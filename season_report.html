<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StatChat — Season Report</title>
<style>
  html, body { margin:0; padding:0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background:#f4f3ef; color:#1a1a1a; }
  .wrap { max-width:960px; margin:0 auto; padding:24px 24px 60px; box-sizing:border-box; }
  .hidden { display:none !important; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .topbar a { color:#555; text-decoration:none; font-size:14px; font-weight:600; }
  .topbar .actions { display:flex; gap:10px; }
  .topbar button { border:none; border-radius:8px; padding:10px 18px; font-size:14px; font-weight:700; cursor:pointer; }
  .topbar button.pdf { background:#1a7a4c; color:#fff; }
  .topbar button.xls { background:#0f6e56; color:#fff; }
  .msg { padding:10px 14px; border-radius:8px; margin-bottom:14px; font-size:14px; }
  .msg.error { background:#fde8e8; color:#a32d2d; }
  .report-header { position:relative; text-align:center; margin-bottom:16px; background:#fff; border:1px solid #ddd; padding:16px; }
  .statchat-logo { position:absolute; top:12px; right:12px; width:60px; height:auto; border-radius:6px; }
  .report-header h1 { font-size:18px; margin:0 0 4px; }
  .report-header .sub { color:#666; font-size:13px; }
  .report-header .record { font-size:13px; font-weight:600; margin-top:4px; }
  .section { background:#fff; border:1px solid #ddd; padding:16px; margin-bottom:16px; }
  .section-title { font-size:14px; font-weight:700; margin:0 0 12px; text-transform:uppercase; letter-spacing:0.03em; color:#333; }
  .metric-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(110px, 1fr)); gap:10px; margin-bottom:22px; padding-bottom:16px; border-bottom:1px solid #f0f0f0; }
  .metric-tile { text-align:center; padding:8px 4px; }
  .metric-tile .metric-val { font-size:22px; font-weight:700; }
  .metric-tile .metric-label { font-size:10px; color:#888; text-transform:uppercase; letter-spacing:0.02em; margin-top:2px; }
  .chart-row { display:grid; grid-template-columns:1fr 1fr; gap:40px 40px; margin-bottom:14px; align-items:start; }
  .chart-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:32px 32px; margin-bottom:14px; align-items:start; }
  .chart-row > :nth-child(even) { border-left:1px solid #eee; padding-left:40px; margin-left:-1px; }
  .chart-row-3 > :nth-child(3n+2) { border-left:1px solid #eee; padding-left:32px; margin-left:-1px; }
  .chart-row-3 > :nth-child(3n+3) { border-left:1px solid #eee; padding-left:32px; margin-left:-1px; }
  .chart-col-metrics { display:flex; justify-content:space-around; gap:8px; flex-wrap:wrap; align-content:flex-start; min-width:0; }
  .chart-col-metrics .metric-tile { flex:1; min-width:70px; }
  .chart-box { position:relative; height:220px; min-width:0; }
  .chart-box.wide { height:260px; }

  @media (max-width: 700px) {
    .wrap { padding:14px 12px 40px; }
    .topbar { flex-wrap:wrap; gap:10px; }
    .topbar .actions { width:100%; }
    .topbar .actions button { flex:1; }
    .report-header { padding:14px; }
    .statchat-logo { width:44px; top:10px; right:10px; }
    .section { padding:12px; }
    .metric-grid { grid-template-columns:repeat(auto-fit, minmax(88px, 1fr)); gap:8px; }
    .metric-tile .metric-val { font-size:19px; }

    /* Collapse 2- and 3-column chart rows to one column. The DOM is
       flat siblings (all metric-groups, then all charts) relying on
       grid column position to pair each metric-group with its chart
       -- naively stacking in DOM order would put every metric-group
       together, then every chart together, losing that pairing. CSS
       order fixes the visual sequence back to metrics-then-chart,
       metrics-then-chart, without touching the DOM or the JS that
       generates it. */
    .chart-row, .chart-row-3 { grid-template-columns:1fr; gap:0; }
    .chart-row > *, .chart-row-3 > * { border-left:none !important; padding-left:0 !important; margin-left:0 !important; margin-bottom:14px; }
    .chart-row > :last-child, .chart-row-3 > :last-child { margin-bottom:0; }

    .chart-row > :nth-child(1){ order:0; } .chart-row > :nth-child(3){ order:1; }
    .chart-row > :nth-child(2){ order:2; } .chart-row > :nth-child(4){ order:3; }

    .chart-row-3 > :nth-child(1){ order:0; } .chart-row-3 > :nth-child(4){ order:1; }
    .chart-row-3 > :nth-child(2){ order:2; } .chart-row-3 > :nth-child(5){ order:3; }
    .chart-row-3 > :nth-child(3){ order:4; } .chart-row-3 > :nth-child(6){ order:5; }

    .chart-box { height:200px; }
    .chart-box.wide { height:220px; }
    .chart-col-metrics { justify-content:space-between; }

    .table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -12px; padding:0 12px; }
    table.stat-table { font-size:12px; }
    table.stat-table th, table.stat-table td { padding:5px 6px; }
  }
  table.stat-table { width:100%; border-collapse:collapse; font-size:13px; background:#fff; margin-bottom:6px; }
  table.stat-table th, table.stat-table td { padding:6px 8px; text-align:right; border:1px solid #eee; }
  table.stat-table th:first-child, table.stat-table td:first-child { text-align:left; }
  table.stat-table th { background:#f5f5f5; color:#555; font-weight:600; font-size:11px; text-transform:uppercase; }
  table.stat-table tr.total-row { font-weight:800; background:#fafafa; }
  .no-stats { color:#999; font-size:13px; font-style:italic; }
  .st-subsection { margin-top:14px; }
  .st-subsection-label { font-size:11px; font-weight:700; color:#888; text-transform:uppercase; letter-spacing:0.03em; margin-bottom:4px; }
  @media print {
    body { background:#fff; }
    .wrap { max-width:none; padding:0 20px; }
    .no-print { display:none !important; }
    .section, .report-header { page-break-inside:avoid; break-inside:avoid; }
    .page-break { page-break-before:always; break-before:always; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div id="loading">Loading…</div>
    <div id="errorView" class="hidden">
      <p id="errorMsg" class="msg error"></p>
    </div>
    <div id="mainView" class="hidden">

        <div class="actions">
          <button class="xls" id="downloadXlsBtn" type="button">Download XLS</button>
          <button class="pdf" id="downloadPdfBtn" type="button">Download PDF</button>
        </div>
      </div>
      <div id="reportContent"></div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="team-icon.js"></script>
<script>
  const SUPABASE_URL = 'https://pboushzlcyfkssojpuut.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_VGnUYurlkoH1yi67jHO6iQ_C8Q0EM2d';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  function showView(name){
    ['loading','errorView','mainView'].forEach(v => document.getElementById(v).classList.toggle('hidden', v !== name));
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'INITIAL_SESSION'){
      if (session){ init(); } else { window.location.href = '/'; }
    } else if (event === 'SIGNED_OUT'){
      window.location.href = '/';
    }
  });

  let plays = [], startingPossession = 'teamA', quarterLengthSec = 720;
  const TEAMS = {};

  // --- Proven read-only engine core, extracted verbatim from game.html / view.html ---
  function otherTeam(t){ return t === 'teamA' ? 'teamB' : 'teamA'; }
const TIMEOUTS_PER_HALF = 3;
const TIMEOUTS_PER_OT = 1;
  // Administrative entries -- clock markers, quarter/half dividers, manual
  // possession flips -- are announcements, not football plays. They carry
  // no roles and no yardage, so anything reasoning about "what actually
  // happened on this drive" has to skip them.
  //
  // isReset markers are deliberately NOT administrative: they are explicit
  // "new drive" announcements and are valid drive starts.
  function isAdminMarker(p){
    if (!p) return true;
    const e = p.effect || {};
    if (e.isReset) return false;
    return !!(e.clockEvent || e.setQuarter || e.forcePossession || p.isDivider);
  }
  function findDriveStarts(playsList){
    // A drive must never START on an administrative marker. Doing so
    // produces a one-play "drive" whose every counter is zero, and
    // because only the last two drives are ever shown, it silently
    // pushes the real drive out of the "previous drive" slot. That is
    // what made a completed scoring drive display as
    // "Clock - 5:00 at change of possession" with 0/0 tiles: the
    // kickoff flipped possession, so the drive began on the clock
    // line that happened to follow it.
    const firstRealPlayFrom = from => {
      for (let j = from; j < playsList.length; j++){
        if (!isAdminMarker(playsList[j])) return j;
      }
      return -1;
    };
    const starts = [];
    // Start indices are produced in non-decreasing order, so checking
    // only the last entry is enough to stop a detected possession
    // change and an explicit reset marker from both claiming the same
    // play (which they often do, since skipping markers lands the
    // possession change exactly on the reset marker that follows it).
    const pushStart = idx => {
      if (idx !== -1 && starts[starts.length - 1] !== idx) starts.push(idx);
    };
    let priorPoss = startingPossession;
    for (let i = 0; i < playsList.length; i++){
      if (playsList[i].effect && playsList[i].effect.isReset){
        // A reset marker only OPENS the game's first drive. Every later
        // drive begins at a real possession change, which is detected
        // below and already lands on the reset marker that follows it.
        // "Adjust down / distance" writes a reset marker purely to
        // correct the chains, so using it mid-drive -- or twice in a row
        // -- must not register another drive, and therefore another
        // possession, for a team that never gave the ball up.
        if (!starts.length) pushStart(i);
        priorPoss = computeState(playsList.slice(0, i + 1)).possession;
        continue;
      }
      // A half ends every drive in progress, even when the same team gets
      // the ball back to start the next one. Only a change of possession
      // was treated as a boundary, so a team that finished the first half
      // with the ball and received to open the second had both halves
      // counted as ONE continuous drive.
      if (playsList[i].isDivider && /end of (1st|first) half/i.test(playsList[i].text || '')){
        pushStart(firstRealPlayFrom(i + 1));
        priorPoss = computeState(playsList.slice(0, i + 1)).possession;
        continue;
      }
      const possAfter = computeState(playsList.slice(0, i + 1)).possession;
      if (possAfter !== priorPoss) pushStart(firstRealPlayFrom(i + 1));
      priorPoss = possAfter;
    }
    return starts;
  }
  // Jersey numbers resolve across ALL THREE roster units, not just the one
  // the play type implies. High-school rosters routinely list a player
  // under a single unit even though they play several, and a dedicated
  // kick/punt returner is normally rostered on special teams only -- which
  // is why returners used to render in the log as a bare "#25".
  //
  // A fallback can only ever turn "#25" into a name; it can never change a
  // name that already resolved, because the expected unit is always
  // searched first. This mirrors playerName() in the report pages.
  function rosterName(teamKey, num, order){
    // Kneels are charged to a TEAM bucket that has no roster entry.
    if (num === 'TEAM') return 'TEAM';
    const t = TEAMS[teamKey];
    const buckets = { offense: t.rosterOffense, defense: t.rosterDefense, special: t.rosterSpecialTeams };
    for (const unit of order){
      const roster = buckets[unit];
      if (roster && roster[num]) return roster[num];
    }
    return null;
  }
  function nameInOffense(teamKey, num){
    const n = rosterName(teamKey, num, ['offense','special','defense']);
    return (n || ('#' + num)) + ' (' + TEAMS[teamKey].name + ')';
  }
  function nameInDefense(teamKey, num){
    const n = rosterName(teamKey, num, ['defense','special','offense']);
    return (n || ('#' + num)) + ' (' + TEAMS[teamKey].name + ')';
  }
  function nameInSpecialTeams(teamKey, num){
    const n = rosterName(teamKey, num, ['special','offense','defense']);
    return (n || ('#' + num)) + ' (' + TEAMS[teamKey].name + ')';
  }

  function computeState(playsList){
    const list = playsList || plays;
    const state = {
      possession: startingPossession,
      quarter: 1,
      scores: { teamA: 0, teamB: 0 },
      possessionTime: { teamA: 0, teamB: 0 },
      down: null, distance: null, fieldPos: null, startSpot: null, statYards: 0,
      penalties: { teamA: { count: 0, yds: 0 }, teamB: { count: 0, yds: 0 } },
    // NFHS: three timeouts per team per half, and they do NOT carry
    // over -- both teams get a fresh three at the start of the second
    // half regardless of what was left.
    timeouts: { teamA: TIMEOUTS_PER_HALF, teamB: TIMEOUTS_PER_HALF },
    // Which physical end of the field a team attacks. Recorded once and
    // alternated by quarter, because teams change ends after Q1, Q2 and
    // Q3. Everything else in this engine is possession-relative, so this
    // is the only place the app knows anything about actual direction.
    dirTeam: null, dirValue: null, dirQuarter: 1
    };
    const pendingClockStart = { teamA: null, teamB: null };
    for (const p of list){
      const e = p.effect;
      if (!e) continue;
      if (e.isReset){
        state.down = e.down; state.distance = e.distance; state.fieldPos = e.fieldPos;
        state.startSpot = e.fieldPos; state.statYards = 0;
      }
      if (e.isStat){
        if (state.fieldPos !== null){
          state.fieldPos += e.fieldDelta;
          state.fieldPos = Math.max(0, Math.min(100, state.fieldPos));
        }
        state.statYards += e.statYds;
        if (e.td){
          state.down = null; state.distance = null; state.fieldPos = null; state.startSpot = null; state.statYards = 0;
        } else {
          if (e.converts){
            state.down = 1;
            state.distance = state.fieldPos !== null ? Math.max(1, Math.min(10, 100 - state.fieldPos)) : 10;
          }
          else if (e.turnoverOnDowns && e.flipApplied){
            state.possession = otherTeam(state.possession);
            // The ball does not move on a turnover on downs -- it is spotted
            // exactly where the play ended, and the team taking over starts
            // 1st & 10 from there. fieldPos is possession-RELATIVE (0 is the
            // possessing team's own goal line), so keeping the same physical
            // spot means mirroring it to 100 - fieldPos for the new offense.
            // Clearing it instead used to force the coach to re-enter a spot
            // the app already knew.
            state.fieldPos = state.fieldPos !== null ? 100 - state.fieldPos : null;
            state.down = 1;
            state.distance = state.fieldPos !== null ? Math.max(1, Math.min(10, 100 - state.fieldPos)) : 10;
            state.startSpot = state.fieldPos; state.statYards = 0;
          } else if (!e.turnoverOnDowns){
            state.down = (state.down || 1) + 1;
            state.distance = Math.max((state.distance || 10) - e.statYds, 1);
          }
        }
      }
      if (e.endsDrive && !e.isStat){
        state.down = null; state.distance = null; state.fieldPos = null; state.startSpot = null; state.statYards = 0;
      }
      if (e.penaltyTeam){
        state.penalties[e.penaltyTeam].count += 1;
        state.penalties[e.penaltyTeam].yds += e.penaltyYds;
        if (state.fieldPos !== null){
          state.fieldPos += e.fieldDelta;
          state.fieldPos = Math.max(0, Math.min(100, state.fieldPos));
        }
        if (state.distance !== null){
          if (e.noDownChange){
            // Dead-ball foul, or one assessed after a kick or change of
            // possession: it is walked off before the series begins, so
            // the ball moves but the down and distance-to-go stay put.
            // Adjusting distance here would measure against a
            // line-to-gain that no longer exists -- which is how a
            // 10-yard foul against a team that had just taken over at
            // 1st & 10 used to become "1st & 20".
            if (state.fieldPos !== null){
              state.distance = Math.max(1, Math.min(state.distance, 100 - state.fieldPos));
            }
          } else if (e.autoFirstDown){
            // Defensive holding, roughing, pass interference and the like
            // award a first down whatever the yardage -- a 5-yard foul on
            // 3rd & 20 still moves the chains, so the distance maths below
            // must not get a say.
            state.down = 1;
            state.distance = state.fieldPos !== null ? Math.max(1, Math.min(10, 100 - state.fieldPos)) : 10;
          } else {
            state.distance -= e.fieldDelta;
            if (state.distance <= 0){
              // Penalty yardage alone reached or passed the marker --
              // an automatic first down, regardless of what down it was.
              state.down = 1;
              state.distance = state.fieldPos !== null ? Math.max(1, Math.min(10, 100 - state.fieldPos)) : 10;
            }
          }
        }
      }
      if (e.score){ state.scores[e.score.team] += e.score.points; }
      if (e.scoreAdjust){ state.scores[e.scoreAdjust.team] += e.scoreAdjust.pts; }
      if (e.flip && e.flipApplied && !e.isStat){
        state.possession = e.flipTo;
        state.down = null; state.distance = null; state.fieldPos = null; state.startSpot = null; state.statYards = 0;
      }
      if (e.forcePossession){ state.possession = e.forcePossession; }
      if (e.setQuarter){
      // Crossing into the second half (or into overtime) resets the
      // allowance. Guarded on the quarter actually changing so that
      // re-entering a Q3 marker cannot hand out a second fresh set.
      if (e.setQuarter >= 3 && state.quarter < 3) state.timeouts = { teamA: TIMEOUTS_PER_HALF, teamB: TIMEOUTS_PER_HALF };
      if (e.setQuarter >= 5 && state.quarter < 5) state.timeouts = { teamA: TIMEOUTS_PER_OT, teamB: TIMEOUTS_PER_OT };
      state.quarter = e.setQuarter;
    }
    if (e.setDirection){
      state.dirTeam = e.setDirection.team;
      state.dirValue = e.setDirection.dir;
      state.dirQuarter = state.quarter;
    }
    if (e.timeout && state.timeouts[e.timeout.team] !== undefined){
      // Floored at zero: the log is a record of what the coach called,
      // and a fourth timeout should not read as -1 remaining.
      state.timeouts[e.timeout.team] = Math.max(0, state.timeouts[e.timeout.team] - 1);
    }
      if (e.clockEvent){
        const ce = e.clockEvent;
        if (ce.type === 'start'){ pendingClockStart[ce.team] = ce.absSec; }
        if (ce.type === 'end' && pendingClockStart[ce.team] !== null){
          state.possessionTime[ce.team] += Math.max(0, ce.absSec - pendingClockStart[ce.team]);
          pendingClockStart[ce.team] = null;
        }
        if (ce.type === 'transition'){
          if (pendingClockStart[ce.outgoingTeam] !== null){
            state.possessionTime[ce.outgoingTeam] += Math.max(0, ce.absSec - pendingClockStart[ce.outgoingTeam]);
            pendingClockStart[ce.outgoingTeam] = null;
          }
          pendingClockStart[ce.incomingTeam] = ce.absSec;
        }
      }
      if (e.setScores){ state.scores.teamA = e.setScores.teamA; state.scores.teamB = e.setScores.teamB; }
    }
    // Direction the team WITH THE BALL is currently driving. Derived, not
    // stored: ends alternate every quarter, so one recorded answer covers
    // the whole game, and re-recording it mid-game just re-bases the
    // alternation from that quarter.
    state.driveDir = null;
    if (state.dirValue && state.possession){
      const flipped = Math.abs((state.quarter || 1) - state.dirQuarter) % 2 === 1;
      let d = flipped ? (state.dirValue === 'right' ? 'left' : 'right') : state.dirValue;
      if (state.possession !== state.dirTeam) d = (d === 'right' ? 'left' : 'right');
      state.driveDir = d;
    }
    return state;
  }
  // --- End engine core ---

  function luminance(hex){
    const r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
    return (0.299*r + 0.587*g + 0.114*b) / 255;
  }
  function safeTextColor(bgHex, preferredHex){
    if (Math.abs(luminance(bgHex) - luminance(preferredHex)) > 0.35) return preferredHex;
    return luminance(bgHex) > 0.55 ? '#1a1a1a' : '#ffffff';
  }
  function colorDistance(hexA, hexB){
    const a = { r: parseInt(hexA.slice(1,3),16), g: parseInt(hexA.slice(3,5),16), b: parseInt(hexA.slice(5,7),16) };
    const b = { r: parseInt(hexB.slice(1,3),16), g: parseInt(hexB.slice(3,5),16), b: parseInt(hexB.slice(5,7),16) };
    return Math.sqrt((a.r-b.r)**2 + (a.g-b.g)**2 + (a.b-b.b)**2);
  }
  function buildTeams(game, rosterRows, ourBranding){
    const ourName = game.our_team_is_home ? game.home_team_name : game.away_team_name;
    const oppName = game.our_team_is_home ? game.away_team_name : game.home_team_name;
    TEAMS.teamA = { name: ourName, bg: ourBranding.primary_color || '#1a1a2e', text: ourBranding.secondary_color || '#ffffff',
      rosterOffense:{}, rosterDefense:{}, rosterSpecialTeams:{}, posOffense:{}, logo: ourBranding.logo_url || null,
      isHome: !!game.our_team_is_home };
    const oppPrimary = game.opponent_primary_color || '#8B0000', oppSecondary = game.opponent_secondary_color || '#ffffff';
    TEAMS.teamB = { name: oppName, bg: oppPrimary, text: oppSecondary,
      rosterOffense:{}, rosterDefense:{}, rosterSpecialTeams:{}, posOffense:{}, logo: game.opponent_logo_url || null,
      isHome: !game.our_team_is_home };
    if (colorDistance(TEAMS.teamA.bg, TEAMS.teamB.bg) < 60){
      if (colorDistance(TEAMS.teamA.bg, oppSecondary) >= 60){
        TEAMS.teamB.bg = oppSecondary;
        TEAMS.teamB.text = oppPrimary;
      } else {
        TEAMS.teamB.bg = luminance(TEAMS.teamA.bg) > 0.5 ? '#3a3a3a' : '#c8c8c8';
        TEAMS.teamB.text = luminance(TEAMS.teamB.bg) > 0.55 ? '#1a1a1a' : '#ffffff';
      }
    }
    rosterRows.forEach(r => {
      const team = TEAMS[r.team_side];
      if (!team) return;
      if (r.unit === 'offense'){ team.rosterOffense[r.jersey_number] = r.player_name; team.posOffense[r.jersey_number] = r.position; }
      else if (r.unit === 'defense'){ team.rosterDefense[r.jersey_number] = r.player_name; }
      else if (r.unit === 'special'){ team.rosterSpecialTeams[r.jersey_number] = r.player_name; }
    });
  }
  function playerName(team, num, preferredUnit){
  // An NCAA team rush (a QB kneel) is charged to the team, not a player,
  // so it carries the sentinel number TEAM and has no roster entry.
  if (num === 'TEAM') return 'TEAM';
    const t = TEAMS[team];
    const buckets = { offense: t.rosterOffense, defense: t.rosterDefense, special: t.rosterSpecialTeams };
    const order = preferredUnit ? [preferredUnit, ...Object.keys(buckets).filter(u => u !== preferredUnit)] : ['offense', 'defense', 'special'];
    for (const unit of order){
      const roster = buckets[unit];
      if (roster && roster[num]) return roster[num];
    }
    return '#' + num;
  }

  function computeBoxScore(playsList){
    const stats = {
      teamA: { rushing:{}, passing:{}, receiving:{}, defense:{}, specialTeams:{} },
      teamB: { rushing:{}, passing:{}, receiving:{}, defense:{}, specialTeams:{} }
    };
    function bucket(team, cat, num){
      if (!team || !stats[team]) return null;
      const b = stats[team][cat];
      if (!b[num]) b[num] = {};
      return b[num];
    }
    playsList.forEach(p => {
      const r = p.roles || {};
      const e = p.effect || {};
      const type = r.playType;

      if (r.carrier && type === 'rush'){
        const s = bucket(r.carrier.team, 'rushing', r.carrier.num);
        if (s){
          s.att = (s.att||0) + 1;
          s.yds = (s.yds||0) + (r.carrier.yards||0);
          s.long = Math.max(s.long||0, r.carrier.yards||0);
          if (e.td) s.td = (s.td||0) + 1;
        }
      }
      if (r.carrier && type === 'fumble'){
        const teamObj = TEAMS[r.carrier.team];
        const pos = ((teamObj && teamObj.posOffense[r.carrier.num]) || '').toUpperCase();
        const targetCat = RECEIVE_POS.has(pos) ? 'receiving' : 'rushing';
        const s = bucket(r.carrier.team, targetCat, r.carrier.num);
        if (s) s.fum = (s.fum||0) + 1;
      }
      if (r.passer && type === 'incomplete'){
        const s = bucket(r.passer.team, 'passing', r.passer.num);
        if (s) s.att = (s.att||0) + 1;
      }
      if (r.passer && type === 'pass'){
        const s = bucket(r.passer.team, 'passing', r.passer.num);
        if (s){
          s.att = (s.att||0) + 1;
          s.comp = (s.comp||0) + 1;
          s.yds = (s.yds||0) + (r.passer.yards||0);
          s.long = Math.max(s.long||0, r.passer.yards||0);
          if (e.td) s.td = (s.td||0) + 1;
        }
        if (r.receiver){
          const rs = bucket(r.receiver.team, 'receiving', r.receiver.num);
          if (rs){
            rs.rec = (rs.rec||0) + 1;
            rs.yds = (rs.yds||0) + (r.receiver.yards||0);
            rs.long = Math.max(rs.long||0, r.receiver.yards||0);
            if (e.td) rs.td = (rs.td||0) + 1;
          }
        }
      }
      if (r.passer && type === 'sack'){
        const s = bucket(r.passer.team, 'passing', r.passer.num);
        if (s) s.sacked = (s.sacked||0) + 1;
        // NFHS charges sack yardage to the team as a rushing loss. Doing
        // it here rather than as a subtraction in each page's totals
        // means the rushing rows actually add up to the rushing tile,
        // and every surface gets the same numbers from one place.
        const ts = bucket(r.passer.team, 'rushing', 'TEAM');
        if (ts){
          ts.att = (ts.att||0) + 1;
          ts.yds = (ts.yds||0) - (r.passer.yards||0);
        }
      }
      if (r.passer && type === 'int'){
        const s = bucket(r.passer.team, 'passing', r.passer.num);
        if (s){
          s.att = (s.att||0) + 1;
          s.intThrown = (s.intThrown||0) + 1;
        }
      }
      if (r.defense && (type === 'int' || type === 'sack' || type === 'fumble')){
        const s = bucket(r.defense.team, 'defense', r.defense.num);
        if (s){
          if (type === 'int') s.int = (s.int||0) + 1;
          if (type === 'sack') s.sacks = (s.sacks||0) + 1;
          if (type === 'fumble') s.fumRec = (s.fumRec||0) + 1;
        }
      } else if (type === 'int' || type === 'sack' || (type === 'fumble' && r.lost)){
        // Naming the tackler, interceptor or recoverer is optional, and
        // these stats used to be keyed entirely off that name -- so a
        // sack with nobody credited recorded no sack anywhere at all,
        // not even for the team. The event happened regardless, so it is
        // credited to a TEAM bucket. Every caller sums the whole defense
        // object, so this reaches all of them without touching each one.
        const victim = (type === 'fumble') ? (r.carrier && r.carrier.team) : (r.passer && r.passer.team);
        if (victim){
          const s = bucket(otherTeam(victim), 'defense', 'TEAM');
          if (s){
            if (type === 'int') s.int = (s.int||0) + 1;
            if (type === 'sack') s.sacks = (s.sacks||0) + 1;
            if (type === 'fumble') s.fumRec = (s.fumRec||0) + 1;
          }
        }
      }
      if (r.kicker && type === 'kickoff'){
        const s = bucket(r.kicker.team, 'specialTeams', r.kicker.num);
        if (s){
          s.kickoffs = (s.kickoffs||0) + 1;
          if (r.kicker.touchback) s.touchbacks = (s.touchbacks||0) + 1;
        }
      }
      if (r.kicker && type === 'fg'){
        const s = bucket(r.kicker.team, 'specialTeams', r.kicker.num);
        if (s){
          s.fgAtt = (s.fgAtt||0) + 1;
          if (r.kicker.result === 'g'){
            s.fgMade = (s.fgMade||0) + 1;
            s.fgLong = Math.max(s.fgLong||0, r.kicker.yards||0);
          }
          if (r.kicker.result === 'b') s.fgBlocked = (s.fgBlocked||0) + 1;
        }
      }
      if (r.kicker && type === 'pat'){
        const s = bucket(r.kicker.team, 'specialTeams', r.kicker.num);
        if (s){
          s.patAtt = (s.patAtt||0) + 1;
          if (r.kicker.result === 'g') s.patMade = (s.patMade||0) + 1;
          if (r.kicker.result === 'b') s.patBlocked = (s.patBlocked||0) + 1;
        }
      }
      if (r.punter && type === 'punt'){
        const s = bucket(r.punter.team, 'specialTeams', r.punter.num);
        if (s){
          s.punts = (s.punts||0) + 1;
          if (!r.punter.blocked){
            s.puntYds = (s.puntYds||0) + (r.punter.yards||0);
            s.puntsWithYards = (s.puntsWithYards||0) + 1;
            s.puntLong = Math.max(s.puntLong||0, r.punter.yards||0);
          } else {
            s.blocked = (s.blocked||0) + 1;
          }
        }
      }
    });

    ['teamA','teamB'].forEach(defTeam => {
      const offTeam = otherTeam(defTeam);
      let d3att=0, d3conv=0, d4att=0, d4conv=0, explosive=0;
      for (let i = 0; i < playsList.length; i++){
        const p = playsList[i];
        const type = p.roles && p.roles.playType;
        // Must match scrimmageTypes exactly. 'incomplete' was missing
        // here (and only here -- every other definition in the codebase
        // includes it), so an incomplete pass on 3rd down, which is the
        // single most common 3rd-down outcome in football, was not even
        // counted as an ATTEMPT. A drive that went incomplete / run for
        // no gain / incomplete / punt reported "no 3rd downs" rather
        // than 0 of 1.
        if (!['rush','pass','incomplete','sack','int','fumble'].includes(type)) continue;
        const before = computeState(playsList.slice(0, i));
        if (before.possession !== offTeam) continue;
        const down = before.down;
        const success = !!(p.effect && (p.effect.converts || p.effect.td));
        if (down === 3){ d3att++; if (success) d3conv++; }
        else if (down === 4){ d4att++; if (success) d4conv++; }
        if (((p.effect && p.effect.statYds) || 0) >= 20) explosive++;
      }
      stats[defTeam].oppDowns = {
        d3Pct: d3att ? Math.round(100*d3conv/d3att) : null, d3att, d3conv,
        d4Pct: d4att ? Math.round(100*d4conv/d4att) : null, d4att, d4conv,
        explosive
      };
    });

    return stats;
  }

  function countPossessions(playsList){
    // A possession IS a drive, so this must use exactly the same
    // boundary rules as findDriveStarts. It used to reimplement them,
    // and the two disagreed: a detected possession change AND the
    // explicit "New drive" marker that follows it were each counted,
    // so an ordinary kickoff -> clock line -> new drive sequence
    // credited the receiving team twice. A brand-new game in which
    // each side had had the ball exactly once reported 2 possessions
    // apiece. Deriving from findDriveStarts makes the two agree by
    // construction rather than by keeping two copies in step.
    const counts = { teamA: 0, teamB: 0 };
    findDriveStarts(playsList).forEach(idx => {
      // Possession AFTER the starting play, matching how
      // computeDriveSummary attributes a drive to a team.
      const team = computeState(playsList.slice(0, idx + 1)).possession;
      if (team === 'teamA' || team === 'teamB') counts[team]++;
    });
    return counts;
  }
  function countTurnovers(playsList){
    const counts = { teamA: 0, teamB: 0 };
    playsList.forEach(p => {
      const r = p.roles;
      if (!r) return;
      if (r.playType === 'int' && r.passer) counts[r.passer.team] = (counts[r.passer.team] || 0) + 1;
      // r.defense used to be the only signal that a fumble was LOST
      // rather than recovered by the offense. Now that naming the
      // recoverer is optional, r.lost carries that meaning explicitly.
      // r.defense is still honoured so plays saved before this change
      // keep counting.
      if (r.playType === 'fumble' && r.carrier && (r.lost || r.defense)) counts[r.carrier.team] = (counts[r.carrier.team] || 0) + 1;
    });
    return counts;
  }

  const RECEIVE_POS = new Set(['WR','TE','SE','FL','SLOT']);

  function sumStat(bucketObj, key){
    return Object.keys(bucketObj).reduce((t, n) => t + (bucketObj[n][key] || 0), 0);
  }
  function maxStat(bucketObj, key){
    return Object.keys(bucketObj).reduce((t, n) => Math.max(t, bucketObj[n][key] || 0), 0);
  }
  function mergeInto(target, key, delta){
    if (!target[key]) target[key] = {};
    Object.keys(delta).forEach(k => {
      if (k === 'long' || k === 'fgLong' || k === 'puntLong'){
        target[key][k] = Math.max(target[key][k] || 0, delta[k] || 0);
      } else {
        target[key][k] = (target[key][k] || 0) + (delta[k] || 0);
      }
    });
  }

  let seasonYearLabel = '';
  const seasonAgg = {
    rushing: {}, passing: {}, receiving: {}, specialTeams: {},
    defense: { int: 0, fumRec: 0, sacks: 0 },
    perGame: [],
    totals: { rushAtt:0, rushYds:0, rushTd:0, passAtt:0, passComp:0, passYds:0, passTd:0, sacked:0, totalPlays:0, possessions:0, turnovers:0, penCount:0, penYds:0,
      oppD3att:0, oppD3conv:0, oppD4att:0, oppD4conv:0, explosiveFor:0,
      oppRushAtt:0, oppRushYds:0, oppRushTd:0, oppPassAtt:0, oppPassComp:0, oppPassYds:0, oppPassTd:0,
      pointsScored:0, pointsAllowed:0, explosiveAgainst:0 },
    quarterScored: [0,0,0,0], quarterAllowed: [0,0,0,0],
    wins: 0, losses: 0, ties: 0
  };

  function processGame(game, rosterRows, gamePlays){
    buildTeams(game, rosterRows, seasonAgg.ourBranding || {});
    const box = computeBoxScore(gamePlays);
    plays = gamePlays;
    const finalState = computeState(gamePlays);
    const possessions = countPossessions(gamePlays);
    const turnovers = countTurnovers(gamePlays);
    const scrimmageTypes = ['rush','pass','incomplete','sack','int','fumble'];
    const playsFor = (teamKey) => gamePlays.filter(p => p.team === teamKey && p.roles && scrimmageTypes.includes(p.roles.playType)).length;

    ['rushing','passing','receiving'].forEach(cat => {
      Object.keys(box.teamA[cat]).forEach(n => {
        mergeInto(seasonAgg[cat], playerName('teamA', n), box.teamA[cat][n]);
      });
    });
    Object.keys(box.teamA.specialTeams).forEach(n => {
      mergeInto(seasonAgg.specialTeams, playerName('teamA', n, 'special'), box.teamA.specialTeams[n]);
    });
    seasonAgg.defense.int += sumStat(box.teamA.defense, 'int');
    seasonAgg.defense.fumRec += sumStat(box.teamA.defense, 'fumRec');
    seasonAgg.defense.sacks += sumStat(box.teamA.defense, 'sacks');

    const t = seasonAgg.totals;
    const ownDowns = box.teamB.oppDowns, oppDowns = box.teamA.oppDowns;
    let rushYds = sumStat(box.teamA.rushing,'yds');
    const rushAtt = sumStat(box.teamA.rushing,'att'), rushTd = sumStat(box.teamA.rushing,'td');
    // NFHS: sack yardage is charged against RUSHING, not passing.
    // Individual passer season totals in seasonAgg.passing stay
    // unadjusted, matching each player's own personal statline.
    const sackYardsLostFor = (teamKey) => gamePlays.reduce((tot, p) => {
      const r = p.roles;
      return (r && r.playType === 'sack' && r.passer && r.passer.team === teamKey) ? tot + (r.passer.yards || 0) : tot;
    }, 0);
    const passYds = sumStat(box.teamA.passing,'yds'), passAtt = sumStat(box.teamA.passing,'att'), passComp = sumStat(box.teamA.passing,'comp'), passTd = sumStat(box.teamA.passing,'td');
    let oppRushYds = sumStat(box.teamB.rushing,'yds');
    const oppRushAtt = sumStat(box.teamB.rushing,'att'), oppRushTd = sumStat(box.teamB.rushing,'td');
    // NFHS/NCAA convention: sacks are a rushing loss, not a passing one.
    // Applied AFTER both declarations -- doing it earlier referenced
    // oppRushYds before its `let`, which is a TDZ error that killed the
    // whole report.
    const oppPassYds = sumStat(box.teamB.passing,'yds'), oppPassAtt = sumStat(box.teamB.passing,'att'), oppPassComp = sumStat(box.teamB.passing,'comp'), oppPassTd = sumStat(box.teamB.passing,'td');
    const pen = finalState.penalties.teamA;
    t.rushAtt += rushAtt; t.rushYds += rushYds; t.rushTd += rushTd;
    t.passAtt += passAtt; t.passComp += passComp; t.passYds += passYds; t.passTd += passTd;
    t.sacked += sumStat(box.teamA.passing, 'sacked');
    t.totalPlays += playsFor('teamA');
    t.possessions += possessions.teamA || 0;
    t.turnovers += turnovers.teamA || 0;
    t.penCount += pen.count; t.penYds += pen.yds;
    t.oppD3att += oppDowns.d3att; t.oppD3conv += oppDowns.d3conv;
    t.oppD4att += oppDowns.d4att; t.oppD4conv += oppDowns.d4conv;
    t.explosiveFor += ownDowns.explosive;
    t.explosiveAgainst += oppDowns.explosive;
    t.oppRushAtt += oppRushAtt; t.oppRushYds += oppRushYds; t.oppRushTd += oppRushTd;
    t.oppPassAtt += oppPassAtt; t.oppPassComp += oppPassComp; t.oppPassYds += oppPassYds; t.oppPassTd += oppPassTd;
    t.pointsScored += finalState.scores.teamA; t.pointsAllowed += finalState.scores.teamB;

    if (finalState.scores.teamA > finalState.scores.teamB) seasonAgg.wins++;
    else if (finalState.scores.teamA < finalState.scores.teamB) seasonAgg.losses++;
    else seasonAgg.ties++;

    const quarterScored = [0,0,0,0], quarterAllowed = [0,0,0,0];
    let h1Rush=0, h1Pass=0, h2Rush=0, h2Pass=0, oppH1Rush=0, oppH1Pass=0, oppH2Rush=0, oppH2Pass=0;
    gamePlays.forEach(p => {
      const q = Math.min(4, Math.max(1, p.quarter || 1)) - 1;
      if (p.effect && p.effect.score){
        if (p.effect.score.team === 'teamA') quarterScored[q] += p.effect.score.points; else quarterAllowed[q] += p.effect.score.points;
      }
      if (p.effect && p.effect.scoreAdjust){
        if (p.effect.scoreAdjust.team === 'teamA') quarterScored[q] += p.effect.scoreAdjust.pts; else quarterAllowed[q] += p.effect.scoreAdjust.pts;
      }
      const r = p.roles;
      if (!r) return;
      const half = (p.quarter || 1) <= 2 ? 1 : 2;
      if (r.playType === 'rush' && r.carrier && r.carrier.team === 'teamA'){ if (half===1) h1Rush += (r.carrier.yards||0); else h2Rush += (r.carrier.yards||0); }
      if (r.playType === 'pass' && r.passer && r.passer.team === 'teamA'){ if (half===1) h1Pass += (r.passer.yards||0); else h2Pass += (r.passer.yards||0); }
      if (r.playType === 'rush' && r.carrier && r.carrier.team === 'teamB'){ if (half===1) oppH1Rush += (r.carrier.yards||0); else oppH2Rush += (r.carrier.yards||0); }
      if (r.playType === 'pass' && r.passer && r.passer.team === 'teamB'){ if (half===1) oppH1Pass += (r.passer.yards||0); else oppH2Pass += (r.passer.yards||0); }
    });
    for (let i=0;i<4;i++){ seasonAgg.quarterScored[i] += quarterScored[i]; seasonAgg.quarterAllowed[i] += quarterAllowed[i]; }

    seasonAgg.perGame.push({
      label: game.designator || '', totalYds: rushYds+passYds, rushYds, passYds,
      h1Yds: h1Rush+h1Pass, h2Yds: h2Rush+h2Pass, h1Rush, h1Pass, h2Rush, h2Pass,
      oppTotalYds: oppRushYds+oppPassYds, oppH1Yds: oppH1Rush+oppH1Pass, oppH2Yds: oppH2Rush+oppH2Pass,
      oppH1Rush, oppH1Pass, oppH2Rush, oppH2Pass,
      pointsScored: finalState.scores.teamA, pointsAllowed: finalState.scores.teamB,
      d3Pct: ownDowns.d3att ? Math.round(100*ownDowns.d3conv/ownDowns.d3att) : null,
      oppD3Pct: oppDowns.d3att ? Math.round(100*oppDowns.d3conv/oppDowns.d3att) : null,
      d4Pct: ownDowns.d4att ? Math.round(100*ownDowns.d4conv/ownDowns.d4att) : null,
      oppD4Pct: oppDowns.d4att ? Math.round(100*oppDowns.d4conv/oppDowns.d4att) : null,
      explosiveFor: ownDowns.explosive || 0, explosiveAgainst: oppDowns.explosive || 0,
      possessions: possessions.teamA || 0, totalPlays: playsFor('teamA'),
      penCount: pen.count, penYds: pen.yds,
      turnovers: turnovers.teamA || 0, sacked: sumStat(box.teamA.passing, 'sacked')
    });

    // XLS export rows -- same 43-column "Stats" schema and "Game
    // Totals" schema as stat_package.html's single-game export, just
    // appended here once per game so the season file ends up with
    // every game stacked together, matching the original reference
    // spreadsheet's multi-game structure.
    const gameIdMatch = (game.designator || '').match(/(\d+)/);
    const gameId = gameIdMatch ? parseInt(gameIdMatch[1]) : (game.designator || '');
    const blankRow = () => xlsStatsHeaders.map(() => '');
    const setCols = (row, obj) => { Object.keys(obj).forEach(k => { const i = xlsStatsHeaders.indexOf(k); if (i>=0) row[i] = obj[k]; }); return row; };

    Object.keys(box.teamA.rushing).forEach(n => {
      const d = box.teamA.rushing[n], row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: playerName('teamA', n),
        'Rush Attempts': d.att||0, 'Rush Yards': d.yds||0, 'Yds Per Carry': d.att?+(d.yds/d.att).toFixed(1):'',
        'Long Rush': d.long||0, 'Rush TD': d.td||0, FUMBLE: d.fum || '' });
      xlsStatsRows.push(row);
    });
    Object.keys(box.teamA.passing).forEach(n => {
      const d = box.teamA.passing[n], row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: playerName('teamA', n),
        'Pass Attempts': d.att||0, 'Pass Completions': d.comp||0, 'Comp Pctg': d.att?+(100*(d.comp||0)/d.att).toFixed(1):'',
        'Pass Yards': d.yds||0, 'Long Pass': d.long||0, 'Pass TD': d.td||0, INT: d.intThrown||0, SACK: d.sacked||0 });
      xlsStatsRows.push(row);
    });
    Object.keys(box.teamA.receiving).forEach(n => {
      const d = box.teamA.receiving[n], row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: playerName('teamA', n),
        Receptions: d.rec||0, 'Receiving Yards': d.yds||0, 'Yards Per Catch': d.rec?+(d.yds/d.rec).toFixed(1):'',
        'Long Recept': d.long||0, 'Receiving TD': d.td||0, FUMBLE: d.fum || '' });
      xlsStatsRows.push(row);
    });
    Object.keys(box.teamA.specialTeams).filter(n => box.teamA.specialTeams[n].kickoffs).forEach(n => {
      const d = box.teamA.specialTeams[n], row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: playerName('teamA', n, 'special'),
        'KO Attempt': d.kickoffs||0, 'KO Touchback': d.touchbacks||0 });
      xlsStatsRows.push(row);
    });
    Object.keys(box.teamA.specialTeams).filter(n => box.teamA.specialTeams[n].patAtt).forEach(n => {
      const d = box.teamA.specialTeams[n], row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: playerName('teamA', n, 'special'),
        'PA Attempt': d.patAtt||0, 'PA Made': d.patMade||0, 'PA Block': d.patBlocked||0 });
      xlsStatsRows.push(row);
    });
    gamePlays.forEach(p => {
      const r = p.roles;
      if (r && r.playType === 'fg' && r.kicker && r.kicker.team === 'teamA'){
        const row = blankRow();
        setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: playerName('teamA', r.kicker.num, 'special'),
          'FG Attempt': 1, 'FG Made': r.kicker.result==='g'?1:0, 'FG Block': r.kicker.result==='b'?1:0, 'FG Yards': r.kicker.yards||0 });
        xlsStatsRows.push(row);
      }
      if (r && r.playType === 'punt' && r.punter && r.punter.team === 'teamA'){
        const row = blankRow();
        setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: playerName('teamA', r.punter.num, 'special'),
          'Punt Attempt': 1, 'Punt Yards': r.punter.blocked?0:(r.punter.yards||0), 'PUNT BLK': r.punter.blocked?1:'' });
        xlsStatsRows.push(row);
      }
    });
    let sackCount=0, sackYardsLost=0;
    gamePlays.forEach(p => { const r=p.roles; if (r && r.playType==='sack' && r.passer && r.passer.team==='teamA'){ sackCount++; sackYardsLost += (r.passer.yards||0); } });
    if (sackCount){
      const row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: 'Sacks and Bad Snaps', 'Rush Attempts': sackCount, 'Rush Yards': -sackYardsLost });
      xlsStatsRows.push(row);
    }
    const defRow = blankRow();
    setCols(defRow, { GameID: gameId, Team: TEAMS.teamA.name, Player: 'Defense',
      'D-Sack': sumStat(box.teamA.defense,'sacks')||'', 'D-INT': sumStat(box.teamA.defense,'int')||'', 'D-FUM': sumStat(box.teamA.defense,'fumRec')||'',
      'D-3rdAtt': oppDowns.d3att||'', 'D-3rdConv': oppDowns.d3conv||'', 'D-4thAtt': oppDowns.d4att||'',
      'D-4thStop': oppDowns.d4att ? (oppDowns.d4att-oppDowns.d4conv) : '', 'D-20PlusPlay': oppDowns.explosive||'' });
    xlsStatsRows.push(defRow);
    const offRow = blankRow();
    setCols(offRow, { GameID: gameId, Team: TEAMS.teamA.name, Player: 'Offense', 'D-20PlusPlay': ownDowns.explosive||'' });
    xlsStatsRows.push(offRow);
    const oppRow = blankRow();
    setCols(oppRow, { GameID: gameId, Team: TEAMS.teamB.name, Player: TEAMS.teamB.name,
      'Rush Attempts': oppRushAtt||'', 'Rush Yards': oppRushYds||'', 'Rush TD': oppRushTd||'',
      'Pass Attempts': oppPassAtt||'', 'Pass Completions': oppPassComp||'', 'Pass Yards': oppPassYds||'', 'Pass TD': oppPassTd||'' });
    xlsStatsRows.push(oppRow);

    const visitorGtKey = game.our_team_is_home ? 'teamB' : 'teamA';
    [ { key:'teamA', name: TEAMS.teamA.name, down: ownDowns, sacked: sumStat(box.teamA.passing,'sacked') },
      { key:'teamB', name: TEAMS.teamB.name, down: null, sacked: '' } ].forEach(({key,name,down,sacked}) => {
      const gtRow = xlsGtHeaders.map(() => '');
      const setGt = (obj) => Object.keys(obj).forEach(k => { const i = xlsGtHeaders.indexOf(k); if (i>=0) gtRow[i] = obj[k]; });
      setGt({ GameID: gameId, Team: name,
        Q1: key==='teamB'?quarterAllowed[0]:quarterScored[0],
        Q2: key==='teamB'?quarterAllowed[1]:quarterScored[1], Q3: key==='teamB'?quarterAllowed[2]:quarterScored[2], Q4: key==='teamB'?quarterAllowed[3]:quarterScored[3],
        Final: finalState.scores[key],
        Penalites: finalState.penalties[key].count||'', 'Penalty Yards': finalState.penalties[key].yds||'',
        'H1 Yards': key==='teamA'?(h1Rush+h1Pass):'', 'H2 Yards': key==='teamA'?(h2Rush+h2Pass):'',
        'Total Yards': key==='teamA'?(rushYds+passYds):(oppRushYds+oppPassYds),
        Sacks: key==='teamA'?(sacked||''):'', TO: turnovers[key]||0, Possessions: possessions[key]||0,
        'H1 Rushing': key==='teamA'?h1Rush:'', 'H1 Passing': key==='teamA'?h1Pass:'', 'H2 Rushing': key==='teamA'?h2Rush:'', 'H2 Passing': key==='teamA'?h2Pass:'' });
      if (down){ setGt({ '3D Att': down.d3att||'', '3D Conv': down.d3conv||'', '4D Att': down.d4att||'', '4D Conv': down.d4conv||'' }); }
      xlsGtRows.push(gtRow);
    });
  }

  const xlsStatsHeaders = ['GameID','Team','Player','Rush Attempts','Rush Yards','Yds Per Carry','Long Rush','Rush TD',
    'Pass Attempts','Pass Completions','Comp Pctg','Pass Yards','Long Pass','Pass TD','INT','SACK',
    'Receptions','Receiving Yards','Yards Per Catch','Long Recept','Receiving TD','FUMBLE',
    'KO Attempt','KO Touchback','PA Attempt','PA Made','PA Block','FG Attempt','FG Made','FG Block','FG Yards','Long FG',
    'Punt Attempt','Punt Yards','Long Punt','PUNT BLK',
    'D-Sack','D-INT','D-FUM','D-3rdAtt','D-3rdConv','D-4thAtt','D-4thStop','D-20PlusPlay'];

    'H1 Yards','H2 Yards','Total Yards','Sacks','TO','Possessions','3D Att','3D Conv','4D Att','4D Conv',
    'H1 Rushing','H1 Passing','H2 Rushing','H2 Passing'];
  const xlsStatsRows = [], xlsGtRows = [];

  function buildWorkbook(){
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([xlsStatsHeaders, ...xlsStatsRows]), 'Stats');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([xlsGtHeaders, ...xlsGtRows]), 'Game Totals');

  }

  document.getElementById('downloadXlsBtn').addEventListener('click', () => {
    const wb = buildWorkbook();

  async function init(){
    const params = new URLSearchParams(window.location.search);
    const season = params.get('season');
    if (!season){
      showView('errorView');
      document.getElementById('errorMsg').textContent = 'No season specified.';
      return;
    }
    seasonYearLabel = season;

    const { data: teamRows } = await supabaseClient
      .from('teams').select('primary_color, secondary_color, logo_url').eq('is_our_team', true).limit(1);
    seasonAgg.ourBranding = (teamRows && teamRows[0]) || {};

    const { data: gameRows, error: gameError } = await supabaseClient
      .from('games').select('*').eq('season_year', parseInt(season)).eq('status', 'final')
      .order('game_date', { ascending: true });
    if (gameError){
      showView('errorView');
      document.getElementById('errorMsg').textContent = gameError.message;
      return;
    }
    if (!gameRows || gameRows.length === 0){
      showView('errorView');
      document.getElementById('errorMsg').textContent = 'No finalized games found for this season.';
      return;
    }

    try {
      for (const game of gameRows){
        const { data: rosterRows, error: rosterError } = await supabaseClient
          .from('game_rosters').select('*').eq('game_id', game.id);
        if (rosterError) throw new Error('Roster for ' + (game.designator||game.id) + ': ' + rosterError.message);
        const { data: gamePlaysRaw, error: playsError } = await supabaseClient
          .from('plays').select('*').eq('game_id', game.id).order('sequence_number', { ascending: true });
        if (playsError) throw new Error('Plays for ' + (game.designator||game.id) + ': ' + playsError.message);
        const gamePlays = (gamePlaysRaw || []).map(p => ({
          text: p.text, effect: p.effect || {}, team: p.team_side, quarter: p.quarter,
          roles: p.roles, unresolved: p.unresolved, isDivider: p.is_divider, isOverride: p.is_override
        }));
        processGame(game, rosterRows || [], gamePlays);
      }

      document.title = 'Season Report — ' + seasonYearLabel;
      document.getElementById('reportContent').innerHTML = renderSeasonReport();
      showView('mainView');
      initCharts();
    } catch (err) {
      showView('errorView');
      document.getElementById('errorMsg').textContent = 'This report could not be built: ' + err.message;
      console.error(err);
    }
  }

    const seasonStatTable = (bucketObj, headers, rowFn, totalFn, sortKey) => {

          return [p, wy?+(yds/wy).toFixed(1):0, Math.max(0,...names.map(n=>obj[n].puntLong||0)), names.reduce((t,n)=>t+(obj[n].blocked||0),0)]; },

      stHtml += stSub('Kicking', seasonStatTable(bucket, ['FG Att','FG Made','Long FG','FG %','FG Blk','XP Att','XP Made','XP %','XP Blk'],
        d => [d.fgAtt||0, d.fgMade||0, d.fgLong||0, d.fgAtt?Math.round(100*(d.fgMade||0)/d.fgAtt)+'%':'—', d.fgBlocked||0, d.patAtt||0, d.patMade||0, d.patAtt?Math.round(100*(d.patMade||0)/d.patAtt)+'%':'—', d.patBlocked||0],

  function chartOpts(extra){
    return Object.assign({ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ labels:{ font:{ size:11 } } } } }, extra || {});
  }

  function lighten(hex, amt){
    const c = hex.replace('#','');
    const r = parseInt(c.slice(0,2),16), g = parseInt(c.slice(2,4),16), b = parseInt(c.slice(4,6),16);
    const mix = (v) => Math.round(v + (255-v)*amt);
    return '#' + [mix(r),mix(g),mix(b)].map(v => v.toString(16).padStart(2,'0')).join('');
  }
  function readableOn(hex){
    const c = hex.replace('#','');
    const r = parseInt(c.slice(0,2),16), g = parseInt(c.slice(2,4),16), b = parseInt(c.slice(4,6),16);
    const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
    return luminance > 0.55 ? '#000' : '#fff';
  }

  function initCharts(){
    const t = seasonAgg.totals;
    const games = seasonAgg.perGame;
    const labels = games.map((g,i) => g.label || ('G' + (i+1)));
    const headroom = (...dataArrays) => {
      const max = Math.max(0, ...dataArrays.flat().filter(v => typeof v === 'number'));
      return max === 0 ? undefined : Math.ceil(max * 1.2);
    };

    // Chart colors are derived from the team's own branded primary/
    // secondary colors (set in account settings), not a fixed
    // categorical palette, so the report visually matches the team.
    const primary = seasonAgg.ourBranding.primary_color || '#1a1a2e';
    const secondary = seasonAgg.ourBranding.secondary_color || '#8B0000';
    const primaryLight = lighten(primary, 0.45);
    const secondaryLight = lighten(secondary, 0.45);

    const showVal = { color:'#000', anchor:'end', align:'top', formatter:(v) => v ? v : '' };
    const pctOfTotal = { color:(ctx) => readableOn(ctx.dataset.backgroundColor[ctx.dataIndex]), font:{ size:12, weight:'bold' },
      formatter:(v, ctx) => { const total = ctx.chart.data.datasets[0].data.reduce((a,b)=>a+b,0); return total ? Math.round(100*v/total)+'%' : ''; } };

    new Chart(document.getElementById('chartPointsByQuarter'), { type:'bar', data:{ labels:['Q1','Q2','Q3','Q4'],
      datasets:[{ label:'Scored', data:seasonAgg.quarterScored, backgroundColor:primary },
        { label:'Allowed', data:seasonAgg.quarterAllowed, backgroundColor:secondary }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'Points by quarter', font:{size:12} }, legend:{ position:'bottom' }, datalabels:showVal },
        scales:{ y:{ suggestedMax: headroom(seasonAgg.quarterScored, seasonAgg.quarterAllowed) } } }) });

    new Chart(document.getElementById('chartHalfYards'), { type:'bar', data:{ labels:['1st half','2nd half'],
      datasets:[
        { label:TEAMS.teamA.name, data:[games.reduce((s,g)=>s+g.h1Yds,0), games.reduce((s,g)=>s+g.h2Yds,0)], backgroundColor:primary },
        { label:'Opponent', data:[games.reduce((s,g)=>s+g.oppH1Yds,0), games.reduce((s,g)=>s+g.oppH2Yds,0)], backgroundColor:secondary }
      ] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'Total yardage by half', font:{size:12} }, legend:{ position:'bottom' }, datalabels:showVal },
        scales:{ y:{ suggestedMax: headroom(
          [games.reduce((s,g)=>s+g.h1Yds,0), games.reduce((s,g)=>s+g.h2Yds,0)],
          [games.reduce((s,g)=>s+g.oppH1Yds,0), games.reduce((s,g)=>s+g.oppH2Yds,0)]) } } }) });

    new Chart(document.getElementById('chartRunPassAtt'), { type:'doughnut', data:{ labels:['Rush att','Pass att'],
      datasets:[{ data:[t.rushAtt, t.passAtt], backgroundColor:[primary, secondary] }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'Run / pass mix', font:{size:12} }, legend:{ position:'bottom' }, datalabels:pctOfTotal } }) });

    new Chart(document.getElementById('chartRunPassYds'), { type:'doughnut', data:{ labels:['Rush yds','Pass yds'],
      datasets:[{ data:[t.rushYds, t.passYds], backgroundColor:[primary, secondary] }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'Run / pass yardage %', font:{size:12} }, legend:{ position:'bottom' }, datalabels:pctOfTotal } }) });

    new Chart(document.getElementById('chartTurnoversByGame'), { type:'bar', data:{ labels,
      datasets:[{ label:'Turnovers', data:games.map(g=>g.turnovers), backgroundColor:primary }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'Turnovers by game', font:{size:12} }, legend:{ display:false }, datalabels:showVal },
        scales:{ y:{ suggestedMax: headroom(games.map(g=>g.turnovers)) } } }) });

    new Chart(document.getElementById('chartSacksByGame'), { type:'bar', data:{ labels,
      datasets:[{ label:'Sacks allowed', data:games.map(g=>g.sacked), backgroundColor:secondary }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'Sacks allowed by game', font:{size:12} }, legend:{ display:false }, datalabels:showVal },
        scales:{ y:{ suggestedMax: headroom(games.map(g=>g.sacked)) } } }) });

    new Chart(document.getElementById('chartPenaltiesByGame'), { type:'bar', data:{ labels,
      datasets:[{ label:'Penalties', data:games.map(g=>g.penCount), backgroundColor:primary, yAxisID:'y' },
        { label:'Yards', data:games.map(g=>g.penYds), backgroundColor:secondary, yAxisID:'y1' }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'Penalties by game', font:{size:12} }, legend:{ position:'bottom' }, datalabels:showVal },
        scales:{ y:{ position:'left', suggestedMax: headroom(games.map(g=>g.penCount)) },
          y1:{ position:'right', grid:{ drawOnChartArea:false }, suggestedMax: headroom(games.map(g=>g.penYds)) } } }) });

    new Chart(document.getElementById('chart3rdDownByGame'), { type:'line', data:{ labels,
      datasets:[{ label:'Offense 3rd down %', data:games.map(g=>g.d3Pct), borderColor:primary, backgroundColor:primary, tension:0.2 },
        { label:'Opponent 3rd down %', data:games.map(g=>g.oppD3Pct), borderColor:secondary, backgroundColor:secondary, tension:0.2 }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'3rd down % by game', font:{size:12} }, legend:{ position:'bottom' },
        datalabels:{ color:'#000', align:'top', font:{size:9}, formatter:(v) => (v===null||v===undefined) ? '' : v+'%' } },
        scales:{ y:{ suggestedMax: Math.min(100, headroom(games.map(g=>g.d3Pct), games.map(g=>g.oppD3Pct)) || 20) } } }) });

    new Chart(document.getElementById('chart4thDownByGame'), { type:'line', data:{ labels,
      datasets:[{ label:'Offense 4th down %', data:games.map(g=>g.d4Pct), borderColor:primary, backgroundColor:primary, tension:0.2 },
        { label:'Opponent 4th down %', data:games.map(g=>g.oppD4Pct), borderColor:secondary, backgroundColor:secondary, tension:0.2 }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'4th down % by game', font:{size:12} }, legend:{ position:'bottom' },
        datalabels:{ color:'#000', align:'top', font:{size:9}, formatter:(v) => (v===null||v===undefined) ? '' : v+'%' } },
        scales:{ y:{ suggestedMax: Math.min(100, headroom(games.map(g=>g.d4Pct), games.map(g=>g.oppD4Pct)) || 20) } } }) });

    new Chart(document.getElementById('chartExplosiveByGame'), { type:'bar', data:{ labels,
      datasets:[{ label:'20yd+ plays', data:games.map(g=>g.explosiveFor), backgroundColor:primary },
        { label:'20yd+ allowed', data:games.map(g=>g.explosiveAgainst), backgroundColor:secondary }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'20yd+ plays by game', font:{size:12} }, legend:{ position:'bottom' }, datalabels:showVal },
        scales:{ y:{ suggestedMax: headroom(games.map(g=>g.explosiveFor), games.map(g=>g.explosiveAgainst)) } } }) });

    new Chart(document.getElementById('chartPossPlaysByGame'), { type:'line', data:{ labels,
      datasets:[{ label:'Possessions', data:games.map(g=>g.possessions), borderColor:primary, backgroundColor:primary, tension:0.2 },
        { label:'Plays', data:games.map(g=>g.totalPlays), borderColor:secondary, backgroundColor:secondary, tension:0.2 }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'Possessions & plays by game', font:{size:12} }, legend:{ position:'bottom' },
        datalabels:{ color:'#000', align:'top', font:{size:9}, formatter:(v) => v ? v : '' } },
        scales:{ y:{ suggestedMax: headroom(games.map(g=>g.possessions), games.map(g=>g.totalPlays)) } } }) });

    new Chart(document.getElementById('chartYardsByGame'), { type:'bar', data:{ labels,
      datasets:[{ label:'1st half', data:games.map(g=>g.h1Yds), backgroundColor:primaryLight, stack:'a' },
        { label:'2nd half', data:games.map(g=>g.h2Yds), backgroundColor:primary, stack:'a' }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'Total yards by game', font:{size:12} }, legend:{ position:'bottom' },
        datalabels:{ color:(ctx) => readableOn(ctx.dataset.backgroundColor), anchor:'center', align:'center', font:{size:9,weight:'bold'}, formatter:(v) => v ? v : '' } },
        scales:{ x:{ stacked:true }, y:{ stacked:true } } }) });

    new Chart(document.getElementById('chartPassByHalf'), { type:'line', data:{ labels,
      datasets:[{ label:'1st half', data:games.map(g=>g.h1Pass), borderColor:primary, backgroundColor:primary, tension:0.2 },
        { label:'2nd half', data:games.map(g=>g.h2Pass), borderColor:primary, backgroundColor:primary, borderDash:[5,3], tension:0.2 },
        { label:'1st half allowed', data:games.map(g=>g.oppH1Pass), borderColor:secondary, backgroundColor:secondary, tension:0.2 },
        { label:'2nd half allowed', data:games.map(g=>g.oppH2Pass), borderColor:secondary, backgroundColor:secondary, borderDash:[5,3], tension:0.2 }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'Passing yards by half', font:{size:12} }, legend:{ position:'bottom' },
        datalabels:{ color:'#000', align:'top', font:{size:8}, formatter:(v) => v ? v : '' } },
        scales:{ y:{ suggestedMax: headroom(games.map(g=>g.h1Pass), games.map(g=>g.h2Pass), games.map(g=>g.oppH1Pass), games.map(g=>g.oppH2Pass)) } } }) });

    new Chart(document.getElementById('chartRushByHalf'), { type:'line', data:{ labels,
      datasets:[{ label:'1st half', data:games.map(g=>g.h1Rush), borderColor:primary, backgroundColor:primary, tension:0.2 },
        { label:'2nd half', data:games.map(g=>g.h2Rush), borderColor:primary, backgroundColor:primary, borderDash:[5,3], tension:0.2 },
        { label:'1st half allowed', data:games.map(g=>g.oppH1Rush), borderColor:secondary, backgroundColor:secondary, tension:0.2 },
        { label:'2nd half allowed', data:games.map(g=>g.oppH2Rush), borderColor:secondary, backgroundColor:secondary, borderDash:[5,3], tension:0.2 }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'Rushing yards by half', font:{size:12} }, legend:{ position:'bottom' },
        datalabels:{ color:'#000', align:'top', font:{size:8}, formatter:(v) => v ? v : '' } },
        scales:{ y:{ suggestedMax: headroom(games.map(g=>g.h1Rush), games.map(g=>g.h2Rush), games.map(g=>g.oppH1Rush), games.map(g=>g.oppH2Rush)) } } }) });

    new Chart(document.getElementById('chartPassRushByGame'), { type:'bar', data:{ labels,
      datasets:[{ label:'Pass yds', data:games.map(g=>g.passYds), backgroundColor:secondary },
        { label:'Rush yds', data:games.map(g=>g.rushYds), backgroundColor:primary }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'Pass / rush yards by game', font:{size:12} }, legend:{ position:'bottom' }, datalabels:showVal },
        scales:{ y:{ suggestedMax: headroom(games.map(g=>g.passYds), games.map(g=>g.rushYds)) } } }) });
  }

  if (window.Chart && window.ChartDataLabels) Chart.register(ChartDataLabels);
  document.getElementById('downloadPdfBtn').addEventListener('click', () => window.print());

</script>
</body>
</html>
