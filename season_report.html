<title>StatChat — Season Report</title>
<style>
  /* ===== ROTATE PROMPT (phone, portrait) — added 25 August 2026 =========
     Andy's call: let a phone reader see these reports, but tell them once
     that landscape is better. The report layout is NOT changed; this is a
     prompt laid over it and nothing else.

     IT COVERS THE REPORT, NOT THE TOOLBAR. Positioned against the content
     container rather than the viewport, so it cannot end up over Download
     PDF or Download XLS however long the page gets. Those must keep
     working in portrait -- someone who only wants the file should not have
     to dismiss anything first, which is why the prompt says so.

     HIDDEN WHEN PRINTING. PDF export here is window.print(), the browser's
     own print-to-PDF, so an overlay left visible would be baked into the
     PDF as a grey box across the first page. */
  .rotateGate { display:none; }
  .rotateGate.show { position:absolute; inset:0; z-index:400;
    background:rgba(16,20,26,.80); display:flex; align-items:flex-start;
    justify-content:center; padding:26px 20px; border-radius:10px; }
  .rotateBox { background:#fff; border-radius:14px; padding:20px 18px; max-width:300px;
    text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.35); }
  .rotateBox .glyph { font-size:34px; line-height:1; display:block; margin-bottom:10px; }
  .rotateBox h4 { margin:0 0 6px; font-size:16px; }
  .rotateBox p { margin:0 0 14px; font-size:13.5px; color:#555; line-height:1.5; }
  .rotateBox button { width:100%; padding:11px; border-radius:8px; border:none;
    background:var(--sc-navy, #1a1a2e); color:#fff; font-size:14px; font-weight:600;
    cursor:pointer; }
  .rotateBox small { display:block; margin-top:10px; color:#777; font-size:12px; }
  @media print { .rotateGate, .rotateGate.show { display:none !important; } }
  html, body { margin:0; padding:0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background:var(--sc-page, #f4f3ef); color:var(--sc-ink, #1a1a1a); }
  /* THE REPORT IS RENDERED AT PRINTED-PAGE WIDTH, ON SCREEN TOO.
     Chart.js sizes a canvas from its container when the chart is BUILT and
     re-measures only on a resize event. A print pass generates no such
     event, so a canvas built against a 912px screen column kept that width
     while the print stylesheet gave its container ~700px -- which is why
     every chart in the 10-game PDF sat in the left part of its slot with
     dead space to the right.
     Making the screen content width equal the printable width removes the
     mismatch at its source rather than trying to re-measure mid-print.
     732px here (780 less 2x24 padding) is just inside the NARROWER of the
     two paper sizes -- A4 at 8mm margins is 733px, US Letter 755px -- so
     the canvas fits on either without overflowing. */
  .wrap { max-width:780px; margin:0 auto; padding:24px 24px 60px; box-sizing:border-box; }
  .hidden { display:none !important; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .topbar a { color:#555; text-decoration:none; font-size:14px; font-weight:600; }
  .topbar .actions { display:flex; gap:10px; }
  .topbar button { border:none; border-radius:8px; padding:10px 18px; font-size:14px; font-weight:700; cursor:pointer; }
  .topbar button.pdf { background:var(--sc-green, #1a7a4c); color:#fff; }
  .topbar button.xls { background:var(--sc-green-dark, #0f6e56); color:#fff; }
  .msg { padding:10px 14px; border-radius:8px; margin-bottom:14px; font-size:14px; }
  .msg.error { background:var(--sc-red-tint, #fdecea); color:var(--sc-red, #a32d2d); }
  .report-header { position:relative; text-align:center; margin-bottom:16px; background:#fff; border:1px solid #ddd; padding:16px; }
  .statchat-logo { position:absolute; top:12px; right:12px; width:60px; height:auto; border-radius:6px; }
  .report-header h1 { font-size:18px; margin:0 0 4px; }
  .report-header .sub { color:#666; font-size:13px; }
  .report-header .record { font-size:13px; font-weight:600; margin-top:4px; }
  .section { background:#fff; border:1px solid #ddd; padding:16px; margin-bottom:16px; }
  .section-title { font-size:14px; font-weight:700; margin:0 0 12px; text-transform:uppercase; letter-spacing:0.03em; color:#333; }
  .metric-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(110px, 1fr)); gap:10px; margin-bottom:22px; padding-bottom:16px; border-bottom:1px solid #f0f0f0; }
  .metric-tile { text-align:center; padding:8px 4px; }
  .metric-tile .metric-val { font-size:22px; font-weight:700; }
  .metric-tile .metric-label { font-size:10px; color:#888; text-transform:uppercase; letter-spacing:0.02em; margin-top:2px; }
  /* ===== CHARTS: ONE COLUMN, AT EVERY WIDTH ======================
     Eleven of the fifteen charts gain a bar or a point per game and run
     from one game to fifteen over a season. A chart that must carry
     fifteen labelled games cannot do it in a third of a page, so the
     per-game charts each get a full-width row of their own -- the
     arrangement `chartYardsByGame` already used and the only one that
     holds across that whole range.
     The two- and three-column grids that used to hold them are GONE, not
     merely overridden. They brought a second layout with them: their
     children were flat siblings (all metric groups, then all charts)
     paired by grid COLUMN, so a phone had to put the visual order back
     with `order` on :nth-child(1) through (4). A row with FIVE children
     -- which Efficiency has -- left the fifth at the default order:0 and
     threw the 4th-down chart above its own heading. The DOM now emits
     each metric group immediately before the chart it describes, so the
     pairing is structural and no rule has to restore it.
     `.compact` is for the four charts whose bar count never changes --
     two quarters/halves and two donuts. They are capped rather than
     stretched: a two-bar chart nine inches wide reads as a mistake. */
  .chart-unit { margin-bottom:24px; }
  .chart-unit:last-child { margin-bottom:0; }
  .chart-col-metrics { display:flex; justify-content:space-around; gap:8px; flex-wrap:wrap; align-content:flex-start; min-width:0; margin-bottom:4px; }
  .chart-col-metrics .metric-tile { flex:1; min-width:70px; }
  .chart-box { position:relative; height:240px; min-width:0; }
  /* Centred, not left-aligned. The cap is the whole point of `.compact` --
     a two-bar chart or a donut nine inches wide reads as a mistake -- but a
     capped block keeps its default left margin, so the four of them sat
     hard left under metric tiles spread across the full width, and the row
     looked unbalanced rather than deliberate. `margin-inline: auto` centres
     the chart under its own numbers. The tiles stay full width: they are
     the section's summary line and spreading them is what makes them read
     as a strip. */
  .chart-box.compact { height:220px; max-width:430px; margin-inline:auto; }
  /* Four series plus their point labels; 240px letterboxes it. */
  .chart-box.tall { height:285px; }

  @media (max-width: 767px) {
    .wrap { padding:14px 12px 40px; }
    .topbar { flex-wrap:wrap; gap:10px; }
    .topbar .actions { width:100%; }
    .topbar .actions button { flex:1; }
    .report-header { padding:14px; }
    .statchat-logo { width:44px; top:10px; right:10px; }
    .section { padding:12px; }
    .metric-grid { grid-template-columns:repeat(auto-fit, minmax(88px, 1fr)); gap:8px; }
    .metric-tile .metric-val { font-size:19px; }

    /* Nothing to collapse any more -- the layout is one column at every
       width, so a phone differs from paper only in scale. The `order`
       rules that used to restore metric/chart pairing here are gone with
       the grids that needed them. */
    .chart-box { height:210px; }
    .chart-box.compact { height:200px; max-width:none; }
    .chart-box.tall { height:250px; }
    .chart-col-metrics { justify-content:space-between; }

    .table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -12px; padding:0 12px; }
    table.stat-table { font-size:12px; }
    table.stat-table th, table.stat-table td { padding:5px 6px; }
  }
  table.stat-table { width:100%; border-collapse:collapse; font-size:13px; background:#fff; margin-bottom:6px; }
  table.stat-table th, table.stat-table td { padding:6px 8px; text-align:right; border:1px solid #eee; }
  table.stat-table th:first-child, table.stat-table td:first-child { text-align:left; }
  table.stat-table th { background:#f5f5f5; color:#555; font-weight:600; font-size:11px; text-transform:uppercase; }
  table.stat-table tr.total-row { font-weight:800; background:#fafafa; }
  .no-stats { color:#999; font-size:13px; font-style:italic; }
  .st-subsection { margin-top:14px; }
  .st-subsection-label { font-size:11px; font-weight:700; color:#888; text-transform:uppercase; letter-spacing:0.03em; margin-bottom:4px; }
  /* ===== SECTION HEADERS =====================================
     Two levels, doing different jobs. The big header says which part of
     the document this is; the coloured band says whose numbers follow.
     Before this, both were the same small grey label and a reader had no
     way to tell a document section from a team's table. */
  .sec-head { margin:34px 0 14px; }
  .sec-head:first-child { margin-top:0; }
  /* The eyebrow names the document. It is PRINT ONLY: on screen you know
     which page you are on, but a sheet that has been printed and
     separated from the rest does not say where it came from. */
  .sec-eyebrow { display:none; font-size:10.5px; font-weight:700; letter-spacing:0.16em;
                 text-transform:uppercase; color:var(--sc-ink-muted, #9aa3b2); margin:0 0 3px; }
  .sec-title { font-size:21px; font-weight:700; letter-spacing:-0.02em; color:#12161c;
               margin:0; line-height:1.1; text-align:left; }
  .sec-sub { font-size:12px; color:#7c8794; margin:4px 0 0; font-variant-numeric:tabular-nums; }
  /* A team band carries its own colour inline; the text colour is chosen
     by contrast so a pale school cannot produce an unreadable band. */
  /* The top margin is the important half. A band used to sit 12px below
     the previous table, which itself had a 6px bottom margin -- so a
     whole section ended and the next one began within 18px, and the page
     read as one undifferentiated run of tables.
     A band opens a section, so the space belongs ABOVE it. */
  .team-band { font-size:12px; font-weight:700; text-transform:uppercase;
               letter-spacing:0.12em; padding:9px 14px; border-radius:6px;
               margin:30px 0 12px; display:flex; align-items:center; gap:9px; }
  /* ...but not when it is the first thing in its container, or every
     section would open with a gap it did not need. */
  .team-band:first-child { margin-top:0; }
  .team-band .tb-dot { width:9px; height:9px; border-radius:50%; }
  .team-band .tb-sub { margin-left:auto; font-weight:600; letter-spacing:0.06em;
                       opacity:0.85; text-transform:none; font-size:11px; }
  .sec-title, .team-band { page-break-after:avoid; break-after:avoid; }
  /* RUNNING FOOTER. position:fixed inside a print context repeats the
     element on every sheet -- the only reliable way to get a footer on
     each page without a print engine. Hidden on screen, where the page
     has no bottom to sit at. */
  .print-footer { display:none; }
  /* The end mark is in the NORMAL flow, so it lands wherever the content
     finishes -- which is the last page, and only the last page. There is
     no CSS selector for "the final sheet", so this is the mechanism. */
  .print-endmark { display:none; }
  @media print {
    /* Room for the running footer, so it never sits on top of a table.
       The side margins are now declared rather than left to the browser:
       they are what fixes the printable width, and the canvases are built
       against that width. Leaving them to the print dialog's default let
       the printable area fall under 767px, which silently switched the
       whole report into the phone layout. */
    @page { margin: 10mm 8mm 16mm; }
    .print-footer { display:block; position:fixed; bottom:6mm; left:0; right:0;
                    text-align:center; font-size:9px; color:var(--sc-ink-muted, #9aa3b2);
                    letter-spacing:0.04em; }
    /* Pushed down so the logo sits just above the running footer rather
       than immediately under the last table.
       This is a MARGIN, not a pin: CSS cannot anchor an element to the
       bottom of the final printed sheet, so if the content happens to end
       low on the page the logo moves to the next one. 42mm is chosen to
       clear the common case without being so large it usually spills. */
    .print-endmark { display:flex; align-items:center; justify-content:center;
                     margin:42mm 0 0; padding-top:18px;
                     border-top:1px solid var(--sc-rule, #e6e6e6);
                     page-break-inside:avoid; break-inside:avoid; }
    .print-endmark img { width:38px; height:38px; border-radius:7px; }

    /* BACKGROUNDS MUST BE TOLD TO PRINT.
       Browsers drop background colours from printed output by default --
       an ink-saving default from the era of text documents. So the team
       bands printed as grey text on white and the row banding vanished
       entirely, which is most of the visual work on the page.
       print-color-adjust:exact overrides that for the elements where the
       colour IS the information. Not applied page-wide: the default is a
       sensible one for body text. */
    .team-band, .scoring-summary tbody tr, .header, .section {
      -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    /* The eyebrow appears only in print, on every section: a detached
       page should say what document it belongs to. */
    .sec-eyebrow { display:block; }
    .sec-title { font-size:17px; }
    .team-band { padding:7px 11px; }

    body { background:#fff; }
    /* No side padding: the @page margin below is the page margin, and
       adding a second one here would make the printable width -- which
       the canvases were sized against -- narrower than the screen's. */
    .wrap { max-width:none; padding:0; }
    .no-print { display:none !important; }
    .report-header { page-break-inside:avoid; break-inside:avoid; }

    /* A SECTION THAT CANNOT FIT MUST BE ALLOWED TO BREAK.
       `break-inside: avoid` is a hope about space, not a rule about a
       boundary (see PROJECT_NOTES, 15 Aug). Once a chart section holds
       three or four full-width per-game charts it is taller than a sheet,
       the hope is unsatisfiable, and the browser breaks it wherever it
       likes -- which on page 5 of the 10-game PDF meant half an empty
       page and a heading stranded from its chart.
       So the avoid moves DOWN to the units that can honour it: a metric
       strip never parts from the chart it describes, and a heading never
       parts from what follows it. The section then breaks between charts,
       which is the only place a break reads as deliberate.
       Table sections still fit, and keep the old behaviour. */
    .section { page-break-inside:avoid; break-inside:avoid; }
    .section.chart-section { page-break-inside:auto; break-inside:auto; }
    .chart-unit { page-break-inside:avoid; break-inside:avoid; }
    .sec-head { page-break-after:avoid; break-after:avoid; }

    /* Last-ditch guard on paper narrower than the canvases were built
       for. A few per cent of horizontal squash is invisible; a canvas
       running off the right edge is not. */
    .chart-box canvas { max-width:100% !important; }

    .page-break { page-break-before:always; break-before:always; }
  }
  /* The copyright line. Muted, small, and given its own top margin rather
     than a bottom one, so adding it cannot push anything or change the
     scroll height of a page that previously ended flush. */
  .sc-copyright { margin:26px auto 0; padding:0 2px 4px; font-size:12px;
    line-height:1.5; color:var(--sc-ink-muted, #8d99a6); opacity:.75;
    text-align:center; max-width:760px; }
  @media print { .sc-copyright { color:#666 !important; opacity:1; } }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
