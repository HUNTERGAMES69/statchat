<script>
  const SUPABASE_URL = 'https://pboushzlcyfkssojpuut.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_VGnUYurlkoH1yi67jHO6iQ_C8Q0EM2d';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  // FETCH EVERY ROW, NOT THE FIRST PAGE OF THEM.
  // ------------------------------------------------------------------
  // PostgREST caps a response at 1000 rows by default and says nothing
  // when it truncates -- no error, no flag, just a short array. Fetching
  // one game at a time never hit it, because a game is ~150 plays. Asking
  // for a whole season in one query does: a 10-game season is ~1500 rows,
  // so 500 went missing, and because the query is ordered by
  // sequence_number ASCENDING the rows lost are the HIGHEST ones -- the
  // end of every game. Q3, Q4 and the second half vanished from the
  // charts and players who only appeared late vanished entirely.
  //
  // Pages explicitly with .range() until a short page comes back. Still
  // two logical fetches rather than two per game, so the speed-up holds;
  // it just no longer stops at the first thousand rows.
  async function fetchAllByGame(client, table, ids, orderCol){
    const PAGE = 1000;
    const out = [];
    for (let from = 0; ; from += PAGE){
      let q = client.from(table).select('*').in('game_id', ids);
      if (orderCol) q = q.order(orderCol, { ascending: true });
      const { data, error } = await q.range(from, from + PAGE - 1);
      if (error) throw error;
      const rows = data || [];
      out.push(...rows);
      // A short page means there is no next one. Equal to PAGE is
      // ambiguous, so it loops once more and gets an empty page.
      if (rows.length < PAGE) break;
    }
    return out;
  }

  function showView(name){
    ['loading','errorView','mainView'].forEach(v => document.getElementById(v).classList.toggle('hidden', v !== name));
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'INITIAL_SESSION'){
      if (session){ init(); } else { window.location.href = '/login.html'; }
    } else if (event === 'SIGNED_OUT'){
      window.location.href = '/login.html';
    }
  });

  let plays = [], startingPossession = 'teamA', quarterLengthSec = 720;
  const TEAMS = {};

  // --- Proven read-only engine core, extracted verbatim from game.html / view.html ---
  function otherTeam(t){ return t === 'teamA' ? 'teamB' : 'teamA'; }
const TIMEOUTS_PER_HALF = 3;
const TIMEOUTS_PER_OT = 1;
  // Administrative entries -- clock markers, quarter/half dividers, manual
  // possession flips -- are announcements, not football plays. They carry
  // no roles and no yardage, so anything reasoning about "what actually
  // happened on this drive" has to skip them.
  //
  // isReset markers are deliberately NOT administrative: they are explicit
  // "new drive" announcements and are valid drive starts.
    // Team tackles for loss, counted from the PLAY rather than a named
  // tackler. Naming the tackler is optional and often skipped at speed,
  // so requiring one would undercount a stat the log already knows for
  // certain: a scrimmage snap by the other team that lost yardage was a
  // tackle for loss, whoever made it. Sacks are included, per NFHS and
  // NCAA, and reported alongside the sack count so both can be read.
  function teamTflFor(playsList, defTeam){
    const TYPES = ['rush', 'pass', 'sack'];
    return (playsList || []).reduce((n, p) => {
      const r = p.roles, e = p.effect || {};
      if (!r) return n;
      const byOpp = (r.carrier && r.carrier.team !== defTeam && r.carrier.team) ||
                    (r.passer && r.passer.team !== defTeam && r.passer.team);
      if (!byOpp) return n;
      if (TYPES.indexOf(r.playType) === -1) return n;
      return (typeof e.statYds === 'number' && e.statYds < 0) ? n + 1 : n;
    }, 0);
  }
function isAdminMarker(p){
    if (!p) return true;
    const e = p.effect || {};
    if (e.isReset) return false;
    // e.timeout added 19 Aug 2026: see game.html for the full reasoning --
    // found and fixed there first, from a real-game report.
    return !!(e.clockEvent || e.setQuarter || e.forcePossession || e.timeout || p.isDivider);
  }

  // Jersey numbers resolve across ALL THREE roster units, not just the one
  // the play type implies. High-school rosters routinely list a player
  // under a single unit even though they play several, and a dedicated
  // kick/punt returner is normally rostered on special teams only -- which
  // is why returners used to render in the log as a bare "#25".
  //
  // A fallback can only ever turn "#25" into a name; it can never change a
  // name that already resolved, because the expected unit is always
  // searched first. This mirrors playerName() in the report pages.






  // --- End engine core ---




  function buildTeams(game, rosterRows, ourBranding){
    const ourName = game.our_team_is_home ? game.home_team_name : game.away_team_name;
    const oppName = game.our_team_is_home ? game.away_team_name : game.home_team_name;
    TEAMS.teamA = { name: ourName, bg: ourBranding.primary_color || '#2b3440', text: ourBranding.secondary_color || '#ffffff',
      rosterOffense:{}, rosterDefense:{}, rosterSpecialTeams:{}, rosterUnassigned:{}, posOffense:{}, logo: ourBranding.logo_url || null,
      isHome: !!game.our_team_is_home };
    const oppPrimary = game.opponent_primary_color || '#6e7885', oppSecondary = game.opponent_secondary_color || '#ffffff';
    TEAMS.teamB = { name: oppName, bg: oppPrimary, text: oppSecondary,
      rosterOffense:{}, rosterDefense:{}, rosterSpecialTeams:{}, rosterUnassigned:{}, posOffense:{}, logo: game.opponent_logo_url || null,
      isHome: !game.our_team_is_home };
    if (colorDistance(TEAMS.teamA.bg, TEAMS.teamB.bg) < 60){
      if (colorDistance(TEAMS.teamA.bg, oppSecondary) >= 60){
        TEAMS.teamB.bg = oppSecondary;
        TEAMS.teamB.text = oppPrimary;
      } else {
        TEAMS.teamB.bg = luminance(TEAMS.teamA.bg) > 0.5 ? '#3a3a3a' : '#c8c8c8';
        TEAMS.teamB.text = luminance(TEAMS.teamB.bg) > 0.55 ? '#1a1a1a' : '#ffffff';
      }
    }
    rosterRows.forEach(r => {
      const team = TEAMS[r.team_side];
      if (!team) return;
      if (r.unit === 'offense'){ team.rosterOffense[r.jersey_number] = r.player_name; team.posOffense[r.jersey_number] = r.position; }
      else if (r.unit === 'defense'){ team.rosterDefense[r.jersey_number] = r.player_name; }
      else if (r.unit === 'special'){ team.rosterSpecialTeams[r.jersey_number] = r.player_name; }
      // Requested directly: resolving every unrecognized-position player
      // to a unit is impractical on a large, position-less roster.
      // Still absent from the three unit-specific picker lists above --
      // there is nothing to file him under -- but named here so
      // rosterName/playerName (engine.js) can resolve him once he is
      // actually credited on a play, instead of reading as a call-up.
      else if (r.player_name){ team.rosterUnassigned[r.jersey_number] = r.player_name; }
    });
  }







  const RECEIVE_POS = new Set(['WR','TE','SE','FL','SLOT','SB']);

  function sumStat(bucketObj, key){
    return Object.keys(bucketObj).reduce((t, n) => t + (bucketObj[n][key] || 0), 0);
  }
  function maxStat(bucketObj, key){
    return Object.keys(bucketObj).reduce((t, n) => Math.max(t, bucketObj[n][key] || 0), 0);
  }
  function mergeInto(target, key, delta){
    if (!target[key]) target[key] = {};
    Object.keys(delta).forEach(k => {
      // A LIST OF MAXIMA, and every "long" has to be on it. `retLong`
      // was added on 23 Aug with the return stats: without it a season
      // total SUMS the longs, so three returns of 20 would report a long
      // of 60. The suffix test catches any future one automatically --
      // the explicit names are kept only so the intent stays readable.
      if (/Long$/.test(k) || k === 'long' || k === 'fgLong' || k === 'puntLong' || k === 'retLong'){
        target[key][k] = Math.max(target[key][k] || 0, delta[k] || 0);
      } else {
        target[key][k] = (target[key][k] || 0) + (delta[k] || 0);
      }
    });
  }

  let seasonYearLabel = '';
  const seasonAgg = {
    rushing: {}, passing: {}, receiving: {}, specialTeams: {},
    defense: { int: 0, fumRec: 0, sacks: 0, tfl: 0 },
      tacklers: {},   // per-player: tackles, tfl, sacks, int, fumRec
    perGame: [],
    totals: { rushAtt:0, rushYds:0, rushTd:0, passAtt:0, passComp:0, passYds:0, passTd:0, sacked:0, totalPlays:0, possessions:0, turnovers:0, penCount:0, penYds:0, topSec:0, topGames:0,
      oppD3att:0, oppD3conv:0, oppD4att:0, oppD4conv:0, explosiveFor:0,
      oppRushAtt:0, oppRushYds:0, oppRushTd:0, oppPassAtt:0, oppPassComp:0, oppPassYds:0, oppPassTd:0,
      pointsScored:0, pointsAllowed:0, explosiveAgainst:0 },
    quarterScored: [0,0,0,0], quarterAllowed: [0,0,0,0],
    wins: 0, losses: 0, ties: 0
  };

  function processGame(game, rosterRows, gamePlays){
    buildTeams(game, rosterRows, seasonAgg.ourBranding || {});
    const box = computeBoxScore(gamePlays);
    plays = gamePlays;
    const finalState = computeState(gamePlays);
    const possessions = countPossessions(gamePlays);
    const turnovers = countTurnovers(gamePlays);
    const scrimmageTypes = ['rush','pass','incomplete','sack','int','fumble'];
    // OFFENSE DETERMINED BY ROLE, NOT BY p.team -- see recap.html for
    // the full reasoning, found and fixed there first the same night.
    const offenseTeamOf = (p) => {
      const r = p.roles;
      if (!r) return null;
      if (r.carrier) return r.carrier.team;
      if (r.passer) return r.passer.team;
      return null;
    };
    const playsFor = (teamKey) => gamePlays.filter(p => p.roles && scrimmageTypes.includes(p.roles.playType) && offenseTeamOf(p) === teamKey).length;

    ['rushing','passing','receiving'].forEach(cat => {
      Object.keys(box.teamA[cat]).forEach(n => {
        mergeInto(seasonAgg[cat], n, box.teamA[cat][n]);
      });
    });
    Object.keys(box.teamA.specialTeams).forEach(n => {
      mergeInto(seasonAgg.specialTeams, n, box.teamA.specialTeams[n]);
    });
    // Per-player defence, accumulated by name like every other category.
    // The team totals below stay as they are -- they answer a different
    // question and must not be replaced by these (see the note by the
    // table).
    Object.keys(box.teamA.defense || {}).forEach(n => {
      if (n !== 'TEAM') mergeInto(seasonAgg.tacklers, n, box.teamA.defense[n]);
    });

    seasonAgg.defense.int += sumStat(box.teamA.defense, 'int');
    seasonAgg.defense.fumRec += sumStat(box.teamA.defense, 'fumRec');
    seasonAgg.defense.sacks += sumStat(box.teamA.defense, 'sacks');
    // Counted from this game's plays, not from a bucket -- TFL is a team
    // stat derived from the log rather than credited to a player.
    seasonAgg.defense.tfl += teamTflFor(plays, 'teamA');

    const t = seasonAgg.totals;
    const ownDowns = box.teamB.oppDowns, oppDowns = box.teamA.oppDowns;
    let rushYds = sumStat(box.teamA.rushing,'yds');
    const rushAtt = sumStat(box.teamA.rushing,'att'), rushTd = sumStat(box.teamA.rushing,'td');
    // NFHS: sack yardage is charged against RUSHING, not passing.
    // Individual passer season totals in seasonAgg.passing stay
    // unadjusted, matching each player's own personal statline.
    //
    // NOT currently called anywhere -- confirmed by search before this
    // fix, not assumed. Corrected anyway, alongside the identical,
    // LIVE gap a few lines down (the 'Sacks and Bad Snaps' xlsx row),
    // rather than left as a latent copy of the same mistake for
    // whenever this does get wired up.
    const sackYardsLostFor = (teamKey) => gamePlays.reduce((tot, p) => {
      const r = p.roles;
      return (r && (r.playType === 'sack' || (r.playType === 'fumble' && r.attempt === 'sack')) && r.passer && r.passer.team === teamKey) ? tot + (r.passer.yards || 0) : tot;
    }, 0);
    const passYds = sumStat(box.teamA.passing,'yds'), passAtt = sumStat(box.teamA.passing,'att'), passComp = sumStat(box.teamA.passing,'comp'), passTd = sumStat(box.teamA.passing,'td');
    let oppRushYds = sumStat(box.teamB.rushing,'yds');
    const oppRushAtt = sumStat(box.teamB.rushing,'att'), oppRushTd = sumStat(box.teamB.rushing,'td');
    // NFHS/NCAA convention: sacks are a rushing loss, not a passing one.
    // Applied AFTER both declarations -- doing it earlier referenced
    // oppRushYds before its `let`, which is a TDZ error that killed the
    // whole report.
    const oppPassYds = sumStat(box.teamB.passing,'yds'), oppPassAtt = sumStat(box.teamB.passing,'att'), oppPassComp = sumStat(box.teamB.passing,'comp'), oppPassTd = sumStat(box.teamB.passing,'td');
    const pen = finalState.penalties.teamA;
    t.rushAtt += rushAtt; t.rushYds += rushYds; t.rushTd += rushTd;
    t.passAtt += passAtt; t.passComp += passComp; t.passYds += passYds; t.passTd += passTd;
    t.sacked += sumStat(box.teamA.passing, 'sacked');
    t.totalPlays += playsFor('teamA');
    t.possessions += possessions.teamA || 0;
    t.turnovers += turnovers.teamA || 0;
    t.penCount += pen.count; t.penYds += pen.yds;
    // Time of possession across the season. topGames counts only the
    // games that actually recorded a clock, so the per-game average is
    // over games with data rather than over every game played -- an
    // average diluted by games nobody clocked would be worse than no
    // average at all.
    {
      const gTop = (finalState.possessionTime || {}).teamA || 0;
      if (gTop > 0){ t.topSec += gTop; t.topGames += 1; }
    }
    t.oppD3att += oppDowns.d3att; t.oppD3conv += oppDowns.d3conv;
    t.oppD4att += oppDowns.d4att; t.oppD4conv += oppDowns.d4conv;
    t.explosiveFor += ownDowns.explosive;
    t.explosiveAgainst += oppDowns.explosive;
    t.oppRushAtt += oppRushAtt; t.oppRushYds += oppRushYds; t.oppRushTd += oppRushTd;
    t.oppPassAtt += oppPassAtt; t.oppPassComp += oppPassComp; t.oppPassYds += oppPassYds; t.oppPassTd += oppPassTd;
    t.pointsScored += finalState.scores.teamA; t.pointsAllowed += finalState.scores.teamB;

    if (finalState.scores.teamA > finalState.scores.teamB) seasonAgg.wins++;
    else if (finalState.scores.teamA < finalState.scores.teamB) seasonAgg.losses++;
    else seasonAgg.ties++;

    const quarterScored = [0,0,0,0], quarterAllowed = [0,0,0,0];
    let h1Rush=0, h1Pass=0, h2Rush=0, h2Pass=0, oppH1Rush=0, oppH1Pass=0, oppH2Rush=0, oppH2Pass=0;
    gamePlays.forEach(p => {
      const q = Math.min(4, Math.max(1, p.quarter || 1)) - 1;
      if (p.effect && p.effect.score){
        if (p.effect.score.team === 'teamA') quarterScored[q] += p.effect.score.points; else quarterAllowed[q] += p.effect.score.points;
      }
      if (p.effect && p.effect.scoreAdjust){
        if (p.effect.scoreAdjust.team === 'teamA') quarterScored[q] += p.effect.scoreAdjust.pts; else quarterAllowed[q] += p.effect.scoreAdjust.pts;
      }
      const r = p.roles;
      if (!r) return;
      const half = (p.quarter || 1) <= 2 ? 1 : 2;
      // A merged fumble play is playType 'fumble' but it WAS a rush or a
      // completion -- see the 'f' branch of parseInput. Keying on
      // playType alone dropped its yardage out of the half splits, so a
      // drive-ending fumble quietly shrank the half it happened in.
      // Sacks stay out, as they always have been here.
      const isRush = r.playType === 'rush' || (r.playType === 'fumble' && r.attempt === 'rush');
      const isPass = r.playType === 'pass' || (r.playType === 'fumble' && r.attempt === 'pass');
      if (isRush && r.carrier && r.carrier.team === 'teamA'){ if (half===1) h1Rush += (r.carrier.yards||0); else h2Rush += (r.carrier.yards||0); }
      if (isPass && r.passer && r.passer.team === 'teamA'){ if (half===1) h1Pass += (r.passer.yards||0); else h2Pass += (r.passer.yards||0); }
      if (isRush && r.carrier && r.carrier.team === 'teamB'){ if (half===1) oppH1Rush += (r.carrier.yards||0); else oppH2Rush += (r.carrier.yards||0); }
      if (isPass && r.passer && r.passer.team === 'teamB'){ if (half===1) oppH1Pass += (r.passer.yards||0); else oppH2Pass += (r.passer.yards||0); }
    });
    for (let i=0;i<4;i++){ seasonAgg.quarterScored[i] += quarterScored[i]; seasonAgg.quarterAllowed[i] += quarterAllowed[i]; }

    seasonAgg.perGame.push({
      label: game.designator || '', totalYds: rushYds+passYds, rushYds, passYds,
      h1Yds: h1Rush+h1Pass, h2Yds: h2Rush+h2Pass, h1Rush, h1Pass, h2Rush, h2Pass,
      oppTotalYds: oppRushYds+oppPassYds, oppH1Yds: oppH1Rush+oppH1Pass, oppH2Yds: oppH2Rush+oppH2Pass,
      oppH1Rush, oppH1Pass, oppH2Rush, oppH2Pass,
      pointsScored: finalState.scores.teamA, pointsAllowed: finalState.scores.teamB,
      d3Pct: ownDowns.d3att ? Math.round(100*ownDowns.d3conv/ownDowns.d3att) : null,
      oppD3Pct: oppDowns.d3att ? Math.round(100*oppDowns.d3conv/oppDowns.d3att) : null,
      d4Pct: ownDowns.d4att ? Math.round(100*ownDowns.d4conv/ownDowns.d4att) : null,
      oppD4Pct: oppDowns.d4att ? Math.round(100*oppDowns.d4conv/oppDowns.d4att) : null,
      explosiveFor: ownDowns.explosive || 0, explosiveAgainst: oppDowns.explosive || 0,
      possessions: possessions.teamA || 0, totalPlays: playsFor('teamA'),
      penCount: pen.count, penYds: pen.yds,
      turnovers: turnovers.teamA || 0, sacked: sumStat(box.teamA.passing, 'sacked')
    });

    // XLS export rows -- same 43-column "Stats" schema and "Game
    // Totals" schema as stat_package.html's single-game export, just
    // appended here once per game so the season file ends up with
    // every game stacked together, matching the original reference
    // spreadsheet's multi-game structure.
    const gameIdMatch = (game.designator || '').match(/(\d+)/);
    const gameId = gameIdMatch ? parseInt(gameIdMatch[1]) : (game.designator || '');
    const blankRow = () => xlsStatsHeaders.map(() => '');
    const setCols = (row, obj) => { Object.keys(obj).forEach(k => { const i = xlsStatsHeaders.indexOf(k); if (i>=0) row[i] = obj[k]; }); return row; };

    Object.keys(box.teamA.rushing).forEach(n => {
      const d = box.teamA.rushing[n], row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: n,
        'Rush Attempts': d.att||0, 'Rush Yards': d.yds||0, 'Yds Per Carry': d.att?+(d.yds/d.att).toFixed(1):'',
        'Long Rush': d.long||0, 'Rush TD': d.td||0, FUMBLE: d.fum || '' });
      xlsStatsRows.push(row);
    });
    Object.keys(box.teamA.passing).forEach(n => {
      const d = box.teamA.passing[n], row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: n,
        'Pass Attempts': d.att||0, 'Pass Completions': d.comp||0, 'Comp Pctg': d.att?+(100*(d.comp||0)/d.att).toFixed(1):'',
        'Pass Yards': d.yds||0, 'Long Pass': d.long||0, 'Pass TD': d.td||0, INT: d.intThrown||0, SACK: d.sacked||0 });
      xlsStatsRows.push(row);
    });
    Object.keys(box.teamA.receiving).forEach(n => {
      const d = box.teamA.receiving[n], row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: n,
        Receptions: d.rec||0, 'Receiving Yards': d.yds||0, 'Yards Per Catch': d.rec?+(d.yds/d.rec).toFixed(1):'',
        'Long Recept': d.long||0, 'Receiving TD': d.td||0, FUMBLE: d.fum || '' });
      xlsStatsRows.push(row);
    });
    Object.keys(box.teamA.specialTeams).filter(n => box.teamA.specialTeams[n].kickoffs).forEach(n => {
      const d = box.teamA.specialTeams[n], row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: n,
        'KO Attempt': d.kickoffs||0, 'KO Touchback': d.touchbacks||0 });
      xlsStatsRows.push(row);
    });
    Object.keys(box.teamA.specialTeams).filter(n => box.teamA.specialTeams[n].patAtt).forEach(n => {
      const d = box.teamA.specialTeams[n], row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: n,
        'PA Attempt': d.patAtt||0, 'PA Made': d.patMade||0, 'PA Block': d.patBlocked||0 });
      xlsStatsRows.push(row);
    });
    gamePlays.forEach(p => {
      const r = p.roles;
      if (r && r.playType === 'fg' && r.kicker && r.kicker.team === 'teamA'){
        const row = blankRow();
        setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: playerName('teamA', r.kicker.num, 'special'),
          'FG Attempt': 1, 'FG Made': r.kicker.result==='g'?1:0, 'FG Block': r.kicker.result==='b'?1:0, 'FG Yards': r.kicker.yards||0 });
        xlsStatsRows.push(row);
      }
      if (r && r.playType === 'punt' && r.punter && r.punter.team === 'teamA'){
        const row = blankRow();
        setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: playerName('teamA', r.punter.num, 'special'),
          'Punt Attempt': 1, 'Punt Yards': r.punter.blocked?0:(r.punter.yards||0), 'PUNT BLK': r.punter.blocked?1:'' });
        xlsStatsRows.push(row);
      }
    });
    let sackCount=0, sackYardsLost=0;
    // Reported directly, 20 Aug 2026: a sack-turned-fumble was missing
    // from this count specifically, even after engine.js's own sack
    // credit was fixed for the same shape -- because this loop never
    // goes through computeBoxScore or sumStat at all. It re-reads
    // gamePlays directly and only ever tested r.playType==='sack', so a
    // sack recorded as playType 'fumble' (with attempt: 'sack', the
    // shape a sack-fumble is actually saved in) was invisible to it. Same
    // gap, same fix, a separate place engine.js's own change could not
    // reach because this was never routed through it.
    gamePlays.forEach(p => { const r=p.roles; if (r && (r.playType==='sack' || (r.playType==='fumble' && r.attempt==='sack')) && r.passer && r.passer.team==='teamA'){ sackCount++; sackYardsLost += (r.passer.yards||0); } });
    if (sackCount){
      const row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: 'Sacks and Bad Snaps', 'Rush Attempts': sackCount, 'Rush Yards': -sackYardsLost });
      xlsStatsRows.push(row);
    }
    const defRow = blankRow();
    setCols(defRow, { GameID: gameId, Team: TEAMS.teamA.name, Player: 'Defense',
      'D-Sack': sumStat(box.teamA.defense,'sacks')||'', 'D-INT': sumStat(box.teamA.defense,'int')||'', 'D-FUM': sumStat(box.teamA.defense,'fumRec')||'',
      'D-3rdAtt': oppDowns.d3att||'', 'D-3rdConv': oppDowns.d3conv||'', 'D-4thAtt': oppDowns.d4att||'',
      'D-4thStop': oppDowns.d4att ? (oppDowns.d4att-oppDowns.d4conv) : '', 'D-20PlusPlay': oppDowns.explosive||'' });
    xlsStatsRows.push(defRow);
    const offRow = blankRow();
    setCols(offRow, { GameID: gameId, Team: TEAMS.teamA.name, Player: 'Offense', 'D-20PlusPlay': ownDowns.explosive||'' });
    xlsStatsRows.push(offRow);
    const oppRow = blankRow();
    setCols(oppRow, { GameID: gameId, Team: TEAMS.teamB.name, Player: TEAMS.teamB.name,
      'Rush Attempts': oppRushAtt||'', 'Rush Yards': oppRushYds||'', 'Rush TD': oppRushTd||'',
      'Pass Attempts': oppPassAtt||'', 'Pass Completions': oppPassComp||'', 'Pass Yards': oppPassYds||'', 'Pass TD': oppPassTd||'' });
    xlsStatsRows.push(oppRow);

    const visitorGtKey = game.our_team_is_home ? 'teamB' : 'teamA';
    [ { key:'teamA', name: TEAMS.teamA.name, down: ownDowns, sacked: sumStat(box.teamA.passing,'sacked') },
      { key:'teamB', name: TEAMS.teamB.name, down: null, sacked: '' } ].forEach(({key,name,down,sacked}) => {
      const gtRow = xlsGtHeaders.map(() => '');
      const setGt = (obj) => Object.keys(obj).forEach(k => { const i = xlsGtHeaders.indexOf(k); if (i>=0) gtRow[i] = obj[k]; });
      setGt({ GameID: gameId, Team: name,
        Q1: key==='teamB'?quarterAllowed[0]:quarterScored[0],
        Q2: key==='teamB'?quarterAllowed[1]:quarterScored[1], Q3: key==='teamB'?quarterAllowed[2]:quarterScored[2], Q4: key==='teamB'?quarterAllowed[3]:quarterScored[3],
        Final: finalState.scores[key],
        Penalites: finalState.penalties[key].count||'', 'Penalty Yards': finalState.penalties[key].yds||'',
        'H1 Yards': key==='teamA'?(h1Rush+h1Pass):'', 'H2 Yards': key==='teamA'?(h2Rush+h2Pass):'',
        'Total Yards': key==='teamA'?(rushYds+passYds):(oppRushYds+oppPassYds),
        Sacks: key==='teamA'?(sacked||''):'', TO: turnovers[key]||0, Possessions: possessions[key]||0,
        'H1 Rushing': key==='teamA'?h1Rush:'', 'H1 Passing': key==='teamA'?h1Pass:'', 'H2 Rushing': key==='teamA'?h2Rush:'', 'H2 Passing': key==='teamA'?h2Pass:'' });
      if (down){ setGt({ '3D Att': down.d3att||'', '3D Conv': down.d3conv||'', '4D Att': down.d4att||'', '4D Conv': down.d4conv||'' }); }
      xlsGtRows.push(gtRow);
    });
  }

  const xlsStatsHeaders = ['GameID','Team','Player','Rush Attempts','Rush Yards','Yds Per Carry','Long Rush','Rush TD',
    'Pass Attempts','Pass Completions','Comp Pctg','Pass Yards','Long Pass','Pass TD','INT','SACK',
    'Receptions','Receiving Yards','Yards Per Catch','Long Recept','Receiving TD','FUMBLE',
    'KO Attempt','KO Touchback','PA Attempt','PA Made','PA Block','FG Attempt','FG Made','FG Block','FG Yards','Long FG',
    'Punt Attempt','Punt Yards','Long Punt','PUNT BLK',
    'D-Sack','D-INT','D-FUM','D-3rdAtt','D-3rdConv','D-4thAtt','D-4thStop','D-20PlusPlay'];
  const xlsGtHeaders = ['GameID','Team','Q1','Q2','Q3','Q4','OT','Final','Penalites','Penalty Yards',
    'H1 Yards','H2 Yards','Total Yards','Sacks','TO','Possessions','3D Att','3D Conv','4D Att','4D Conv',
    'H1 Rushing','H1 Passing','H2 Rushing','H2 Passing'];
  const xlsStatsRows = [], xlsGtRows = [];

  function buildWorkbook(){
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([xlsStatsHeaders, ...xlsStatsRows]), 'Stats');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([xlsGtHeaders, ...xlsGtRows]), 'Game Totals');
    return wb;
  }

  document.getElementById('downloadXlsBtn').addEventListener('click', () => {
    const wb = buildWorkbook();
    // THE TENANT'S OWN NAME, not a hardcoded one. Every tenant's season
    // export downloaded as "Neville_2026_season_stats.xlsx" -- somebody
    // else's school, in a file a coach sends to local media.
    //
    // Non-alphanumerics are collapsed so a name like "St. Mary's" does
    // not produce a filename an operating system argues with.
    const ourLabel = (seasonAgg.ourBranding && seasonAgg.ourBranding.name)
      || (TEAMS && TEAMS.teamA && TEAMS.teamA.name) || 'season';
    const filename = String(ourLabel).replace(/[^A-Za-z0-9]+/g, '_')
      .replace(/^_|_$/g, '') + '_' + seasonYearLabel + '_season_stats.xlsx';
    XLSX.writeFile(wb, filename.replace(/[^a-z0-9._-]+/gi, '_'));
  });


  async function init(){
    const params = new URLSearchParams(window.location.search);
    const season = params.get('season');
    // BACK TO THE SEASON YOU CAME FROM. reports.html defaulted to the
    // CURRENT season however you got there, so reading three 2023 reports
    // meant picking 2023 three times. This page already knows which season
    // it is showing; it just never said so on the way out.
    if (season){
      const back = document.getElementById('backToReports');
      if (back) back.href = 'reports.html?season=' + encodeURIComponent(season);
    }
    if (!season){
      showView('errorView');
      document.getElementById('errorMsg').textContent = 'No season specified.';
      return;
    }
    seasonYearLabel = season;

      // EXACTLY ONE ROW, OR AN ERROR. `is_our_team` is true for every
      // tenant's team now, so the old query returned all of them and
      // took whichever came first. This report runs before any game is
      // loaded, so there is no game to ask -- and maybeSingle() is
      // correct for a tenant (009 scopes teams to one row) and fails
      // loudly for the platform, which is the right outcome for a page
      // that cannot tell whose season it is showing.
    const { data: teamRows } = await supabaseClient
      .from('teams').select('name, primary_color, secondary_color, logo_url').maybeSingle();
      seasonAgg.ourBranding = teamRows || {};

    const { data: gameRows, error: gameError } = await supabaseClient
      .from('games').select('*').eq('season_year', parseInt(season)).eq('status', 'final')
      // Preseason games are excluded from every season-wide total.
      // is_preseason is null on every game saved before this existed,
      // and NULL = false is itself NULL in SQL -- not true -- so
      // .eq('is_preseason', false) would have silently dropped every
      // one of those games from every season report the moment this
      // shipped. .or() with an explicit `is.null` clause is what
      // actually means "not marked preseason", covering null and
      // false alike; only a genuine true is excluded.
      .or('is_preseason.is.null,is_preseason.eq.false')
      .order('game_date', { ascending: true });
    if (gameError){
      showView('errorView');
      document.getElementById('errorMsg').textContent = gameError.message;
      return;
    }
    if (!gameRows || gameRows.length === 0){
      showView('errorView');
      document.getElementById('errorMsg').textContent = 'No finalized games found for this season.';
      return;
    }

    try {
      // TWO QUERIES FOR THE WHOLE SEASON, NOT TWO PER GAME.
      // This was a sequential loop: for each game, await the rosters, then
      // await the plays, then move on. Every round trip waited for the one
      // before it, so a 10-game season cost 20 trips end to end -- several
      // seconds of a page that looks frozen, and it got WORSE as the season
      // went on, which is exactly backwards.
      //
      // .in('game_id', ids) uses the same plays_game_idx and
      // game_rosters_game_idx that a single-game lookup does, so the
      // database does no more work; the saving is entirely in not paying
      // the latency twenty times. RLS is untouched -- the same policies
      // filter an IN exactly as they filter an equals.
      //
      // The two remaining queries run TOGETHER, so the whole load costs
      // about one round trip regardless of how many games the season has.
      const gameIds = gameRows.map(g => g.id);
      let allRosters, allPlays;
      try {
        [allRosters, allPlays] = await Promise.all([
          fetchAllByGame(supabaseClient, 'game_rosters', gameIds, null),
          fetchAllByGame(supabaseClient, 'plays', gameIds, 'sequence_number')
        ]);
      } catch (e) { throw new Error('Season data: ' + e.message); }

      // WHAT WAS ACTUALLY FETCHED, in the console.
      // I diagnosed this bug once from symptoms and got it wrong -- the row
      // cap I blamed cannot fire on a one-game season. This prints the real
      // numbers so the next question is answered with data rather than
      // another theory. Cheap, silent to the user, and worth keeping.
      console.log('[season report] games:', gameRows.length,
                  '| roster rows:', allRosters.length,
                  '| play rows:', allPlays.length);
      {
        const per = {};
        allPlays.forEach(r => { per[r.game_id] = (per[r.game_id] || 0) + 1; });
        gameRows.forEach(g => console.log('[season report]  ', (g.designator || g.id),
          '-> plays:', per[g.id] || 0,
          '| quarters seen:', [...new Set(allPlays.filter(r => r.game_id === g.id)
                                                  .map(r => r.quarter))].sort().join(',') || 'none'));
      }

      // Grouped in one pass. The order() is applied per QUERY rather than
      // per game, but sequence_number is only ever compared within a single
      // game, so appending in returned order preserves each game's ordering.
      const rostersByGame = new Map(), playsByGame = new Map();
      for (const r of (allRosters)){
        if (!rostersByGame.has(r.game_id)) rostersByGame.set(r.game_id, []);
        rostersByGame.get(r.game_id).push(r);
      }
      for (const p of (allPlays)){
        if (!playsByGame.has(p.game_id)) playsByGame.set(p.game_id, []);
        playsByGame.get(p.game_id).push(p);
      }

      for (const game of gameRows){
        const gamePlays = (playsByGame.get(game.id) || []).map(p => ({
          text: p.text, effect: p.effect || {}, team: p.team_side, quarter: p.quarter,
          roles: p.roles, unresolved: p.unresolved, isDivider: p.is_divider, isOverride: p.is_override
        }));
        processGame(game, rostersByGame.get(game.id) || [], gamePlays);
      }

      document.title = 'Season Report — ' + seasonYearLabel;
      document.getElementById('reportContent').innerHTML = renderSeasonReport();
      showView('mainView');
      initCharts();
    } catch (err) {
      showView('errorView');
      document.getElementById('errorMsg').textContent = 'This report could not be built: ' + err.message;
      console.error(err);
    }
  }

  const DOC_LABEL = 'Season Report';

  // SECTION HEADERS. Two levels, both built here so every section in this
  // document is headed the same way and a new one cannot drift.
  //
  //   sectionHead()  document sections -- eyebrow, title, optional subtitle
  //   teamBand()     anything belonging to a team -- coloured band
  //
  // The subtitle is optional and should carry a number the table itself
  // does not total, or nothing at all. An empty line is worse than none.
  function sectionHead(title, subtitle){
    return '<div class="sec-head">' +
      '<p class="sec-eyebrow">' + DOC_LABEL + '</p>' +
      '<h2 class="sec-title">' + title + '</h2>' +
      (subtitle ? '<p class="sec-sub">' + subtitle + '</p>' : '') +
    '</div>';
  }

  function teamBand(teamKey, label, subtitle){
    const t = TEAMS[teamKey] || {};
    const bg = t.bg || '#1a1a2e';
    // safeTextColor picks black or white by WCAG contrast, the same rule
    // the live view uses -- so a gold school gets dark text rather than
    // white on yellow.
    const fg = (typeof safeTextColor === 'function') ? safeTextColor(bg) : '#ffffff';
    const dot = fg === '#000000' ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.85)';
    return '<div class="team-band" style="background:' + bg + '; color:' + fg + ';">' +
      '<span class="tb-dot" style="background:' + dot + ';"></span>' + label +
      (subtitle ? '<span class="tb-sub">' + subtitle + '</span>' : '') +
    '</div>';
  }

  function renderSeasonReport(){
    const t = seasonAgg.totals, gamesPlayed = seasonAgg.perGame.length;
    const totalYds = t.rushYds + t.passYds, oppTotalYds = t.oppRushYds + t.oppPassYds;
    const per = (v) => gamesPlayed ? +(v/gamesPlayed).toFixed(1) : 0;
    const pct = (c,a) => a ? Math.round(100*c/a) : 0;

    let html = '<div class="report-header"><img class="statchat-logo" src="logo.png" alt="StatChat">' +
      '<h1>' + TEAMS.teamA.name + ' — ' + seasonYearLabel + ' season</h1>' +
      '<div class="record">' + seasonAgg.wins + '-' + seasonAgg.losses + (seasonAgg.ties ? '-' + seasonAgg.ties : '') +
      ' &middot; ' + gamesPlayed + ' games</div></div>';

    // Each metric group sits immediately above the chart it summarizes --
    // the standing convention (see PROJECT_NOTES, "Season report chart/
    // metric layout"). It used to be achieved by grid column position with
    // CSS `order` restoring it on narrow screens; now it is just the DOM
    // order, which is what the convention described in the first place.
    const tiles = (rows) => '<div class="chart-col-metrics">' + rows
      .map(([v,l]) => '<div class="metric-tile"><div class="metric-val">'+v+'</div><div class="metric-label">'+l+'</div></div>').join('') +
      '</div>';
    const unit = (metricRows, canvasId, boxClass) =>
      '<div class="chart-unit">' +
      (metricRows ? tiles(metricRows) : '') +
      (canvasId ? '<div class="chart-box' + (boxClass ? ' ' + boxClass : '') + '">' +
        '<canvas id="' + canvasId + '"></canvas></div>' : '') +
      '</div>';

    html += '<div class="section chart-section">' + sectionHead('Season totals') +
      unit([[t.pointsScored,'Points scored'],[per(t.pointsScored),'Scored/game'],
            [t.pointsAllowed,'Points allowed'],[per(t.pointsAllowed),'Allowed/game']],
           'chartPointsByQuarter', 'compact') +
      unit([[totalYds,'Total yards'],[per(totalYds),'Yards/game'],
            [oppTotalYds,'Yards allowed'],[per(oppTotalYds),'Allowed/game']],
           'chartHalfYards', 'compact') +
      '</div>';

    html += '<div class="section chart-section">' + sectionHead('Run / pass mix') +
      unit([[t.rushAtt,'Rush att'],[t.passAtt,'Pass att']],
           'chartRunPassAtt', 'compact') +
      unit([[t.rushYds,'Rush yds'],[t.rushAtt?+(t.rushYds/t.rushAtt).toFixed(1):0,'Yds/rush'],
            [t.passYds,'Pass yds'],[t.passAtt?+(t.passYds/t.passAtt).toFixed(1):0,'Yds/pass']],
           'chartRunPassYds', 'compact') +
      '</div>';

    // chartPassByHalf and chartRushByHalf are PER-GAME charts, not season
    // aggregates -- both plot G1..Gn with four series. TODO.md listed them
    // among the six "leave them alone" aggregates and suggested reclaiming
    // their full width; the 10-game PDF shows they are two of the densest
    // charts in the report. `tall` because four lines and their point
    // labels do not fit the standard height.
    html += '<div class="section chart-section page-break">' + sectionHead('Yards by game') +
      unit(null, 'chartYardsByGame') +
      unit(null, 'chartPassRushByGame') +
      unit(null, 'chartPassByHalf', 'tall') +
      unit(null, 'chartRushByHalf', 'tall') +
      '</div>';

    html += '<div class="section chart-section">' + sectionHead('Discipline') +
      unit([[t.turnovers,'Turnovers'],[per(t.turnovers),'Per game']],
           'chartTurnoversByGame') +
      unit([[t.sacked,'Sacks allowed'],[per(t.sacked),'Per game']],
           'chartSacksByGame') +
      unit([[t.penCount,'Penalties'],[per(t.penCount),'Pen/game'],
            [t.penYds,'Penalty yds'],[per(t.penYds),'Pen yds/game']],
           'chartPenaltiesByGame') +
      '</div>';

    // TIME OF POSSESSION SITS WITH EFFICIENCY, not with penalties.
    // Keeping the ball is a description of how a team controlled a game,
    // the same question third and fourth down conversion answers. It was
    // grouped with Penalties and Sacks allowed, which are mistakes -- and
    // holding the ball is not one.
    //
    // The per-game figure is over the games that actually recorded a
    // clock, and says how many. Em dash rather than 0:00 when none did:
    // zero would claim they never had the ball.
    // Time of possession has no chart of its own, so it leads the section
    // as a metric strip. In the grid it was the first cell of a FIVE-child
    // row, which is what pushed the 4th-down chart above its own heading.
    html += '<div class="section chart-section">' + sectionHead('Efficiency') +
      unit([[t.topGames ? formatDuration(t.topSec) : '—','Time of poss.'],
            [t.topGames ? formatDuration(t.topSec / t.topGames) : '—',
             t.topGames ? 'TOP/game (' + t.topGames + ' game' + (t.topGames === 1 ? '' : 's') + ')' : 'TOP/game']],
           null) +
      unit([[t.oppD3att?pct(t.oppD3conv,t.oppD3att)+'%':'—','3rd down %']],
           'chart3rdDownByGame') +
      unit([[t.oppD4att?pct(t.oppD4conv,t.oppD4att)+'%':'—','4th down %']],
           'chart4thDownByGame') +
      unit([[t.explosiveFor,'20yd+ plays'],[t.explosiveAgainst,'20yd+ allowed']],
           'chartExplosiveByGame') +
      unit([[t.possessions,'Possessions'],[per(t.possessions),'Poss/game'],
            [per(t.totalPlays),'Plays/game']],
           'chartPossPlaysByGame') +
      '</div>';

    const seasonStatTable = (bucketObj, headers, rowFn, totalFn, sortKey) => {
      const names = Object.keys(bucketObj);
      if (!names.length) return '<p class="no-stats">No stats recorded.</p>';
      // TEAM last -- a bookkeeping bucket, not a player. See recap.html.
      const sorted = names.slice().sort((a,b) =>
        (((a === 'TEAM' || a === 'Unknown') ? 1 : 0) - ((b === 'TEAM' || b === 'Unknown') ? 1 : 0)) ||
        ((bucketObj[b][sortKey]||0) - (bucketObj[a][sortKey]||0)));
      let h = '<table class="stat-table"><tr><th></th>' + headers.map(x=>'<th>'+x+'</th>').join('') + '</tr>';
      sorted.forEach(name => { h += '<tr><td>'+name+'</td>'+rowFn(bucketObj[name]).map(v=>'<td>'+v+'</td>').join('')+'</tr>'; });
      h += '<tr class="total-row"><td>Total</td>'+totalFn(bucketObj, sorted).map(v=>'<td>'+v+'</td>').join('')+'</tr>';
      return '<div class="table-scroll">' + h + '</table></div>';
    };

    html += '<div class="section">' + teamBand('teamA', TEAMS.teamA.name + ' \u2014 Passing') +
      seasonStatTable(seasonAgg.passing, ['Comp','Att','%','Yds','Y/C','Long','TD','Int','Sacked'],
        d => [d.comp||0, d.att||0, d.att?Math.round(100*(d.comp||0)/d.att):0, d.yds||0, d.comp?+(d.yds/d.comp).toFixed(1):0, d.long||0, d.td||0, d.intThrown||0, d.sacked||0],
        (obj, names) => { const att=names.reduce((t,n)=>t+(obj[n].att||0),0), comp=names.reduce((t,n)=>t+(obj[n].comp||0),0), yds=names.reduce((t,n)=>t+(obj[n].yds||0),0);
          return [comp, att, att?Math.round(100*comp/att):0, yds, comp?+(yds/comp).toFixed(1):0, Math.max(0,...names.map(n=>obj[n].long||0)), names.reduce((t,n)=>t+(obj[n].td||0),0), names.reduce((t,n)=>t+(obj[n].intThrown||0),0), names.reduce((t,n)=>t+(obj[n].sacked||0),0)]; },
        'yds') + '</div>';

    html += '<div class="section">' + teamBand('teamA', TEAMS.teamA.name + ' \u2014 Receiving') +
      seasonStatTable(seasonAgg.receiving, ['Rec','Tgt','Catch %','Yds','Y/C','Long','TD','Fum'],
        d => [d.rec||0, d.tgt||0, d.tgt?Math.round(100*(d.rec||0)/d.tgt)+'%':'—', d.yds||0, d.rec?+(d.yds/d.rec).toFixed(1):0, d.long||0, d.td||0, d.fum||0],
        (obj, names) => { const rec=names.reduce((t,n)=>t+(obj[n].rec||0),0), yds=names.reduce((t,n)=>t+(obj[n].yds||0),0), tgt=names.reduce((t,n)=>t+(obj[n].tgt||0),0);
          return [rec, tgt, tgt?Math.round(100*rec/tgt)+'%':'—', yds, rec?+(yds/rec).toFixed(1):0, Math.max(0,...names.map(n=>obj[n].long||0)), names.reduce((t,n)=>t+(obj[n].td||0),0), names.reduce((t,n)=>t+(obj[n].fum||0),0)]; },
        'yds') + '</div>';

    html += '<div class="section">' + teamBand('teamA', TEAMS.teamA.name + ' \u2014 Rushing') +
      seasonStatTable(seasonAgg.rushing, ['Att','Yds','Y/C','Long','TD','Fum'],
        d => [d.att||0, d.yds||0, d.att?+(d.yds/d.att).toFixed(1):0, d.long||0, d.td||0, d.fum||0],
        (obj, names) => { const att=names.reduce((t,n)=>t+(obj[n].att||0),0), yds=names.reduce((t,n)=>t+(obj[n].yds||0),0);
          return [att, yds, att?+(yds/att).toFixed(1):0, Math.max(0,...names.map(n=>obj[n].long||0)), names.reduce((t,n)=>t+(obj[n].td||0),0), names.reduce((t,n)=>t+(obj[n].fum||0),0)]; },
        'yds') + '</div>';

    html += '<div class="section">' + teamBand('teamA', TEAMS.teamA.name + ' \u2014 Defense') +
      (seasonAgg.defense.int || seasonAgg.defense.fumRec || seasonAgg.defense.sacks || seasonAgg.defense.tfl
        ? '<table class="stat-table"><tr><th></th><th>Int</th><th>Fum Rec</th><th>Sacks</th><th>TFL</th></tr><tr><td>Defense</td><td>'+seasonAgg.defense.int+'</td><td>'+seasonAgg.defense.fumRec+'</td><td>'+seasonAgg.defense.sacks+'</td><td>'+seasonAgg.defense.tfl+'</td></tr></table>'
        : '<p class="no-stats">No defensive stats recorded.</p>') + '</div>';

    // Per-player tackles across the season, in their own section. The
    // team TFL above counts every play for a loss with no tackler needed
    // (a ceiling); these need a name and naming is optional (a floor).
    // Separate tables, because one number cannot be both.
    const seasonTacklers = Object.keys(seasonAgg.tacklers || {})
      .filter(n => (seasonAgg.tacklers[n].tackles || 0) > 0)
      .sort((a, b) => (seasonAgg.tacklers[b].tackles || 0) -
                      (seasonAgg.tacklers[a].tackles || 0));
    if (seasonTacklers.length){
      html += '<div class="section">' + teamBand('teamA', TEAMS.teamA.name + ' \u2014 Tackles') +
        '<table class="stat-table"><tr><th></th><th>Tackles</th><th>TFL</th>' +
        '<th>Sacks</th><th>Int</th><th>Fum Rec</th></tr>' +
        seasonTacklers.map(n => {
          const d = seasonAgg.tacklers[n];
          return '<tr><td>' + n + '</td><td>' + (d.tackles || 0) + '</td><td>' +
                 (d.tfl || 0) + '</td><td>' + (d.sacks || 0) + '</td><td>' +
                 (d.int || 0) + '</td><td>' + (d.fumRec || 0) + '</td></tr>';
        }).join('') +
        '</table><p class="no-stats" style="margin-top:4px; font-size:11px;">' +
        'Counts only plays where a tackler was named, so these are a minimum. ' +
        'The team TFL above counts every play for a loss and may be higher.</p>' +
        '</div>';
    }

    const koNames = Object.keys(seasonAgg.specialTeams).filter(n => seasonAgg.specialTeams[n].kickoffs);
    const puntNames = Object.keys(seasonAgg.specialTeams).filter(n => seasonAgg.specialTeams[n].punts);
    // Returns, kickoff and punt kept SEPARATE. Filtered on the count
    // rather than yardage: a return for a loss still happened.
    const kRetNames = Object.keys(seasonAgg.specialTeams).filter(n => seasonAgg.specialTeams[n].kickRet);
    const pRetNames = Object.keys(seasonAgg.specialTeams).filter(n => seasonAgg.specialTeams[n].puntRet);
    const kickNames = Object.keys(seasonAgg.specialTeams).filter(n => seasonAgg.specialTeams[n].fgAtt || seasonAgg.specialTeams[n].patAtt);
    let stHtml = '';
    const stSub = (label, tableHtml) => tableHtml ? '<div class="st-subsection"><div class="st-subsection-label">'+label+'</div>'+tableHtml+'</div>' : '';
    if (koNames.length){
      const bucket = Object.fromEntries(koNames.map(n=>[n,seasonAgg.specialTeams[n]]));
      stHtml += stSub('Kickoffs', seasonStatTable(bucket, ['Kickoffs','Touchbacks','TB %'],
        d => [d.kickoffs||0, d.touchbacks||0, d.kickoffs?Math.round(100*(d.touchbacks||0)/d.kickoffs)+'%':'—'],
        (obj,names) => { const k=names.reduce((t,n)=>t+(obj[n].kickoffs||0),0), tb=names.reduce((t,n)=>t+(obj[n].touchbacks||0),0); return [k, tb, k?Math.round(100*tb/k)+'%':'—']; },
        'kickoffs'));
    }
    if (puntNames.length){
      const bucket = Object.fromEntries(puntNames.map(n=>[n,seasonAgg.specialTeams[n]]));
      stHtml += stSub('Punting', seasonStatTable(bucket, ['Punts','Yds Per Punt','Long','Blocked'],
        d => [d.punts||0, d.puntsWithYards?+(d.puntYds/d.puntsWithYards).toFixed(1):0, d.puntLong||0, d.blocked||0],
        (obj,names) => { const p=names.reduce((t,n)=>t+(obj[n].punts||0),0), yds=names.reduce((t,n)=>t+(obj[n].puntYds||0),0), wy=names.reduce((t,n)=>t+(obj[n].puntsWithYards||0),0);
          return [p, wy?+(yds/wy).toFixed(1):0, Math.max(0,...names.map(n=>obj[n].puntLong||0)), names.reduce((t,n)=>t+(obj[n].blocked||0),0)]; },
        'puntYds'));
    }
    const retSub = (label, nameList, pre) => {
      if (!nameList.length) return '';
      const bucket = Object.fromEntries(nameList.map(n=>[n,seasonAgg.specialTeams[n]]));
      return stSub(label, seasonStatTable(bucket, ['Ret','Yds','Avg','Long','TD'],
        d => [d[pre]||0, d[pre+'Yds']||0, d[pre]?+(d[pre+'Yds']/d[pre]).toFixed(1):0, d[pre+'Long']||0, d[pre+'Td']||0],
        (obj,names) => { const r=names.reduce((t,n)=>t+(obj[n][pre]||0),0), yds=names.reduce((t,n)=>t+(obj[n][pre+'Yds']||0),0);
          // Long is a MAX across the season, not a sum.
          return [r, yds, r?+(yds/r).toFixed(1):0, Math.max(0,...names.map(n=>obj[n][pre+'Long']||0)), names.reduce((t,n)=>t+(obj[n][pre+'Td']||0),0)]; },
        pre+'Yds'));
    };
    if (kickNames.length){
      const bucket = Object.fromEntries(kickNames.map(n=>[n,seasonAgg.specialTeams[n]]));
      stHtml += stSub('Kicking', seasonStatTable(bucket, ['FG Att','FG Made','Long FG','FG %','FG Blk','XP Att','XP Made','XP %','XP Blk'],
        d => [d.fgAtt||0, d.fgMade||0, d.fgLong||0, d.fgAtt?Math.round(100*(d.fgMade||0)/d.fgAtt)+'%':'—', d.fgBlocked||0, d.patAtt||0, d.patMade||0, d.patAtt?Math.round(100*(d.patMade||0)/d.patAtt)+'%':'—', d.patBlocked||0],
        (obj,names) => { const fa=names.reduce((t,n)=>t+(obj[n].fgAtt||0),0), fm=names.reduce((t,n)=>t+(obj[n].fgMade||0),0), pa=names.reduce((t,n)=>t+(obj[n].patAtt||0),0), pm=names.reduce((t,n)=>t+(obj[n].patMade||0),0);
          return [fa, fm, Math.max(0,...names.map(n=>obj[n].fgLong||0)), fa?Math.round(100*fm/fa)+'%':'—', names.reduce((t,n)=>t+(obj[n].fgBlocked||0),0), pa, pm, pa?Math.round(100*pm/pa)+'%':'—', names.reduce((t,n)=>t+(obj[n].patBlocked||0),0)]; },
        'fgAtt'));
    }
    stHtml += retSub('Kick returns', kRetNames, 'kickRet');
    stHtml += retSub('Punt returns', pRetNames, 'puntRet');
    html += '<div class="section">' + teamBand('teamA', TEAMS.teamA.name + ' \u2014 Special Teams') + (stHtml || '<p class="no-stats">No special teams stats recorded.</p>') + '</div>';

    // THE END MARK IS THE LOGO ONLY.
    // ------------------------------------------------------------------
    // It used to repeat "Generated with StatChat / www.statchat.co", which
    // the running footer already prints on every sheet -- so the last page
    // carried the same words twice, once here and once six lines below.
    //
    // The running footer cannot be suppressed on the final page (CSS has
    // no "last sheet" selector), so the duplicate had to go from the half
    // that CAN be changed. The logo sits above the footer line and the
    // two read as one mark.
    html += '<div class="print-endmark"><img src="logo.png" alt="StatChat"></div>';
    return html;
  }

  function chartOpts(extra){
    return Object.assign({ responsive:true, maintainAspectRatio:false,
      // A CAP, NOT A WIDTH. Per-game charts are full width so that fifteen
      // games fit; at one game the same chart would otherwise draw a single
      // bar a third of a page wide. Capping the bar leaves the axis full
      // width and the bar a normal size, so game 1 and game 15 are the same
      // chart with more or fewer bars. Applied to every bar chart: the
      // fixed-bar-count ones are capped at 430px and four fat bars there
      // looked no better.
      datasets:{ bar:{ maxBarThickness:46 } },
      plugins:{ legend:{ labels:{ font:{ size:11 } } } } }, extra || {});
  }

  // PER-GAME X AXIS. Chart.js drops tick labels it cannot fit, silently:
  // in the 10-game PDF "Sacks allowed by game" printed G1 G3 G5 G7 G9 and
  // gave no sign the even games were still plotted. A reader counting bars
  // against labels would misread every one of them. autoSkip:false makes a
  // cramped axis LOOK cramped instead of looking wrong, which at full width
  // it should no longer be -- fifteen "G15" labels need about 450px and
  // have 732. maxRotation:0 for the same reason: rotated labels were the
  // reported wrapping, and horizontal ones now fit.
  function gameAxis(scales){
    const s = Object.assign({}, scales || {});
    s.x = Object.assign({ ticks:{ autoSkip:false, maxRotation:0, minRotation:0, font:{ size:10 } } }, s.x || {});
    return s;
  }

  function lighten(hex, amt){
    const c = hex.replace('#','');
    const r = parseInt(c.slice(0,2),16), g = parseInt(c.slice(2,4),16), b = parseInt(c.slice(4,6),16);
    const mix = (v) => Math.round(v + (255-v)*amt);
    return '#' + [mix(r),mix(g),mix(b)].map(v => v.toString(16).padStart(2,'0')).join('');
  }
  function readableOn(hex){
    const c = hex.replace('#','');
    const r = parseInt(c.slice(0,2),16), g = parseInt(c.slice(2,4),16), b = parseInt(c.slice(4,6),16);
    const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
    return luminance > 0.55 ? '#000' : '#fff';
  }

  function initCharts(){
    const t = seasonAgg.totals;
    const games = seasonAgg.perGame;
    const labels = games.map((g,i) => g.label || ('G' + (i+1)));
    const headroom = (...dataArrays) => {
      const max = Math.max(0, ...dataArrays.flat().filter(v => typeof v === 'number'));
      return max === 0 ? undefined : Math.ceil(max * 1.2);
    };

    // Chart colors are derived from the team's own branded primary/
    // secondary colors (set in account settings), not a fixed
    // categorical palette, so the report visually matches the team.
    const primary = seasonAgg.ourBranding.primary_color || '#2b3440';
    const secondary = seasonAgg.ourBranding.secondary_color || '#6e7885';
    const primaryLight = lighten(primary, 0.45);
    const secondaryLight = lighten(secondary, 0.45);

    const showVal = { color:'#000', anchor:'end', align:'top', formatter:(v) => v ? v : '' };
    const pctOfTotal = { color:(ctx) => readableOn(ctx.dataset.backgroundColor[ctx.dataIndex]), font:{ size:12, weight:'bold' },
      formatter:(v, ctx) => { const total = ctx.chart.data.datasets[0].data.reduce((a,b)=>a+b,0); return total ? Math.round(100*v/total)+'%' : ''; } };

    new Chart(document.getElementById('chartPointsByQuarter'), { type:'bar', data:{ labels:['Q1','Q2','Q3','Q4'],
      datasets:[{ label:'Scored', data:seasonAgg.quarterScored, backgroundColor:primary },
        { label:'Allowed', data:seasonAgg.quarterAllowed, backgroundColor:secondary }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'Points by quarter', font:{size:12} }, legend:{ position:'bottom' }, datalabels:showVal },
        scales:{ y:{ suggestedMax: headroom(seasonAgg.quarterScored, seasonAgg.quarterAllowed) } } }) });

    new Chart(document.getElementById('chartHalfYards'), { type:'bar', data:{ labels:['1st half','2nd half'],
      datasets:[
        { label:TEAMS.teamA.name, data:[games.reduce((s,g)=>s+g.h1Yds,0), games.reduce((s,g)=>s+g.h2Yds,0)], backgroundColor:primary },
        { label:'Opponent', data:[games.reduce((s,g)=>s+g.oppH1Yds,0), games.reduce((s,g)=>s+g.oppH2Yds,0)], backgroundColor:secondary }
      ] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'Total yardage by half', font:{size:12} }, legend:{ position:'bottom' }, datalabels:showVal },
        scales:{ y:{ suggestedMax: headroom(
          [games.reduce((s,g)=>s+g.h1Yds,0), games.reduce((s,g)=>s+g.h2Yds,0)],
          [games.reduce((s,g)=>s+g.oppH1Yds,0), games.reduce((s,g)=>s+g.oppH2Yds,0)]) } } }) });

    new Chart(document.getElementById('chartRunPassAtt'), { type:'doughnut', data:{ labels:['Rush att','Pass att'],
      datasets:[{ data:[t.rushAtt, t.passAtt], backgroundColor:[primary, secondary] }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'Run / pass mix', font:{size:12} }, legend:{ position:'bottom' }, datalabels:pctOfTotal } }) });

    new Chart(document.getElementById('chartRunPassYds'), { type:'doughnut', data:{ labels:['Rush yds','Pass yds'],
      datasets:[{ data:[t.rushYds, t.passYds], backgroundColor:[primary, secondary] }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'Run / pass yardage %', font:{size:12} }, legend:{ position:'bottom' }, datalabels:pctOfTotal } }) });

    new Chart(document.getElementById('chartTurnoversByGame'), { type:'bar', data:{ labels,
      datasets:[{ label:'Turnovers', data:games.map(g=>g.turnovers), backgroundColor:primary }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'Turnovers by game', font:{size:12} }, legend:{ display:false }, datalabels:showVal },
        scales: gameAxis({ y:{ suggestedMax: headroom(games.map(g=>g.turnovers)) } }) }) });

    new Chart(document.getElementById('chartSacksByGame'), { type:'bar', data:{ labels,
      datasets:[{ label:'Sacks allowed', data:games.map(g=>g.sacked), backgroundColor:secondary }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'Sacks allowed by game', font:{size:12} }, legend:{ display:false }, datalabels:showVal },
        scales: gameAxis({ y:{ suggestedMax: headroom(games.map(g=>g.sacked)) } }) }) });

    new Chart(document.getElementById('chartPenaltiesByGame'), { type:'bar', data:{ labels,
      datasets:[{ label:'Penalties', data:games.map(g=>g.penCount), backgroundColor:primary, yAxisID:'y' },
        { label:'Yards', data:games.map(g=>g.penYds), backgroundColor:secondary, yAxisID:'y1' }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'Penalties by game', font:{size:12} }, legend:{ position:'bottom' }, datalabels:showVal },
        scales: gameAxis({ y:{ position:'left', suggestedMax: headroom(games.map(g=>g.penCount)) },
          y1:{ position:'right', grid:{ drawOnChartArea:false }, suggestedMax: headroom(games.map(g=>g.penYds)) } }) }) });

    new Chart(document.getElementById('chart3rdDownByGame'), { type:'line', data:{ labels,
      datasets:[{ label:'Offense 3rd down %', data:games.map(g=>g.d3Pct), borderColor:primary, backgroundColor:primary, tension:0.2 },
        { label:'Opponent 3rd down %', data:games.map(g=>g.oppD3Pct), borderColor:secondary, backgroundColor:secondary, tension:0.2 }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'3rd down % by game', font:{size:12} }, legend:{ position:'bottom' },
        datalabels:{ color:'#000', align:'top', font:{size:9}, formatter:(v) => (v===null||v===undefined) ? '' : v+'%' } },
        scales: gameAxis({ y:{ suggestedMax: Math.min(100, headroom(games.map(g=>g.d3Pct), games.map(g=>g.oppD3Pct)) || 20) } }) }) });

    new Chart(document.getElementById('chart4thDownByGame'), { type:'line', data:{ labels,
      datasets:[{ label:'Offense 4th down %', data:games.map(g=>g.d4Pct), borderColor:primary, backgroundColor:primary, tension:0.2 },
        { label:'Opponent 4th down %', data:games.map(g=>g.oppD4Pct), borderColor:secondary, backgroundColor:secondary, tension:0.2 }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'4th down % by game', font:{size:12} }, legend:{ position:'bottom' },
        datalabels:{ color:'#000', align:'top', font:{size:9}, formatter:(v) => (v===null||v===undefined) ? '' : v+'%' } },
        scales: gameAxis({ y:{ suggestedMax: Math.min(100, headroom(games.map(g=>g.d4Pct), games.map(g=>g.oppD4Pct)) || 20) } }) }) });

    new Chart(document.getElementById('chartExplosiveByGame'), { type:'bar', data:{ labels,
      datasets:[{ label:'20yd+ plays', data:games.map(g=>g.explosiveFor), backgroundColor:primary },
        { label:'20yd+ allowed', data:games.map(g=>g.explosiveAgainst), backgroundColor:secondary }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'20yd+ plays by game', font:{size:12} }, legend:{ position:'bottom' }, datalabels:showVal },
        scales: gameAxis({ y:{ suggestedMax: headroom(games.map(g=>g.explosiveFor), games.map(g=>g.explosiveAgainst)) } }) }) });

    new Chart(document.getElementById('chartPossPlaysByGame'), { type:'line', data:{ labels,
      datasets:[{ label:'Possessions', data:games.map(g=>g.possessions), borderColor:primary, backgroundColor:primary, tension:0.2 },
        { label:'Plays', data:games.map(g=>g.totalPlays), borderColor:secondary, backgroundColor:secondary, tension:0.2 }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'Possessions & plays by game', font:{size:12} }, legend:{ position:'bottom' },
        datalabels:{ color:'#000', align:'top', font:{size:9}, formatter:(v) => v ? v : '' } },
        scales: gameAxis({ y:{ suggestedMax: headroom(games.map(g=>g.possessions), games.map(g=>g.totalPlays)) } }) }) });

    new Chart(document.getElementById('chartYardsByGame'), { type:'bar', data:{ labels,
      datasets:[{ label:'1st half', data:games.map(g=>g.h1Yds), backgroundColor:primaryLight, stack:'a' },
        { label:'2nd half', data:games.map(g=>g.h2Yds), backgroundColor:primary, stack:'a' }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'Total yards by game', font:{size:12} }, legend:{ position:'bottom' },
        datalabels:{ color:(ctx) => readableOn(ctx.dataset.backgroundColor), anchor:'center', align:'center', font:{size:9,weight:'bold'}, formatter:(v) => v ? v : '' } },
        scales: gameAxis({ x:{ stacked:true }, y:{ stacked:true } }) }) });

    new Chart(document.getElementById('chartPassByHalf'), { type:'line', data:{ labels,
      datasets:[{ label:'1st half', data:games.map(g=>g.h1Pass), borderColor:primary, backgroundColor:primary, tension:0.2 },
        { label:'2nd half', data:games.map(g=>g.h2Pass), borderColor:primary, backgroundColor:primary, borderDash:[5,3], tension:0.2 },
        { label:'1st half allowed', data:games.map(g=>g.oppH1Pass), borderColor:secondary, backgroundColor:secondary, tension:0.2 },
        { label:'2nd half allowed', data:games.map(g=>g.oppH2Pass), borderColor:secondary, backgroundColor:secondary, borderDash:[5,3], tension:0.2 }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'Passing yards by half', font:{size:12} }, legend:{ position:'bottom' },
        datalabels:{ color:'#000', align:'top', font:{size:8}, formatter:(v) => v ? v : '' } },
        scales: gameAxis({ y:{ suggestedMax: headroom(games.map(g=>g.h1Pass), games.map(g=>g.h2Pass), games.map(g=>g.oppH1Pass), games.map(g=>g.oppH2Pass)) } }) }) });

    new Chart(document.getElementById('chartRushByHalf'), { type:'line', data:{ labels,
      datasets:[{ label:'1st half', data:games.map(g=>g.h1Rush), borderColor:primary, backgroundColor:primary, tension:0.2 },
        { label:'2nd half', data:games.map(g=>g.h2Rush), borderColor:primary, backgroundColor:primary, borderDash:[5,3], tension:0.2 },
        { label:'1st half allowed', data:games.map(g=>g.oppH1Rush), borderColor:secondary, backgroundColor:secondary, tension:0.2 },
        { label:'2nd half allowed', data:games.map(g=>g.oppH2Rush), borderColor:secondary, backgroundColor:secondary, borderDash:[5,3], tension:0.2 }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'Rushing yards by half', font:{size:12} }, legend:{ position:'bottom' },
        datalabels:{ color:'#000', align:'top', font:{size:8}, formatter:(v) => v ? v : '' } },
        scales: gameAxis({ y:{ suggestedMax: headroom(games.map(g=>g.h1Rush), games.map(g=>g.h2Rush), games.map(g=>g.oppH1Rush), games.map(g=>g.oppH2Rush)) } }) }) });

    new Chart(document.getElementById('chartPassRushByGame'), { type:'bar', data:{ labels,
      datasets:[{ label:'Pass yds', data:games.map(g=>g.passYds), backgroundColor:secondary },
        { label:'Rush yds', data:games.map(g=>g.rushYds), backgroundColor:primary }] },
      options: chartOpts({ plugins:{ title:{ display:true, text:'Pass / rush yards by game', font:{size:12} }, legend:{ position:'bottom' }, datalabels:showVal },
        scales: gameAxis({ y:{ suggestedMax: headroom(games.map(g=>g.passYds), games.map(g=>g.rushYds)) } }) }) });
  }

  if (window.Chart && window.ChartDataLabels) Chart.register(ChartDataLabels);
  // A SAFETY NET, not the mechanism. Screen and printable widths are now
  // made equal (see the .wrap comment), so on Letter or A4 there is nothing
  // to re-measure and this is a no-op. It exists for the paper sizes and
  // margin settings nobody predicted: a canvas built too wide for the sheet
  // would otherwise run off the right edge, and Chart.js re-measures only on
  // a resize event, which a print pass does not fire.
  // Browsers differ on whether print styles are applied before beforeprint,
  // so this cannot be relied on to produce the right width -- only to stop a
  // badly wrong one. The width matching is what does the real work.
  window.addEventListener('beforeprint', () => {
    document.querySelectorAll('.chart-box canvas').forEach((cv) => {
      const c = window.Chart && Chart.getChart ? Chart.getChart(cv) : null;
      if (c) { try { c.resize(); } catch (e) {} }
    });
  });

  // Shared shape with recap.html: window.print() is a silent no-op in
  // some mobile contexts (iOS in-app browsers, installed web apps), so
  // the click watches for the browser telling us a dialog opened and
  // explains what to do by hand if none did.
  document.getElementById('downloadPdfBtn').addEventListener('click', () => {
    const note = document.getElementById('printFallback');
    if (note) note.classList.add('hidden');
    let started = false;
    const mark = () => { started = true; };
    window.addEventListener('beforeprint', mark, { once: true });
    let mq = null;
    if (window.matchMedia){
      mq = window.matchMedia('print');
      if (mq.addListener) mq.addListener(mark);
    }
    try { window.print(); } catch (e) { started = false; }
    setTimeout(() => {
      window.removeEventListener('beforeprint', mark);
      if (mq && mq.removeListener) mq.removeListener(mark);
      if (started || !note) return;
      note.textContent = 'Your browser did not open a print dialog. ' +
        'On iPhone or iPad use the Share button, then Print, then pinch out on the ' +
        'preview to save it as a PDF. On Android open the browser menu, then Print. ' +
        'If you are inside another app — a message or an email — open this page in ' +
        'Safari or Chrome first.';
      note.classList.remove('hidden');
    }, 1500);
  });


  /* ===== ROTATE PROMPT ================================================
     Shown once per visit, on a PHONE in PORTRAIT only.

     Detected by viewport width AND a coarse pointer, never by user-agent:
     UA sniffing is wrong on every device released after it was written. An
     iPad in portrait is 768px+ and reads fine, so tablets never see this.

     sessionStorage, not localStorage: opening a recap and then a stat
     package should not prompt twice, but a genuinely new visit should be
     told again. Wrapped in try/catch because storage throws outright in
     private mode on some browsers, and a prompt is not worth a broken page.

     It removes itself if the phone is turned while it is open -- telling
     someone already in landscape to rotate reads as a bug -- and before
     printing, so it is never captured in the PDF. */
  (function(){
    /* SHOWN EVERY TIME THE PAGE IS OPENED IN PORTRAIT.
       ------------------------------------------------------------------
       This used to remember a dismissal in sessionStorage under a key
       SHARED BY ALL FOUR report pages. Wrong in principle and broken in
       practice.

       Wrong in principle: the prompt is not an announcement, it is a
       RESPONSE TO A CONDITION -- this screen is too narrow for these
       tables. That is still true of the next report you open, so
       suppressing it leaves you looking at columns running off the edge
       with nothing saying why.

       Broken in practice: one tap of "View anyway", ever, silenced all four
       pages for the life of the browser tab, and a mobile tab left open
       keeps sessionStorage for weeks. An earlier build did show this on
       stat_package.html; a single dismissal then would explain never seeing
       it since.

       Dismissal now lasts for THIS PAGE VIEW only -- a plain variable, no
       storage at all. Tap "View anyway" and it stays gone while you read;
       open another report or reload and it is back, because the condition
       is back.

       PHONES ONLY, by viewport and pointer, never user-agent. An iPad in
       portrait is 744px or wider and renders these tables readably, so
       tablets stay excluded -- Andy's call, 25 August 2026. */
    var dismissedThisView = false;
    var host = document.getElementById('reportContent');
    if (!host) return;

    function isPhonePortrait(){
      var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      var narrow = Math.min(window.innerWidth, window.innerHeight) <= 500;
      var portrait = window.innerHeight >= window.innerWidth;
      return coarse && narrow && portrait;
    }

    var gate = document.createElement('div');
    gate.className = 'rotateGate';
    gate.setAttribute('role', 'dialog');
    gate.setAttribute('aria-modal', 'false');
    gate.setAttribute('aria-label', 'Rotate your phone for a better view');
    gate.innerHTML =
      '<div class="rotateBox">' +
        '<span class="glyph" aria-hidden="true">&#128260;</span>' +
        '<h4>Turn your phone sideways</h4>' +
        '<p>These reports are built for a wide screen. In portrait the stat tables ' +
        'run off the edge.</p>' +
        '<button type="button" class="rotateDismiss">View anyway</button>' +
        '<small>Download PDF and XLS work either way.</small>' +
      '</div>';

    function hide(){ gate.classList.remove('show'); }
    function maybeShow(){
      if (dismissedThisView || !isPhonePortrait()) { hide(); return; }
      if (host.offsetHeight === 0) return;
      if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
      if (!gate.parentNode) host.appendChild(gate);
      gate.classList.add('show');
    }

    gate.addEventListener('click', function(e){
      if (e.target.classList.contains('rotateDismiss')) { dismissedThisView = true; hide(); }
    });

    /* SYMMETRIC. The old handler only ever called hide(), so a report opened
       in landscape and then turned to portrait never showed the prompt --
       the one orientation change most likely to need it. orientationchange
       as well as resize, on a short delay: iOS Safari fires it more
       reliably, and the new dimensions are not readable until the frame
       after. */
    window.addEventListener('resize', maybeShow);
    window.addEventListener('orientationchange', function(){ setTimeout(maybeShow, 120); });
    window.addEventListener('beforeprint', hide);

    /* WAIT FOR THE HOST TO HAVE A HEIGHT, do not guess at a delay. The
       overlay is absolute inset:0 inside the report container, which sits in
       a wrapper hidden until the data loads. Appended while the host is
       zero-height it renders as nothing -- which is what happened before:
       the prompt appeared on stat_package.html, the fastest of the four, and
       on none of the others. */
    function showWhenReady(){
      if (dismissedThisView || !isPhonePortrait()) return false;
      if (host.offsetHeight > 0) { maybeShow(); return true; }
      return false;
    }

    /* NO DEADLINE ON THE WAIT. This used to disconnect the observer after
       15 seconds -- a guess at how long a FETCH takes, which is the wrong
       unit for the player report.

       There the host stays empty until somebody CHOOSES a player from the
       picker. That wait is human-paced: land, read the list, decide. Longer
       than 15 seconds is ordinary, and after that the observer was gone, so
       filling the host fired nothing. The prompt worked if you picked
       quickly and appeared broken otherwise, which is why it read as never
       working at all.

       The observer now lives until it has something to show, then
       disconnects. One ResizeObserver on one element costs nothing to keep,
       and "wait until the content exists" is the actual condition -- a timer
       was only ever standing in for it. */
    if (typeof ResizeObserver === 'function') {
      var ro = new ResizeObserver(function(){
        if (showWhenReady()) ro.disconnect();
      });
      ro.observe(host);
    } else {
      // The fallback still ends, because an interval that never stops is a
      // real cost -- but four minutes covers a human reading a picker.
      var tries = 0;
      var poll = setInterval(function(){
        if (showWhenReady() || ++tries > 960) clearInterval(poll);
      }, 250);
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', showWhenReady);
    } else { showWhenReady(); }
  })();
