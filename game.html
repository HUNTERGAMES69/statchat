<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StatChat">
<title>StatChat — Game Entry</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background:#f4f3ef; margin:0; padding:14px; padding-top:calc(14px + env(safe-area-inset-top)); }
  .wrap { max-width:760px; margin:0 auto; }
  .card { background:#fff; border-radius:12px; padding:18px; margin-bottom:16px; box-shadow:0 2px 12px rgba(0,0,0,0.08); }
  h1 { font-size:20px; margin:0; }
  h2 { font-size:16px; margin:0 0 10px; color:#444; }
  p.sub { color:#888; margin:0 0 14px; font-size:13px; }
  label { display:block; font-size:13px; margin-bottom:4px; color:#555; }
  input:not([type=checkbox]):not([type=radio]), select { padding:8px; border:1px solid #ddd; border-radius:6px; font-size:14px; box-sizing:border-box; width:100%; }
  input[type=checkbox], input[type=radio] { width:auto; margin-right:6px; vertical-align:middle; }
  button { padding:8px 12px; border-radius:6px; border:none; background:#1a1a2e; color:#fff; font-size:13px; font-weight:600; cursor:pointer; }
  button.primary { background:#1a7a4c; }
  button.secondary { background:#fff; color:#444; border:1px solid #ccc; }
  button.danger { background:#fff; color:#a32d2d; border:1px solid #a32d2d; }
  button:disabled { opacity:0.5; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .hidden { display:none; }
  .msg { font-size:14px; padding:10px; border-radius:6px; margin-bottom:14px; }
  .msg.error { background:#fdecea; color:#a32d2d; }
  .msg.success { background:#e8f5e9; color:#1a7a4c; }
  .banner { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; border-radius:10px; padding:12px 16px; margin-bottom:6px; transition:background 0.2s; position:sticky; top:8px; z-index:50; box-shadow:0 2px 8px rgba(0,0,0,0.15); }
  .banner .score { font-size:20px; font-weight:700; }
  .banner .downdist { font-size:15px; font-weight:500; }
  .hint { font-size:12px; color:#888; margin:6px 0; }
  .floating-actions { position:fixed; bottom:16px; right:16px; z-index:90; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  .floating-actions button { box-shadow:0 2px 8px rgba(0,0,0,0.2); }
  #playPanel, #utilPanel { background:#f7f6f2; border-radius:8px; padding:12px 14px; margin-top:10px; scroll-margin-top:70px; }
  #confirmCard { background:#f7f6f2; border-radius:8px; padding:12px 14px; margin-top:8px; }
  .logline { font-size:14px; padding:6px 0; border-bottom:1px solid #f2f2f2; }
  .badge { font-size:10px; padding:2px 6px; border-radius:8px; margin-left:6px; font-weight:600; }
  .badge.unresolved { background:#fff3cd; color:#7a6a2a; }
  .conflict-block { background:#fff3cd; border-radius:8px; padding:10px; margin-top:8px; }
  @media (min-width: 640px) {
    body { padding:24px; padding-top:calc(24px + env(safe-area-inset-top)); }
    .card { padding:24px; }
    button { padding:9px 16px; font-size:14px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="loading" class="card"><div style="display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:14px;"><img src="logo.png" alt="StatChat" style="width:48px; height:auto; border-radius:8px;"><img id="splashTeamIcon" style="display:none; width:48px; height:48px; border-radius:8px; object-fit:cover;"></div><h1>Loading…</h1></div>

  <div id="errorView" class="hidden card">
    <h1>Couldn't open this game</h1>
    <p class="sub" id="errorMsg"></p>
    <a href="dashboard.html" style="text-decoration:none; padding:9px 16px; border-radius:6px; background:#1a1a2e; color:#fff; font-weight:600;">← Dashboard</a>
  </div>

  <div id="mainView" class="hidden">
    <div class="banner" id="banner">
      <img id="bannerLogoA" style="display:none; height:28px; width:28px; object-fit:contain; border-radius:4px;">
      <span class="score" id="scoreText"></span>
      <img id="bannerLogoB" style="display:none; height:28px; width:28px; object-fit:contain; border-radius:4px;">
      <span class="downdist" id="downText"></span>
      <span class="downdist" id="quarterText"></span>
    </div>
    <div class="hint" id="topText" style="text-align:right;"></div>

    <div id="clockPromptCard" style="display:none; background:#fff3cd; border-radius:8px; padding:12px 14px; margin-bottom:10px;">
      <div id="clockPromptLabel" style="font-size:15px; font-weight:600; margin-bottom:8px;"></div>
      <input type="text" id="clockPromptInput" placeholder="M:SS or MSS" style="width:100px; display:inline-block;">
      <button class="primary" id="clockPromptSave">Save clock</button>
      <button class="secondary" id="clockPromptSkip">Skip</button>
    </div>

    <div id="guidedPanel" class="card" style="display:none;">
      <h2>Kickoff</h2>
      <div id="guidedContent"></div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px;">
        <h1 id="gameTitle">Game</h1>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <a id="launchViewLink" href="#" target="_blank" style="text-decoration:none; padding:8px 14px; border-radius:6px; border:1px solid #1565c0; color:#1565c0; font-size:13px; font-weight:600; white-space:nowrap;">Launch view ↗</a>
          <a href="dashboard.html" style="text-decoration:none; padding:8px 14px; border-radius:6px; border:1px solid #ccc; color:#444; font-size:13px; font-weight:600; white-space:nowrap;">← Dashboard</a>
        </div>
      </div>
      <div id="gameMsg"></div>
      <div id="syncStatus" style="display:none; margin:8px 0; padding:10px 12px; border-radius:8px; background:#fff4d6; border:1px solid #e0b84c; font-size:13px;"></div>
      <input type="text" id="code" style="display:none;">

      <div class="row" style="margin-bottom:8px;">
        <button class="primary" id="startGameBtn">Start game</button>
        <button class="primary" id="endFirstHalfBtn" style="display:none;">End 1st half</button>
        <button class="primary" id="quarterUtilBtn">Quarter marker</button>
        <button class="primary" id="startHalfBtn" style="display:none;">Start 2nd half</button>
        <button class="primary" id="endGameBtn" style="display:none;">End game</button>
        <button id="otUtilBtn" style="display:none;">Start overtime</button>
        <a id="recapLink" href="#" style="display:none; padding:8px 12px; border-radius:6px; background:#1a7a4c; color:#fff; font-size:13px; font-weight:600; text-decoration:none;">View game recap &rarr;</a>
      </div>

      <p class="hint" style="margin:10px 0 6px;">Scrimmage</p>
      <div class="row">
        <button class="ptypeBtn" data-type="rush">Rush</button>
        <button class="ptypeBtn" data-type="pass">Pass</button>
      </div>
      <p class="hint" style="margin:10px 0 6px;">Special teams</p>
      <div class="row">
        <button class="ptypeBtn" data-type="kickoff">Kickoff</button>
        <button class="ptypeBtn" data-type="punt">Punt</button>
        <button class="ptypeBtn" data-type="fg">Field goal</button>
        <button class="ptypeBtn" data-type="pat">PAT</button>
        <button class="ptypeBtn" data-type="twopt">2PT</button>
      </div>
      <p class="hint" style="margin:10px 0 6px;">Utilities</p>
      <div class="row">
        <button id="penUtilBtn" style="background:#ffc72c; color:#1a1a1a;">Penalty</button>
        <button class="ptypeBtn" data-type="fumble">Fumble</button>
        <button class="ptypeBtn" data-type="safety">Safety</button>
        <button id="driveUtilBtn">Adjust Down/Distance</button>
        <button id="flipBtn">Flip possession</button>
      </div>

      <div id="playPanel" style="display:none;"></div>

      <div id="manualPanel" style="display:none; background:#f7f6f2; border-radius:8px; padding:12px 14px; margin-top:10px;">
        <p class="hint" style="margin:0 0 6px;">Manual entry (flags as unresolved for later review)</p>
        <label>Insert after<select id="insertAfter" style="width:100%; margin-bottom:8px;"></select></label>
        <input type="text" id="manualText" placeholder="Describe the play" style="width:100%; margin-bottom:8px;">
        <div class="row"><button class="primary" id="saveManual">Save</button><button class="secondary" id="cancelManual">Cancel</button></div>
      </div>

      <div id="confirmCard" style="display:none;">
        <div style="font-size:14px; color:#888; margin-bottom:4px;">Parsed as</div>
        <div id="parsedText" style="font-size:16px; font-weight:600; margin-bottom:10px;"></div>
        <div id="fieldPosWarning" style="display:none; background:#fff3cd; border:1px solid #e0b400; border-radius:6px; padding:8px 12px; margin-bottom:10px; font-size:13px; color:#7a5c00;"></div>
        <label id="flipRow" style="display:none;"><input type="checkbox" id="flipCheck" checked> <span id="flipLabel"></span></label>
        <div id="confirmClockRow" style="display:none; margin-bottom:8px;">
          <span id="confirmClockLabel">Clock</span>&nbsp;<input type="text" id="confirmClockInput" placeholder="M:SS or MSS" style="width:90px; display:inline-block;">
        </div>
        <div class="row" style="margin-top:8px;">
          <button class="primary" id="saveBtn">Save</button>
          <button class="secondary" id="editBtn">Edit</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:baseline;">
        <h2 style="margin:0;">Current drive</h2>
        <div style="display:flex; gap:6px;">
          <button class="secondary" id="undoBtn" style="padding:6px 12px; font-size:12px;">Undo last</button>
          <button class="secondary" id="redoBtn" style="padding:6px 12px; font-size:12px;" disabled>Redo last</button>
        </div>
      </div>
      <div id="driveLogScroll"></div>
    </div>

    <div class="card">
      <h2>Previous drive</h2>
      <div id="prevDriveLogScroll"></div>
    </div>

    <div class="card">
      <h2>All plays</h2>
      <div id="logScroll"></div>
    </div>
  </div>

  <div class="floating-actions">
    <button class="secondary" id="manualBtn">Manual entry</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="team-icon.js"></script>
<script>
  const SUPABASE_URL = 'https://pboushzlcyfkssojpuut.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_VGnUYurlkoH1yi67jHO6iQ_C8Q0EM2d';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  function showView(name){
    ['loading','errorView','mainView'].forEach(v => document.getElementById(v).classList.toggle('hidden', v !== name));
  }
  function showMsg(elId, text, type){
    document.getElementById(elId).innerHTML = '<div class="msg ' + type + '">' + text + '</div>';
  }

  let currentGameId = null;
  let nextSequenceNumber = 1;
  let TEAMS = { teamA: {}, teamB: {} };
  let plays = [], nextId = 1, startingPossession = 'teamA', quarterLengthSec = 720, gameLabel = '';
  let pending = null;
  let guided = { active: false, quarter: null, kickingTeam: null, receivingTeam: null, step: null, targetPhase: null };
  let gamePhase = 'notStarted';
  let clockPrompt = null, clockPromptCallback = null;
  let currentGameStatus = 'setup';
  const ROLE_RANK = { view: 0, game_entry: 1, admin: 2 };

  async function guardMinRoleOrRedirect(userId, minRole){
    const { data, error } = await supabaseClient
      .from('profiles').select('role').eq('id', userId).limit(1);
    const role = (!error && data && data.length > 0 && data[0].role) || 'view';
    const ok = (ROLE_RANK[role] || 0) >= (ROLE_RANK[minRole] || 0);
    if (!ok) window.location.href = 'dashboard.html';
    return ok;
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'INITIAL_SESSION'){
      if (session){
        guardMinRoleOrRedirect(session.user.id, 'game_entry').then(ok => {
          if (ok) init();
        });
      } else { window.location.href = '/'; }
    } else if (event === 'SIGNED_OUT'){
      window.location.href = '/';
    }
  });

  async function init(){
    const params = new URLSearchParams(window.location.search);
    currentGameId = params.get('id');
    if (!currentGameId){
      showView('errorView');
      showMsg('errorMsg', 'No game specified.', 'error');
      return;
    }

    const { data: gameRows, error: gameError } = await supabaseClient
      .from('games').select('*').eq('id', currentGameId).limit(1);
    if (gameError || !gameRows || gameRows.length === 0){
      showView('errorView');
      document.getElementById('errorMsg').textContent = gameError ? gameError.message : 'That game could not be found.';
      return;
    }
    const game = gameRows[0];
    gameLabel = game.designator;
    quarterLengthSec = game.quarter_length_seconds || 720;
    currentGameStatus = game.status;

    const { data: rosterRows, error: rosterError } = await supabaseClient
      .from('game_rosters').select('*').eq('game_id', currentGameId);
    if (rosterError){
      showView('errorView');
      document.getElementById('errorMsg').textContent = rosterError.message;
      return;
    }

    const { data: teamRows } = await supabaseClient
      .from('teams').select('primary_color, secondary_color, logo_url').eq('is_our_team', true).limit(1);
    const ourBranding = (teamRows && teamRows[0]) || {};

    buildTeams(game, rosterRows || [], ourBranding);
    document.getElementById('gameTitle').textContent = gameLabel + ' — ' + TEAMS.teamA.name + ' vs ' + TEAMS.teamB.name;
    document.getElementById('launchViewLink').href = 'view.html?id=' + currentGameId;

    const { data: existingPlays } = await supabaseClient
      .from('plays').select('*').eq('game_id', currentGameId).order('sequence_number', { ascending: true });
    plays = (existingPlays || []).map(p => ({
      id: nextId++, text: p.text, effect: p.effect || {}, team: p.team_side, quarter: p.quarter,
      roles: p.roles, unresolved: p.unresolved, isDivider: p.is_divider, isOverride: p.is_override,
      _seq: p.sequence_number
    }));
    // Plays that never reached the server last session are held on this
    // device. Merge them back in BEFORE anything reads `plays`, or a
    // reload silently drops them and every later play's down & distance
    // is recomputed against a game that is missing a snap.
    loadPendingQueue();
    if (pendingQueue.length){
      const onServer = new Set(plays.map(p => p._seq));
      // Some may have landed after all -- an insert can succeed while
      // the response is lost. Anything the server already has is done.
      pendingQueue = pendingQueue.filter(r => !onServer.has(r.sequence_number));
      savePendingQueue();
      pendingQueue.forEach(r => {
        plays.push({
          id: nextId++, text: r.text, effect: r.effect || {}, team: r.team_side,
          quarter: r.quarter, roles: r.roles, unresolved: r.unresolved,
          isDivider: r.is_divider, isOverride: r.is_override, _seq: r.sequence_number
        });
      });
      plays.sort((a, b) => (a._seq || 0) - (b._seq || 0));
    }
    nextSequenceNumber = plays.length ? Math.max(...plays.map(p => p._seq || 0)) + 1 : 1;
    renderSyncStatus();
    if (pendingQueue.length){ scheduleSync(); drainPendingQueue(); }
    // Retry the moment the device says it is back online, rather than
    // waiting out the polling interval.
    window.addEventListener('online', () => { if (pendingQueue.length) drainPendingQueue(); });

    // Resume exactly where we left off -- read the persisted phase and
    // any in-progress guided step directly, rather than guessing from
    // play history (which can't tell "kickoff in progress" from "kickoff
    // never started", and would silently drop an interrupted kickoff).
    gamePhase = game.game_phase || (plays.length === 0 ? 'notStarted' : 'firstHalf');
    if (currentGameStatus === 'final') gamePhase = 'ended';
    guided = (game.guided_state && game.guided_state.active) ? game.guided_state : { active: false, quarter: null, kickingTeam: null, receivingTeam: null, step: null, targetPhase: null };
    showView('mainView');
    renderAll();
    renderGuided();
    updatePhaseUI();
  }

  function buildTeams(game, rosterRows, ourBranding){
    const ourName = game.our_team_is_home ? game.home_team_name : game.away_team_name;
    const oppName = game.our_team_is_home ? game.away_team_name : game.home_team_name;
    const seeds = game.seed_starters || {};
    const seedOrderFor = (side) => {
      const s = seeds[side] || {};
      return ['QB','RB1','RB2','WR1','WR2','WR3'].map(role => s[role]).filter(Boolean);
    };
    TEAMS.teamA = { name: ourName, bg: ourBranding.primary_color || '#1a1a2e', text: ourBranding.secondary_color || '#ffffff',
      rosterOffense:{}, rosterDefense:{}, rosterSpecialTeams:{}, posOffense:{}, posDefense:{}, posSpecialTeams:{}, logo: ourBranding.logo_url || null, seedOrder: seedOrderFor('teamA') };
    TEAMS.teamB = { name: oppName, bg: game.opponent_primary_color || '#8B0000', text: game.opponent_secondary_color || '#ffffff',
      rosterOffense:{}, rosterDefense:{}, rosterSpecialTeams:{}, posOffense:{}, posDefense:{}, posSpecialTeams:{}, logo: game.opponent_logo_url || null, seedOrder: seedOrderFor('teamB') };
    rosterRows.forEach(r => {
      const team = TEAMS[r.team_side];
      if (!team) return;
      if (r.unit === 'offense'){ team.rosterOffense[r.jersey_number] = r.player_name; team.posOffense[r.jersey_number] = r.position; }
      else if (r.unit === 'defense'){ team.rosterDefense[r.jersey_number] = r.player_name; team.posDefense[r.jersey_number] = r.position; }
      else if (r.unit === 'special'){ team.rosterSpecialTeams[r.jersey_number] = r.player_name; team.posSpecialTeams[r.jersey_number] = r.position; }
    });
  }


  // --- Proven engine core, ported verbatim from the tested entry app ---
function otherTeam(t){ return t === 'teamA' ? 'teamB' : 'teamA'; }
// Administrative entries -- clock markers, quarter/half dividers, manual
// possession flips -- are announcements, not football plays. They carry
// no roles and no yardage, so anything reasoning about "what actually
// happened on this drive" has to skip them.
//
// isReset markers are deliberately NOT administrative: they are explicit
// "new drive" announcements and are valid drive starts.
//
// Lives in the engine core (top level) rather than inside
// findDriveStarts because computeDriveSummary needs it too, from a
// different scope.
function isAdminMarker(p){
  if (!p) return true;
  const e = p.effect || {};
  if (e.isReset) return false;
  return !!(e.clockEvent || e.setQuarter || e.forcePossession || p.isDivider);
}
function findDriveStarts(playsList){
  // A drive must never START on an administrative marker. Doing so
  // produces a one-play "drive" whose every counter is zero, and
  // because only the last two drives are ever shown, it silently
  // pushes the real drive out of the "previous drive" slot. That is
  // what made a completed scoring drive display as
  // "Clock - 5:00 at change of possession" with 0/0 tiles: the
  // kickoff flipped possession, so the drive began on the clock
  // line that happened to follow it.
  const firstRealPlayFrom = from => {
    for (let j = from; j < playsList.length; j++){
      if (!isAdminMarker(playsList[j])) return j;
    }
    return -1;
  };
  const starts = [];
  // Start indices are produced in non-decreasing order, so checking
  // only the last entry is enough to stop a detected possession
  // change and an explicit reset marker from both claiming the same
  // play (which they often do, since skipping markers lands the
  // possession change exactly on the reset marker that follows it).
  const pushStart = idx => {
    if (idx !== -1 && starts[starts.length - 1] !== idx) starts.push(idx);
  };
  let priorPoss = startingPossession;
  for (let i = 0; i < playsList.length; i++){
    if (playsList[i].effect && playsList[i].effect.isReset){
      // A reset marker only OPENS the game's first drive. Every later
      // drive begins at a real possession change, which is detected
      // below and already lands on the reset marker that follows it.
      // "Adjust down / distance" writes a reset marker purely to
      // correct the chains, so using it mid-drive -- or twice in a row
      // -- must not register another drive, and therefore another
      // possession, for a team that never gave the ball up.
      if (!starts.length) pushStart(i);
      priorPoss = computeState(playsList.slice(0, i + 1)).possession;
      continue;
    }
    const possAfter = computeState(playsList.slice(0, i + 1)).possession;
    if (possAfter !== priorPoss) pushStart(firstRealPlayFrom(i + 1));
    priorPoss = possAfter;
  }
  return starts;
}
// Jersey numbers resolve across ALL THREE roster units, not just the one
// the play type implies. High-school rosters routinely list a player
// under a single unit even though they play several, and a dedicated
// kick/punt returner is normally rostered on special teams only -- which
// is why returners used to render in the log as a bare "#25".
//
// A fallback can only ever turn "#25" into a name; it can never change a
// name that already resolved, because the expected unit is always
// searched first. This mirrors playerName() in the report pages.
function rosterName(teamKey, num, order){
  const t = TEAMS[teamKey];
  const buckets = { offense: t.rosterOffense, defense: t.rosterDefense, special: t.rosterSpecialTeams };
  for (const unit of order){
    const roster = buckets[unit];
    if (roster && roster[num]) return roster[num];
  }
  return null;
}
function nameInOffense(teamKey, num){
  const n = rosterName(teamKey, num, ['offense','special','defense']);
  return (n || ('#' + num)) + ' (' + TEAMS[teamKey].name + ')';
}
function nameInDefense(teamKey, num){
  const n = rosterName(teamKey, num, ['defense','special','offense']);
  return (n || ('#' + num)) + ' (' + TEAMS[teamKey].name + ')';
}
function nameInSpecialTeams(teamKey, num){
  const n = rosterName(teamKey, num, ['special','offense','defense']);
  return (n || ('#' + num)) + ' (' + TEAMS[teamKey].name + ')';
}
function ordinal(n){ return n===1?'1st':n===2?'2nd':n===3?'3rd':n===4?'4th':(n+'th'); }
// Coaches are allowed to type a clock without the colon ("1156" for
// "11:56"), because that's faster to enter mid-game. But every DISPLAY
// -- the play log, view.html, recap, every report -- must always show
// the colon. Storing the coach's raw input verbatim baked "1156" into
// the saved text forever, so any clock line typed without a colon
// showed up colon-less everywhere the play was ever displayed.
//
// The fix is at the source: normalize to "M:SS" once, here, before the
// text is ever assembled and persisted. Every display page just renders
// the stored string verbatim (there is no separate formatting step
// downstream), so a page can only ever show what game.html wrote.
//
// Uses the exact same parsing rules as clockToAbsSeconds -- colon-less
// entry, seconds always two digits, quarter-length bound -- so anything
// accepted by one is formatted by the other. Returns null for the same
// inputs clockToAbsSeconds rejects.
function normalizeClockStr(quarter, clockStr){
  let m = clockStr.match(/^(\d{1,2}):(\d{2})$/);
  let mins, secs;
  if (m){
    mins = parseInt(m[1]); secs = parseInt(m[2]);
  } else {
    m = clockStr.match(/^(\d*)(\d{2})$/);
    if (!m) return null;
    mins = m[1] ? parseInt(m[1]) : 0; secs = parseInt(m[2]);
  }
  if (secs > 59) return null;
  if (mins * 60 + secs > quarterLengthSec) return null;

    const { error } = await supabaseClient.from('games')
      .update({ game_phase: gamePhase, guided_state: guided })
      .eq('id', currentGameId);
    if (error) showMsg('gameMsg', 'State changed here, but failed to sync to the server: ' + error.message, 'error');
  }

  function showClockPrompt(ctx, thenFn){
    clockPrompt = ctx;
    clockPromptCallback = thenFn;
    renderClockPrompt();
    updatePhaseUI();
  }
  function renderClockPrompt(){
    const card = document.getElementById('clockPromptCard');
    if (!clockPrompt){ card.style.display = 'none'; return; }
    card.style.display = 'block';
    let label = '';
    if (clockPrompt.mode === 'transition') label = 'Clock at change of possession — ' + TEAMS[clockPrompt.outgoingTeam].name + ' \u2192 ' + TEAMS[clockPrompt.incomingTeam].name;
    if (clockPrompt.mode === 'start') label = 'Clock at start of ' + TEAMS[clockPrompt.team].name + ' possession';
    if (clockPrompt.mode === 'end') label = 'Clock at end of ' + TEAMS[clockPrompt.team].name + ' possession';
    document.getElementById('clockPromptLabel').textContent = label;
    document.getElementById('clockPromptInput').value = '';
  }
  function resolveClockPrompt(skip){
    const val = document.getElementById('clockPromptInput').value.trim();
    if (!skip && val){
      const q = computeState().quarter;
      const absSec = clockToAbsSeconds(q, val);
      if (absSec === null){
        alert('"' + val + '" isn\'t a valid clock value for this quarter -- check the format (M:SS) and that it doesn\'t exceed the quarter length.');
        return;
      }
      if (!confirmClockAdvances(absSec, val)) return;
      let effect, text;
      if (clockPrompt.mode === 'transition'){
        effect = { clockEvent: { type: 'transition', outgoingTeam: clockPrompt.outgoingTeam, incomingTeam: clockPrompt.incomingTeam, absSec } };
        text = 'Clock — ' + normalizeClockStr(q, val) + ' at change of possession (' + TEAMS[clockPrompt.outgoingTeam].name + ' \u2192 ' + TEAMS[clockPrompt.incomingTeam].name + ')';
      } else if (clockPrompt.mode === 'start'){
        effect = { clockEvent: { type: 'start', team: clockPrompt.team, absSec } };
        text = 'Clock — ' + normalizeClockStr(q, val) + ' start of possession (' + TEAMS[clockPrompt.team].name + ')';
      } else {
        effect = { clockEvent: { type: 'end', team: clockPrompt.team, absSec } };
        text = 'Clock — ' + normalizeClockStr(q, val) + ' end of possession (' + TEAMS[clockPrompt.team].name + ')';
      }
      pushAndPersist({ id: nextId++, text, effect, quarter: q });
    }
    const cb = clockPromptCallback;
    clockPrompt = null;
    clockPromptCallback = null;
    renderAll();
    renderClockPrompt();
    updatePhaseUI();
    if (cb) cb();
  }
  document.getElementById('clockPromptSave').addEventListener('click', () => resolveClockPrompt(false));
  document.getElementById('clockPromptSkip').addEventListener('click', () => resolveClockPrompt(true));
  document.getElementById('clockPromptInput').addEventListener('keydown', e => { if (e.key === 'Enter') resolveClockPrompt(false); });

  function startGuided(quarterNum, targetPhase){
    guided = { active: true, quarter: quarterNum, kickingTeam: null, receivingTeam: null, step: 'pickKicker', targetPhase };
    persistUiState();
    pushAndPersist({ id: nextId++, text: 'Quarter marker — start of Q' + quarterNum, effect: { setQuarter: quarterNum }, quarter: quarterNum });
    renderAll();
    renderGuided();
    updatePhaseUI();
  }
  document.getElementById('startGameBtn').addEventListener('click', () => { setGameStatus('in_progress'); startGuided(1, 'firstHalf'); });
  document.getElementById('startHalfBtn').addEventListener('click', () => startGuided(3, 'secondHalf'));
  document.getElementById('endFirstHalfBtn').addEventListener('click', () => {
    const state = computeState();
    const absSec = clockToAbsSeconds(state.quarter, '0:00');
    if (!confirmClockAdvances(absSec, '0:00')) return;
    pushAndPersist({ id: nextId++, text: 'Clock — 0:00 end of possession (' + TEAMS[state.possession].name + ')', effect: { clockEvent: { type: 'end', team: state.possession, absSec } }, quarter: state.quarter });
    pushAndPersist({ id: nextId++, text: 'End of 1st half', effect: {}, isDivider: true });
    gamePhase = 'halftime';
    persistUiState();
    renderAll();
    updatePhaseUI();
  });
  document.getElementById('endGameBtn').addEventListener('click', () => {
    const state = computeState();
    if (state.scores.teamA === state.scores.teamB){
      alert('Score is tied ' + state.scores.teamA + '-' + state.scores.teamB + ' — the game can\'t end on a tie. Use "Start overtime" instead.');
      return;
    }
    const ok = confirm('End the game now? Final score: ' + TEAMS.teamA.name + ' ' + state.scores.teamA + ' — ' + TEAMS.teamB.name + ' ' + state.scores.teamB + '.\n\nThis locks in the game as final.');
    if (!ok) return;
    const absSec = clockToAbsSeconds(state.quarter, '0:00');
    if (!confirmClockAdvances(absSec, '0:00')) return;
    pushAndPersist({ id: nextId++, text: 'Clock — 0:00 end of possession (' + TEAMS[state.possession].name + ')', effect: { clockEvent: { type: 'end', team: state.possession, absSec } }, quarter: state.quarter });
    pushAndPersist({ id: nextId++, text: 'Final', effect: {}, isDivider: true });
    gamePhase = 'ended';
    persistUiState();
    setGameStatus('final', { us: state.scores.teamA, opp: state.scores.teamB });
    renderAll();
    updatePhaseUI();
  });

  function renderGuided(){
    const panel = document.getElementById('guidedPanel');
    const content = document.getElementById('guidedContent');
    if (!guided.active){ panel.style.display = 'none'; return; }
    panel.style.display = 'block';

    if (guided.step === 'otPickTeam'){
      content.innerHTML =
        '<p class="hint">Overtime — no kickoff. Who gets the ball first? Possession will keep alternating from here as normal (turnovers, New Drive after each score) until someone\'s actually ahead.</p>' +
        '<button type="button" id="ot_pickA">' + TEAMS.teamA.name + '</button> ' +
        '<button type="button" id="ot_pickB">' + TEAMS.teamB.name + '</button>';
      function pickTeam(team){
        pushAndPersist({ id: nextId++, text: 'Quarter marker — start of overtime', effect: { setQuarter: 5 }, quarter: 5 });
        guided.receivingTeam = team;
        guided.step = 'otSpot';
        persistUiState();
        renderGuided();
      }
      document.getElementById('ot_pickA').addEventListener('click', () => pickTeam('teamA'));
      document.getElementById('ot_pickB').addEventListener('click', () => pickTeam('teamB'));
      return;
    }

    if (guided.step === 'otSpot'){
      const team = guided.receivingTeam;
      content.innerHTML =
        '<p class="hint">' + TEAMS[team].name + ' starts overtime. Starting spot (most rule sets: opponent\'s 10 — adjust to your association\'s format):</p>' +
        startingSpotFieldsHtml('ot_spot', 'Starting spot', team) +
        '<div class="row" style="margin-top:12px;"><button class="primary" id="ot_review">Set drive</button></div>';
      const getReset = wireStartingSpot(content, 'ot_spot');
      document.getElementById('ot_review').addEventListener('click', () => {
        const reset = getReset();
        if (!reset) return;
        pushAndPersist({ id: nextId++, text: 'Overtime — ' + TEAMS[team].name + ' to start at ' + markerLabel(reset.fieldPos), effect: { forcePossession: team }, quarter: 5 });
        pushAndPersist({ id: nextId++, text: 'New drive — ' + ordinal(reset.down) + ' & ' + reset.distance + ' at ' + markerLabel(reset.fieldPos) + ' (' + TEAMS[team].name + ')', effect: { isReset: true, down: reset.down, distance: reset.distance, fieldPos: reset.fieldPos }, quarter: 5 });
        guided = { active: false, quarter: null, kickingTeam: null, receivingTeam: null, step: null, targetPhase: null };
        persistUiState();
        renderAll();
        renderGuided();
        updatePhaseUI();
      });
      return;
    }

    if (guided.step === 'pickKicker'){
      content.innerHTML =
        '<div style="font-size:16px; margin-bottom:8px;">Q' + guided.quarter + ' kickoff — who kicks off?</div>' +
        '<div class="row"><button class="primary" id="pickA">' + TEAMS.teamA.name + ' kicks</button>' +
        '<button class="primary" id="pickB">' + TEAMS.teamB.name + ' kicks</button></div>';
      document.getElementById('pickA').addEventListener('click', () => { guided.kickingTeam = 'teamA'; guided.receivingTeam = 'teamB'; guided.step = 'kickoff'; persistUiState(); renderGuided(); });
      document.getElementById('pickB').addEventListener('click', () => { guided.kickingTeam = 'teamB'; guided.receivingTeam = 'teamA'; guided.step = 'kickoff'; persistUiState(); renderGuided(); });
      return;
    }
    if (guided.step === 'kickoff'){
      const kickerList = specialTeamsEligible(guided.kickingTeam);
      content.innerHTML =
        '<div style="font-size:16px; margin-bottom:8px;">' + TEAMS[guided.kickingTeam].name + ' kicks off.</div>' +
        '<p style="font-size:13px; color:#888; margin:0 0 4px;">Kicker</p>' +
        '<div id="gk_kicker_grid">' + pickerHtml(kickerList, 'gk_kicker_pick') + '</div>' +
        '<input type="text" id="gk_kicker_manual" placeholder="or type #" style="width:100px; margin:4px 0 8px;"><br>' +
        '<label class="inline">Distance <input type="text" id="gk_yards" style="width:70px; margin-left:6px; display:inline-block;"></label>' +
        '<div class="row" style="margin-top:10px;"><button class="primary" id="guidedKickoffSave">Save kickoff</button></div>';
      let kickerNum = null;
      content.querySelectorAll('.gk_kicker_pick').forEach(b => b.addEventListener('click', () => {
        kickerNum = b.dataset.num;
        if (b.dataset.resolved) TEAMS[guided.kickingTeam].rosterSpecialTeams[kickerNum] = b.dataset.resolved;
        content.querySelectorAll('.gk_kicker_pick').forEach(x => x.style.background = '');
        b.style.background = '#e6f1fb';
        document.getElementById('gk_kicker_manual').value = kickerNum;
      }));
      document.getElementById('gk_kicker_manual').addEventListener('input', e => { kickerNum = e.target.value.trim(); });
      document.getElementById('guidedKickoffSave').addEventListener('click', () => {
        const yds = document.getElementById('gk_yards').value.trim();
        if (!kickerNum || !yds) return;
        const text = nameInSpecialTeams(guided.kickingTeam, kickerNum) + ' kicks off ' + yds;
        pushAndPersist({ id: nextId++, text, effect: {}, team: guided.kickingTeam, quarter: guided.quarter, roles: { kicker: { team: guided.kickingTeam, num: kickerNum, yards: parseInt(yds)||0 }, playType: 'kickoff' } });
        guided.step = 'return';
        persistUiState();
        renderAll(); renderGuided();
      });
      return;
    }
    if (guided.step === 'return'){
      const returnerList = defenseEligible(guided.receivingTeam);
      content.innerHTML =
        '<div style="font-size:16px; margin-bottom:8px;">' + TEAMS[guided.receivingTeam].name + ' returns.</div>' +
        '<p style="font-size:13px; color:#888; margin:0 0 4px;">Returner</p>' +
        '<div id="gr_returner_grid">' + pickerHtml(returnerList, 'gr_returner_pick') + '</div>' +
        '<input type="text" id="gr_returner_manual" placeholder="type #" style="width:100px; margin:4px 0 8px;"><br>' +
        '<label class="inline">Return yards <input type="text" id="gr_yards" style="width:70px; margin-left:6px; display:inline-block;"></label>' +
        '<label class="inline" style="margin-left:12px; display:inline-block;"><input type="checkbox" id="gr_td"> Touchdown</label>' +
        '<label class="inline" style="margin-left:12px; display:inline-block;">Clock <input type="text" id="guidedReturnClock" placeholder="M:SS or MSS" style="width:80px; margin-left:6px; display:inline-block;"></label>' +
        startingSpotFieldsHtml('gr_spot', 'Ball spot after the return (sets 1st down for ' + TEAMS[guided.receivingTeam].name + ')', guided.receivingTeam) +
        '<div class="row" style="margin-top:10px;"><button class="primary" id="guidedReturnSave">Save return</button></div>';
      let returnerNum = null;
      const getReturnReset = wireStartingSpot(content, 'gr_spot');
      content.querySelectorAll('.gr_returner_pick').forEach(b => b.addEventListener('click', () => {
        returnerNum = b.dataset.num;
        if (b.dataset.resolved) TEAMS[guided.receivingTeam].rosterDefense[returnerNum] = b.dataset.resolved;
        content.querySelectorAll('.gr_returner_pick').forEach(x => x.style.background = '');
        b.style.background = '#e6f1fb';
        document.getElementById('gr_returner_manual').value = returnerNum;
      }));
      document.getElementById('gr_returner_manual').addEventListener('input', e => { returnerNum = e.target.value.trim(); });
      document.getElementById('guidedReturnSave').addEventListener('click', () => {
        const yds = document.getElementById('gr_yards').value.trim();
        const td = document.getElementById('gr_td').checked;
        // The returner is optional here too -- on the opening kickoff the
        // picker is usually empty anyway, and a coach frequently can't
        // read the number. Return yardage is still required because it
        // is what the rest of the flow needs.
        if (!yds) return;
        const q = guided.quarter;

        // Validate the clock before anything gets saved, same reasoning
        // as the main save flow -- a rejected value should abort the
        // whole thing, not commit the return and quietly drop the clock.
        const clockVal = document.getElementById('guidedReturnClock').value.trim();
        let clockAbsSec = null;
        if (clockVal){
          clockAbsSec = clockToAbsSeconds(q, clockVal);
          if (clockAbsSec === null){
            alert('"' + clockVal + '" isn\'t a valid clock value for this quarter. Check the format (M:SS) and that it doesn\'t exceed the quarter length. Nothing was saved -- fix the clock value and try again.');
            return;
          }
          if (!confirmClockAdvances(clockAbsSec, clockVal)) return;
        }

        let text = (returnerNum ? nameInDefense(guided.receivingTeam, returnerNum) : TEAMS[guided.receivingTeam].name) + ' returns ' + yds;
        const effect = { flip: true, flipApplied: true, flipTo: guided.receivingTeam };
        if (td){ text += ' — TOUCHDOWN'; effect.score = { team: guided.receivingTeam, points: 6 }; }
        pushAndPersist({ id: nextId++, text, effect, team: guided.receivingTeam, quarter: guided.quarter, roles: Object.assign({ playType: 'kickoff_return' }, returnerNum ? { defense: { team: guided.receivingTeam, num: returnerNum } } : {}) });
        const receivingName = TEAMS[guided.receivingTeam].name;
        const receivingTeamKey = guided.receivingTeam;
        if (clockVal && clockAbsSec !== null){
          pushAndPersist({ id: nextId++, text: 'Clock — ' + normalizeClockStr(q, clockVal) + ' start of possession (' + receivingName + ')', effect: { clockEvent: { type: 'start', team: receivingTeamKey, absSec: clockAbsSec } }, quarter: q });
        }
        const reset = getReturnReset();
        if (reset && !td){
          pushAndPersist({ id: nextId++, text: 'New drive — ' + ordinal(reset.down) + ' & ' + reset.distance + ' at ' + markerLabel(reset.fieldPos) + ' (' + receivingName + ')', effect: { isReset: true, down: reset.down, distance: reset.distance, fieldPos: reset.fieldPos }, quarter: q });
        }
        gamePhase = guided.targetPhase;
        guided = { active: false, quarter: null, kickingTeam: null, receivingTeam: null, step: null, targetPhase: null };
        persistUiState();
        renderAll(); renderGuided(); updatePhaseUI();
        if (reset && !td){
          document.getElementById('code').placeholder = '15p 22 25 7';
        } else {
          document.getElementById('code').placeholder = '1 10 -20 — set the starting spot for ' + receivingName;
        }
      });
      return;
    }
  }

  document.getElementById('otUtilBtn').addEventListener('click', () => {
    guided = { active: true, quarter: 5, kickingTeam: null, receivingTeam: null, step: 'otPickTeam', targetPhase: 'secondHalf' };
    persistUiState();
    renderGuided();
  });

  document.querySelectorAll('.ptypeBtn').forEach(b => b.addEventListener('click', () => renderPlayPanel(b.dataset.type)));
  let currentSpotGetter = null;

  function startingSpotFieldsHtml(idPrefix, label, driveTeamKey){
    const driveTeamLabel = driveTeamKey ? TEAMS[driveTeamKey].name + "'s side" : 'Our side';
    const otherTeamLabel = driveTeamKey ? TEAMS[otherTeam(driveTeamKey)].name + "'s side" : 'Their side';
    return '<p style="font-size:13px; color:#888; margin:8px 0 4px;">' + (label || 'Starting spot for the ensuing drive (optional — leave blank to set later)') + '</p>' +
      '<button type="button" class="' + idPrefix + '_side" data-side="own">' + driveTeamLabel + '</button> ' +
      '<button type="button" class="' + idPrefix + '_side" data-side="opp">' + otherTeamLabel + '</button> ' +
      '<input type="text" id="' + idPrefix + '_yardline" style="width:70px; display:inline-block;" placeholder="Yard line">';
  }
  function wireStartingSpot(container, idPrefix){
    let side = null;
    container.querySelectorAll('.' + idPrefix + '_side').forEach(b => b.addEventListener('click', () => {
      side = b.dataset.side;
      container.querySelectorAll('.' + idPrefix + '_side').forEach(x => x.style.background = '');
      b.style.background = '#e6f1fb';
    }));
    return function getReset(){
      const yardlineEl = document.getElementById(idPrefix + '_yardline');
      const yardline = yardlineEl ? yardlineEl.value.trim() : '';
      if (!side || !yardline) return null;
      const fieldPos = side === 'own' ? Math.abs(parseInt(yardline)) : (100 - parseInt(yardline));
      const distance = Math.min(10, 100 - fieldPos);
      return { down: 1, distance, fieldPos };
    };
  }

  function renderPlayPanel(type){
    const state = computeState();
    const off = state.possession, def = otherTeam(state.possession);
    const panel = document.getElementById('playPanel');
    panel.style.display = 'block';
    document.getElementById('confirmCard').style.display = 'none';

    const { stats } = computePlayerStats();
    function offBlock(role, label){
      const list = (role === 'kicker' || role === 'punter') ? specialTeamsEligible(off) : offenseEligible(off, role);
      const statFn = role === 'carrier' ? (n => (stats[off].rushYds[n]||0)+' yds') : role === 'passer' ? (n => (stats[off].passYds[n]||0)+' yds') : role === 'receiver' ? (n => (stats[off].recYds[n]||0)+' yds') : null;
      return '<p style="font-size:13px; color:#888; margin:8px 0 4px;">' + label + '</p>' +
        '<div id="pp_' + role + '_grid">' + pickerHtml(list, 'pp_' + role + '_pick', statFn) + '</div>' +
        '<input type="text" id="pp_' + role + '_manual" placeholder="or type #" style="width:100px; margin-top:4px;">';
    }
    function defBlock(label, suffix){
      suffix = suffix || '';
      const list = defenseEligible(def);
      return '<p style="font-size:13px; color:#888; margin:8px 0 4px;">' + label + '</p>' +
        '<div id="pp_credit_grid' + suffix + '">' + pickerHtml(list, 'pp_credit_pick' + suffix, n => (stats[def].credits[n]||0)+' credits') + '</div>' +
        '<input type="text" id="pp_credit_manual' + suffix + '" placeholder="type #" style="width:100px; margin-top:4px;">';
    }
    // Dedicated returner picker for kickoffs and punts. It deliberately
    // reuses the credit field's ids and classes (pp_credit_grid /
    // pp_credit_pick / pp_credit_manual) so buildAndReview and every
    // existing wiring path keep working untouched -- the only difference
    // is who gets offered. No stat label either: a returner's defensive
    // credit count is meaningless here, and "0 credits" next to every
    // special-teams player was pure noise.
    function retBlock(label, suffix){
      suffix = suffix || '';
      const list = returnerEligible(def);
      return '<p style="font-size:13px; color:#888; margin:8px 0 4px;">' + label + '</p>' +
        '<div id="pp_credit_grid' + suffix + '">' + pickerHtml(list, 'pp_credit_pick' + suffix, (num, p) => (p && p.pos) || '', 'no returners on the roster — type a number below') + '</div>' +
        '<input type="text" id="pp_credit_manual' + suffix + '" placeholder="type #" style="width:100px; margin-top:4px;">';
    }
    const yardsBlock = (label, id) => '<p style="font-size:13px; color:#888; margin:8px 0 4px;">' + (label||'Yards') + '</p><input type="text" id="' + (id||'pp_yards') + '" style="width:80px;">';
    const yardsBlockRet = () => '<div id="pp_retyds_container"><p style="font-size:13px; color:#888; margin:8px 0 4px;">Return yards (optional)</p><input type="text" id="pp_retyds" style="width:80px;"></div>';
    const tdBlock = '<div style="margin-top:10px;">' +
      '<input type="checkbox" id="pp_td" style="display:none;">' +
      '<button type="button" id="pp_td_toggle" style="width:100%; padding:12px; border-radius:8px; border:2px solid #ccc; background:#fff; color:#555; font-size:15px; font-weight:700; cursor:pointer;">Touchdown</button>' +
      '</div>';
    const blockedToggleHtml = (id, label) => '<input type="checkbox" id="' + id + '" style="display:none;">' +
      '<button type="button" id="' + id + '_toggle" data-cb="' + id + '" data-label="' + (label || 'Blocked') + '" class="pp-blocked-toggle" style="padding:8px 12px; border-radius:6px; border:2px solid #ccc; background:#fff; color:#555; font-size:14px; font-weight:600; cursor:pointer;">' + (label || 'Blocked') + '</button>';

    let html = '';
    if (type === 'rush') html = offBlock('carrier','Ball carrier') +
        '<div style="display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap;"><div>' + yardsBlock() + '</div>' +
        '<div id="pp_rush_fumbled_wrap" style="margin-bottom:6px;">' + blockedToggleHtml('pp_rush_fumbled', 'Fumbled') + '</div>' +
        '<div id="pp_rush_safety_wrap" style="margin-bottom:6px;">' + blockedToggleHtml('pp_rush_safety', 'Safety') + '</div></div>' +
        defBlock('Tackled by (optional)') +
        '<div id="pp_rush_td_wrap">' + tdBlock + '</div>' +
        '<div id="pp_rush_fumble_fields" style="display:none; margin-top:10px; padding-top:10px; border-top:1px solid #ddd;">' +
          '<label class="inline" style="display:block;"><input type="radio" name="pp_rush_fumrec" value="own"> Recovered by own team</label>' +
          '<label class="inline" style="display:block;"><input type="radio" name="pp_rush_fumrec" value="opp" checked> Recovered by opponent</label>' +
          '<div id="pp_rush_fum_own" style="display:none; margin-top:10px;"><input type="checkbox" id="pp_rushfum_safety" style="display:none;">' +
          '<button type="button" id="pp_rushfum_safety_toggle" style="width:100%; padding:12px; border-radius:8px; border:2px solid #ccc; background:#fff; color:#555; font-size:15px; font-weight:700; cursor:pointer;">In the end zone — safety</button></div>' +
          '<div id="pp_rush_fum_opp" style="margin-top:8px;">' + defBlock('Recovered by', '_rushfum') + yardsBlock('Return yards (optional)', 'pp_rushfum_retyds') +
            '<div style="margin-top:10px;"><input type="checkbox" id="pp_rushfum_td" style="display:none;">' +
            '<button type="button" id="pp_rushfum_td_toggle" style="width:100%; padding:12px; border-radius:8px; border:2px solid #ccc; background:#fff; color:#555; font-size:15px; font-weight:700; cursor:pointer;">Returned for touchdown (defense)</button></div>' +
          '</div>' +
        '</div>';
    else if (type === 'pass') html =
        '<div style="margin-bottom:12px; display:flex; gap:8px; flex-wrap:wrap;">' +
        '<button type="button" class="pp-outcome-switch" onclick="renderPlayPanel(\'sack\')" style="padding:8px 12px; border-radius:6px; border:2px solid #ccc; background:#fff; color:#555; font-size:14px; font-weight:600; cursor:pointer;">Sacked</button>' +
        '<button type="button" class="pp-outcome-switch" onclick="renderPlayPanel(\'int\')" style="padding:8px 12px; border-radius:6px; border:2px solid #ccc; background:#fff; color:#555; font-size:14px; font-weight:600; cursor:pointer;">Intercepted</button>' +
        '</div>' +
        offBlock('passer','Passer') + offBlock('receiver','Receiver') +
        '<div style="display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap;"><div id="pp_yards_wrap">' + yardsBlock() + '</div>' +
        '<div style="margin-bottom:6px;"><input type="checkbox" id="pp_incomplete" style="display:none;">' +
        '<button type="button" id="pp_incomplete_toggle" style="padding:8px 12px; border-radius:6px; border:2px solid #ccc; background:#fff; color:#555; font-size:14px; font-weight:600; cursor:pointer;">Incomplete</button></div>' +
        '<div id="pp_pass_fumbled_wrap" style="margin-bottom:6px;">' + blockedToggleHtml('pp_pass_fumbled', 'Fumbled') + '</div>' +

  function buildAndReview(type, sel){
    const yards = (id) => (document.getElementById(id) ? document.getElementById(id).value.trim() : '');
    const td = document.getElementById('pp_td') && document.getElementById('pp_td').checked;
    let code = '', roles = null;
    const state = computeState();
    const off = state.possession, def = otherTeam(state.possession);

    if (type === 'rush'){
      if (!sel.carrier) return;
      const yds = yards('pp_yards') || '0';
      const fumbled = document.getElementById('pp_rush_fumbled').checked;
      if (fumbled){
        // The gain genuinely happened before the fumble -- save it as
        // its own play first, silently, then let the rest of this
        // branch build a Fumble-type play for the turnover itself.
        const rushParsed = parseInput(sel.carrier + 'r ' + yds, computeState());
        pushAndPersist({ id: nextId++, text: rushParsed.text, effect: rushParsed.effect, team: off, quarter: computeState().quarter,
          roles: { carrier: { team: off, num: sel.carrier, yards: parseInt(yds)||0 }, playType: 'rush' } });
        const rec = document.querySelector('input[name=pp_rush_fumrec]:checked').value;
        if (rec === 'own'){
          const isRushFumSafety = document.getElementById('pp_rushfum_safety').checked;
          code = sel.carrier + 'f' + (isRushFumSafety ? ' sf' : '');
          roles = { carrier: { team: off, num: sel.carrier }, playType: 'fumble' };
        } else {
          const fumCredit = sel.credit;
          // Optional -- see the standalone fumble branch.
          const retyds = yards('pp_rushfum_retyds');
          const returnTd = document.getElementById('pp_rushfum_td').checked;
          code = sel.carrier + 'f ' + (fumCredit || '?') + (retyds ? ' ' + retyds : '') + (returnTd ? ' td' : '');
          roles = { carrier: { team: off, num: sel.carrier }, playType: 'fumble', lost: true };
          if (fumCredit) roles.defense = { team: def, num: fumCredit };
        }
      } else {
        const isRushSafety = document.getElementById('pp_rush_safety').checked;
        code = sel.carrier + 'r ' + yds + (sel.credit ? ' ' + sel.credit : '') + (isRushSafety ? ' sf' : (td ? ' td' : ''));
        roles = { carrier: { team: off, num: sel.carrier, yards: parseInt(yds)||0 } };
        if (sel.credit) roles.defense = { team: def, num: sel.credit };
      }
    } else if (type === 'pass'){
      if (!sel.passer) return;
      // Receiver optional, same reasoning as the kick returner. '?' keeps
      // the completion and its yardage on the books; no receiver role is
      // created, so nobody gets phantom receiving stats.
      const recTok = sel.receiver || '?';
      const isIncomplete = document.getElementById('pp_incomplete') && document.getElementById('pp_incomplete').checked;
      if (isIncomplete){
        code = sel.passer + 'i ' + recTok;
        roles = { passer: { team: off, num: sel.passer, yards: 0 }, playType: 'incomplete' };
        if (sel.receiver) roles.receiver = { team: off, num: sel.receiver, yards: 0 };
      } else {
        const yds = yards('pp_yards') || '0';
        const fumbled = document.getElementById('pp_pass_fumbled').checked;
        if (fumbled){
          // The catch and yardage genuinely happened before the fumble --
          // save the completion as its own play first, silently, then
          // let the rest of this branch build a Fumble-type play for
          // the receiver, same as the Rush panel's equivalent.
          const passParsed = parseInput(sel.passer + 'p ' + recTok + ' ' + yds, computeState());
          pushAndPersist({ id: nextId++, text: passParsed.text, effect: passParsed.effect, team: off, quarter: computeState().quarter,
            roles: Object.assign({ passer: { team: off, num: sel.passer, yards: parseInt(yds)||0 }, playType: 'pass' },
              sel.receiver ? { receiver: { team: off, num: sel.receiver, yards: parseInt(yds)||0 } } : {}) });
          const rec = document.querySelector('input[name=pp_pass_fumrec]:checked').value;
          if (rec === 'own'){
            const isPassFumSafety = document.getElementById('pp_passfum_safety').checked;
            code = sel.receiver + 'f' + (isPassFumSafety ? ' sf' : '');
            roles = { carrier: { team: off, num: sel.receiver }, playType: 'fumble' };
          } else {
            const fumCredit = sel.credit;
            // Optional -- see the standalone fumble branch.
            const retyds = yards('pp_passfum_retyds');
            const returnTd = document.getElementById('pp_passfum_td').checked;
            code = sel.receiver + 'f ' + (fumCredit || '?') + (retyds ? ' ' + retyds : '') + (returnTd ? ' td' : '');
            roles = { carrier: { team: off, num: sel.receiver }, playType: 'fumble', lost: true };
            if (fumCredit) roles.defense = { team: def, num: fumCredit };
          }
        } else {
          const isPassSafety = document.getElementById('pp_pass_safety').checked;
          code = sel.passer + 'p ' + recTok + ' ' + yds + (sel.credit ? ' ' + sel.credit : '') + (isPassSafety ? ' sf' : (td ? ' td' : ''));
          roles = { passer: { team: off, num: sel.passer, yards: parseInt(yds)||0 } };
          if (sel.receiver) roles.receiver = { team: off, num: sel.receiver, yards: parseInt(yds)||0 };
          if (sel.credit) roles.defense = { team: def, num: sel.credit };
        }
      }
    } else if (type === 'sack'){
      if (!sel.passer) return;
      const yds = yards('pp_yards') || '0';
      const fumbled = document.getElementById('pp_sack_fumbled').checked;
      if (fumbled){
        // The sack and its yardage genuinely happened before the fumble
        // -- save it as its own play first, silently, then build a
        // Fumble-type play for the turnover itself.
        const sackParsed = parseInput(sel.passer + 's ' + yds, computeState());
        pushAndPersist({ id: nextId++, text: sackParsed.text, effect: sackParsed.effect, team: off, quarter: computeState().quarter,
          roles: { passer: { team: off, num: sel.passer, yards: parseInt(yds)||0 }, playType: 'sack' } });
        const rec = document.querySelector('input[name=pp_sack_fumrec]:checked').value;
        if (rec === 'own'){
          const isSackFumSafety = document.getElementById('pp_sackfum_safety').checked;
          code = sel.passer + 'f' + (isSackFumSafety ? ' sf' : '');
          roles = { carrier: { team: off, num: sel.passer }, playType: 'fumble' };
        } else {
          const fumCredit = sel.credit;
          // Optional -- see the standalone fumble branch.
          const retyds = yards('pp_sackfum_retyds');
          const returnTd = document.getElementById('pp_sackfum_td').checked;
          code = sel.passer + 'f ' + (fumCredit || '?') + (retyds ? ' ' + retyds : '') + (returnTd ? ' td' : '');
          roles = { carrier: { team: off, num: sel.passer }, playType: 'fumble', lost: true };
          if (fumCredit) roles.defense = { team: def, num: fumCredit };
        }

        const isSackSafety = document.getElementById('pp_sack_safety').checked;
        code = sel.passer + 's ' + yds + (sel.credit ? ' ' + sel.credit : '') + (isSackSafety ? ' sf' : '');
        roles = { passer: { team: off, num: sel.passer, yards: parseInt(yds)||0 } };

    } else if (type === 'int'){

      code = sel.passer + 'x ' + (sel.credit || '?') + (yds ? ' ' + yds : '') + (td ? ' td' : '');

      if (sel.credit) roles.defense = { team: def, num: sel.credit };
    } else if (type === 'fumble'){
      if (!sel.carrier) return;
      const rec = document.querySelector('input[name=pp_fumrec]:checked').value;
      if (rec === 'own'){
        const isFumSafety = document.getElementById('pp_fum_safety').checked;
        code = sel.carrier + 'f' + (isFumSafety ? ' sf' : '');
        roles = { carrier: { team: off, num: sel.carrier } };
      }
      else {
        // Optional, same reasoning as the kick/punt returner: a pile
        // rarely gives up a jersey number. '?' records "turned over,
        // recovered by the defense, player unknown" so the turnover and
        // any return yardage still count. roles.lost marks it as a
        // turnover without needing a named recoverer.
        const yds = yards('pp_yards');
        code = sel.carrier + 'f ' + (sel.credit || '?') + (yds ? ' ' + yds : '') + (td ? ' td' : '');
        roles = { carrier: { team: off, num: sel.carrier }, playType: 'fumble', lost: true };
        if (sel.credit) roles.defense = { team: def, num: sel.credit };
      }
    } else if (type === 'safety'){
      code = 'sf' + (sel.credit ? ' ' + sel.credit : '');
      roles = sel.credit ? { defense: { team: def, num: sel.credit }, playType: 'safety' } : null;
    } else if (type === 'kickoff'){
      if (!sel.kicker) return;
      const yds = yards('pp_yards') || '0';
      const isTouchback = document.getElementById('pp_ko_touchback').checked;
      const koMuffed = document.getElementById('pp_ko_muffed') && document.getElementById('pp_ko_muffed').checked;
      if (isTouchback){
        code = sel.kicker + 'ko ' + yds + ' tb';
        roles = { kicker: { team: off, num: sel.kicker, yards: parseInt(yds)||0, touchback: true } };
      } else if (koMuffed){
        const recTeamTok = document.querySelector('input[name=pp_ko_muffrec]:checked').value;
        const recRaw = (document.getElementById('pp_ko_muff_rec') || {}).value;
        const recNum = (recRaw || '').trim() || '?';
        const muffRet = yards('pp_ko_muff_retyds') || '0';
        code = sel.kicker + 'km ' + yds + ' ' + recTeamTok + ' ' + recNum + ' ' + muffRet + (td ? ' td' : '');

        if (recNum !== '?'){
          // Recovering a muff is neither a defensive nor a receiving
          // stat, so it is recorded for the log only.
          roles.recovery = { team: recTeamTok === 'k' ? off : def, num: recNum };
        }
      } else {
        const retyds = yards('pp_retyds');
        // The returner is optional: a coach often can't read the number
        // on a return, and forcing one meant the return YARDAGE they did
        // see was silently dropped along with it. '?' records "returned,
        // returner unknown" so the yards still count; no roles.defense is
        // created, so no phantom player appears in stats or pickers.
        const retTok = sel.credit || ((retyds || td) ? '?' : null);
        code = sel.kicker + 'ko ' + yds + (retTok ? ' ' + retTok + (retyds ? ' ' + retyds : ' 0') : '') + (td ? ' td' : '');
        roles = { kicker: { team: off, num: sel.kicker, yards: parseInt(yds)||0 } };
        if (sel.credit) roles.defense = { team: def, num: sel.credit };
