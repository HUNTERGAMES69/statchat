<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StatChat">
<title>StatChat — Game Entry</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background:#f4f3ef; margin:0; padding:14px; }
  .wrap { max-width:760px; margin:0 auto; }
  .card { background:#fff; border-radius:12px; padding:18px; margin-bottom:16px; box-shadow:0 2px 12px rgba(0,0,0,0.08); }
  h1 { font-size:20px; margin:0; }
  h2 { font-size:16px; margin:0 0 10px; color:#444; }
  p.sub { color:#888; margin:0 0 14px; font-size:13px; }
  label { display:block; font-size:13px; margin-bottom:4px; color:#555; }
  input, select { padding:8px; border:1px solid #ddd; border-radius:6px; font-size:14px; box-sizing:border-box; width:100%; }
  button { padding:8px 12px; border-radius:6px; border:none; background:#1a1a2e; color:#fff; font-size:13px; font-weight:600; cursor:pointer; }
  button.primary { background:#1a7a4c; }
  button.secondary { background:#fff; color:#444; border:1px solid #ccc; }
  button.danger { background:#fff; color:#a32d2d; border:1px solid #a32d2d; }
  button:disabled { opacity:0.5; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .hidden { display:none; }
  .msg { font-size:14px; padding:10px; border-radius:6px; margin-bottom:14px; }
  .msg.error { background:#fdecea; color:#a32d2d; }
  .msg.success { background:#e8f5e9; color:#1a7a4c; }
  .banner { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; border-radius:10px; padding:12px 16px; margin-bottom:6px; transition:background 0.2s; position:sticky; top:8px; z-index:50; box-shadow:0 2px 8px rgba(0,0,0,0.15); }
  .banner .score { font-size:20px; font-weight:700; }
  .banner .downdist { font-size:15px; font-weight:500; }
  .hint { font-size:12px; color:#888; margin:6px 0; }
  #playPanel, #utilPanel { background:#f7f6f2; border-radius:8px; padding:12px 14px; margin-top:10px; }
  #confirmCard { background:#f7f6f2; border-radius:8px; padding:12px 14px; margin-top:8px; }
  .logline { font-size:14px; padding:6px 0; border-bottom:1px solid #f2f2f2; }
  .badge { font-size:10px; padding:2px 6px; border-radius:8px; margin-left:6px; font-weight:600; }
  .badge.unresolved { background:#fff3cd; color:#7a6a2a; }
  .conflict-block { background:#fff3cd; border-radius:8px; padding:10px; margin-top:8px; }
  @media (min-width: 640px) {
    body { padding:24px; }
    .card { padding:24px; }
    button { padding:9px 16px; font-size:14px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="loading" class="card"><h1>Loading…</h1></div>

  <div id="errorView" class="hidden card">
    <h1>Couldn't open this game</h1>
    <p class="sub" id="errorMsg"></p>
    <a href="dashboard.html" style="text-decoration:none; padding:9px 16px; border-radius:6px; background:#1a1a2e; color:#fff; font-weight:600;">← Dashboard</a>
  </div>

  <div id="mainView" class="hidden">
    <div class="banner" id="banner">
      <img id="bannerLogoA" style="display:none; height:28px; width:28px; object-fit:contain; border-radius:4px;">
      <span class="score" id="scoreText"></span>
      <img id="bannerLogoB" style="display:none; height:28px; width:28px; object-fit:contain; border-radius:4px;">
      <span class="downdist" id="downText"></span>
      <span class="downdist" id="quarterText"></span>
    </div>
    <div class="hint" id="topText" style="text-align:right;"></div>

    <div id="clockPromptCard" style="display:none; background:#fff3cd; border-radius:8px; padding:12px 14px; margin-bottom:10px;">
      <div id="clockPromptLabel" style="font-size:15px; font-weight:600; margin-bottom:8px;"></div>
      <input type="text" id="clockPromptInput" placeholder="M:SS" style="width:100px; display:inline-block;">
      <button class="primary" id="clockPromptSave">Save clock</button>
      <button class="secondary" id="clockPromptSkip">Skip</button>
    </div>

    <div id="guidedPanel" class="card" style="display:none;">
      <h2>Kickoff</h2>
      <div id="guidedContent"></div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px;">
        <h1 id="gameTitle">Game</h1>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <a id="launchViewLink" href="#" target="_blank" style="text-decoration:none; padding:8px 14px; border-radius:6px; border:1px solid #1565c0; color:#1565c0; font-size:13px; font-weight:600; white-space:nowrap;">Launch view ↗</a>
          <a href="dashboard.html" style="text-decoration:none; padding:8px 14px; border-radius:6px; border:1px solid #ccc; color:#444; font-size:13px; font-weight:600; white-space:nowrap;">← Dashboard</a>
        </div>
      </div>
      <div id="gameMsg"></div>
      <input type="text" id="code" style="display:none;">

      <div class="row" style="margin-bottom:8px;">
        <button class="primary" id="startGameBtn">Start game</button>
        <button class="primary" id="endFirstHalfBtn" style="display:none;">End 1st half</button>
        <button class="primary" id="startHalfBtn" style="display:none;">Start 2nd half</button>
        <button class="primary" id="endGameBtn" style="display:none;">End game</button>
        <button id="otUtilBtn" style="display:none;">Start overtime</button>
      </div>

      <p class="hint" style="margin:10px 0 6px;">Scrimmage</p>
      <div class="row">
        <button class="ptypeBtn" data-type="rush">Rush</button>
        <button class="ptypeBtn" data-type="pass">Pass</button>
        <button class="ptypeBtn" data-type="sack">Sack</button>
        <button class="ptypeBtn" data-type="int">Interception</button>
        <button class="ptypeBtn" data-type="fumble">Fumble</button>
      </div>
      <p class="hint" style="margin:10px 0 6px;">Special teams</p>
      <div class="row">
        <button class="ptypeBtn" data-type="kickoff">Kickoff</button>
        <button class="ptypeBtn" data-type="punt">Punt</button>
        <button class="ptypeBtn" data-type="fg">Field goal</button>
        <button class="ptypeBtn" data-type="pat">PAT</button>
      </div>
      <p class="hint" style="margin:10px 0 6px;">Utilities</p>
      <div class="row">
        <button id="penUtilBtn">Penalty</button>
        <button id="driveUtilBtn">New drive / correct down</button>
        <button id="quarterUtilBtn">Quarter marker</button>
        <button class="secondary" id="undoBtn">Undo last</button>
        <button class="secondary" id="manualBtn">Manual entry</button>
        <button class="secondary" id="flipBtn">Flip possession</button>
      </div>

      <div id="playPanel" style="display:none;"></div>

      <div id="manualPanel" style="display:none; background:#f7f6f2; border-radius:8px; padding:12px 14px; margin-top:10px;">
        <p class="hint" style="margin:0 0 6px;">Manual entry (flags as unresolved for later review)</p>
        <label>Insert after<select id="insertAfter" style="width:100%; margin-bottom:8px;"></select></label>
        <input type="text" id="manualText" placeholder="Describe the play" style="width:100%; margin-bottom:8px;">
        <div class="row"><button class="primary" id="saveManual">Save</button><button class="secondary" id="cancelManual">Cancel</button></div>
      </div>

      <div id="confirmCard" style="display:none;">
        <div style="font-size:14px; color:#888; margin-bottom:4px;">Parsed as</div>
        <div id="parsedText" style="font-size:16px; font-weight:600; margin-bottom:10px;"></div>
        <label id="flipRow" style="display:none;"><input type="checkbox" id="flipCheck" checked> <span id="flipLabel"></span></label>
        <div id="confirmClockRow" style="display:none; margin-bottom:8px;">
          <span id="confirmClockLabel">Clock</span>&nbsp;<input type="text" id="confirmClockInput" placeholder="M:SS" style="width:90px; display:inline-block;">
        </div>
        <div class="row" style="margin-top:8px;">
          <button class="primary" id="saveBtn">Save</button>

    </div>

    <div class="card">
      <h2>Current drive</h2>
      <div id="driveLogScroll"></div>
    </div>

    <div class="card">
      <h2>Previous drive</h2>
      <div id="prevDriveLogScroll"></div>
    </div>

    <div class="card">
      <h2>All plays</h2>
      <div id="logScroll"></div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://pboushzlcyfkssojpuut.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_VGnUYurlkoH1yi67jHO6iQ_C8Q0EM2d';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  function showView(name){
    ['loading','errorView','mainView'].forEach(v => document.getElementById(v).classList.toggle('hidden', v !== name));
  }
  function showMsg(elId, text, type){
    document.getElementById(elId).innerHTML = '<div class="msg ' + type + '">' + text + '</div>';
  }

  let currentGameId = null;
  let nextSequenceNumber = 1;
  let TEAMS = { teamA: {}, teamB: {} };
  let plays = [], nextId = 1, startingPossession = 'teamA', quarterLengthSec = 720, gameLabel = '';
  let pending = null;
  let guided = { active: false, quarter: null, kickingTeam: null, receivingTeam: null, step: null, targetPhase: null };
  let gamePhase = 'notStarted';
  let clockPrompt = null, clockPromptCallback = null;
  let currentGameStatus = 'setup';

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'INITIAL_SESSION'){
      if (session){ init(); } else { window.location.href = '/'; }
    } else if (event === 'SIGNED_OUT'){
      window.location.href = '/';
    }
  });

  async function init(){
    const params = new URLSearchParams(window.location.search);
    currentGameId = params.get('id');
    if (!currentGameId){
      showView('errorView');
      showMsg('errorMsg', 'No game specified.', 'error');
      return;
    }

    const { data: gameRows, error: gameError } = await supabaseClient
      .from('games').select('*').eq('id', currentGameId).limit(1);
    if (gameError || !gameRows || gameRows.length === 0){
      showView('errorView');
      document.getElementById('errorMsg').textContent = gameError ? gameError.message : 'That game could not be found.';
      return;
    }
    const game = gameRows[0];
    gameLabel = game.designator;
    quarterLengthSec = game.quarter_length_seconds || 720;
    currentGameStatus = game.status;

    const { data: rosterRows, error: rosterError } = await supabaseClient
      .from('game_rosters').select('*').eq('game_id', currentGameId);
    if (rosterError){
      showView('errorView');
      document.getElementById('errorMsg').textContent = rosterError.message;
      return;
    }

    const { data: teamRows } = await supabaseClient
      .from('teams').select('primary_color, secondary_color, logo_url').eq('is_our_team', true).limit(1);
    const ourBranding = (teamRows && teamRows[0]) || {};

    buildTeams(game, rosterRows || [], ourBranding);
    document.getElementById('gameTitle').textContent = gameLabel + ' — ' + TEAMS.teamA.name + ' vs ' + TEAMS.teamB.name;
    document.getElementById('launchViewLink').href = 'view.html?id=' + currentGameId;

    const { data: existingPlays } = await supabaseClient
      .from('plays').select('*').eq('game_id', currentGameId).order('sequence_number', { ascending: true });
    plays = (existingPlays || []).map(p => ({
      id: nextId++, text: p.text, effect: p.effect || {}, team: p.team_side, quarter: p.quarter,
      roles: p.roles, unresolved: p.unresolved, isDivider: p.is_divider, isOverride: p.is_override,
      _seq: p.sequence_number
    }));
    nextSequenceNumber = plays.length ? Math.max(...plays.map(p => p._seq || 0)) + 1 : 1;

    // Resume exactly where we left off -- read the persisted phase and
    // any in-progress guided step directly, rather than guessing from
    // play history (which can't tell "kickoff in progress" from "kickoff
    // never started", and would silently drop an interrupted kickoff).
    gamePhase = game.game_phase || (plays.length === 0 ? 'notStarted' : 'firstHalf');
    if (currentGameStatus === 'final') gamePhase = 'ended';
    guided = (game.guided_state && game.guided_state.active) ? game.guided_state : { active: false, quarter: null, kickingTeam: null, receivingTeam: null, step: null, targetPhase: null };
    showView('mainView');
    renderAll();
    renderGuided();
    updatePhaseUI();
  }

  function buildTeams(game, rosterRows, ourBranding){
    const ourName = game.our_team_is_home ? game.home_team_name : game.away_team_name;
    const oppName = game.our_team_is_home ? game.away_team_name : game.home_team_name;
    TEAMS.teamA = { name: ourName, bg: ourBranding.primary_color || '#1a1a2e', text: ourBranding.secondary_color || '#ffffff',
      rosterOffense:{}, rosterDefense:{}, rosterSpecialTeams:{}, posOffense:{}, logo: ourBranding.logo_url || null };
    TEAMS.teamB = { name: oppName, bg: game.opponent_primary_color || '#8B0000', text: game.opponent_secondary_color || '#ffffff',
      rosterOffense:{}, rosterDefense:{}, rosterSpecialTeams:{}, posOffense:{}, logo: game.opponent_logo_url || null };
    rosterRows.forEach(r => {
      const team = TEAMS[r.team_side];
      if (!team) return;
      if (r.unit === 'offense'){ team.rosterOffense[r.jersey_number] = r.player_name; team.posOffense[r.jersey_number] = r.position; }
      else if (r.unit === 'defense'){ team.rosterDefense[r.jersey_number] = r.player_name; }
      else if (r.unit === 'special'){ team.rosterSpecialTeams[r.jersey_number] = r.player_name; }
    });
  }


  // --- Proven engine core, ported verbatim from the tested entry app ---
function otherTeam(t){ return t === 'teamA' ? 'teamB' : 'teamA'; }
function nameInOffense(teamKey, num){
  const n = TEAMS[teamKey].rosterOffense[num] || (TEAMS[teamKey].rosterSpecialTeams && TEAMS[teamKey].rosterSpecialTeams[num]);
  return (n || ('#' + num)) + ' (' + TEAMS[teamKey].name + ')';
}
function nameInDefense(teamKey, num){
  const n = TEAMS[teamKey].rosterDefense[num];
  return (n || ('#' + num)) + ' (' + TEAMS[teamKey].name + ')';
}
function nameInSpecialTeams(teamKey, num){
  const n = (TEAMS[teamKey].rosterSpecialTeams && TEAMS[teamKey].rosterSpecialTeams[num]) || TEAMS[teamKey].rosterOffense[num];
  return (n || ('#' + num)) + ' (' + TEAMS[teamKey].name + ')';
}
function ordinal(n){ return n===1?'1st':n===2?'2nd':n===3?'3rd':n===4?'4th':(n+'th'); }
function clockToAbsSeconds(quarter, clockStr){
  const m = clockStr.match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return null;
  const remaining = parseInt(m[1]) * 60 + parseInt(m[2]);
  return (quarter - 1) * quarterLengthSec + (quarterLengthSec - remaining);
}
function formatDuration(sec){
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}
function markerLabel(fp){
  if (fp === null || fp === undefined) return '';
  return fp <= 50 ? ('own ' + fp) : ('opp ' + (100 - fp));
}

function readFileAsDataURL(file){
  return new Promise(resolve => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.readAsDataURL(file);
  });
}

const OFFENSE_POS = new Set(['QB','RB','FB','HB','WR','TE','OL','OT','OG','C']);
const DEFENSE_POS = new Set(['DB','CB','S','FS','SS','LB','OLB','ILB','MLB','WLB','DE','DT','NG','NT','EDGE']);
const SPECIAL_POS = new Set(['K','P','LS','H','KR','PR']);
function posToUnit(pos){
  if (!pos) return null;
  const first = String(pos).toUpperCase().split(/[\/,\s]+/)[0];
  if (SPECIAL_POS.has(first)) return 'st';
  if (OFFENSE_POS.has(first)) return 'o';
  if (DEFENSE_POS.has(first)) return 'd';
  return null;
}
function extractNameTag(rawName){
  const m = String(rawName).match(/\(\s*(O|D|ST)\s*\)\s*$/i);
  if (!m) return { cleanName: String(rawName).trim(), explicitUnit: null };
  const tag = m[1].toUpperCase();
  const cleanName = String(rawName).slice(0, m.index).trim();
  return { cleanName, explicitUnit: tag.toLowerCase() };
}
function computeState(){
  const state = {
    possession: startingPossession,
    quarter: 1,
    scores: { teamA: 0, teamB: 0 },
    possessionTime: { teamA: 0, teamB: 0 },
    down: null, distance: null, fieldPos: null, startSpot: null, statYards: 0,
    penalties: { teamA: { count: 0, yds: 0 }, teamB: { count: 0, yds: 0 } }
  };
  const pendingClockStart = { teamA: null, teamB: null };
  for (const p of plays){
    const e = p.effect;
    if (!e) continue;
    if (e.isReset){
      state.down = e.down; state.distance = e.distance; state.fieldPos = e.fieldPos;
      state.startSpot = e.fieldPos; state.statYards = 0;
    }
    if (e.isStat){
      if (state.fieldPos !== null){
        state.fieldPos += e.fieldDelta;
        state.fieldPos = Math.max(0, Math.min(100, state.fieldPos));
      }
      state.statYards += e.statYds;
      if (e.td){
        state.down = null; state.distance = null; state.fieldPos = null; state.startSpot = null; state.statYards = 0;
      } else {
        if (e.converts){
          state.down = 1;
          state.distance = state.fieldPos !== null ? Math.max(1, Math.min(10, 100 - state.fieldPos)) : 10;
        }
        else if (e.turnoverOnDowns && e.flipApplied){
          state.possession = otherTeam(state.possession);
          state.down = null; state.distance = null; state.fieldPos = null; state.startSpot = null; state.statYards = 0;
        } else if (!e.turnoverOnDowns){
          state.down = (state.down || 1) + 1;
          state.distance = Math.max((state.distance || 10) - e.statYds, 1);
        }
      }
    }
    if (e.endsDrive && !e.isStat){
      state.down = null; state.distance = null; state.fieldPos = null; state.startSpot = null; state.statYards = 0;
    }
    if (e.penaltyTeam){
      state.penalties[e.penaltyTeam].count += 1;
      state.penalties[e.penaltyTeam].yds += e.penaltyYds;
      if (state.fieldPos !== null){
        state.fieldPos += e.fieldDelta;
        state.fieldPos = Math.max(0, Math.min(100, state.fieldPos));
      }
    }
    if (e.score){ state.scores[e.score.team] += e.score.points; }
    if (e.scoreAdjust){ state.scores[e.scoreAdjust.team] += e.scoreAdjust.pts; }
    if (e.flip && e.flipApplied && !e.isStat){
      state.possession = e.flipTo;
      state.down = null; state.distance = null; state.fieldPos = null; state.startSpot = null; state.statYards = 0;
    }
    if (e.forcePossession){ state.possession = e.forcePossession; }
    if (e.setQuarter){ state.quarter = e.setQuarter; }
    if (e.clockEvent){
      const ce = e.clockEvent;
      if (ce.type === 'start'){ pendingClockStart[ce.team] = ce.absSec; }
      if (ce.type === 'end' && pendingClockStart[ce.team] !== null){
        state.possessionTime[ce.team] += Math.max(0, ce.absSec - pendingClockStart[ce.team]);
        pendingClockStart[ce.team] = null;
      }
      if (ce.type === 'transition'){
        if (pendingClockStart[ce.outgoingTeam] !== null){
          state.possessionTime[ce.outgoingTeam] += Math.max(0, ce.absSec - pendingClockStart[ce.outgoingTeam]);
          pendingClockStart[ce.outgoingTeam] = null;
        }
        pendingClockStart[ce.incomingTeam] = ce.absSec;
      }
    }
    if (e.setScores){ state.scores.teamA = e.setScores.teamA; state.scores.teamB = e.setScores.teamB; }
  }
  return state;
}

function parseInput(raw, state){
  const trimmed = raw.trim();
  if (!trimmed) return null;
  const off = state.possession, def = otherTeam(off);

  const quarterMatch = trimmed.match(/^q([1-4])$/i);
  if (quarterMatch){
    const q = parseInt(quarterMatch[1]);
    return { text: 'Quarter marker — start of Q' + q, effect: { setQuarter: q }, flipEligible: false, quarter: q };
  }

  if (/^note:/i.test(trimmed)){
    return { text: 'NOTE — ' + trimmed.slice(5).trim(), effect: {}, unresolved: true, flipEligible: false, quarter: state.quarter };
  }
  const scoreAdjMatch = trimmed.match(/^score\s+(teamA|teamB)\s+([+-]\d+)$/i);
  if (scoreAdjMatch){
    const team = scoreAdjMatch[1] === 'teamA' || scoreAdjMatch[1].toLowerCase() === 'teama' ? 'teamA' : 'teamB';
    const pts = parseInt(scoreAdjMatch[2]);
    return { text: 'Manual score adjust — ' + TEAMS[team].name + ' ' + (pts > 0 ? '+' : '') + pts, effect: { scoreAdjust: { team, pts } }, flipEligible: false, quarter: state.quarter };
  }

  const tokens = trimmed.split(/\s+/).filter(Boolean);

  if (tokens.length === 3 && /^\d+$/.test(tokens[0]) && /^\d+$/.test(tokens[1]) && /^-?\d+$/.test(tokens[2])){
    const d = parseInt(tokens[0]), togo = parseInt(tokens[1]), marker = parseInt(tokens[2]);
    const fp = marker < 0 ? Math.abs(marker) : (100 - marker);
    return {
      text: 'New drive / down correction — ' + ordinal(d) + ' & ' + togo + ' at the ' + markerLabel(fp) + ' (' + TEAMS[off].name + ')',
      effect: { isReset: true, down: d, distance: togo, fieldPos: fp },
      flipEligible: false, team: off, quarter: state.quarter
    };
  }

  const penMatch = tokens[0].match(/^(po|pd)$/i);
  if (penMatch){
    const which = penMatch[1].toLowerCase();
    const yds = parseInt(tokens[1]) || 0;
    const team = which === 'po' ? off : def;
    const fieldDelta = which === 'po' ? -yds : yds;
    return {
      text: 'Penalty on ' + TEAMS[team].name + ' — ' + yds + ' yds',
      effect: { penaltyTeam: team, penaltyYds: yds, fieldDelta },
      flipEligible: false, team
    };
  }

  const m = tokens[0].match(/^(\d+)([a-z]+)$/i);
  if (!m) return null;
  const p1 = m[1], type = m[2].toLowerCase();
  let rest = tokens.slice(1);
  const td = rest[rest.length - 1] === 'td';
  if (td) rest.pop();
  const O = n => nameInOffense(off, n), D = n => nameInDefense(def, n), ST = n => nameInSpecialTeams(off, n);

  if (['r', 'p', 'i', 's'].includes(type)){
    let netYards = 0, tackler = null, text;
    if (type === 'r'){ netYards = parseInt(rest[0]) || 0; tackler = rest[1]; text = O(p1) + ' rush for ' + netYards; }
    else if (type === 'p'){ netYards = parseInt(rest[1]) || 0; tackler = rest[2]; text = O(p1) + ' pass to ' + O(rest[0]) + ' for ' + netYards; }
    else if (type === 'i'){ netYards = 0; text = O(p1) + ' incomplete, intended for ' + O(rest[0]); }
    else if (type === 's'){ netYards = parseInt(rest[0]) || 0; tackler = rest[1]; text = O(p1) + ' sacked for ' + netYards + ' yds'; }

    const curDown = state.down || 1, curDist = state.distance || 10;
    let score = null, converts = false, turnoverOnDowns = false;
    if (td){
      text += ' — TOUCHDOWN';
      score = { team: off, points: 6 };
    } else {
      if (netYards >= curDist){ converts = true; text += ' — 1st down'; }
      else if (curDown >= 4){ turnoverOnDowns = true; text += ' — turnover on downs'; }
      else { text += ' — ' + ordinal(curDown + 1) + ' & ' + Math.max(curDist - netYards, 1); }
    }
    if (tackler) text += ', tackled by ' + D(tackler);

    const effect = { isStat: true, statYds: netYards, fieldDelta: netYards, td, converts, turnoverOnDowns };
    if (td) effect.endsDrive = true;
    if (score) effect.score = score;
    return { text, effect, flipEligible: turnoverOnDowns, flipTo: def, team: off, quarter: state.quarter };
  }

  if (type === 'x'){
    const defn = rest[0], ret = rest[1];
    let t = O(p1) + ' intercepted by ' + D(defn);
    if (ret) t += ', returned ' + ret;
    let score = null;
    if (td){ t += ' — TOUCHDOWN'; score = { team: def, points: 6 }; }
    return { text: t, effect: score ? { score } : {}, flipEligible: true, flipTo: def, team: off, quarter: state.quarter };
  }
  if (type === 'f'){
    const rec = rest[0], retyds = rest[1];
    if (rec){
      let t = O(p1) + ' fumble — recovered by ' + D(rec) + ' (turnover)';
      if (retyds) t += ', returned ' + retyds;
      let score = null;
      if (td){ t += ' — TOUCHDOWN'; score = { team: def, points: 6 }; }
      return { text: t, effect: score ? { score } : {}, flipEligible: true, flipTo: def, team: off, quarter: state.quarter };
    }
    return { text: O(p1) + ' fumble — recovered by own team', effect: {}, flipEligible: false, team: off, quarter: state.quarter };
  }
  if (type === 'pt'){
    const yds = rest[0], ret = rest[1], retyds = rest[2];
    let t = ST(p1) + ' punts ' + yds;
    if (ret) t += ', returned by ' + D(ret) + (retyds ? ' for ' + retyds : '');
    let score = null;
    if (td){ t += ' — TOUCHDOWN'; score = { team: def, points: 6 }; }
    return { text: t, effect: score ? { score } : {}, flipEligible: true, flipTo: def, team: off, quarter: state.quarter };
  }
  if (type === 'pb'){
    const rec = rest[0], retyds = rest[1];
    let t = ST(p1) + ' punt BLOCKED';
    if (rec) t += ', recovered by ' + D(rec);
    if (retyds) t += ', returned ' + retyds;
    let score = null;
    if (td){ t += ' — TOUCHDOWN'; score = { team: def, points: 6 }; }
    return { text: t, effect: score ? { score } : {}, flipEligible: true, flipTo: def, team: off, quarter: state.quarter };
  }
  if (type === 'ko'){
    const yds = rest[0], ret = rest[1], retyds = rest[2];
    let t = ST(p1) + ' kicks off ' + yds;
    if (ret) t += ', returned by ' + D(ret) + (retyds ? ' for ' + retyds : '');
    let score = null;
    if (td){ t += ' — TOUCHDOWN'; score = { team: def, points: 6 }; }
    return { text: t, effect: score ? { score } : {}, flipEligible: true, flipTo: def, team: off, quarter: state.quarter };
  }
  if (type === 'fg'){
    if (rest[0] === 'b' || rest[0] === 'B'){
      const rec = rest[1], retyds = rest[2];
      let t = ST(p1) + ' field goal BLOCKED';
      if (rec) t += ', recovered by ' + D(rec);
      if (retyds) t += ', returned ' + retyds;
      let score = null;
      if (td){ t += ' — TOUCHDOWN'; score = { team: def, points: 6 }; }
      return { text: t, effect: score ? { score } : {}, flipEligible: true, flipTo: def, team: off, quarter: state.quarter };
    }
    const yds = rest[0], res = rest[1];
    const good = res === 'g';
    const score = good ? { team: off, points: 3 } : null;
    const effect = good ? { score, endsDrive: true } : {};
    return { text: ST(p1) + ' field goal, ' + yds + ' yds — ' + (good ? 'GOOD' : 'MISSED'), effect, flipEligible: !good, flipTo: def, team: off, quarter: state.quarter };
  }
  if (type === 'pa'){
    const res = rest[0];
    if (res === 'b' || res === 'B'){
      const rec = rest[1], retyds = rest[2];
      let t = ST(p1) + ' PAT BLOCKED';
      if (rec) t += ', recovered by ' + D(rec);
      if (retyds) t += ', returned ' + retyds;
      let score = null;
      if (td){ t += ' — returned for 2 (defense)'; score = { team: def, points: 2 }; }
      return { text: t, effect: score ? { score } : {}, flipEligible: false, team: off, quarter: state.quarter };
    }
    const good = res === 'g';
    const score = good ? { team: off, points: 1 } : null;
    return { text: ST(p1) + ' PAT — ' + (good ? 'GOOD' : 'MISSED'), effect: score ? { score } : {}, flipEligible: false, team: off, quarter: state.quarter };
  }
  return null;
}
const OFFENSE_ROLE_POS = {
  carrier: ['RB','QB','WR','FB','HB'],
  passer: ['QB'],
  receiver: ['WR','TE','RB'],
  kicker: ['K'],
  punter: ['P']
};
function computePlayerStats(){
  const stats = { teamA: { rushYds:{}, recYds:{}, passYds:{}, credits:{} }, teamB: { rushYds:{}, recYds:{}, passYds:{}, credits:{} } };
  const discovered = { teamA: [], teamB: [] };
  const discoveredOffense = { teamA: [], teamB: [] };
  function noteOffense(team, num){ if (discoveredOffense[team].indexOf(num) === -1) discoveredOffense[team].push(num); }
  plays.forEach(p => {
    if (!p.roles) return;
    const r = p.roles;
    if (r.carrier){ stats[r.carrier.team].rushYds[r.carrier.num] = (stats[r.carrier.team].rushYds[r.carrier.num]||0) + (r.carrier.yards||0); noteOffense(r.carrier.team, r.carrier.num); }
    if (r.passer){ stats[r.passer.team].passYds[r.passer.num] = (stats[r.passer.team].passYds[r.passer.num]||0) + (r.passer.yards||0); noteOffense(r.passer.team, r.passer.num); }
    if (r.receiver){ stats[r.receiver.team].recYds[r.receiver.num] = (stats[r.receiver.team].recYds[r.receiver.num]||0) + (r.receiver.yards||0); noteOffense(r.receiver.team, r.receiver.num); }
    if (r.defense){
      stats[r.defense.team].credits[r.defense.num] = (stats[r.defense.team].credits[r.defense.num]||0) + 1;
      if (discovered[r.defense.team].indexOf(r.defense.num) === -1) discovered[r.defense.team].push(r.defense.num);
    }
  });
  return { stats, discovered, discoveredOffense };
}
function offenseEligible(team, role){
  const posOffense = TEAMS[team].posOffense || {};
  const roster = TEAMS[team].rosterOffense || {};
  const ambiguous = TEAMS[team].ambiguousOffense || {};
  const allowedPos = OFFENSE_ROLE_POS[role];
  const { stats, discoveredOffense } = computePlayerStats();
  const statKey = role === 'carrier' ? 'rushYds' : role === 'passer' ? 'passYds' : role === 'receiver' ? 'recYds' : null;
  // The original app seeded this list from a small set of projected
  // starters. There's no equivalent concept in the database-backed
  // roster yet, so default to the full roster instead -- everyone who's
  // on offense is a visible candidate, filtered by position below.
  const seed = TEAMS[team].seedOrder && TEAMS[team].seedOrder.length ? TEAMS[team].seedOrder : Object.keys(roster);
  const visible = {};
  seed.forEach(n => { visible[n] = true; });
  (discoveredOffense[team] || []).forEach(n => { visible[n] = true; });
  const nums = Object.keys(visible).filter(num => roster[num] && (!allowedPos || allowedPos.indexOf((posOffense[num]||'').toUpperCase()) !== -1));
  const resolved = nums.slice().sort((a, b) => {
    const av = statKey ? (stats[team][statKey][a]||0) : 0, bv = statKey ? (stats[team][statKey][b]||0) : 0;
    if (av !== bv) return bv - av;
    const aSeed = seed.indexOf(a), bSeed = seed.indexOf(b);
    return (aSeed === -1 ? 999 : aSeed) - (bSeed === -1 ? 999 : bSeed);
  }).map(num => ({ num, name: roster[num] }));
  const ambiguousList = [];
  Object.keys(ambiguous).forEach(num => {
    ambiguous[num].forEach(name => ambiguousList.push({ num, name: name + ' ?', resolvedName: name }));
  });
  return ambiguousList.concat(resolved);
}
function defenseEligible(team){
  const { stats, discovered } = computePlayerStats();
  const ambiguous = TEAMS[team].ambiguousDefense || {};
  const ambiguousList = [];
  Object.keys(ambiguous).forEach(num => {
    ambiguous[num].forEach(name => ambiguousList.push({ num, name: name + ' ?', resolvedName: name }));
  });
  const discoveredList = discovered[team].slice().sort((a, b) => (stats[team].credits[b]||0) - (stats[team].credits[a]||0))
    .filter(num => !ambiguous[num])
    .map(num => ({ num, name: TEAMS[team].rosterDefense[num] || ('#'+num) }));
  return ambiguousList.concat(discoveredList);
}
function specialTeamsEligible(team){
  const roster = TEAMS[team].rosterSpecialTeams || {};
  const ambiguous = TEAMS[team].ambiguousSpecialTeams || {};
  const ambiguousList = [];
  Object.keys(ambiguous).forEach(num => {
    ambiguous[num].forEach(name => ambiguousList.push({ num, name: name + ' ?', resolvedName: name }));
  });
  const resolvedList = Object.keys(roster).sort().map(num => ({ num, name: roster[num] }));
  return ambiguousList.concat(resolvedList);
}
function pickerHtml(list, groupClass, statLabelFn){
  if (list.length === 0) return '<span style="font-size:13px; color:var(--text-muted, #999);">no one credited yet — type a number below</span>';
  return list.map(p => '<button type="button" class="' + groupClass + '" data-num="' + p.num + '"' + (p.resolvedName ? ' data-resolved="' + p.resolvedName.replace(/"/g,'') + '"' : '') + ' style="margin:0 6px 6px 0;">#' + p.num + ' ' + (p.name||'') + (statLabelFn ? ' <span style="color:#999; font-size:11px;">(' + statLabelFn(p.num) + ')</span>' : '') + '</button>').join('');
}
function wirePickerButtons(container, groupClass, manualInputId, onPick){

  // --- End engine core ---

  async function persistPlay(playObj){
    const seq = nextSequenceNumber++;
    playObj._seq = seq;
    const { error } = await supabaseClient.from('plays').insert({
      game_id: currentGameId,
      quarter: playObj.quarter || 1,
      sequence_number: seq,
      team_side: playObj.team || null,
      text: playObj.text,
      effect: playObj.effect || {},
      roles: playObj.roles || null,
      unresolved: !!playObj.unresolved,
      is_divider: !!playObj.isDivider,
      is_override: !!playObj.isOverride
    });
    if (error){
      showMsg('gameMsg', 'Saved on this screen, but failed to sync to the server: ' + error.message + '. (Offline-safe retry queue is planned but not built yet — for now, check your connection and re-enter this play if it never appears after reloading.)', 'error');
    }
  }

  function pushAndPersist(playObj){
    plays.push(playObj);
    persistPlay(playObj);
  }

  function renderAll(){
    const state = computeState();
    const isGoalToGo = state.down && state.fieldPos !== null && (state.fieldPos + state.distance >= 100);

    document.getElementById('scoreText').textContent = TEAMS.teamA.name + ' ' + state.scores.teamA + ' — ' + TEAMS.teamB.name + ' ' + state.scores.teamB;
    document.getElementById('downText').textContent = state.down
      ? (ordinal(state.down) + ' & ' + distDisplay + ' at the ' + markerLabel(state.fieldPos) + ' — ' + TEAMS[state.possession].name + ' ball')
      : ('no active drive — ' + TEAMS[state.possession].name + ' ball');
    document.getElementById('quarterText').textContent = 'Q' + state.quarter + ' (' + (state.quarter <= 2 ? '1st half' : state.quarter <= 4 ? '2nd half' : 'OT') + ')';
    document.getElementById('topText').textContent = 'Time of possession — ' + TEAMS.teamA.name + ' ' + formatDuration(state.possessionTime.teamA) + ' · ' + TEAMS.teamB.name + ' ' + formatDuration(state.possessionTime.teamB);
    const banner = document.getElementById('banner');
    const c = TEAMS[state.possession];
    banner.style.background = c.bg;

    if (TEAMS.teamA.logo){ logoA.src = TEAMS.teamA.logo; logoA.style.display = 'inline-block'; } else { logoA.style.display = 'none'; }
    if (TEAMS.teamB.logo){ logoB.src = TEAMS.teamB.logo; logoB.style.display = 'inline-block'; } else { logoB.style.display = 'none'; }

    function renderLogLines(list){
      return list.map(p => {
        if (p.isDivider) return '<div style="text-align:center; font-size:14px; font-weight:600; color:#888; margin:8px 0; border-top:1px dashed #ccc; padding-top:6px;">' + p.text + '</div>';
        const qtag = p.quarter ? '<span style="color:#999; font-size:12px; margin-right:6px;">Q' + p.quarter + '</span>' : '';
        return '<div class="logline">' + qtag + p.text + (p.unresolved ? '<span class="badge unresolved">unresolved</span>' : '') + '</div>';
      }).join('');
    }
    document.getElementById('logScroll').innerHTML = renderLogLines(plays.slice().reverse()) || '<div style="color:#999;">no plays logged yet</div>';

    // Every play with effect.isReset marks the start of a new drive --
    // current and previous drive are just the last two segments between
    // those markers.
    const resetIdxs = [];

    const currentDrivePlays = resetIdxs.length ? plays.slice(resetIdxs[resetIdxs.length - 1]) : [];

        '<div class="row"><button class="primary" id="pickA">' + TEAMS.teamA.name + ' kicks</button>' +
        '<button class="primary" id="pickB">' + TEAMS.teamB.name + ' kicks</button></div>';
      document.getElementById('pickA').addEventListener('click', () => { guided.kickingTeam = 'teamA'; guided.receivingTeam = 'teamB'; guided.step = 'kickoff'; persistUiState(); renderGuided(); });
      document.getElementById('pickB').addEventListener('click', () => { guided.kickingTeam = 'teamB'; guided.receivingTeam = 'teamA'; guided.step = 'kickoff'; persistUiState(); renderGuided(); });
      return;
    }
    if (guided.step === 'kickoff'){
      const kickerList = specialTeamsEligible(guided.kickingTeam);
      content.innerHTML =
        '<div style="font-size:16px; margin-bottom:8px;">' + TEAMS[guided.kickingTeam].name + ' kicks off.</div>' +
        '<p style="font-size:13px; color:#888; margin:0 0 4px;">Kicker</p>' +
        '<div id="gk_kicker_grid">' + pickerHtml(kickerList, 'gk_kicker_pick') + '</div>' +
        '<input type="text" id="gk_kicker_manual" placeholder="or type #" style="width:100px; margin:4px 0 8px;"><br>' +
        '<label class="inline">Distance <input type="text" id="gk_yards" style="width:70px; margin-left:6px; display:inline-block;"></label>' +
        '<div class="row" style="margin-top:10px;"><button class="primary" id="guidedKickoffSave">Save kickoff</button></div>';
      let kickerNum = null;
      content.querySelectorAll('.gk_kicker_pick').forEach(b => b.addEventListener('click', () => {
        kickerNum = b.dataset.num;
        if (b.dataset.resolved) TEAMS[guided.kickingTeam].rosterSpecialTeams[kickerNum] = b.dataset.resolved;
        content.querySelectorAll('.gk_kicker_pick').forEach(x => x.style.background = '');
        b.style.background = '#e6f1fb';
        document.getElementById('gk_kicker_manual').value = kickerNum;
      }));
      document.getElementById('gk_kicker_manual').addEventListener('input', e => { kickerNum = e.target.value.trim(); });
      document.getElementById('guidedKickoffSave').addEventListener('click', () => {
        const yds = document.getElementById('gk_yards').value.trim();
        if (!kickerNum || !yds) return;
        const text = nameInSpecialTeams(guided.kickingTeam, kickerNum) + ' kicks off ' + yds;
        pushAndPersist({ id: nextId++, text, effect: {}, team: guided.kickingTeam, quarter: guided.quarter, roles: { kicker: { team: guided.kickingTeam, num: kickerNum, yards: parseInt(yds)||0 }, playType: 'kickoff' } });
        guided.step = 'return';
        persistUiState();
        renderAll(); renderGuided();
      });
      return;
    }
    if (guided.step === 'return'){
      const returnerList = defenseEligible(guided.receivingTeam);
      content.innerHTML =
        '<div style="font-size:16px; margin-bottom:8px;">' + TEAMS[guided.receivingTeam].name + ' returns.</div>' +
        '<p style="font-size:13px; color:#888; margin:0 0 4px;">Returner</p>' +
        '<div id="gr_returner_grid">' + pickerHtml(returnerList, 'gr_returner_pick') + '</div>' +
        '<input type="text" id="gr_returner_manual" placeholder="type #" style="width:100px; margin:4px 0 8px;"><br>' +
        '<label class="inline">Return yards <input type="text" id="gr_yards" style="width:70px; margin-left:6px; display:inline-block;"></label>' +
        '<label class="inline" style="margin-left:12px; display:inline-block;"><input type="checkbox" id="gr_td"> Touchdown</label>' +
        '<label class="inline" style="margin-left:12px; display:inline-block;">Clock <input type="text" id="guidedReturnClock" placeholder="M:SS" style="width:80px; margin-left:6px; display:inline-block;"></label>' +
        startingSpotFieldsHtml('gr_spot', 'Ball spot after the return (sets 1st down for ' + TEAMS[guided.receivingTeam].name + ')') +
        '<div class="row" style="margin-top:10px;"><button class="primary" id="guidedReturnSave">Save return</button></div>';
      let returnerNum = null;
      const getReturnReset = wireStartingSpot(content, 'gr_spot');
      content.querySelectorAll('.gr_returner_pick').forEach(b => b.addEventListener('click', () => {
        returnerNum = b.dataset.num;
        if (b.dataset.resolved) TEAMS[guided.receivingTeam].rosterDefense[returnerNum] = b.dataset.resolved;
        content.querySelectorAll('.gr_returner_pick').forEach(x => x.style.background = '');
        b.style.background = '#e6f1fb';
        document.getElementById('gr_returner_manual').value = returnerNum;
      }));
      document.getElementById('gr_returner_manual').addEventListener('input', e => { returnerNum = e.target.value.trim(); });
      document.getElementById('guidedReturnSave').addEventListener('click', () => {
        const yds = document.getElementById('gr_yards').value.trim();
        const td = document.getElementById('gr_td').checked;
        if (!returnerNum || !yds) return;
        let text = nameInDefense(guided.receivingTeam, returnerNum) + ' returns ' + yds;
        const effect = { flip: true, flipApplied: true, flipTo: guided.receivingTeam };
        if (td){ text += ' — TOUCHDOWN'; effect.score = { team: guided.receivingTeam, points: 6 }; }
        pushAndPersist({ id: nextId++, text, effect, team: guided.receivingTeam, quarter: guided.quarter, roles: { defense: { team: guided.receivingTeam, num: returnerNum }, playType: 'kickoff_return' } });
        const receivingName = TEAMS[guided.receivingTeam].name;
        const receivingTeamKey = guided.receivingTeam;
        const q = guided.quarter;
        const clockVal = document.getElementById('guidedReturnClock').value.trim();
        if (clockVal){
          const absSec = clockToAbsSeconds(q, clockVal);
          if (absSec !== null){
            pushAndPersist({ id: nextId++, text: 'Clock — ' + clockVal + ' start of possession (' + receivingName + ')', effect: { clockEvent: { type: 'start', team: receivingTeamKey, absSec } }, quarter: q });
          }
        }
        const reset = getReturnReset();
        if (reset && !td){
          pushAndPersist({ id: nextId++, text: 'New drive — ' + ordinal(reset.down) + ' & ' + reset.distance + ' at the ' + markerLabel(reset.fieldPos) + ' (' + receivingName + ')', effect: { isReset: true, down: reset.down, distance: reset.distance, fieldPos: reset.fieldPos }, quarter: q });
        }
        gamePhase = guided.targetPhase;
        guided = { active: false, quarter: null, kickingTeam: null, receivingTeam: null, step: null, targetPhase: null };
        persistUiState();
        renderAll(); renderGuided(); updatePhaseUI();
        if (reset && !td){
          document.getElementById('code').placeholder = '15p 22 25 7';
        } else {
          document.getElementById('code').placeholder = '1 10 -20 — set the starting spot for ' + receivingName;
        }
      });
      return;
    }
  }

  document.getElementById('otUtilBtn').addEventListener('click', () => {
    guided = { active: true, quarter: 5, kickingTeam: null, receivingTeam: null, step: 'otPickTeam', targetPhase: 'secondHalf' };
    persistUiState();
    renderGuided();
  });

  document.querySelectorAll('.ptypeBtn').forEach(b => b.addEventListener('click', () => renderPlayPanel(b.dataset.type)));
  let currentSpotGetter = null;

  function startingSpotFieldsHtml(idPrefix, label){
    return '<p style="font-size:13px; color:#888; margin:8px 0 4px;">' + (label || 'Starting spot for the ensuing drive (optional — leave blank to set later)') + '</p>' +
      '<button type="button" class="' + idPrefix + '_side" data-side="own">Our side</button> ' +
      '<button type="button" class="' + idPrefix + '_side" data-side="opp">Their side</button> ' +
      '<input type="text" id="' + idPrefix + '_yardline" style="width:70px; display:inline-block;" placeholder="Yard line">';
  }
  function wireStartingSpot(container, idPrefix){
    let side = null;
    container.querySelectorAll('.' + idPrefix + '_side').forEach(b => b.addEventListener('click', () => {
      side = b.dataset.side;
      container.querySelectorAll('.' + idPrefix + '_side').forEach(x => x.style.background = '');
      b.style.background = '#e6f1fb';
    }));
    return function getReset(){
      const yardlineEl = document.getElementById(idPrefix + '_yardline');
      const yardline = yardlineEl ? yardlineEl.value.trim() : '';
      if (!side || !yardline) return null;
      const fieldPos = side === 'own' ? Math.abs(parseInt(yardline)) : (100 - parseInt(yardline));
      const distance = Math.min(10, 100 - fieldPos);
      return { down: 1, distance, fieldPos };
    };
  }

  function renderPlayPanel(type){
    const state = computeState();
    const off = state.possession, def = otherTeam(state.possession);
    const panel = document.getElementById('playPanel');
    panel.style.display = 'block';
    document.getElementById('confirmCard').style.display = 'none';

    const { stats } = computePlayerStats();
    function offBlock(role, label){
      const list = (role === 'kicker' || role === 'punter') ? specialTeamsEligible(off) : offenseEligible(off, role);
      const statFn = role === 'carrier' ? (n => (stats[off].rushYds[n]||0)+' yds') : role === 'passer' ? (n => (stats[off].passYds[n]||0)+' yds') : role === 'receiver' ? (n => (stats[off].recYds[n]||0)+' yds') : null;
      return '<p style="font-size:13px; color:#888; margin:8px 0 4px;">' + label + '</p>' +
        '<div id="pp_' + role + '_grid">' + pickerHtml(list, 'pp_' + role + '_pick', statFn) + '</div>' +
        '<input type="text" id="pp_' + role + '_manual" placeholder="or type #" style="width:100px; margin-top:4px;">';
    }
    function defBlock(label, suffix){
      suffix = suffix || '';
      const list = defenseEligible(def);
      return '<p style="font-size:13px; color:#888; margin:8px 0 4px;">' + label + '</p>' +
        '<div id="pp_credit_grid' + suffix + '">' + pickerHtml(list, 'pp_credit_pick' + suffix, n => (stats[def].credits[n]||0)+' credits') + '</div>' +
        '<input type="text" id="pp_credit_manual' + suffix + '" placeholder="type #" style="width:100px; margin-top:4px;">';
    }
    const yardsBlock = (label, id) => '<p style="font-size:13px; color:#888; margin:8px 0 4px;">' + (label||'Yards') + '</p><input type="text" id="' + (id||'pp_yards') + '" style="width:80px;">';
    const yardsBlockRet = () => '<div id="pp_retyds_container"><p style="font-size:13px; color:#888; margin:8px 0 4px;">Return yards (optional)</p><input type="text" id="pp_retyds" style="width:80px;"></div>';
    const tdBlock = '<label class="inline" style="margin-top:8px; display:block;"><input type="checkbox" id="pp_td"> Touchdown</label>';

    let html = '';
    if (type === 'rush') html = offBlock('carrier','Ball carrier') + yardsBlock() + defBlock('Tackled by (optional)') + tdBlock;
    else if (type === 'pass') html = offBlock('passer','Passer') + offBlock('receiver','Receiver') + yardsBlock() + defBlock('Tackled by (optional)') + tdBlock;
    else if (type === 'sack') html = offBlock('passer','Passer') + yardsBlock('Yards lost') + defBlock('Sacked by');
    else if (type === 'int') html = offBlock('passer','Passer') + defBlock('Intercepted by') + yardsBlock('Return yards (optional)') + tdBlock + startingSpotFieldsHtml('pp_spot');
    else if (type === 'fumble') html = offBlock('carrier','Who fumbled') +
        '<div style="margin-top:8px;"><label class="inline" style="display:block;"><input type="radio" name="pp_fumrec" value="own" checked> Recovered by own team</label>' +
        '<label class="inline" style="display:block;"><input type="radio" name="pp_fumrec" value="opp"> Recovered by opponent</label></div>' +
        '<div id="pp_fum_opp" style="display:none;">' + defBlock('Recovered by') + yardsBlock('Return yards (optional)') + tdBlock + startingSpotFieldsHtml('pp_spot') + '</div>';
    else if (type === 'kickoff') html = offBlock('kicker','Kicker') + yardsBlock('Kick distance') + defBlock('Returned by (optional)') + '<div id="pp_ret_yds_wrap">' + yardsBlockRet() + '</div>' + tdBlock + startingSpotFieldsHtml('pp_spot');
    else if (type === 'punt') html =
        '<label class="inline" style="display:block;"><input type="checkbox" id="pp_blocked"> Blocked</label>' +
        offBlock('punter','Punter') +
        '<div id="pp_punt_normal">' + yardsBlock('Punt distance') + defBlock('Returned by (optional)') + '<div id="pp_ret_yds_wrap2">' + yardsBlockRet() + '</div></div>' +
        '<div id="pp_punt_blocked" style="display:none;">' + defBlock('Recovered by', '_pb') + yardsBlock('Return yards (optional)', 'pp_blockretyds') + '</div>' + tdBlock + startingSpotFieldsHtml('pp_spot');
    else if (type === 'fg') html =
        offBlock('kicker','Kicker') + yardsBlock('Distance') +
        '<div style="margin-top:8px;"><label class="inline" style="display:block;"><input type="radio" name="pp_fgres" value="g" checked> Good</label>' +
        '<label class="inline" style="display:block;"><input type="radio" name="pp_fgres" value="x"> Missed</label>' +
        '<label class="inline" style="display:block;"><input type="radio" name="pp_fgres" value="b"> Blocked</label></div>' +
        '<div id="pp_fg_blocked" style="display:none;">' + defBlock('Recovered by', '_fgb') + yardsBlock('Return yards (optional)', 'pp_blockretyds') + tdBlock + '</div>';
    else if (type === 'pat') html =
        offBlock('kicker','Kicker') +
        '<div style="margin-top:8px;"><label class="inline" style="display:block;"><input type="radio" name="pp_patres" value="g" checked> Good</label>' +
        '<label class="inline" style="display:block;"><input type="radio" name="pp_patres" value="x"> Missed</label>' +
        '<label class="inline" style="display:block;"><input type="radio" name="pp_patres" value="b"> Blocked</label></div>' +
        '<div id="pp_pat_blocked" style="display:none;">' + defBlock('Returned by (optional)') + yardsBlock('Return yards (optional)') +
        '<label class="inline" style="margin-top:6px; display:block;"><input type="checkbox" id="pp_pat_2pt"> Returned all the way (defense +2)</label></div>';

    html += '<div class="row" style="margin-top:12px;"><button class="primary" id="pp_review">Review play</button><button class="secondary" id="pp_clear">Clear</button></div>';
    panel.innerHTML = html;
    currentSpotGetter = (type === 'kickoff' || type === 'punt' || type === 'int' || type === 'fumble') ? wireStartingSpot(panel, 'pp_spot') : null;
    if (panel.scrollIntoView) try { panel.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch(e){}

    const sel = { carrier:null, passer:null, receiver:null, kicker:null, punter:null, credit:null };
    ['carrier','passer','receiver','kicker','punter'].forEach(role => {
      const grid = document.getElementById('pp_' + role + '_grid');
      const targetRoster = (role === 'kicker' || role === 'punter') ? TEAMS[off].rosterSpecialTeams : TEAMS[off].rosterOffense;
      if (grid) wirePickerButtons(panel, 'pp_' + role + '_pick', 'pp_' + role + '_manual', (num, resolvedName) => {
        if (resolvedName) targetRoster[num] = resolvedName;
        sel[role] = num;
      });
      const manual = document.getElementById('pp_' + role + '_manual');
      if (manual) manual.addEventListener('input', e => { sel[role] = e.target.value.trim(); });
    });
    ['', '_pb', '_fgb'].forEach(suffix => {
      const creditGrid = document.getElementById('pp_credit_grid' + suffix);
      if (creditGrid) wirePickerButtons(panel, 'pp_credit_pick' + suffix, 'pp_credit_manual' + suffix, (num, resolvedName) => {
        if (resolvedName) TEAMS[def].rosterDefense[num] = resolvedName;
        sel.credit = num;
      });
      const creditManual = document.getElementById('pp_credit_manual' + suffix);
      if (creditManual) creditManual.addEventListener('input', e => { sel.credit = e.target.value.trim(); });
    });

    if (type === 'fumble'){
      panel.querySelectorAll('input[name=pp_fumrec]').forEach(r => r.addEventListener('change', () => {
        document.getElementById('pp_fum_opp').style.display = (document.querySelector('input[name=pp_fumrec]:checked').value === 'opp') ? 'block' : 'none';
      }));
    }
    if (type === 'punt'){
      document.getElementById('pp_blocked').addEventListener('change', (e) => {
        document.getElementById('pp_punt_normal').style.display = e.target.checked ? 'none' : 'block';
        document.getElementById('pp_punt_blocked').style.display = e.target.checked ? 'block' : 'none';
      });
    }
    if (type === 'fg'){
      panel.querySelectorAll('input[name=pp_fgres]').forEach(r => r.addEventListener('change', () => {
        document.getElementById('pp_fg_blocked').style.display = (document.querySelector('input[name=pp_fgres]:checked').value === 'b') ? 'block' : 'none';
      }));
    }
    if (type === 'pat'){
      panel.querySelectorAll('input[name=pp_patres]').forEach(r => r.addEventListener('change', () => {
        document.getElementById('pp_pat_blocked').style.display = (document.querySelector('input[name=pp_patres]:checked').value === 'b') ? 'block' : 'none';
      }));
    }

    document.getElementById('pp_clear').addEventListener('click', () => renderPlayPanel(type));
    document.getElementById('pp_review').addEventListener('click', () => buildAndReview(type, sel));
  }

  function buildAndReview(type, sel){
    const yards = (id) => (document.getElementById(id) ? document.getElementById(id).value.trim() : '');
    const td = document.getElementById('pp_td') && document.getElementById('pp_td').checked;
    let code = '', roles = null;
    const state = computeState();
    const off = state.possession, def = otherTeam(state.possession);

    if (type === 'rush'){
      if (!sel.carrier) return;
      const yds = yards('pp_yards') || '0';
      code = sel.carrier + 'r ' + yds + (sel.credit ? ' ' + sel.credit : '') + (td ? ' td' : '');
      roles = { carrier: { team: off, num: sel.carrier, yards: parseInt(yds)||0 } };
      if (sel.credit) roles.defense = { team: def, num: sel.credit };
    } else if (type === 'pass'){
      if (!sel.passer || !sel.receiver) return;
      const yds = yards('pp_yards') || '0';
      code = sel.passer + 'p ' + sel.receiver + ' ' + yds + (sel.credit ? ' ' + sel.credit : '') + (td ? ' td' : '');
      roles = { passer: { team: off, num: sel.passer, yards: parseInt(yds)||0 }, receiver: { team: off, num: sel.receiver, yards: parseInt(yds)||0 } };
      if (sel.credit) roles.defense = { team: def, num: sel.credit };
    } else if (type === 'sack'){
      if (!sel.passer) return;
      const yds = yards('pp_yards') || '0';
      code = sel.passer + 's ' + yds + (sel.credit ? ' ' + sel.credit : '');
      roles = { passer: { team: off, num: sel.passer, yards: parseInt(yds)||0 } };
      if (sel.credit) roles.defense = { team: def, num: sel.credit };
    } else if (type === 'int'){
      if (!sel.passer || !sel.credit) return;
      const yds = yards('pp_yards');
      code = sel.passer + 'x ' + sel.credit + (yds ? ' ' + yds : '') + (td ? ' td' : '');
      roles = { passer: { team: off, num: sel.passer }, defense: { team: def, num: sel.credit } };
    } else if (type === 'fumble'){
      if (!sel.carrier) return;
      const rec = document.querySelector('input[name=pp_fumrec]:checked').value;
      if (rec === 'own'){ code = sel.carrier + 'f'; roles = {}; }
      else {
        if (!sel.credit) return;
        const yds = yards('pp_yards');
        code = sel.carrier + 'f ' + sel.credit + (yds ? ' ' + yds : '') + (td ? ' td' : '');
        roles = { defense: { team: def, num: sel.credit } };
      }
    } else if (type === 'kickoff'){
      if (!sel.kicker) return;
      const yds = yards('pp_yards') || '0';
      const retyds = yards('pp_retyds');
      code = sel.kicker + 'ko ' + yds + (sel.credit ? ' ' + sel.credit + (retyds ? ' ' + retyds : ' 0') : '') + (td ? ' td' : '');
      roles = { kicker: { team: off, num: sel.kicker, yards: parseInt(yds)||0 } };
      if (sel.credit) roles.defense = { team: def, num: sel.credit };
    } else if (type === 'punt'){
      const blocked = document.getElementById('pp_blocked').checked;
      if (!sel.punter) return;
      if (blocked){
        if (!sel.credit) return;
        const retyds = yards('pp_blockretyds');
        code = sel.punter + 'pb ' + sel.credit + (retyds ? ' ' + retyds : '') + (td ? ' td' : '');
        roles = { punter: { team: off, num: sel.punter, yards: 0, blocked: true } };
      } else {
        const yds = yards('pp_yards') || '0';
        const retyds = yards('pp_retyds');
        code = sel.punter + 'pt ' + yds + (sel.credit ? ' ' + sel.credit + (retyds ? ' ' + retyds : ' 0') : '') + (td ? ' td' : '');
        roles = { punter: { team: off, num: sel.punter, yards: parseInt(yds)||0, blocked: false } };
      }
      if (sel.credit) roles.defense = { team: def, num: sel.credit };
    } else if (type === 'fg'){
      if (!sel.kicker) return;
      const yds = yards('pp_yards') || '0';
      const res = document.querySelector('input[name=pp_fgres]:checked').value;
      if (res === 'b'){
        const retyds = yards('pp_blockretyds');
        code = sel.kicker + 'fg b' + (sel.credit ? ' ' + sel.credit : '') + (retyds ? ' ' + retyds : '') + (td ? ' td' : '');
      } else {
        code = sel.kicker + 'fg ' + yds + ' ' + res;
      }
      roles = { kicker: { team: off, num: sel.kicker, yards: parseInt(yds)||0, result: res } };
      if (sel.credit) roles.defense = { team: def, num: sel.credit };
    } else if (type === 'pat'){
      if (!sel.kicker) return;
      const res = document.querySelector('input[name=pp_patres]:checked').value;
      if (res === 'b'){
        const twoPt = document.getElementById('pp_pat_2pt').checked;
        const retyds = yards('pp_yards');
        code = sel.kicker + 'pa b' + (sel.credit ? ' ' + sel.credit : '') + (retyds ? ' ' + retyds : '') + (twoPt ? ' td' : '');
      } else {
        code = sel.kicker + 'pa ' + res;
      }
      roles = { kicker: { team: off, num: sel.kicker, result: res } };
      if (sel.credit) roles.defense = { team: def, num: sel.credit };
    }

    if (!code) return;
    if (roles) roles.playType = type;
    document.getElementById('code').value = code;
    showConfirm();
    if (pending){
      pending.roles = roles;
      pending.reset = (currentSpotGetter && !td) ? currentSpotGetter() : null;
    }
  }

  function showConfirm(){
    const val = document.getElementById('code').value;
    if (!val) return;
    const state = computeState();
    pending = parseInput(val, state);
    if (!pending){
      document.getElementById('parsedText').textContent = 'Unrecognized entry.';
      document.getElementById('flipRow').style.display = 'none';
      document.getElementById('confirmClockRow').style.display = 'none';
    } else {
      document.getElementById('parsedText').textContent = pending.text;
      if (pending.flipEligible){
        document.getElementById('flipRow').style.display = 'flex';
        document.getElementById('flipLabel').textContent = 'Change of possession — ' + TEAMS[pending.flipTo].name + ' ball';
        document.getElementById('flipCheck').checked = true;
      } else {
        document.getElementById('flipRow').style.display = 'none';
      }
      const needsClock = pending.flipEligible || (pending.effect && pending.effect.endsDrive);
      document.getElementById('confirmClockRow').style.display = needsClock ? 'flex' : 'none';
      if (needsClock) document.getElementById('confirmClockInput').value = '';
    }
    document.getElementById('confirmCard').style.display = 'block';
    const cc = document.getElementById('confirmCard');
    if (cc.scrollIntoView) try { cc.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch(e){}
  }

  document.getElementById('editBtn').addEventListener('click', () => {
    document.getElementById('confirmCard').style.display = 'none';
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    if (!pending) return;
    const preState = computeState();
    const effect = Object.assign({}, pending.effect);
    let flipHappened = false, outgoingTeam = null, incomingTeam = null;
    if (pending.flipEligible){
      const confirmed = document.getElementById('flipCheck').checked;
      effect.flip = true;
      effect.flipTo = pending.flipTo;
      effect.flipApplied = confirmed;
      if (confirmed){ flipHappened = true; outgoingTeam = preState.possession; incomingTeam = pending.flipTo; }
    }
    pushAndPersist({ id: nextId++, text: pending.text, effect, unresolved: !!pending.unresolved, team: pending.team || null, quarter: pending.quarter || computeState().quarter, roles: pending.roles || null });

    const clockVal = document.getElementById('confirmClockInput').value.trim();
    if (clockVal){
      const q = computeState().quarter;
      const absSec = clockToAbsSeconds(q, clockVal);
      if (absSec !== null){
        if (flipHappened){
          pushAndPersist({ id: nextId++, text: 'Clock — ' + clockVal + ' at change of possession (' + TEAMS[outgoingTeam].name + ' \u2192 ' + TEAMS[incomingTeam].name + ')', effect: { clockEvent: { type: 'transition', outgoingTeam, incomingTeam, absSec } }, quarter: q });
        }
        if (effect.endsDrive){
          const scoringTeam = effect.score ? effect.score.team : preState.possession;
          pushAndPersist({ id: nextId++, text: 'Clock — ' + clockVal + ' end of possession (' + TEAMS[scoringTeam].name + ')', effect: { clockEvent: { type: 'end', team: scoringTeam, absSec } }, quarter: q });
        } else if (flipHappened && effect.score && effect.score.points === 6){
          pushAndPersist({ id: nextId++, text: 'Clock — ' + clockVal + ' end of possession (' + TEAMS[effect.score.team].name + ')', effect: { clockEvent: { type: 'end', team: effect.score.team, absSec } }, quarter: q });
        }
      }
    }
    if (pending.reset && flipHappened){
      const q2 = computeState().quarter;
      pushAndPersist({ id: nextId++, text: 'New drive — ' + ordinal(pending.reset.down) + ' & ' + pending.reset.distance + ' at the ' + markerLabel(pending.reset.fieldPos) + ' (' + TEAMS[incomingTeam].name + ')', effect: { isReset: true, down: pending.reset.down, distance: pending.reset.distance, fieldPos: pending.reset.fieldPos }, quarter: q2 });
    }
    renderAll();
    document.getElementById('confirmCard').style.display = 'none';
    document.getElementById('playPanel').style.display = 'none';
    document.getElementById('playPanel').innerHTML = '';
    document.getElementById('code').value = '';
    pending = null;
    if (window.scrollTo) try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch(e){}
  });

  document.getElementById('driveUtilBtn').addEventListener('click', () => {
    document.getElementById('confirmCard').style.display = 'none';
    const panel = document.getElementById('playPanel');
    panel.style.display = 'block';
    panel.innerHTML =
      '<p style="font-size:13px; color:#888; margin:0 0 6px;">New drive / correct down</p>' +
      '<div style="margin-bottom:8px;"><span style="font-size:13px; margin-right:6px;">Down</span>' +
      ['1','2','3','4'].map(d => '<button type="button" class="driveDownBtn" data-d="' + d + '">' + (d==='1'?'1st':d==='2'?'2nd':d==='3'?'3rd':'4th') + '</button>').join(' ') + '</div>' +
      '<label class="inline">Distance <input type="text" id="drive_dist" style="width:60px; display:inline-block;"></label>' +
      '<div style="margin-top:8px;"><button type="button" class="driveSideBtn" data-side="own">Our side</button> <button type="button" class="driveSideBtn" data-side="opp">Their side</button> ' +
      '<input type="text" id="drive_yardline" style="width:70px; display:inline-block;" placeholder="Yard line"></div>' +
      '<div class="row" style="margin-top:12px;"><button class="primary" id="drive_review">Review</button><button class="secondary" id="drive_clear">Clear</button></div>';
    if (panel.scrollIntoView) try { panel.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch(e){}
    let down = null, side = null;
    panel.querySelectorAll('.driveDownBtn').forEach(b => b.addEventListener('click', () => {
      down = b.dataset.d;
      panel.querySelectorAll('.driveDownBtn').forEach(x => x.style.background = '');
      b.style.background = '#e6f1fb';
    }));
    panel.querySelectorAll('.driveSideBtn').forEach(b => b.addEventListener('click', () => {
      side = b.dataset.side;
      panel.querySelectorAll('.driveSideBtn').forEach(x => x.style.background = '');
      b.style.background = '#e6f1fb';
    }));
    document.getElementById('drive_clear').addEventListener('click', () => document.getElementById('driveUtilBtn').click());
    document.getElementById('drive_review').addEventListener('click', () => {
      const dist = document.getElementById('drive_dist').value.trim();
      const yardline = document.getElementById('drive_yardline').value.trim();
      if (!down || !side || !dist || !yardline) return;
      const marker = side === 'own' ? ('-' + yardline) : yardline;
      document.getElementById('code').value = down + ' ' + dist + ' ' + marker;
      showConfirm();
    });
  });

  document.getElementById('quarterUtilBtn').addEventListener('click', () => {
    document.getElementById('confirmCard').style.display = 'none';
    const panel = document.getElementById('playPanel');
    panel.style.display = 'block';
    panel.innerHTML = '<p style="font-size:13px; color:#888; margin:0 0 6px;">Mark start of quarter</p>' +
      ['2','3','4'].map(q => '<button type="button" class="qMarkBtn" data-q="' + q + '">Start Q' + q + '</button>').join(' ');
    if (panel.scrollIntoView) try { panel.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch(e){}
    panel.querySelectorAll('.qMarkBtn').forEach(b => b.addEventListener('click', () => {
      document.getElementById('code').value = 'q' + b.dataset.q;
      showConfirm();
    }));
  });

  document.getElementById('undoBtn').addEventListener('click', async () => {
    if (!plays.length) return;
    const removed = plays.pop();
    renderAll();
    // The game isn't finalized, so the database allows this delete -- but
    // only bother if this play actually made it to the server in the
    // first place (it has a real sequence number).
    if (removed._seq){
      const { error } = await supabaseClient.from('plays').delete()
        .eq('game_id', currentGameId).eq('sequence_number', removed._seq);
      if (error){
        showMsg('gameMsg', 'Removed here, but failed to remove from the server: ' + error.message, 'error');
      }
    }
  });

  document.getElementById('penUtilBtn').addEventListener('click', () => {
    document.getElementById('confirmCard').style.display = 'none';
    const panel = document.getElementById('playPanel');
    panel.style.display = 'block';
    panel.innerHTML =
      '<p class="hint">Penalty</p>' +
      '<button type="button" class="penTeamBtn" data-team="off">On offense</button> ' +
      '<button type="button" class="penTeamBtn" data-team="def">On defense</button>' +
      '<div style="margin-top:8px;"><label class="inline">Yards <input type="text" id="pen_yds" style="width:70px; display:inline-block; margin-left:6px;"></label></div>' +
      '<div class="row" style="margin-top:12px;"><button class="primary" id="pen_review">Review</button><button class="secondary" id="pen_clear">Clear</button></div>';
    if (panel.scrollIntoView) try { panel.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch(e){}
    let penTeam = null;
    panel.querySelectorAll('.penTeamBtn').forEach(b => b.addEventListener('click', () => {
      penTeam = b.dataset.team;
      panel.querySelectorAll('.penTeamBtn').forEach(x => x.style.background = '');
      b.style.background = '#e6f1fb';
    }));
    document.getElementById('pen_clear').addEventListener('click', () => document.getElementById('penUtilBtn').click());
    document.getElementById('pen_review').addEventListener('click', () => {
      const yds = document.getElementById('pen_yds').value.trim();
      if (!penTeam || !yds) return;
      const code = (penTeam === 'off' ? 'po' : 'pd') + ' ' + yds;
      document.getElementById('code').value = code;
      showConfirm();
    });
  });

  document.getElementById('flipBtn').addEventListener('click', () => {
    const state = computeState();
    const outgoingTeam = state.possession, incomingTeam = otherTeam(state.possession);
    pushAndPersist({ id: nextId++, text: 'Manual flip — possession to ' + TEAMS[incomingTeam].name, effect: { forcePossession: incomingTeam } });
    renderAll();
    showClockPrompt({ mode: 'transition', outgoingTeam, incomingTeam }, () => { document.getElementById('code').focus(); });
  });

  function populateInsertOptions(){
    const sel = document.getElementById('insertAfter');
    sel.innerHTML = '<option value="start">— beginning of log —</option>' +
      plays.map(p => '<option value="' + p.id + '">after: ' + p.text.slice(0, 60) + '</option>').join('');
    sel.value = plays.length ? plays[plays.length - 1].id : 'start';
  }

  document.getElementById('manualBtn').addEventListener('click', () => {
    populateInsertOptions();
    document.getElementById('manualPanel').style.display = 'block';
  });
  document.getElementById('cancelManual').addEventListener('click', () => {
    document.getElementById('manualPanel').style.display = 'none';
    document.getElementById('manualText').value = '';
  });
  document.getElementById('saveManual').addEventListener('click', async () => {
    const text = document.getElementById('manualText').value;
    if (!text) return;
    const afterVal = document.getElementById('insertAfter').value;
    const entry = { id: nextId++, text, unresolved: true, effect: {} };

    // Manual entry can land anywhere in the log, not just the end, so it
    // needs its own fractional sequence number between whatever it's
    // being inserted between -- this is exactly what the NUMERIC (not
    // integer) sequence_number column exists to support.
    let insertIdx, seq;
    if (afterVal === 'start'){
      insertIdx = 0;
      const firstSeq = plays.length ? (plays[0]._seq || 1) : 1;
      seq = firstSeq > 1 ? firstSeq - 0.5 : firstSeq / 2;
    } else {
      const idx = plays.findIndex(p => p.id === parseInt(afterVal));
      insertIdx = idx + 1;
      const beforeSeq = plays[idx] ? (plays[idx]._seq || nextSequenceNumber - 1) : nextSequenceNumber - 1;
      const afterSeq = plays[idx + 1] ? plays[idx + 1]._seq : null;
      seq = afterSeq ? (beforeSeq + afterSeq) / 2 : null;
    }
    entry._seq = seq;
    plays.splice(insertIdx, 0, entry);
    renderAll();
    document.getElementById('manualPanel').style.display = 'none';
    document.getElementById('manualText').value = '';

    if (seq === null){
      // Inserting at the very end -- just use the normal next sequence.
      persistPlay(entry);
    } else {
      const { error } = await supabaseClient.from('plays').insert({
        game_id: currentGameId, quarter: computeState().quarter, sequence_number: seq,
        team_side: null, text: entry.text, effect: {}, roles: null, unresolved: true
      });
      if (error) showMsg('gameMsg', 'Saved here, but failed to sync to the server: ' + error.message, 'error');
    }
  });

</script>
</body>
</html>
