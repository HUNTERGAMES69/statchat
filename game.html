<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StatChat">
<title>StatChat — Game Entry</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background:#f4f3ef; margin:0; padding:14px; padding-top:calc(14px + env(safe-area-inset-top)); }
  .wrap { max-width:760px; margin:0 auto; }
  .card { background:#fff; border-radius:12px; padding:18px; margin-bottom:16px; box-shadow:0 2px 12px rgba(0,0,0,0.08); }
  h1 { font-size:20px; margin:0; }
  h2 { font-size:16px; margin:0 0 10px; color:#444; }
  p.sub { color:#888; margin:0 0 14px; font-size:13px; }
  label { display:block; font-size:13px; margin-bottom:4px; color:#555; }
  input:not([type=checkbox]):not([type=radio]), select { padding:8px; border:1px solid #ddd; border-radius:6px; font-size:14px; box-sizing:border-box; width:100%; }
  input[type=checkbox], input[type=radio] { width:auto; margin-right:6px; vertical-align:middle; }
  button { padding:8px 12px; border-radius:6px; border:none; background:#1a1a2e; color:#fff; font-size:13px; font-weight:600; cursor:pointer; }
  button.primary { background:#1a7a4c; }
  button.secondary { background:#fff; color:#444; border:1px solid #ccc; }
  button.danger { background:#fff; color:#a32d2d; border:1px solid #a32d2d; }
  button:disabled { opacity:0.5; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .hidden { display:none; }
  .msg { font-size:14px; padding:10px; border-radius:6px; margin-bottom:14px; }
  .msg.error { background:#fdecea; color:#a32d2d; }
  .msg.success { background:#e8f5e9; color:#1a7a4c; }
  .banner { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; border-radius:10px; padding:12px 16px; margin-bottom:6px; transition:background 0.2s; position:sticky; top:8px; z-index:50; box-shadow:0 2px 8px rgba(0,0,0,0.15); }
  .banner .score { font-size:20px; font-weight:700; }
  .banner .downdist { font-size:15px; font-weight:500; }
  .hint { font-size:12px; color:#888; margin:6px 0; }
  .floating-actions { position:fixed; bottom:16px; right:16px; z-index:90; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  .floating-actions button { box-shadow:0 2px 8px rgba(0,0,0,0.2); }
  #playPanel, #utilPanel { background:#f7f6f2; border-radius:8px; padding:12px 14px; margin-top:10px; scroll-margin-top:70px; }
  #confirmCard { background:#f7f6f2; border-radius:8px; padding:12px 14px; margin-top:8px; }
  .logline { font-size:14px; padding:6px 0; border-bottom:1px solid #f2f2f2; }
  .badge { font-size:10px; padding:2px 6px; border-radius:8px; margin-left:6px; font-weight:600; }
  .badge.unresolved { background:#fff3cd; color:#7a6a2a; }
  .conflict-block { background:#fff3cd; border-radius:8px; padding:10px; margin-top:8px; }
  @media (min-width: 640px) {
    body { padding:24px; padding-top:calc(24px + env(safe-area-inset-top)); }
    .card { padding:24px; }
    button { padding:9px 16px; font-size:14px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="loading" class="card"><div style="display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:14px;"><img src="logo.png" alt="StatChat" style="width:48px; height:auto; border-radius:8px;"><img id="splashTeamIcon" style="display:none; width:48px; height:48px; border-radius:8px; object-fit:cover;"></div><h1>Loading…</h1></div>

  <div id="errorView" class="hidden card">
    <h1>Couldn't open this game</h1>
    <p class="sub" id="errorMsg"></p>
    <a href="dashboard.html" style="text-decoration:none; padding:9px 16px; border-radius:6px; background:#1a1a2e; color:#fff; font-weight:600;">← Dashboard</a>
  </div>

  <div id="mainView" class="hidden">
    <div class="banner" id="banner">
      <img id="bannerLogoA" style="display:none; height:28px; width:28px; object-fit:contain; border-radius:4px;">
      <span class="score" id="scoreText"></span>
      <img id="bannerLogoB" style="display:none; height:28px; width:28px; object-fit:contain; border-radius:4px;">
      <span class="downdist" id="downText"></span>
      <span class="downdist" id="quarterText"></span>
    </div>
    <div class="hint" id="topText" style="text-align:right;"></div>

    <div id="clockPromptCard" style="display:none; background:#fff3cd; border-radius:8px; padding:12px 14px; margin-bottom:10px;">
      <div id="clockPromptLabel" style="font-size:15px; font-weight:600; margin-bottom:8px;"></div>
      <input type="text" id="clockPromptInput" placeholder="M:SS or MSS" style="width:100px; display:inline-block;">
      <button class="primary" id="clockPromptSave">Save clock</button>
      <button class="secondary" id="clockPromptSkip">Skip</button>
    </div>

    <div id="guidedPanel" class="card" style="display:none;">
      <h2>Kickoff</h2>
      <div id="guidedContent"></div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px;">
        <h1 id="gameTitle">Game</h1>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <a id="launchViewLink" href="#" target="_blank" style="text-decoration:none; padding:8px 14px; border-radius:6px; border:1px solid #1565c0; color:#1565c0; font-size:13px; font-weight:600; white-space:nowrap;">Launch view ↗</a>
          <a href="dashboard.html" style="text-decoration:none; padding:8px 14px; border-radius:6px; border:1px solid #ccc; color:#444; font-size:13px; font-weight:600; white-space:nowrap;">← Dashboard</a>
        </div>
      </div>
      <div id="gameMsg"></div>
      <input type="text" id="code" style="display:none;">

      <div class="row" style="margin-bottom:8px;">
        <button class="primary" id="startGameBtn">Start game</button>
        <button class="primary" id="endFirstHalfBtn" style="display:none;">End 1st half</button>
        <button class="primary" id="quarterUtilBtn">Quarter marker</button>
        <button class="primary" id="startHalfBtn" style="display:none;">Start 2nd half</button>
        <button class="primary" id="endGameBtn" style="display:none;">End game</button>
        <button id="otUtilBtn" style="display:none;">Start overtime</button>
        <a id="recapLink" href="#" style="display:none; padding:8px 12px; border-radius:6px; background:#1a7a4c; color:#fff; font-size:13px; font-weight:600; text-decoration:none;">View game recap &rarr;</a>
      </div>

      <p class="hint" style="margin:10px 0 6px;">Scrimmage</p>
      <div class="row">
        <button class="ptypeBtn" data-type="rush">Rush</button>
        <button class="ptypeBtn" data-type="pass">Pass</button>
      </div>
      <p class="hint" style="margin:10px 0 6px;">Special teams</p>
      <div class="row">
        <button class="ptypeBtn" data-type="kickoff">Kickoff</button>
        <button class="ptypeBtn" data-type="punt">Punt</button>
        <button class="ptypeBtn" data-type="fg">Field goal</button>
        <button class="ptypeBtn" data-type="pat">PAT</button>
        <button class="ptypeBtn" data-type="twopt">2PT</button>
      </div>
      <p class="hint" style="margin:10px 0 6px;">Utilities</p>
      <div class="row">
        <button id="penUtilBtn" style="background:#ffc72c; color:#1a1a1a;">Penalty</button>
        <button class="ptypeBtn" data-type="fumble">Fumble</button>
        <button class="ptypeBtn" data-type="safety">Safety</button>
        <button id="driveUtilBtn">New drive / correct down</button>
        <button id="flipBtn">Flip possession</button>
      </div>

      <div id="playPanel" style="display:none;"></div>

      <div id="manualPanel" style="display:none; background:#f7f6f2; border-radius:8px; padding:12px 14px; margin-top:10px;">
        <p class="hint" style="margin:0 0 6px;">Manual entry (flags as unresolved for later review)</p>
        <label>Insert after<select id="insertAfter" style="width:100%; margin-bottom:8px;"></select></label>
        <input type="text" id="manualText" placeholder="Describe the play" style="width:100%; margin-bottom:8px;">
        <div class="row"><button class="primary" id="saveManual">Save</button><button class="secondary" id="cancelManual">Cancel</button></div>
      </div>

      <div id="confirmCard" style="display:none;">
        <div style="font-size:14px; color:#888; margin-bottom:4px;">Parsed as</div>
        <div id="parsedText" style="font-size:16px; font-weight:600; margin-bottom:10px;"></div>
        <div id="fieldPosWarning" style="display:none; background:#fff3cd; border:1px solid #e0b400; border-radius:6px; padding:8px 12px; margin-bottom:10px; font-size:13px; color:#7a5c00;"></div>
        <label id="flipRow" style="display:none;"><input type="checkbox" id="flipCheck" checked> <span id="flipLabel"></span></label>
        <div id="confirmClockRow" style="display:none; margin-bottom:8px;">
          <span id="confirmClockLabel">Clock</span>&nbsp;<input type="text" id="confirmClockInput" placeholder="M:SS or MSS" style="width:90px; display:inline-block;">
        </div>
        <div class="row" style="margin-top:8px;">
          <button class="primary" id="saveBtn">Save</button>
          <button class="secondary" id="editBtn">Edit</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:baseline;">
        <h2 style="margin:0;">Current drive</h2>
        <button class="secondary" id="undoBtn" style="padding:6px 12px; font-size:12px;">Undo last</button>
      </div>
      <div id="driveLogScroll"></div>
    </div>

    <div class="card">
      <h2>Previous drive</h2>
      <div id="prevDriveLogScroll"></div>
    </div>

    <div class="card">
      <h2>All plays</h2>
      <div id="logScroll"></div>
    </div>
  </div>

  <div class="floating-actions">
    <button class="secondary" id="manualBtn">Manual entry</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="team-icon.js"></script>
<script>
  const SUPABASE_URL = 'https://pboushzlcyfkssojpuut.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_VGnUYurlkoH1yi67jHO6iQ_C8Q0EM2d';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  function showView(name){
    ['loading','errorView','mainView'].forEach(v => document.getElementById(v).classList.toggle('hidden', v !== name));
  }
  function showMsg(elId, text, type){
    document.getElementById(elId).innerHTML = '<div class="msg ' + type + '">' + text + '</div>';
  }

  let currentGameId = null;
  let nextSequenceNumber = 1;
  let TEAMS = { teamA: {}, teamB: {} };
  let plays = [], nextId = 1, startingPossession = 'teamA', quarterLengthSec = 720, gameLabel = '';
  let pending = null;
  let guided = { active: false, quarter: null, kickingTeam: null, receivingTeam: null, step: null, targetPhase: null };
  let gamePhase = 'notStarted';
  let clockPrompt = null, clockPromptCallback = null;
  let currentGameStatus = 'setup';
  const ROLE_RANK = { view: 0, game_entry: 1, admin: 2 };

  async function guardMinRoleOrRedirect(userId, minRole){
    const { data, error } = await supabaseClient
      .from('profiles').select('role').eq('id', userId).limit(1);
    const role = (!error && data && data.length > 0 && data[0].role) || 'view';
    const ok = (ROLE_RANK[role] || 0) >= (ROLE_RANK[minRole] || 0);
    if (!ok) window.location.href = 'dashboard.html';
    return ok;
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'INITIAL_SESSION'){
      if (session){
        guardMinRoleOrRedirect(session.user.id, 'game_entry').then(ok => {
          if (ok) init();
        });
      } else { window.location.href = '/'; }
    } else if (event === 'SIGNED_OUT'){
      window.location.href = '/';
    }
  });

  async function init(){
    const params = new URLSearchParams(window.location.search);
    currentGameId = params.get('id');
    if (!currentGameId){
      showView('errorView');
      showMsg('errorMsg', 'No game specified.', 'error');
      return;
    }

    const { data: gameRows, error: gameError } = await supabaseClient
      .from('games').select('*').eq('id', currentGameId).limit(1);
    if (gameError || !gameRows || gameRows.length === 0){
      showView('errorView');
      document.getElementById('errorMsg').textContent = gameError ? gameError.message : 'That game could not be found.';
      return;
    }
    const game = gameRows[0];
    gameLabel = game.designator;
    quarterLengthSec = game.quarter_length_seconds || 720;
    currentGameStatus = game.status;

    const { data: rosterRows, error: rosterError } = await supabaseClient
      .from('game_rosters').select('*').eq('game_id', currentGameId);
    if (rosterError){
      showView('errorView');
      document.getElementById('errorMsg').textContent = rosterError.message;
      return;
    }

    const { data: teamRows } = await supabaseClient
      .from('teams').select('primary_color, secondary_color, logo_url').eq('is_our_team', true).limit(1);
    const ourBranding = (teamRows && teamRows[0]) || {};

    buildTeams(game, rosterRows || [], ourBranding);
    document.getElementById('gameTitle').textContent = gameLabel + ' — ' + TEAMS.teamA.name + ' vs ' + TEAMS.teamB.name;
    document.getElementById('launchViewLink').href = 'view.html?id=' + currentGameId;

    const { data: existingPlays } = await supabaseClient
      .from('plays').select('*').eq('game_id', currentGameId).order('sequence_number', { ascending: true });
    plays = (existingPlays || []).map(p => ({
      id: nextId++, text: p.text, effect: p.effect || {}, team: p.team_side, quarter: p.quarter,
      roles: p.roles, unresolved: p.unresolved, isDivider: p.is_divider, isOverride: p.is_override,
      _seq: p.sequence_number
    }));
    nextSequenceNumber = plays.length ? Math.max(...plays.map(p => p._seq || 0)) + 1 : 1;

    // Resume exactly where we left off -- read the persisted phase and
    // any in-progress guided step directly, rather than guessing from
    // play history (which can't tell "kickoff in progress" from "kickoff
    // never started", and would silently drop an interrupted kickoff).
    gamePhase = game.game_phase || (plays.length === 0 ? 'notStarted' : 'firstHalf');
    if (currentGameStatus === 'final') gamePhase = 'ended';
    guided = (game.guided_state && game.guided_state.active) ? game.guided_state : { active: false, quarter: null, kickingTeam: null, receivingTeam: null, step: null, targetPhase: null };
    showView('mainView');
    renderAll();
    renderGuided();
    updatePhaseUI();
  }

  function buildTeams(game, rosterRows, ourBranding){
    const ourName = game.our_team_is_home ? game.home_team_name : game.away_team_name;
    const oppName = game.our_team_is_home ? game.away_team_name : game.home_team_name;
    const seeds = game.seed_starters || {};
    const seedOrderFor = (side) => {
      const s = seeds[side] || {};
      return ['QB','RB1','RB2','WR1','WR2','WR3'].map(role => s[role]).filter(Boolean);
    };
    TEAMS.teamA = { name: ourName, bg: ourBranding.primary_color || '#1a1a2e', text: ourBranding.secondary_color || '#ffffff',
      rosterOffense:{}, rosterDefense:{}, rosterSpecialTeams:{}, posOffense:{}, logo: ourBranding.logo_url || null, seedOrder: seedOrderFor('teamA') };
    TEAMS.teamB = { name: oppName, bg: game.opponent_primary_color || '#8B0000', text: game.opponent_secondary_color || '#ffffff',
      rosterOffense:{}, rosterDefense:{}, rosterSpecialTeams:{}, posOffense:{}, logo: game.opponent_logo_url || null, seedOrder: seedOrderFor('teamB') };
    rosterRows.forEach(r => {
      const team = TEAMS[r.team_side];
      if (!team) return;
      if (r.unit === 'offense'){ team.rosterOffense[r.jersey_number] = r.player_name; team.posOffense[r.jersey_number] = r.position; }
      else if (r.unit === 'defense'){ team.rosterDefense[r.jersey_number] = r.player_name; }
      else if (r.unit === 'special'){ team.rosterSpecialTeams[r.jersey_number] = r.player_name; }
    });
  }


  // --- Proven engine core, ported verbatim from the tested entry app ---
function otherTeam(t){ return t === 'teamA' ? 'teamB' : 'teamA'; }
function nameInOffense(teamKey, num){
  const n = TEAMS[teamKey].rosterOffense[num];
  return (n || ('#' + num)) + ' (' + TEAMS[teamKey].name + ')';
}
function nameInDefense(teamKey, num){
  const n = TEAMS[teamKey].rosterDefense[num];
  return (n || ('#' + num)) + ' (' + TEAMS[teamKey].name + ')';
}
function nameInSpecialTeams(teamKey, num){
  const n = TEAMS[teamKey].rosterSpecialTeams && TEAMS[teamKey].rosterSpecialTeams[num];
  return (n || ('#' + num)) + ' (' + TEAMS[teamKey].name + ')';
}
function ordinal(n){ return n===1?'1st':n===2?'2nd':n===3?'3rd':n===4?'4th':(n+'th'); }
function clockToAbsSeconds(quarter, clockStr){
  let m = clockStr.match(/^(\d{1,2}):(\d{2})$/);
  let mins, secs;
  if (m){
    mins = parseInt(m[1]); secs = parseInt(m[2]);
  } else {
    // Colon-less entry: last two digits are seconds, everything
    // before that is minutes -- e.g. "1156" reads the same as
    // "11:56" would, "56" alone reads as "0:56". Requires at least
    // two digits so this split is never ambiguous.
    m = clockStr.match(/^(\d*)(\d{2})$/);
    if (!m) return null;
    mins = m[1] ? parseInt(m[1]) : 0; secs = parseInt(m[2]);
  }
  if (secs > 59) return null;
  const remaining = mins * 60 + secs;
  // A clock value can never show more time than the quarter itself
  // holds -- e.g. "15:00" is meaningless in a 12-minute quarter.
  if (remaining > quarterLengthSec) return null;
  return (quarter - 1) * quarterLengthSec + (quarterLengthSec - remaining);
}
function getLastClockAbsSec(){
  for (let i = plays.length - 1; i >= 0; i--){
    if (plays[i].effect && plays[i].effect.clockEvent){
      return plays[i].effect.clockEvent.absSec;
    }
  }
  return null;
}
// Absolute game time only ever moves forward -- a new clock entry must
// always be later than whatever was last recorded, regardless of which
// of the several places in the app that clock gets entered from. Warns
// rather than silently blocking, since there's no way to rule out a
// legitimate correction to an earlier mistaken entry.
function confirmClockAdvances(absSec, clockVal){
  const lastAbsSec = getLastClockAbsSec();
  if (lastAbsSec !== null && absSec < lastAbsSec){
    return confirm('This clock value (' + clockVal + ') is earlier than the last time recorded for this game. Click OK to save it anyway, or Cancel to go back and fix it -- nothing will be saved if you cancel.');
  }
  return true;
}
function formatDuration(sec){
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}
function markerLabel(fp){
  if (fp === null || fp === undefined) return '';
  return fp <= 50 ? ('own ' + fp) : ('opp ' + (100 - fp));
}

function readFileAsDataURL(file){
  return new Promise(resolve => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.readAsDataURL(file);
  });
}

const OFFENSE_POS = new Set(['QB','RB','FB','HB','WR','TE','OL','OT','OG','C']);
const DEFENSE_POS = new Set(['DB','CB','S','FS','SS','LB','OLB','ILB','MLB','WLB','DE','DT','NG','NT','EDGE']);
const SPECIAL_POS = new Set(['K','P','LS','H','KR','PR']);
function posToUnit(pos){
  if (!pos) return null;
  const first = String(pos).toUpperCase().split(/[\/,\s]+/)[0];
  if (SPECIAL_POS.has(first)) return 'st';
  if (OFFENSE_POS.has(first)) return 'o';
  if (DEFENSE_POS.has(first)) return 'd';
  return null;
}
function extractNameTag(rawName){
  const m = String(rawName).match(/\(\s*(O|D|ST)\s*\)\s*$/i);
  if (!m) return { cleanName: String(rawName).trim(), explicitUnit: null };
  const tag = m[1].toUpperCase();
  const cleanName = String(rawName).slice(0, m.index).trim();
  return { cleanName, explicitUnit: tag.toLowerCase() };
}
function computeState(playsList){
  const list = playsList || plays;
  const state = {
    possession: startingPossession,
    quarter: 1,
    scores: { teamA: 0, teamB: 0 },
    possessionTime: { teamA: 0, teamB: 0 },
    down: null, distance: null, fieldPos: null, startSpot: null, statYards: 0,
    penalties: { teamA: { count: 0, yds: 0 }, teamB: { count: 0, yds: 0 } }
  };
  const pendingClockStart = { teamA: null, teamB: null };
  for (const p of list){
    const e = p.effect;
    if (!e) continue;
    if (e.isReset){
      state.down = e.down; state.distance = e.distance; state.fieldPos = e.fieldPos;
      state.startSpot = e.fieldPos; state.statYards = 0;
    }
    if (e.isStat){
      if (state.fieldPos !== null){
        state.fieldPos += e.fieldDelta;
        state.fieldPos = Math.max(0, Math.min(100, state.fieldPos));
      }
      state.statYards += e.statYds;
      if (e.td){
        state.down = null; state.distance = null; state.fieldPos = null; state.startSpot = null; state.statYards = 0;
      } else {
        if (e.converts){
          state.down = 1;
          state.distance = state.fieldPos !== null ? Math.max(1, Math.min(10, 100 - state.fieldPos)) : 10;
        }
        else if (e.turnoverOnDowns && e.flipApplied){
          state.possession = otherTeam(state.possession);
          state.down = null; state.distance = null; state.fieldPos = null; state.startSpot = null; state.statYards = 0;
        } else if (!e.turnoverOnDowns){
          state.down = (state.down || 1) + 1;
          state.distance = Math.max((state.distance || 10) - e.statYds, 1);
        }
      }
    }
    if (e.endsDrive && !e.isStat){
      state.down = null; state.distance = null; state.fieldPos = null; state.startSpot = null; state.statYards = 0;
    }
    if (e.penaltyTeam){
      state.penalties[e.penaltyTeam].count += 1;
      state.penalties[e.penaltyTeam].yds += e.penaltyYds;
      if (state.fieldPos !== null){
        state.fieldPos += e.fieldDelta;
        state.fieldPos = Math.max(0, Math.min(100, state.fieldPos));
      }
      if (state.distance !== null){
        state.distance -= e.fieldDelta;
        if (state.distance <= 0){
          // Penalty yardage alone reached or passed the marker --
          // an automatic first down, regardless of what down it was.
          state.down = 1;
          state.distance = state.fieldPos !== null ? Math.max(1, Math.min(10, 100 - state.fieldPos)) : 10;
        }
      }
    }
    if (e.score){ state.scores[e.score.team] += e.score.points; }
    if (e.scoreAdjust){ state.scores[e.scoreAdjust.team] += e.scoreAdjust.pts; }
    if (e.flip && e.flipApplied && !e.isStat){
      state.possession = e.flipTo;

const OFFENSE_ROLE_POS = {

  passer: ['QB'],
  receiver: ['WR','TE','RB'],
  kicker: ['K'],
  punter: ['P']
};
function computePlayerStats(){
  const stats = { teamA: { rushYds:{}, recYds:{}, passYds:{}, credits:{} }, teamB: { rushYds:{}, recYds:{}, passYds:{}, credits:{} } };
  const discovered = { teamA: [], teamB: [] };
  const discoveredOffense = { teamA: [], teamB: [] };
  function noteOffense(team, num){ if (discoveredOffense[team].indexOf(num) === -1) discoveredOffense[team].push(num); }

    if (!p.roles) return;
    const r = p.roles;
    if (r.carrier){ stats[r.carrier.team].rushYds[r.carrier.num] = (stats[r.carrier.team].rushYds[r.carrier.num]||0) + (r.carrier.yards||0); noteOffense(r.carrier.team, r.carrier.num); }

      stats[r.defense.team].credits[r.defense.num] = (stats[r.defense.team].credits[r.defense.num]||0) + 1;
      if (discovered[r.defense.team].indexOf(r.defense.num) === -1) discovered[r.defense.team].push(r.defense.num);
    }

}
function offenseEligible(team, role){
  const posOffense = TEAMS[team].posOffense || {};
  const roster = TEAMS[team].rosterOffense || {};
  const ambiguous = TEAMS[team].ambiguousOffense || {};
  const allowedPos = OFFENSE_ROLE_POS[role];
  const { stats, discoveredOffense } = computePlayerStats();
  const statKey = role === 'carrier' ? 'rushYds' : role === 'passer' ? 'passYds' : role === 'receiver' ? 'recYds' : null;

  // game setup) and grows as other players get discovered during the
  // game itself. Falls back to the full roster only if no seed list was
  // ever set for this game.

  seed.forEach(n => { visible[n] = true; });
  (discoveredOffense[team] || []).forEach(n => { visible[n] = true; });

    ambiguous[num].forEach(name => ambiguousList.push({ num, name: name + ' ?', resolvedName: name }));
  });

    function findDriveStarts(playsList){
      const starts = [];
      let priorPoss = startingPossession;
      for (let i = 0; i < playsList.length; i++){
        if (playsList[i].effect && playsList[i].effect.isReset){
          starts.push(i);
          priorPoss = computeState(playsList.slice(0, i + 1)).possession;
          continue;
        }
        const possAfter = computeState(playsList.slice(0, i + 1)).possession;
        if (possAfter !== priorPoss && i + 1 < playsList.length){
          starts.push(i + 1);
        }
        priorPoss = possAfter;
      }
      return starts;
    }
    const resetIdxs = findDriveStarts(plays);
    const currentDrivePlays = resetIdxs.length ? plays.slice(resetIdxs[resetIdxs.length - 1]) : [];
    const previousDrivePlays = resetIdxs.length >= 2 ? plays.slice(resetIdxs[resetIdxs.length - 2], resetIdxs[resetIdxs.length - 1]) : [];
    document.getElementById('driveLogScroll').innerHTML = renderLogLines(currentDrivePlays.slice().reverse()) || '<div style="color:#999;">no active drive yet</div>';
    document.getElementById('prevDriveLogScroll').innerHTML = renderLogLines(previousDrivePlays.slice().reverse()) || '<div style="color:#999;">no previous drive yet</div>';
  }

    document.getElementById('endFirstHalfBtn').style.display = (gamePhase === 'firstHalf' && !guided.active) ? 'inline-block' : 'none';
    document.getElementById('startHalfBtn').style.display = (gamePhase === 'halftime' && !guided.active) ? 'inline-block' : 'none';
    document.getElementById('endGameBtn').style.display = (gamePhase === 'secondHalf' && !guided.active) ? 'inline-block' : 'none';
    document.getElementById('otUtilBtn').style.display = (gamePhase === 'secondHalf' && !guided.active && computeState().quarter < 5) ? 'inline-block' : 'none';

  async function setGameStatus(status, finalScore){
    currentGameStatus = status;
    const updateFields = { status };
    if (finalScore){
      updateFields.final_score_us = finalScore.us;
      updateFields.final_score_opp = finalScore.opp;
    }
    const { error } = await supabaseClient.from('games').update(updateFields).eq('id', currentGameId);
    if (error) showMsg('gameMsg', 'Phase changed here, but failed to sync to the server: ' + error.message, 'error');
  }

  // Persists exactly where we are in the live flow -- including any
  // in-progress guided step (mid-kickoff, mid-overtime-setup) -- so
  // navigating away and back resumes exactly here instead of guessing
  // from play history, which can silently drop an incomplete kickoff.
  async function persistUiState(){
    const { error } = await supabaseClient.from('games')
      .update({ game_phase: gamePhase, guided_state: guided })
      .eq('id', currentGameId);
    if (error) showMsg('gameMsg', 'State changed here, but failed to sync to the server: ' + error.message, 'error');
  }

  function showClockPrompt(ctx, thenFn){
    clockPrompt = ctx;
    clockPromptCallback = thenFn;
    renderClockPrompt();
    updatePhaseUI();

  function renderClockPrompt(){
    const card = document.getElementById('clockPromptCard');
    if (!clockPrompt){ card.style.display = 'none'; return; }
    card.style.display = 'block';
    let label = '';
    if (clockPrompt.mode === 'transition') label = 'Clock at change of possession — ' + TEAMS[clockPrompt.outgoingTeam].name + ' \u2192 ' + TEAMS[clockPrompt.incomingTeam].name;
    if (clockPrompt.mode === 'start') label = 'Clock at start of ' + TEAMS[clockPrompt.team].name + ' possession';
    if (clockPrompt.mode === 'end') label = 'Clock at end of ' + TEAMS[clockPrompt.team].name + ' possession';
    document.getElementById('clockPromptLabel').textContent = label;
    document.getElementById('clockPromptInput').value = '';
  }
  function resolveClockPrompt(skip){
    const val = document.getElementById('clockPromptInput').value.trim();
    if (!skip && val){
      const q = computeState().quarter;
      const absSec = clockToAbsSeconds(q, val);
      if (absSec === null){
        alert('"' + val + '" isn\'t a valid clock value for this quarter -- check the format (M:SS) and that it doesn\'t exceed the quarter length.');
        return;
      }
      if (!confirmClockAdvances(absSec, val)) return;
      let effect, text;
      if (clockPrompt.mode === 'transition'){
        effect = { clockEvent: { type: 'transition', outgoingTeam: clockPrompt.outgoingTeam, incomingTeam: clockPrompt.incomingTeam, absSec } };
        text = 'Clock — ' + val + ' at change of possession (' + TEAMS[clockPrompt.outgoingTeam].name + ' \u2192 ' + TEAMS[clockPrompt.incomingTeam].name + ')';
      } else if (clockPrompt.mode === 'start'){
        effect = { clockEvent: { type: 'start', team: clockPrompt.team, absSec } };
        text = 'Clock — ' + val + ' start of possession (' + TEAMS[clockPrompt.team].name + ')';
      } else {
        effect = { clockEvent: { type: 'end', team: clockPrompt.team, absSec } };
        text = 'Clock — ' + val + ' end of possession (' + TEAMS[clockPrompt.team].name + ')';
      }
      pushAndPersist({ id: nextId++, text, effect, quarter: q });
    }
    const cb = clockPromptCallback;
    clockPrompt = null;
    clockPromptCallback = null;
    renderAll();
    renderClockPrompt();
    updatePhaseUI();
    if (cb) cb();
  }
  document.getElementById('clockPromptSave').addEventListener('click', () => resolveClockPrompt(false));
  document.getElementById('clockPromptSkip').addEventListener('click', () => resolveClockPrompt(true));
  document.getElementById('clockPromptInput').addEventListener('keydown', e => { if (e.key === 'Enter') resolveClockPrompt(false); });

    const state = computeState();
    const absSec = clockToAbsSeconds(state.quarter, '0:00');
    if (!confirmClockAdvances(absSec, '0:00')) return;
    pushAndPersist({ id: nextId++, text: 'Clock — 0:00 end of possession (' + TEAMS[state.possession].name + ')', effect: { clockEvent: { type: 'end', team: state.possession, absSec } }, quarter: state.quarter });

  document.getElementById('endGameBtn').addEventListener('click', () => {
    const state = computeState();
    if (state.scores.teamA === state.scores.teamB){
      alert('Score is tied ' + state.scores.teamA + '-' + state.scores.teamB + ' — the game can\'t end on a tie. Use "Start overtime" instead.');
      return;
    }
    const ok = confirm('End the game now? Final score: ' + TEAMS.teamA.name + ' ' + state.scores.teamA + ' — ' + TEAMS.teamB.name + ' ' + state.scores.teamB + '.\n\nThis locks in the game as final.');
    if (!ok) return;
    const absSec = clockToAbsSeconds(state.quarter, '0:00');
    if (!confirmClockAdvances(absSec, '0:00')) return;
    pushAndPersist({ id: nextId++, text: 'Clock — 0:00 end of possession (' + TEAMS[state.possession].name + ')', effect: { clockEvent: { type: 'end', team: state.possession, absSec } }, quarter: state.quarter });
    pushAndPersist({ id: nextId++, text: 'Final', effect: {}, isDivider: true });
    gamePhase = 'ended';
    persistUiState();

        pushAndPersist({ id: nextId++, text: 'Quarter marker — start of overtime', effect: { setQuarter: 5 }, quarter: 5 });

      document.getElementById('guidedKickoffSave').addEventListener('click', () => {
        const yds = document.getElementById('gk_yards').value.trim();

        pushAndPersist({ id: nextId++, text, effect: {}, team: guided.kickingTeam, quarter: guided.quarter, roles: { kicker: { team: guided.kickingTeam, num: kickerNum, yards: parseInt(yds)||0 }, playType: 'kickoff' } });

        '<label class="inline" style="margin-left:12px; display:inline-block;">Clock <input type="text" id="guidedReturnClock" placeholder="M:SS or MSS" style="width:80px; margin-left:6px; display:inline-block;"></label>' +
        startingSpotFieldsHtml('gr_spot', 'Ball spot after the return (sets 1st down for ' + TEAMS[guided.receivingTeam].name + ')', guided.receivingTeam) +
        '<div class="row" style="margin-top:10px;"><button class="primary" id="guidedReturnSave">Save return</button></div>';
      let returnerNum = null;
      const getReturnReset = wireStartingSpot(content, 'gr_spot');

      document.getElementById('gr_returner_manual').addEventListener('input', e => { returnerNum = e.target.value.trim(); });
      document.getElementById('guidedReturnSave').addEventListener('click', () => {
        const yds = document.getElementById('gr_yards').value.trim();

        const q = guided.quarter;

        // Validate the clock before anything gets saved, same reasoning
        // as the main save flow -- a rejected value should abort the
        // whole thing, not commit the return and quietly drop the clock.
        const clockVal = document.getElementById('guidedReturnClock').value.trim();
        let clockAbsSec = null;
        if (clockVal){

            return;
          }
          if (!confirmClockAdvances(clockAbsSec, clockVal)) return;
        }

        let text = nameInDefense(guided.receivingTeam, returnerNum) + ' returns ' + yds;
        const effect = { flip: true, flipApplied: true, flipTo: guided.receivingTeam };
        if (td){ text += ' — TOUCHDOWN'; effect.score = { team: guided.receivingTeam, points: 6 }; }
        pushAndPersist({ id: nextId++, text, effect, team: guided.receivingTeam, quarter: guided.quarter, roles: { defense: { team: guided.receivingTeam, num: returnerNum }, playType: 'kickoff_return' } });
        const receivingName = TEAMS[guided.receivingTeam].name;
        const receivingTeamKey = guided.receivingTeam;

        const reset = getReturnReset();
        if (reset && !td){
          pushAndPersist({ id: nextId++, text: 'New drive — ' + ordinal(reset.down) + ' & ' + reset.distance + ' at ' + markerLabel(reset.fieldPos) + ' (' + receivingName + ')', effect: { isReset: true, down: reset.down, distance: reset.distance, fieldPos: reset.fieldPos }, quarter: q });
        }
        gamePhase = guided.targetPhase;
        guided = { active: false, quarter: null, kickingTeam: null, receivingTeam: null, step: null, targetPhase: null };
        persistUiState();
        renderAll(); renderGuided(); updatePhaseUI();
        if (reset && !td){
          document.getElementById('code').placeholder = '15p 22 25 7';

          document.getElementById('code').placeholder = '1 10 -20 — set the starting spot for ' + receivingName;
        }
      });
      return;
    }

  function startingSpotFieldsHtml(idPrefix, label, driveTeamKey){
    const driveTeamLabel = driveTeamKey ? TEAMS[driveTeamKey].name + "'s side" : 'Our side';
    const otherTeamLabel = driveTeamKey ? TEAMS[otherTeam(driveTeamKey)].name + "'s side" : 'Their side';
    return '<p style="font-size:13px; color:#888; margin:8px 0 4px;">' + (label || 'Starting spot for the ensuing drive (optional — leave blank to set later)') + '</p>' +
      '<button type="button" class="' + idPrefix + '_side" data-side="own">' + driveTeamLabel + '</button> ' +
      '<button type="button" class="' + idPrefix + '_side" data-side="opp">' + otherTeamLabel + '</button> ' +
      '<input type="text" id="' + idPrefix + '_yardline" style="width:70px; display:inline-block;" placeholder="Yard line">';
  }
  function wireStartingSpot(container, idPrefix){
    let side = null;
    container.querySelectorAll('.' + idPrefix + '_side').forEach(b => b.addEventListener('click', () => {
      side = b.dataset.side;
      container.querySelectorAll('.' + idPrefix + '_side').forEach(x => x.style.background = '');
      b.style.background = '#e6f1fb';
    }));
    return function getReset(){
      const yardlineEl = document.getElementById(idPrefix + '_yardline');
      const yardline = yardlineEl ? yardlineEl.value.trim() : '';
      if (!side || !yardline) return null;
      const fieldPos = side === 'own' ? Math.abs(parseInt(yardline)) : (100 - parseInt(yardline));
      const distance = Math.min(10, 100 - fieldPos);
      return { down: 1, distance, fieldPos };
    };
  }

  function buildAndReview(type, sel){
    const yards = (id) => (document.getElementById(id) ? document.getElementById(id).value.trim() : '');
    const td = document.getElementById('pp_td') && document.getElementById('pp_td').checked;
    let code = '', roles = null;
    const state = computeState();
    const off = state.possession, def = otherTeam(state.possession);

    if (type === 'rush'){
      if (!sel.carrier) return;
      const yds = yards('pp_yards') || '0';
      const fumbled = document.getElementById('pp_rush_fumbled').checked;
      if (fumbled){
        // The gain genuinely happened before the fumble -- save it as
        // its own play first, silently, then let the rest of this
        // branch build a Fumble-type play for the turnover itself.
        const rushParsed = parseInput(sel.carrier + 'r ' + yds, computeState());
        pushAndPersist({ id: nextId++, text: rushParsed.text, effect: rushParsed.effect, team: off, quarter: computeState().quarter,
          roles: { carrier: { team: off, num: sel.carrier, yards: parseInt(yds)||0 }, playType: 'rush' } });
        const rec = document.querySelector('input[name=pp_rush_fumrec]:checked').value;
        if (rec === 'own'){
          const isRushFumSafety = document.getElementById('pp_rushfum_safety').checked;
          code = sel.carrier + 'f' + (isRushFumSafety ? ' sf' : '');
          roles = { carrier: { team: off, num: sel.carrier }, playType: 'fumble' };
        } else {
          const fumCredit = sel.credit;
          if (!fumCredit) return;
          const retyds = yards('pp_rushfum_retyds');
          const returnTd = document.getElementById('pp_rushfum_td').checked;
          code = sel.carrier + 'f ' + fumCredit + (retyds ? ' ' + retyds : '') + (returnTd ? ' td' : '');
          roles = { carrier: { team: off, num: sel.carrier }, defense: { team: def, num: fumCredit }, playType: 'fumble' };
        }
      } else {
        const isRushSafety = document.getElementById('pp_rush_safety').checked;
        code = sel.carrier + 'r ' + yds + (sel.credit ? ' ' + sel.credit : '') + (isRushSafety ? ' sf' : (td ? ' td' : ''));
        roles = { carrier: { team: off, num: sel.carrier, yards: parseInt(yds)||0 } };
        if (sel.credit) roles.defense = { team: def, num: sel.credit };
      }
    } else if (type === 'pass'){
      if (!sel.passer || !sel.receiver) return;
      const isIncomplete = document.getElementById('pp_incomplete') && document.getElementById('pp_incomplete').checked;
      if (isIncomplete){
        code = sel.passer + 'i ' + sel.receiver;
        roles = { passer: { team: off, num: sel.passer, yards: 0 }, receiver: { team: off, num: sel.receiver, yards: 0 }, playType: 'incomplete' };
      } else {
        const yds = yards('pp_yards') || '0';
        const fumbled = document.getElementById('pp_pass_fumbled').checked;
        if (fumbled){
          // The catch and yardage genuinely happened before the fumble --
          // save the completion as its own play first, silently, then
          // let the rest of this branch build a Fumble-type play for
          // the receiver, same as the Rush panel's equivalent.
          const passParsed = parseInput(sel.passer + 'p ' + sel.receiver + ' ' + yds, computeState());
          pushAndPersist({ id: nextId++, text: passParsed.text, effect: passParsed.effect, team: off, quarter: computeState().quarter,
            roles: { passer: { team: off, num: sel.passer, yards: parseInt(yds)||0 }, receiver: { team: off, num: sel.receiver, yards: parseInt(yds)||0 }, playType: 'pass' } });

          if (rec === 'own'){

            code = sel.receiver + 'f' + (isPassFumSafety ? ' sf' : '');
            roles = { carrier: { team: off, num: sel.receiver }, playType: 'fumble' };
          } else {
            const fumCredit = sel.credit;
            if (!fumCredit) return;
            const retyds = yards('pp_passfum_retyds');
            const returnTd = document.getElementById('pp_passfum_td').checked;
            code = sel.receiver + 'f ' + fumCredit + (retyds ? ' ' + retyds : '') + (returnTd ? ' td' : '');
            roles = { carrier: { team: off, num: sel.receiver }, defense: { team: def, num: fumCredit }, playType: 'fumble' };

          const isPassSafety = document.getElementById('pp_pass_safety').checked;
          code = sel.passer + 'p ' + sel.receiver + ' ' + yds + (sel.credit ? ' ' + sel.credit : '') + (isPassSafety ? ' sf' : (td ? ' td' : ''));

      if (!sel.passer) return;

      const fumbled = document.getElementById('pp_sack_fumbled').checked;
      if (fumbled){

        // -- save it as its own play first, silently, then build a
        // Fumble-type play for the turnover itself.
        const sackParsed = parseInput(sel.passer + 's ' + yds, computeState());
        pushAndPersist({ id: nextId++, text: sackParsed.text, effect: sackParsed.effect, team: off, quarter: computeState().quarter,
          roles: { passer: { team: off, num: sel.passer, yards: parseInt(yds)||0 }, playType: 'sack' } });
        const rec = document.querySelector('input[name=pp_sack_fumrec]:checked').value;

        roles = { passer: { team: off, num: sel.passer, yards: parseInt(yds)||0 } };
        if (sel.credit) roles.defense = { team: def, num: sel.credit };
      }
    } else if (type === 'int'){
      if (!sel.passer || !sel.credit) return;
      const yds = yards('pp_yards');
      code = sel.passer + 'x ' + sel.credit + (yds ? ' ' + yds : '') + (td ? ' td' : '');
      roles = { passer: { team: off, num: sel.passer }, defense: { team: def, num: sel.credit } };
    } else if (type === 'fumble'){
      if (!sel.carrier) return;
      const rec = document.querySelector('input[name=pp_fumrec]:checked').value;

        roles = { carrier: { team: off, num: sel.carrier } };
      }
      else {
        if (!sel.credit) return;
        const yds = yards('pp_yards');
        code = sel.carrier + 'f ' + sel.credit + (yds ? ' ' + yds : '') + (td ? ' td' : '');
        roles = { carrier: { team: off, num: sel.carrier }, defense: { team: def, num: sel.credit } };
      }
    } else if (type === 'safety'){
      code = 'sf' + (sel.credit ? ' ' + sel.credit : '');
      roles = sel.credit ? { defense: { team: def, num: sel.credit }, playType: 'safety' } : null;
    } else if (type === 'kickoff'){
      if (!sel.kicker) return;
      const yds = yards('pp_yards') || '0';
      const isTouchback = document.getElementById('pp_ko_touchback').checked;
      if (isTouchback){
        code = sel.kicker + 'ko ' + yds + ' tb';
        roles = { kicker: { team: off, num: sel.kicker, yards: parseInt(yds)||0, touchback: true } };
      } else {
        const retyds = yards('pp_retyds');
        code = sel.kicker + 'ko ' + yds + (sel.credit ? ' ' + sel.credit + (retyds ? ' ' + retyds : ' 0') : '') + (td ? ' td' : '');
        roles = { kicker: { team: off, num: sel.kicker, yards: parseInt(yds)||0 } };
        if (sel.credit) roles.defense = { team: def, num: sel.credit };
      }
    } else if (type === 'punt'){
      const blocked = document.getElementById('pp_blocked').checked;
      if (!sel.punter) return;
      if (blocked){
        const blockRec = document.querySelector('input[name=pp_punt_blockrec]:checked').value;
        if (blockRec === 'own'){
          const isPuntSafety = document.getElementById('pp_punt_safety').checked;
          code = sel.punter + 'pbo' + (isPuntSafety ? ' sf' : '');
          roles = { punter: { team: off, num: sel.punter, yards: 0, blocked: true } };
        } else {
          if (!sel.credit) return;
          const retyds = yards('pp_blockretyds');
          code = sel.punter + 'pb ' + sel.credit + (retyds ? ' ' + retyds : '') + (td ? ' td' : '');
          roles = { punter: { team: off, num: sel.punter, yards: 0, blocked: true } };
          roles.defense = { team: def, num: sel.credit };
        }
      } else {
        const yds = yards('pp_yards') || '0';
        const retyds = yards('pp_retyds');
        code = sel.punter + 'pt ' + yds + (sel.credit ? ' ' + sel.credit + (retyds ? ' ' + retyds : ' 0') : '') + (td ? ' td' : '');
        roles = { punter: { team: off, num: sel.punter, yards: parseInt(yds)||0, blocked: false } };
        if (sel.credit) roles.defense = { team: def, num: sel.credit };
      }
    } else if (type === 'fg'){
      if (!sel.kicker) return;
      const yds = yards('pp_yards') || '0';
      const blocked = document.getElementById('pp_fg_blocked_cb').checked;
      const res = blocked ? 'b' : document.querySelector('input[name=pp_fgres]:checked').value;
      if (res === 'b'){
        const retyds = yards('pp_blockretyds');
        code = sel.kicker + 'fg b' + (sel.credit ? ' ' + sel.credit : '') + (retyds ? ' ' + retyds : '') + (td ? ' td' : '');
      } else {
        code = sel.kicker + 'fg ' + yds + ' ' + res;
      }
      roles = { kicker: { team: off, num: sel.kicker, yards: parseInt(yds)||0, result: res } };
      if (sel.credit) roles.defense = { team: def, num: sel.credit };
    } else if (type === 'pat'){
      if (!sel.kicker) return;
      const blocked = document.getElementById('pp_pat_blocked_cb').checked;
      const res = blocked ? 'b' : document.querySelector('input[name=pp_patres]:checked').value;
      if (res === 'b'){
        const twoPt = document.getElementById('pp_pat_2pt').checked;
        const retyds = yards('pp_yards');
        code = sel.kicker + 'pa b' + (sel.credit ? ' ' + sel.credit : '') + (retyds ? ' ' + retyds : '') + (twoPt ? ' td' : '');
      } else {
        code = sel.kicker + 'pa ' + res;
      }
      roles = { kicker: { team: off, num: sel.kicker, result: res } };
      if (sel.credit) roles.defense = { team: def, num: sel.credit };
    } else if (type === 'twopt'){
      const sub = document.getElementById('playPanel').dataset.twoptSub || 'rush';
      if (sub === 'rush'){
        if (!sel.carrier) return;
        const res = document.querySelector('input[name=pp_2pt_rush_res]:checked').value;
        if (res === 'b'){
          const defTd = document.getElementById('pp_2pt_rush_defTd').checked;
          code = sel.carrier + 'tpr b' + (sel.credit ? ' ' + sel.credit : '') + (defTd ? ' td' : '');
        } else {
          code = sel.carrier + 'tpr ' + res;
        }
        roles = { carrier: { team: off, num: sel.carrier, result: res } };
        if (sel.credit) roles.defense = { team: def, num: sel.credit };
      } else {
        if (!sel.passer || !sel.receiver) return;
        const res = document.querySelector('input[name=pp_2pt_pass_res]:checked').value;
        if (res === 'b'){
          const defTd = document.getElementById('pp_2pt_pass_defTd').checked;
          code = sel.passer + 'tpp ' + sel.receiver + ' b' + (sel.credit ? ' ' + sel.credit : '') + (defTd ? ' td' : '');
        } else {
          code = sel.passer + 'tpp ' + sel.receiver + ' ' + res;
        }
        roles = { passer: { team: off, num: sel.passer, result: res }, receiver: { team: off, num: sel.receiver, result: res } };
        if (sel.credit) roles.defense = { team: def, num: sel.credit };
      }
    }

    if (!code) return;
    if (roles) roles.playType = roles.playType || type;
    document.getElementById('code').value = code;
    showConfirm();
    if (pending){
      pending.roles = roles;
      pending.reset = (currentSpotGetter && !td) ? currentSpotGetter() : null;
    }
  }

  function showConfirm(){
    const val = document.getElementById('code').value;
    if (!val) return;
    const state = computeState();
    pending = parseInput(val, state);
    const warningEl = document.getElementById('fieldPosWarning');
    warningEl.style.display = 'none';
    if (!pending){
      document.getElementById('parsedText').textContent = 'Unrecognized entry.';
      document.getElementById('flipRow').style.display = 'none';
      document.getElementById('confirmClockRow').style.display = 'none';
    } else {
      document.getElementById('parsedText').textContent = pending.text;
      // A gain that reaches or passes the goal line should always be a
      // touchdown -- field position itself is clamped at 0/100 elsewhere,
      // but that clamp doesn't stop a play's own recorded yardage from
      // being logged at its full, unclamped value if TD wasn't checked,
      // which silently inflates both the player's stats and drive totals.
      // The maximum possible gain on any single play is capped by the
      // actual distance to the goal line -- the play physically ends
      // there, whether it's a touchdown or not. That's a fundamentally
      // different check from "reached the goal line but TD wasn't
      // checked" below: exceeding the field is impossible no matter how
      // the play is marked, so it must warn regardless of TD status.
      const gain = pending.effect && typeof pending.effect.statYds === 'number' ? pending.effect.statYds : 0;
      const distToGoal = state.fieldPos !== null ? 100 - state.fieldPos : null;
      if (gain > 0 && distToGoal !== null && gain > distToGoal){
        warningEl.textContent = '⚠️ This gain (' + gain + ' yds) is more than possible here -- only ' + distToGoal + ' yds to the goal line. The maximum this play could have gained is ' + distToGoal + ' yds.';
        warningEl.style.display = 'block';
      } else if (gain > 0 && distToGoal !== null && gain === distToGoal && !pending.effect.td){
        warningEl.textContent = '⚠️ This gain (' + gain + ' yds) reaches the goal line exactly -- only ' + distToGoal + ' yds away. If this scored, go back and check the touchdown box first.';
        warningEl.style.display = 'block';
      }
      if (pending.flipEligible){
        document.getElementById('flipRow').style.display = 'flex';
        document.getElementById('flipLabel').textContent = 'Change of possession — ' + TEAMS[pending.flipTo].name + ' ball';
        document.getElementById('flipCheck').checked = true;
      } else {
        document.getElementById('flipRow').style.display = 'none';
      }
      const needsClock = pending.flipEligible || (pending.effect && pending.effect.endsDrive);
      document.getElementById('confirmClockRow').style.display = needsClock ? 'flex' : 'none';
      if (needsClock) document.getElementById('confirmClockInput').value = '';
    }
    document.getElementById('confirmCard').style.display = 'block';
    const cc = document.getElementById('confirmCard');
    if (cc.scrollIntoView) try { cc.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch(e){}
  }

  document.getElementById('editBtn').addEventListener('click', () => {
    document.getElementById('confirmCard').style.display = 'none';
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    if (!pending) return;
    const preState = computeState();
    const effect = Object.assign({}, pending.effect);
    let flipHappened = false, outgoingTeam = null, incomingTeam = null;
    if (pending.flipEligible){
      const confirmed = document.getElementById('flipCheck').checked;
      effect.flip = true;
      effect.flipTo = pending.flipTo;
      effect.flipApplied = confirmed;
      if (confirmed){ flipHappened = true; outgoingTeam = preState.possession; incomingTeam = pending.flipTo; }
    }

    // Validate the clock before anything gets saved. A rejected value
    // aborts the whole save here, rather than committing the play and
    // silently dropping just the clock marker afterward -- so declining
    // genuinely means "go back and fix it," not "save without a clock."
    const clockVal = document.getElementById('confirmClockInput').value.trim();
    let clockAbsSec = null;
    if (clockVal){
      const q0 = computeState().quarter;
      clockAbsSec = clockToAbsSeconds(q0, clockVal);
      if (clockAbsSec === null){
        alert('"' + clockVal + '" isn\'t a valid clock value for this quarter. Check the format (M:SS) and that it doesn\'t exceed the quarter length. Nothing was saved -- fix the clock value and try again.');
        return;
      }
      if (!confirmClockAdvances(clockAbsSec, clockVal)) return;
    }

    pushAndPersist({ id: nextId++, text: pending.text, effect, unresolved: !!pending.unresolved, team: pending.team || null, quarter: pending.quarter || computeState().quarter, roles: pending.roles || null });

    if (clockVal && clockAbsSec !== null){
      const q = computeState().quarter;
      const absSec = clockAbsSec;
      if (flipHappened){
        pushAndPersist({ id: nextId++, text: 'Clock — ' + clockVal + ' at change of possession (' + TEAMS[outgoingTeam].name + ' \u2192 ' + TEAMS[incomingTeam].name + ')', effect: { clockEvent: { type: 'transition', outgoingTeam, incomingTeam, absSec } }, quarter: q });
      }
      if (effect.endsDrive){
        const scoringTeam = effect.score ? effect.score.team : preState.possession;
        pushAndPersist({ id: nextId++, text: 'Clock — ' + clockVal + ' end of possession (' + TEAMS[scoringTeam].name + ')', effect: { clockEvent: { type: 'end', team: scoringTeam, absSec } }, quarter: q });
      } else if (flipHappened && effect.score && effect.score.points === 6){
        pushAndPersist({ id: nextId++, text: 'Clock — ' + clockVal + ' end of possession (' + TEAMS[effect.score.team].name + ')', effect: { clockEvent: { type: 'end', team: effect.score.team, absSec } }, quarter: q });
      }
    }
    if (pending.reset && flipHappened){
      const q2 = computeState().quarter;
      pushAndPersist({ id: nextId++, text: 'New drive — ' + ordinal(pending.reset.down) + ' & ' + pending.reset.distance + ' at ' + markerLabel(pending.reset.fieldPos) + ' (' + TEAMS[incomingTeam].name + ')', effect: { isReset: true, down: pending.reset.down, distance: pending.reset.distance, fieldPos: pending.reset.fieldPos }, quarter: q2 });
    }
    renderAll();
    document.getElementById('confirmCard').style.display = 'none';
    document.getElementById('playPanel').style.display = 'none';
    document.getElementById('playPanel').innerHTML = '';
    document.getElementById('code').value = '';
    pending = null;
    if (window.scrollTo) try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch(e){}
  });

  document.getElementById('driveUtilBtn').addEventListener('click', () => {
    document.getElementById('confirmCard').style.display = 'none';
    const panel = document.getElementById('playPanel');
    panel.style.display = 'block';
    const driveTeam = computeState().possession;
    const driveTeamLabel = TEAMS[driveTeam].name + "'s side";
    const otherTeamLabel = TEAMS[otherTeam(driveTeam)].name + "'s side";
    panel.innerHTML =
      '<p style="font-size:13px; color:#888; margin:0 0 6px;">New drive / correct down</p>' +
      '<div style="margin-bottom:8px;"><span style="font-size:13px; margin-right:6px;">Down</span>' +
      ['1','2','3','4'].map(d => '<button type="button" class="driveDownBtn" data-d="' + d + '">' + (d==='1'?'1st':d==='2'?'2nd':d==='3'?'3rd':'4th') + '</button>').join(' ') + '</div>' +
      '<label class="inline">Distance <input type="text" id="drive_dist" style="width:60px; display:inline-block;"></label>' +
      '<div style="margin-top:8px;"><button type="button" class="driveSideBtn" data-side="own">' + driveTeamLabel + '</button> <button type="button" class="driveSideBtn" data-side="opp">' + otherTeamLabel + '</button> ' +
      '<input type="text" id="drive_yardline" style="width:70px; display:inline-block;" placeholder="Yard line"></div>' +
      '<div class="row" style="margin-top:12px;"><button class="primary" id="drive_review">Review</button><button class="secondary" id="drive_clear">Clear</button></div>';
    if (panel.scrollIntoView) try { panel.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch(e){}
    let down = null, side = null;
    panel.querySelectorAll('.driveDownBtn').forEach(b => b.addEventListener('click', () => {
      down = b.dataset.d;
      panel.querySelectorAll('.driveDownBtn').forEach(x => x.style.background = '');
      b.style.background = '#e6f1fb';
    }));
    panel.querySelectorAll('.driveSideBtn').forEach(b => b.addEventListener('click', () => {
      side = b.dataset.side;
      panel.querySelectorAll('.driveSideBtn').forEach(x => x.style.background = '');
      b.style.background = '#e6f1fb';
    }));
    document.getElementById('drive_clear').addEventListener('click', () => document.getElementById('driveUtilBtn').click());
    document.getElementById('drive_review').addEventListener('click', () => {
      const dist = document.getElementById('drive_dist').value.trim();
      const yardline = document.getElementById('drive_yardline').value.trim();
      if (!down || !side || !dist || !yardline) return;
      const marker = side === 'own' ? ('-' + yardline) : yardline;
      document.getElementById('code').value = down + ' ' + dist + ' ' + marker;
      showConfirm();
    });
  });

  document.getElementById('quarterUtilBtn').addEventListener('click', () => {
    document.getElementById('confirmCard').style.display = 'none';
    const panel = document.getElementById('playPanel');
    panel.style.display = 'block';
    panel.innerHTML = '<p style="font-size:13px; color:#888; margin:0 0 6px;">Mark start of quarter</p>' +
      ['2','3','4'].map(q => '<button type="button" class="qMarkBtn" data-q="' + q + '">Start Q' + q + '</button>').join(' ');
    if (panel.scrollIntoView) try { panel.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch(e){}
    panel.querySelectorAll('.qMarkBtn').forEach(b => b.addEventListener('click', () => {
      document.getElementById('code').value = 'q' + b.dataset.q;
      showConfirm();
    }));
  });

  document.getElementById('undoBtn').addEventListener('click', async () => {
    if (!plays.length) return;
    const removed = plays.pop();
    renderAll();
    // The game isn't finalized, so the database allows this delete -- but
    // only bother if this play actually made it to the server in the
    // first place (it has a real sequence number).
    if (removed._seq){
      const { error } = await supabaseClient.from('plays').delete()
        .eq('game_id', currentGameId).eq('sequence_number', removed._seq);
      if (error){
        showMsg('gameMsg', 'Removed here, but failed to remove from the server: ' + error.message, 'error');
      }
    }
  });

  document.getElementById('penUtilBtn').addEventListener('click', () => {
    document.getElementById('confirmCard').style.display = 'none';
    const panel = document.getElementById('playPanel');
    panel.style.display = 'block';
    panel.innerHTML =
      '<p class="hint">Penalty</p>' +
      '<button type="button" class="penTeamBtn" data-team="off">On offense</button> ' +
      '<button type="button" class="penTeamBtn" data-team="def">On defense</button>' +
      '<div style="margin-top:8px;"><label class="inline">Yards <input type="text" id="pen_yds" style="width:70px; display:inline-block; margin-left:6px;"></label></div>' +
      '<div class="row" style="margin-top:12px;"><button class="primary" id="pen_review">Review</button><button class="secondary" id="pen_clear">Clear</button></div>';
    if (panel.scrollIntoView) try { panel.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch(e){}
    let penTeam = null;
    panel.querySelectorAll('.penTeamBtn').forEach(b => b.addEventListener('click', () => {
      penTeam = b.dataset.team;
      panel.querySelectorAll('.penTeamBtn').forEach(x => x.style.background = '');
      b.style.background = '#e6f1fb';
    }));
    document.getElementById('pen_clear').addEventListener('click', () => document.getElementById('penUtilBtn').click());
    document.getElementById('pen_review').addEventListener('click', () => {
      const yds = document.getElementById('pen_yds').value.trim();
      if (!penTeam || !yds) return;
      const code = (penTeam === 'off' ? 'po' : 'pd') + ' ' + yds;
      document.getElementById('code').value = code;
      showConfirm();
    });
  });

  document.getElementById('flipBtn').addEventListener('click', () => {
    const state = computeState();
    const outgoingTeam = state.possession, incomingTeam = otherTeam(state.possession);
    pushAndPersist({ id: nextId++, text: 'Manual flip — possession to ' + TEAMS[incomingTeam].name, effect: { forcePossession: incomingTeam } });
    renderAll();
    showClockPrompt({ mode: 'transition', outgoingTeam, incomingTeam }, () => { document.getElementById('code').focus(); });
  });

  function populateInsertOptions(){
    const sel = document.getElementById('insertAfter');
    sel.innerHTML = '<option value="start">— beginning of log —</option>' +
      plays.map(p => '<option value="' + p.id + '">after: ' + p.text.slice(0, 60) + '</option>').join('');
    sel.value = plays.length ? plays[plays.length - 1].id : 'start';
  }

  document.getElementById('manualBtn').addEventListener('click', () => {
    populateInsertOptions();
    document.getElementById('manualPanel').style.display = 'block';
  });
  document.getElementById('cancelManual').addEventListener('click', () => {
    document.getElementById('manualPanel').style.display = 'none';
    document.getElementById('manualText').value = '';
  });
  document.getElementById('saveManual').addEventListener('click', async () => {
    const text = document.getElementById('manualText').value;
    if (!text) return;
    const afterVal = document.getElementById('insertAfter').value;
    const entry = { id: nextId++, text, unresolved: true, effect: {} };

    // Manual entry can land anywhere in the log, not just the end, so it
    // needs its own fractional sequence number between whatever it's
    // being inserted between -- this is exactly what the NUMERIC (not
    // integer) sequence_number column exists to support.
    let insertIdx, seq;
    if (afterVal === 'start'){
      insertIdx = 0;
      const firstSeq = plays.length ? (plays[0]._seq || 1) : 1;
      seq = firstSeq > 1 ? firstSeq - 0.5 : firstSeq / 2;
    } else {
      const idx = plays.findIndex(p => p.id === parseInt(afterVal));
      insertIdx = idx + 1;
      const beforeSeq = plays[idx] ? (plays[idx]._seq || nextSequenceNumber - 1) : nextSequenceNumber - 1;
      const afterSeq = plays[idx + 1] ? plays[idx + 1]._seq : null;
      seq = afterSeq ? (beforeSeq + afterSeq) / 2 : null;
    }
    entry._seq = seq;
    plays.splice(insertIdx, 0, entry);
    renderAll();
    document.getElementById('manualPanel').style.display = 'none';
    document.getElementById('manualText').value = '';

    if (seq === null){
      // Inserting at the very end -- just use the normal next sequence.
      persistPlay(entry);
    } else {
      const { error } = await supabaseClient.from('plays').insert({
        game_id: currentGameId, quarter: computeState().quarter, sequence_number: seq,
        team_side: null, text: entry.text, effect: {}, roles: null, unresolved: true
      });
      if (error) showMsg('gameMsg', 'Saved here, but failed to sync to the server: ' + error.message, 'error');
    }
  });

</script>
</body>
</html>
