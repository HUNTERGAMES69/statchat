<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="logo.png" type="image/png">
<link rel="stylesheet" href="statchat.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StatChat — Score Summary</title>
<style>
  /* SCORE SUMMARY — a second crew view.
     Renamed from view2.html on 30 August 2026, when it got an entry point
     off the dashboard row menu. "view2" said nothing about what it holds
     and was only ever a working name.
     ===================================================================
     The main crew view swaps its top-right quad to a scoring summary at
     halftime and at the final whistle. This is that summary given a whole
     screen, with the drive that produced each score attached to it.

     WHY A SEPARATE PAGE rather than a mode of view.html: the two are
     watched at different moments by different people. The crew view is
     live and changes every play; this is a reference a booth glances at
     between series. Cramming both into one page would mean one of them
     compromising, and the quad grid has no room for eighteen rows.

     SIZED FOR EIGHTEEN. A game reaching double overtime scores about that
     many times and it is the number that has to fit without scrolling --
     a booth cannot scroll a reference during a broadcast. Everything else
     gave way to that: two columns of nine, and the type tuned until 18
     rows fit at 1920x1080.

     Scaled the same way as view.html: a fixed 1920x1080 sheet with a
     transform, so it behaves identically on whatever the booth monitor
     happens to be. */
  html, body { height:100%; margin:0; box-sizing:border-box; overflow:hidden; }
  body { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
         background:#0d1117; width:100vw; height:100vh;
         display:flex; align-items:center; justify-content:center; }

  .sheet { width:1920px; height:1080px; box-sizing:border-box; padding:22px 30px;
           display:flex; flex-direction:column; background:#0d1117;
           transform-origin:center center; flex-shrink:0; }

  .shead { display:flex; align-items:baseline; justify-content:space-between;
           margin-bottom:12px; flex:0 0 auto; }
  .stitle { font-size:26px; font-weight:700; letter-spacing:.06em;
            text-transform:uppercase; color:#8d99a6; }
  .sfinal { font-size:34px; font-weight:800; color:#eef1f4;
            font-variant-numeric:tabular-nums; }
  .sphase { font-size:22px; color:#8d99a6; font-weight:600; margin-left:10px; }

  /* TWO COLUMNS OF NINE, filled DOWN then ACROSS so the order still reads
     chronologically. One column of eighteen gives 50px a row, which is a
     table rather than something readable across a booth. */
  .slist { flex:1 1 auto; display:grid; grid-template-columns:1fr 1fr;
           grid-auto-flow:column; grid-template-rows:repeat(9, 1fr);
           gap:10px 22px; min-height:0; }

  .srow { display:grid; grid-template-columns:58px 48px 1fr 128px;
          align-items:center; gap:14px; background:#161b22;
          border:1px solid #2b333d; border-radius:8px;
          padding:10px 16px; min-height:0; }
  .srow.alt { background:#12171e; }

  .q { font-size:18px; font-weight:700; color:#8d99a6; letter-spacing:.05em; }
  /* The clock a score happened at, under its quarter. Gold, matching
     every other clock reading in the app; tabular so a column of them
     lines up. */
  .qclock { font-size:15px; font-weight:700; color:#ffc72c; letter-spacing:0;
            margin-top:2px; font-variant-numeric:tabular-nums; }
  .slogo { width:48px; height:48px; border-radius:7px; display:block;
           object-fit:contain; background:#0d1117; }
  .slogo.blank { background:#2b333d; }
  .sbody { min-width:0; }

  /* NO TEAM NAME IN THE PLAY LINE. The logo beside it says the same thing
     and the words cost about 130px, which truncated ten of eighteen rows
     in the narrower column. Without them nothing truncates and the line
     can take a second row where it needs one. */
  .sline { font-size:24px; font-weight:700; color:#eef1f4; line-height:1.22;
           display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
           overflow:hidden; }
  .k { font-size:17px; color:#8d99a6; font-weight:500; }

  /* The drive behind the score, inline so a row stays one band tall. */
  .mini-row { display:flex; gap:22px; margin-top:6px; }
  .mini { display:flex; align-items:baseline; gap:6px; }
  .mini-l { font-size:12px; letter-spacing:.08em; text-transform:uppercase;
            color:#6f7d8c; font-weight:700; }
  .mini-v { font-size:18px; color:#cfd8e3; font-weight:600;
            font-variant-numeric:tabular-nums; }

  .sscore { font-size:32px; font-weight:800; color:#eef1f4; text-align:right;
            font-variant-numeric:tabular-nums; }

  .empty { display:flex; align-items:center; justify-content:center;
           height:100%; font-size:40px; font-weight:700; color:#3d4854; }

  /* Copyright: absolute, as on the crew view. `body` centres its child with
     flex, so a paragraph in the flow becomes a second flex item and pushes
     the sheet sideways. Learned on view.html and login.html. */
  .sc-copyright { position:absolute; right:6px; bottom:2px; margin:0; padding:0;
    font-size:9px; line-height:1.2; color:#8d99a6; opacity:.4; text-align:right;
    white-space:nowrap; pointer-events:none; z-index:1; }

  /* =====================================================================
     PHONE AND TABLET. Added 30 August 2026 with the rename from view2.
     =====================================================================
     Everything above this block describes a BOOTH MONITOR: a fixed
     1920x1080 sheet, transform-scaled to the viewport, eighteen rows in
     two columns of nine, sized so nothing scrolls. That is the right
     surface for a control room and completely wrong for a phone --
     min(390/1920, 844/1080) scales the sheet to 20%, which is a picture
     of a page rather than a page.

     So below 1280px the fixed sheet is abandoned rather than shrunk. The
     sheet becomes fluid, the rows flow, and THE PAGE SCROLLS. Losing the
     no-scrolling rule is deliberate: it exists because a booth cannot
     scroll a reference mid-broadcast, and a person holding a phone
     scrolls without being asked.

     1280px is the boundary because it is where the scaled sheet stops
     being readable. An iPad Pro landscape (1366x1024) scales to 0.71 and
     keeps 24px text at 17px, which is fine; an iPad Air landscape
     (1180x820) scales to 0.61 and lands at under 15px, which is not.
     Both those numbers were measured, not guessed.
     ===================================================================== */
  @media (max-width: 1279px){
    /* The booth rules that have to be undone, one by one, rather than a
       blanket reset -- .sheet's own colors, font and flex direction are
       still wanted. */
    html, body { height:auto; overflow:auto; -webkit-text-size-adjust:100%; }
    body { display:block; width:auto; height:auto;
           /* The home-indicator strip on a phone, and the notch in
              landscape. Without these the last row sits under the bar. */
           padding:0 0 env(safe-area-inset-bottom);
           padding-left:env(safe-area-inset-left);
           padding-right:env(safe-area-inset-right); }
    /* transform is set INLINE by fitSheet(), so it can only be beaten
       inline or with !important. fitSheet clears it on this path -- this
       is the belt to that braces, for the first paint before any script
       has run. */
    .sheet { width:auto; height:auto; padding:14px 14px 28px;
             transform:none !important; }

    .shead { flex-wrap:wrap; gap:4px 12px; margin-bottom:10px; }
    .stitle { font-size:17px; }
    .sfinal { font-size:26px; }
    .sphase { font-size:16px; }

    /* ONE COLUMN, ROWS IN SOURCE ORDER. The booth grid fills DOWN then
       ACROSS, which only reads chronologically when there are exactly
       two columns of nine. Auto-flow row with a single column puts them
       back in plain order. */
    .slist { display:grid; grid-template-columns:1fr; grid-auto-flow:row;
             grid-template-rows:none; gap:8px; }

    /* Rows size to content now: a fixed 1fr row was how eighteen of them
       divided a fixed sheet, and there is no fixed sheet here. */
    .srow { grid-template-columns:40px 34px 1fr auto; gap:10px;
            padding:9px 11px; align-items:start; }
    .q { font-size:14px; padding-top:2px; }
    .qclock { font-size:12px; }
    .slogo { width:34px; height:34px; }
    .sline { font-size:16px; -webkit-line-clamp:3; }
    .k { font-size:13px; }
    .sscore { font-size:20px; padding-top:1px; }

    /* The drive strip wraps instead of overflowing. On the booth sheet it
       is one line in a 609px column; on a phone it is four facts in
       roughly 240px and has to be allowed to take two lines. */
    .mini-row { flex-wrap:wrap; gap:4px 14px; margin-top:5px; }
    .mini-l { font-size:10px; }
    .mini-v { font-size:15px; }

    .empty { height:auto; padding:40px 0; font-size:24px; }

    /* Absolute against a page that now scrolls would pin it to the
       viewport top-left region rather than the foot of the content. */
    .sc-copyright { position:static; text-align:center; margin:14px 0 0;
                    white-space:normal; }
  }

  /* TABLET LANDSCAPE — two columns again, because the width is there.
     Still fluid and still scrolling; this only stops a 1100px-wide screen
     from rendering one very long column of half-empty rows. */
  @media (min-width: 900px) and (max-width: 1279px){
    .slist { grid-template-columns:1fr 1fr; gap:8px 18px; }
    .sline { font-size:17px; -webkit-line-clamp:2; }
    .srow { grid-template-columns:44px 38px 1fr auto; }
    .slogo { width:38px; height:38px; }
    .sscore { font-size:22px; }
  }
</style>
</head>
<body>
  <div class="sheet" id="sheet">
    <div class="shead">
      <div class="stitle" id="title">Scoring</div>
      <div><span class="sfinal" id="finalScore">&nbsp;</span><span class="sphase" id="phase"></span></div>
    </div>
    <div class="slist" id="list"></div>
  </div>
  <p class="sc-copyright">&copy; 2026 StatChat</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="team-icon.js"></script>
<script src="engine.js"></script>
<script>
  const SUPABASE_URL = 'https://pboushzlcyfkssojpuut.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_VGnUYurlkoH1yi67jHO6iQ_C8Q0EM2d';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  let plays = [], currentGameId = null, startingPossession = 'teamA';
  let quarterLengthSec = 720, gameLabel = '';
  const TEAMS = { teamA:null, teamB:null };
  const PENALTIES = {};
  function otherTeam(t){ return t === 'teamA' ? 'teamB' : 'teamA'; }
  const TIMEOUTS_PER_HALF = 3;
  function isAdminMarker(p){ return !!(p && p.is_divider); }
  function clockToAbsSeconds(){ return null; }

  // SCALE TO THE MONITOR, exactly as view.html does, so the two pages behave
  // the same on the same screen rather than each inventing its own sizing.
  // BOOTH ONLY. Below 1280px the page is a fluid, scrolling document and
  // must carry NO transform at all -- see the media query in the
  // stylesheet for why that boundary and not another.
  //
  // The clear on the else branch is the load-bearing half. This sets an
  // INLINE transform, and an inline style beats any stylesheet rule, so
  // a sheet scaled at 1400px and then rotated to portrait would keep its
  // 0.72 scale with no rule able to reach it. Rotating an iPad is not an
  // edge case; it is the second thing anybody does.
  const BOOTH_MIN_WIDTH = 1280;
  function fitSheet(){
    const s = document.getElementById('sheet');
    if (!s) return;
    if (window.innerWidth >= BOOTH_MIN_WIDTH){
      const k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      s.style.transform = 'scale(' + k + ')';
    } else {
      s.style.transform = '';
    }
  }
  window.addEventListener('resize', fitSheet);
  // Rotating a phone fires resize on every browser worth naming, but
  // orientationchange fires FIRST on iOS and the two disagree about
  // innerWidth for a frame or two. Listening to both, and re-running on
  // the next frame, is cheaper than reasoning about which one won.
  window.addEventListener('orientationchange', () => requestAnimationFrame(fitSheet));

  const esc = (t) => String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  // THE DRIVE BEHIND EACH SCORE.
  // -------------------------------------------------------------------
  // findDriveStarts gives the index each drive begins at. For a scoring
  // play we want the drive it ENDED, so we take the last start at or before
  // it and walk forward to the score.
  //
  // A KICK OR INTERCEPTION RETURNED FOR A SCORE IS NOT A DRIVE. Showing "1
  // play, 88 yards" for a kickoff return reads as a drive summary and is
  // not one; the tiles are blanked instead, which is honest and stops the
  // eye stopping on a row that looks wrong.
  function driveFor(scoreIdx, starts, prevScoreIdx){
    let from = -1;
    for (const s of starts){ if (s <= scoreIdx) from = s; else break; }
    // FALL BACK TO THE LAST SCORE. findDriveStarts keys off kickoffs and
    // punts, so early in a game -- or in a log where those were not entered
    // -- it can return nothing at all, and every row came out with no
    // tiles. The plays since the previous score are a fair approximation of
    // the drive and always yield something.
    if (from < 0) from = (prevScoreIdx === undefined ? 0 : prevScoreIdx + 1);

    const scorePlay = plays[scoreIdx];
    const sr = scorePlay && scorePlay.roles;
    const returnScore = sr && ['kickoff','kickoff_return','punt','int','fumble']
      .indexOf(sr.playType) !== -1;
    if (returnScore) return null;

    let count = 0, yds = 0, long = 0, longKind = '';
    for (let i = from; i <= scoreIdx; i++){
      const p = plays[i], r = p.roles, e = p.effect || {};
      if (!r || !r.playType) continue;
      if (['rush','pass','incomplete','sack','fumble'].indexOf(r.playType) === -1) continue;
      count++;
      if (typeof e.statYds === 'number') yds += e.statYds;
      const gain = (r.carrier && r.carrier.yards) ||
                   (r.receiver && r.receiver.yards) || 0;
      if (gain > long){
        long = gain;
        longKind = r.receiver ? 'pass' : 'rush';
      }
    }
    if (!count) return null;
    // TIME OF POSSESSION, from engine.js's driveTop -- the SAME rule
    // view.html's drive tiles read, moved there on 30 Aug 2026 rather
    // than restated here. endIdx is exclusive, matching the slice
    // convention computeDriveSummary uses, so the scoring play itself
    // is inside the drive it ended.
    //
    // The driving team is left to the helper. `from` can be the
    // fallback (prevScoreIdx + 1) rather than a real drive start when
    // findDriveStarts returns nothing, and the helper derives the team
    // from the state after that play either way -- which is the same
    // derivation, applied to the same index, as the tiles above use.
    // ENDS AT THE NEXT DRIVE START, NOT AT THE SCORING PLAY.
    // ------------------------------------------------------------------
    // Reported live, 30 Aug 2026: every TOP read as an em dash.
    // possessionTime does not accrue play by play -- computeState holds
    // a PENDING start for the team with the ball and only pays it out
    // when a closing clock event is replayed. A drive that ends in a
    // score is closed by the ensuing kickoff's `transition`, which sits
    // AFTER the scoring play, so slicing at scoreIdx + 1 asked for the
    // delta before the payout and got zero every time.
    //
    // view.html never hit this because computeDriveSummary's endIdx is
    // already the next drive's start index, which is past the kickoff.
    // Measured, not reasoned: same drive, endIdx = scoreIdx + 1 gives
    // 0s and endIdx = next start gives 214s.
    //
    // The plays/yards counters above deliberately still stop at the
    // score -- the try and the kickoff are not part of the drive's
    // offense. Only the CLOCK needs the wider window, because that is
    // where the possession is actually closed out.
    let until = plays.length;
    for (const s of starts){ if (s > scoreIdx){ until = s; break; } }
    const top = driveTop(plays, from, until);
    return { count: count, yds: yds, long: long, longKind: longKind, top: top };
  }

  function render(){
    const state = computeState(plays);
    const rows = scoringSummary(plays);
    const starts = findDriveStarts(plays);

    document.getElementById('title').textContent =
      'Scoring — ' + (TEAMS.teamA ? TEAMS.teamA.name : '') +
      ' vs ' + (TEAMS.teamB ? TEAMS.teamB.name : '');
    document.getElementById('finalScore').textContent =
      (state.scores.teamA || 0) + ' – ' + (state.scores.teamB || 0);
    document.getElementById('phase').textContent =
      state.status === 'FINAL' ? 'FINAL' : quarterLabel(state);

    const list = document.getElementById('list');
    if (!rows.length){
      list.innerHTML = '<div class="empty" style="grid-column:1 / -1;">No scoring yet</div>';
      return;
    }

    // THE ROW CARRIES ITS OWN PLAY INDEX, since 30 August 2026.
    // ------------------------------------------------------------------
    // This used to walk the log for every play with effect.score and pair
    // rows[n] with that list's nth entry. scoringSummary FOLDS a try into
    // the touchdown above it, so it returns one row per touchdown-plus-
    // try while the log carries a score on both -- and from the first
    // converted PAT onward, row N was paired with someone else's play.
    // Measured: a three-touchdown log paired row 1 (Sterlington's score)
    // with Ouachita's PAT, and row 2 with Sterlington's touchdown.
    //
    // Every drive tile on this page reads from that index, so all of
    // them -- plays, yards, long, and now TOP -- were describing the
    // wrong drive. Nothing links to this page yet, which is the only
    // reason it was never reported.
    const scoreIdx = rows.map(r => r.idx);

    // One place, so the markup above stays readable. Returns nothing at
    // all when the clock was never entered -- no dash, no placeholder,
    // matching how time of possession already reports a missing clock.
    const stampFor = (r) => {
      const p = plays[r.idx];
      if (!p || !isStampableScore(p)) return '';
      const st = scoreStamp(plays, p);
      return st ? '<div class="qclock">' + st.clock + '</div>' : '';
    };

    list.innerHTML = rows.map((r, n) => {
      const t = TEAMS[r.team] || {};
      const lg = t.logo
        ? '<img class="slogo" src="' + esc(t.logo) + '" alt="">'
        : '<div class="slogo blank"></div>';
      const here = scoreIdx[n] === undefined ? plays.length - 1 : scoreIdx[n];
      const d = driveFor(here, starts, n > 0 ? scoreIdx[n - 1] : undefined);
      const tiles = d
        ? [['Drive', d.count + (d.count === 1 ? ' play' : ' plays')],
           ['Yds', d.yds],
           // AN EM DASH AT ZERO, not "0:00". A drive cannot take no
           // time, so zero here means the clock was never entered for
           // it -- and 0:00 states a duration where the truth is that
           // there isn't one. Same reading the Long tile beside it
           // already uses for the same reason.
           ['TOP', d.top ? formatDuration(d.top) : '—'],
           ['Long', d.long ? (d.long + ' ' + d.longKind) : '—']]
          .map(x => '<div class="mini"><span class="mini-l">' + x[0] +
                    '</span><span class="mini-v">' + x[1] + '</span></div>').join('')
        : '';
      return '<div class="srow' + (n % 2 ? ' alt' : '') + '">' +
        // THE CLOCK UNDER THE QUARTER, 30 August 2026. .clock only --
        // the quarter is the line directly above it. A second line rather
        // than "Q3 5:12" on one: this column is 58px in the booth layout
        // and 40px on a phone, and widening it takes width from the play
        // text, which is what a reader is actually here for.
        //
        // r.idx is the source play index scoringSummary now returns, so
        // the stamp is read from the SAME play the row describes. Before
        // that field existed this page paired rows with a self-built list
        // and drifted; a timestamp attached to the wrong play would be a
        // quieter version of the same fault.
        '<div class="q">' + quarterLabel(r.quarter > 4
          ? { quarter: r.quarter, otSeries: (r.quarter - 4) * 2 - 1 }
          : { quarter: r.quarter }) + stampFor(r) + '</div>' + lg +
        '<div class="sbody"><div class="sline">' + esc(r.text) +
          (r.detail ? ' <span class="k">' + esc(r.detail) + '</span>' : '') +
        '</div><div class="mini-row">' + tiles + '</div></div>' +
        '<div class="sscore">' + r.teamA + '–' + r.teamB + '</div>' +
      '</div>';
    }).join('');
  }

  async function loadPlays(){
    const { data } = await supabaseClient
      .from('plays').select('*').eq('game_id', currentGameId)
      .order('sequence_number', { ascending: true });
    plays = (data || []).map(p => ({
      id: p.id, text: p.text, effect: p.effect, quarter: p.quarter,
      roles: p.roles, team: p.team, is_divider: p.is_divider
    }));
  }

  async function init(){
    const params = new URLSearchParams(window.location.search);
    currentGameId = params.get('id');
    if (!currentGameId){
      document.getElementById('list').innerHTML =
        '<div class="empty" style="grid-column:1 / -1;">No game specified</div>';
      fitSheet(); return;
    }

    const { data: gameRows } = await supabaseClient
      .from('games').select('*').eq('id', currentGameId).limit(1);
    if (!gameRows || !gameRows.length){
      document.getElementById('list').innerHTML =
        '<div class="empty" style="grid-column:1 / -1;">Game not found</div>';
      fitSheet(); return;
    }
    const game = gameRows[0];
    gameLabel = game.designator;
    quarterLengthSec = game.quarter_length_seconds || 720;
    startingPossession = game.starting_possession || 'teamA';

    const { data: teamRows } = await supabaseClient
      .from('teams').select('name, primary_color, secondary_color, logo_url')
      .eq('tenant_id', game.tenant_id).limit(1);
    const ours = (teamRows && teamRows[0]) || {};

    const ourName = game.our_team_is_home ? game.home_team_name : game.away_team_name;
    const oppName = game.our_team_is_home ? game.away_team_name : game.home_team_name;
    const blank = { posOffense:{}, posDefense:{}, rosterOffense:{},
                    rosterDefense:{}, rosterSpecialTeams:{}, rosterUnassigned:{} };
    TEAMS.teamA = Object.assign({}, blank, { name: ourName,
      bg: ours.primary_color || '#2b3440', text: ours.secondary_color || '#ffffff',
      logo: ours.logo_url || null });
    TEAMS.teamB = Object.assign({}, blank, { name: oppName,
      bg: game.opponent_primary_color || '#6e7885',
      text: game.opponent_secondary_color || '#ffffff',
      logo: game.opponent_logo_url || null });

    await loadPlays();
    render();
    fitSheet();

    // Same cadence as the crew view. A scoring page changes far less often
    // than a play-by-play one, but a booth must not be looking at a stale
    // score after a touchdown.
    setInterval(async () => {
      if (document.hidden) return;
      await loadPlays();
      render();
    }, 4000);
  }

  // SCALE BEFORE ANYTHING LOADS. fitSheet only ran after auth resolved and
  // the game came back, so a slow sign-in showed a 1920px sheet unscaled in
  // whatever the window actually is -- running off the edge on a smaller
  // monitor for as long as the round trip took.
  fitSheet();

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'INITIAL_SESSION'){
      if (session){ init(); } else { window.location.href = '/login.html'; }
    } else if (event === 'SIGNED_OUT'){
      window.location.href = '/login.html';
    }
  });
</script>
</body>
</html>
