<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<!-- NOT A PAGE FOR SEARCH. Behind a login, or a prototype, or an
     overlay composited into a live picture. robots.txt disallows it too;
     the two do different jobs, and a URL linked from anywhere can be
     indexed without ever being crawled. -->
<!-- Without this every page load logs a 404 for /favicon.ico.
     Harmless, but a red console error should MEAN something. -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="logo.png" type="image/png">
<!-- Shared tokens. Loaded BEFORE this page's own <style> so anything
     below still wins -- that ordering is what lets a page be converted
     a bit at a time without breaking on the way. -->
<link rel="stylesheet" href="statchat.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StatChat — Play log</title>
<style>
  /* DARK, matching every other in-app report. Tokens defined here rather
     than assumed, for the reason DARK_THEME_PLAN.md gives: a var(--x, #fff)
     fallback chosen for a white page silently applies if the token is not
     defined. */
  :root{ color-scheme:dark; }
  :root{
    --sc-page:#10141a;   --sc-card:#191f27;   --sc-raise:#20272f;
    --sc-ink:#eef1f4;    --sc-ink-soft:#c7d0da;  --sc-ink-muted:#8d99a6;
    --sc-rule:#2b333d;   --sc-rule-strong:#6b7d8f;
    --sc-green:#a3d93f;  --sc-blue:#5aa9f0;   --sc-amber:#ffc72c;
    --sc-red:#ff8fa3;    --sc-accent:#a3d93f;
  }
  body { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
         background:var(--sc-page); color:var(--sc-ink); margin:0; padding:14px;
         padding-top:calc(14px + env(safe-area-inset-top)); }
  .wrap { max-width:1100px; margin:0 auto; }
  .card { background:var(--sc-card); border:1px solid var(--sc-rule); border-radius:12px;
          padding:18px 20px; margin-bottom:16px; }
  h1 { font-size:22px; margin:0 0 3px; }
  .sub { color:var(--sc-ink-muted); font-size:14px; margin:0; }
  .hidden { display:none; }
  .msg.error { background:rgba(176,0,32,.16); border:1px solid #c8455c; color:var(--sc-red);
               padding:10px 12px; border-radius:8px; font-size:14px; }
  .topbar { display:flex; justify-content:space-between; align-items:center;
            flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .topbar a { color:var(--sc-accent); text-decoration:none; font-weight:600; font-size:14px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .actions button { padding:8px 14px; border-radius:6px; border:1px solid var(--sc-rule-strong);
                    background:var(--sc-raise); color:var(--sc-ink); font-size:13px;
                    font-weight:600; cursor:pointer; }
  .actions button.primary { background:rgba(124,181,24,.20); color:var(--sc-green);
                            border-color:#6f9f22; }

  table { border-collapse:collapse; width:100%; font-size:13px; }
  th { text-align:left; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
       color:var(--sc-ink-muted); font-weight:700; padding:8px 8px;
       border-bottom:1px solid var(--sc-rule-strong); white-space:nowrap;
       position:sticky; top:0; background:var(--sc-card); }
  td { padding:7px 8px; border-bottom:1px solid var(--sc-rule); vertical-align:top; }
  td.num, td.q, td.clock, td.gain { white-space:nowrap; font-variant-numeric:tabular-nums; }
  td.num { color:var(--sc-ink-muted); text-align:right; width:1%; }
  td.gain { text-align:right; font-weight:600; }
  td.gain.neg { color:var(--sc-red); }
  td.play { width:99%; }

  /* MARKERS ARE ROWS TOO, and they have to look like what they are.
     Andy asked for "every entry that's logged", which includes the clock
     events, the drive dividers and the down-and-distance corrections --
     the same lines the drive log shows. Dimmed and italic so a person
     scanning for actual plays can skip them, present so the log is a true
     record of what was entered. */
  tr.marker td { color:var(--sc-ink-muted); font-style:italic; }
  tr.divider td { border-top:2px solid var(--sc-rule-strong); }
  /* A play the scorer flagged as needing another look, and one entered as
     an override. Both are facts about the entry rather than the football,
     so they sit in their own column rather than colouring the text. */
  .tag { display:inline-block; padding:1px 6px; border-radius:4px; font-size:10.5px;
         font-weight:700; letter-spacing:.04em; margin-right:4px; white-space:nowrap; }
  .tag.unres { background:rgba(255,199,44,.16); color:var(--sc-amber); }
  .tag.over  { background:rgba(90,169,240,.16); color:var(--sc-blue); }
  .tag.score { background:rgba(124,181,24,.18); color:var(--sc-green); }

  .counts { color:var(--sc-ink-muted); font-size:13px; margin:0 0 10px; }

  @media print {
    :root{ color-scheme:light;
      --sc-page:#fff; --sc-card:#fff; --sc-raise:#f4f6f8;
      --sc-ink:#1a1a1a; --sc-ink-soft:#3a3a3a; --sc-ink-muted:#5a5a5a;
      --sc-rule:#dddddd; --sc-rule-strong:#bbbbbb; --sc-accent:#1a4d2e; }
    body { background:#fff !important; color:#1a1a1a !important; padding:0; }
    .card { background:#fff !important; border:none !important; padding:0; }
    .no-print { display:none !important; }
    th { background:#fff !important; color:#1a4d2e !important; }
    /* The header repeats on every page of a long log, which is most of
       them -- a play log runs to several sheets. */
    thead { display:table-header-group; }
    tr { page-break-inside:avoid; break-inside:avoid; }
    .tag { border:1px solid #bbb; color:#1a1a1a !important; background:#fff !important; }
  }
  .sc-copyright { margin:26px 0 0; padding:0 2px 4px; font-size:12px; line-height:1.5;
    color:var(--sc-ink-muted); opacity:.75; text-align:center; max-width:760px;
    margin-left:auto; margin-right:auto; }
  /* ======================================================================
     PHONES. Added 4 September 2026.
     ----------------------------------------------------------------------
     This page had no mobile rules at all -- its only media queries were the
     two print blocks above.

     Measured at 390px with a full four-quarter game on screen: the document
     was 628px wide against a 390px viewport, so the PAGE scrolled sideways
     by 238px. Unlike platform.html there was no overflow-x backstop to
     catch it, so the table simply left the card and took the page with it.

     What was off the right-hand edge was the play text -- the entire point
     of a play log. You could read the number, the quarter, the clock, the
     team and the down, and not what happened.

     Nine columns cannot be made to fit 320px and should not be tried. The
     row becomes a card instead, ordered by what someone actually scans for:

         48 · Q4 12:34 · Neville · 3rd & 4 · at own 32            +14
         Conner pass to Clark Jr for 14, tackled by Grayson
         [NEEDS REVIEW]

     A FLEX ROW WITH EXPLICIT ORDER rather than a grid. The cells are fixed
     in DOM order by the desktop table -- gain comes after play -- and grid
     areas would work, except that a grid's columns are shared down the
     whole row, so the short meta line would set the width of the long play
     line. order + flex-wrap places each cell where it reads best and lets
     every line size itself.

     700px, and a laptop cannot reach it: verified pixel-identical at 1440,
     1100 and 768.
     ====================================================================== */
  /* SCREEN ONLY. Paper is not a narrow screen: a sheet lays out at the page
     width whatever device asked for it, the print block above is built for a
     TABLE -- it repeats <thead> on every sheet and keeps rows off page breaks
     -- and a log printed as 48 stacked cards runs half again as long as the
     same log printed as rows. Without this, printing from a phone got the
     card layout and neither of those print rules had anything to act on. */
  @media screen and (max-width:700px){
    body { padding:10px; padding-top:calc(10px + env(safe-area-inset-top)); }
    .card { padding:13px 12px; border-radius:10px; }
    h1 { font-size:19px; }

    /* The column headings have nothing left to head. */
    #logTable thead { display:none; }
    #logTable table, #logTable tbody { display:block; width:auto; }

    #logTable tr {
      display:flex; flex-wrap:wrap; align-items:baseline;
      column-gap:7px; row-gap:3px;
      padding:11px 12px; margin:0 0 8px;
      border:1px solid var(--sc-rule); border-radius:8px;
      background:var(--sc-raise);
    }
    /* AN EMPTY CELL DISAPPEARS. A marker carries no number, no down and no
       gain, and a card with three blank slots in it reads as a card with
       something missing. :empty is exact here -- those cells are built as
       '' + '', with no whitespace inside them. */
    /* WIDTH IS RESET, and it has to be said explicitly. The desktop table
       sizes its two elastic columns with td.num{width:1%} and
       td.play{width:99%} -- percentages that mean "shrink to content" and
       "take the rest" to a table layout, and mean literally 1% and 99% of
       the row to a flex one. The number came out 3px wide with "48"
       spilling out of it into the quarter beside it. Caught in a render,
       not in review. */
    #logTable td { display:inline; padding:0; border-bottom:none; width:auto; }
    #logTable td:empty { display:none; }

    /* Reading order, which is not DOM order. */
    #logTable td.num   { order:1; font-weight:700; color:var(--sc-ink-soft); }
    #logTable td.q     { order:2; }
    #logTable td.clock { order:3; }
    #logTable td.team  { order:4; color:var(--sc-ink-soft); }
    #logTable td.sit   { order:5; }
    #logTable td.ball  { order:6; }
    #logTable td.q, #logTable td.clock,
    #logTable td.sit, #logTable td.ball { color:var(--sc-ink-muted); font-size:12px; }
    /* "at own 32" rather than a bare "own 32" once it is running inline in a
       sentence instead of sitting under a BALL ON heading. Generated, so the
       cell's own text -- and the CSV built from it -- is untouched. */
    #logTable td.ball:not(:empty)::before { content:'at '; }

    /* THE GAIN STAYS ON THE RIGHT, where a number that is scanned rather
       than read belongs. margin-left:auto claims the rest of the meta line;
       if that line wraps it settles at the end of whichever line it is on,
       which is still the right edge. */
    #logTable td.gain  { order:7; margin-left:auto; font-size:12.5px; }

    /* THE PLAY, ON ITS OWN LINE AND LARGEST. It is the reason the page
       exists and on a phone it gets the full width and the primary ink. */
    #logTable td.play  { order:8; flex:0 0 100%; width:auto;
                         font-size:14px; color:var(--sc-ink); line-height:1.4; }
    #logTable td.flags { order:9; flex:0 0 100%; }

    /* A marker is a card too, but a quieter one -- no fill and no border, so
       a scan down the page lands on the plays. tr.marker td already sets the
       muted italic; this is about the card, not the text. */
    #logTable tr.marker { background:none; border-color:transparent;
                          padding-top:4px; padding-bottom:4px; margin-bottom:4px; }
    #logTable tr.marker td.play { font-size:13px; color:var(--sc-ink-muted); }
    /* The divider's 2px rule was a line across a table. Between cards it
       reads better as a gap plus a rule above the card it belongs to. */
    #logTable tr.divider { border-top:2px solid var(--sc-rule-strong); margin-top:14px; }

    .counts { font-size:12.5px; }
    .actions button { padding:9px 13px; }
  }

  @media print { .sc-copyright { color:#666 !important; opacity:1; } }
</style>
</head>
<body>
  <div class="wrap">
    <div id="loading">Loading&hellip;</div>
    <div id="errorView" class="hidden"><p id="errorMsg" class="msg error"></p></div>

    <div id="mainView" class="hidden">
      <div class="topbar no-print">
        <a id="backLink" href="dashboard.html">&larr; Back to dashboard</a>
        <div class="actions">
          <button class="primary" id="csvBtn" type="button">Download CSV</button>
          <button id="printBtn" type="button">Print</button>
        </div>
      </div>
      <div class="card">
        <h1 id="title"></h1>
        <p class="sub" id="subtitle"></p>
      </div>
      <div class="card">
        <p class="counts" id="counts"></p>
        <div id="logTable"></div>
      </div>
      <p class="sc-copyright">&copy; 2026 StatChat. All rights reserved.
        Unauthorized copying, modification or distribution of this software or
        its documentation is prohibited.</p>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="team-icon.js"></script>
<script src="engine.js"></script>
<script>
  // FULL PLAY LOG -- every row in `plays` for one game, in order.
  // =====================================================================
  //     /play_log.html?id=<game id>
  //
  // Andy, 31 Aug 2026: "a way to export the full play log from any game,
  // every play, basically every entry that's logged".
  //
  // NOT THE SAME THING AS Download backup. That produces a
  // statchat-game-backup-v1 JSON file -- everything, in the shape the app
  // stores it, for restoring a game. This is the same rows written for a
  // person: the situation each play happened in, in a table you can read,
  // print, or open in a spreadsheet.
  //
  // THE SITUATION IS DERIVED, NOT STORED. A play row carries its text and
  // its effect; the down, the distance and the yard line are what the
  // engine works out by replaying everything before it. So each row is
  // computed against computeState(plays.slice(0, i)) -- the state BEFORE
  // that play, which is the situation it was snapped in. Same walk
  // game.html already does for its own log.
  const SUPABASE_URL = 'https://pboushzlcyfkssojpuut.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_VGnUYurlkoH1yi67jHO6iQ_C8Q0EM2d';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  function showView(name){
    ['loading','errorView','mainView'].forEach(v =>
      document.getElementById(v).classList.toggle('hidden', v !== name));
  }
  function fail(msg){
    showView('errorView');
    document.getElementById('errorMsg').textContent = msg;
  }

  // engine.js needs these from the host page.
  let plays = [], startingPossession = 'teamA', quarterLengthSec = 720;
  const TEAMS = {};
  function otherTeam(t){ return t === 'teamA' ? 'teamB' : 'teamA'; }
  const TIMEOUTS_PER_HALF = 3;
  const TIMEOUTS_PER_OT = 1;

  let GAME = null, ROWS = [];
  // The last plays payload actually painted, so an unchanged poll can be
  // dropped before it touches the DOM. See refresh().
  let lastStamp = null;
  // Set across a print so the refresh loop cannot put the screen order back
  // while the sheet is being taken. Declared HERE with the rest of the page
  // state rather than beside the handler that sets it: a let is in its
  // temporal dead zone until its declaration runs, and paint() reads this.
  let printing = false;

  function buildTeams(game, rosterRows, branding){
    const ourName = game.our_team_is_home ? game.home_team_name : game.away_team_name;
    const oppName = game.our_team_is_home ? game.away_team_name : game.home_team_name;
    TEAMS.teamA = { name: ourName, bg: branding.primary_color || '#2b3440',
      text: branding.secondary_color || '#ffffff',
      rosterOffense:{}, rosterDefense:{}, rosterSpecialTeams:{}, posOffense:{},
      logo: branding.logo_url || null, isHome: !!game.our_team_is_home };
    TEAMS.teamB = { name: oppName, bg: game.opponent_primary_color || '#6e7885',
      text: game.opponent_secondary_color || '#ffffff',
      rosterOffense:{}, rosterDefense:{}, rosterSpecialTeams:{}, posOffense:{},
      logo: game.opponent_logo_url || null, isHome: !game.our_team_is_home };
    (rosterRows || []).forEach(r => {
      const t = TEAMS[r.team_side];
      if (!t) return;
      const bucket = r.unit === 'defense' ? 'rosterDefense'
                   : r.unit === 'special' ? 'rosterSpecialTeams' : 'rosterOffense';
      t[bucket][String(r.jersey_number)] = r.player_name;
    });
  }

  const esc = (s) => String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');

  const spot = (fp) => (fp === null || fp === undefined) ? ''
    : fp === 50 ? 'the 50' : fp < 50 ? 'own ' + fp : 'opp ' + (100 - fp);
  const ord = (n) => n + (['th','st','nd','rd'][(n % 100 - 20) % 10]
                          || ['th','st','nd','rd'][n] || 'th');

  // ONE ROW OF THE LOG, as data. Built once and used by both the table and
  // the CSV, so the two can never disagree about what a play said -- which
  // is the whole risk of writing an export beside a view.
  function buildRows(){
    // THE NUMBER COUNTS PLAYS, NOT ROWS. Andy's call, 4 September 2026: a
    // timeout or a change of possession does not need one, because the
    // number is a play's name -- "#47" should mean the 47th play of the
    // game, the way it does on a stat sheet.
    //
    // So it runs consecutively across the real plays and skips the markers
    // entirely, rather than blanking a marker and leaving a hole in the
    // sequence. A hole reads as missing data; an unnumbered row reads as a
    // row that was never a play, which is what it is.
    //
    // It therefore no longer matches a row's POSITION. That was already
    // true of the count line above the table -- "N entries logged · M
    // plays" has always distinguished the two -- and that line stays the
    // place to look for a total.
    let playNo = 0;
    return plays.map((p, i) => {
      const before = computeState(plays.slice(0, i));
      const e = p.effect || {};
      // WHAT COUNTS AS A PLAY HERE IS NOT WHAT COUNTS AS ONE IN THE ENGINE.
      // isAdminMarker() answers a different question -- "can a drive start
      // on this row" -- and deliberately says NO for a down-and-distance
      // adjustment (effect.isReset), because a drive very often does start
      // on one. For a log read by a person, a scorer correcting the
      // situation is administrative by any ordinary meaning of the word:
      // nobody snapped the ball. So this page adds isReset to the engine's
      // answer rather than redefining it, and the difference is stated here
      // rather than left as a surprise to whoever reads both.
      const marker = ((typeof isAdminMarker === 'function') ? isAdminMarker(p) : false)
                     || !!e.isReset;
      const stamp = (typeof scoreStamp === 'function') ? scoreStamp(plays, p) : null;
      const q = p.quarter >= 5 ? 'OT' + (p.quarter - 4) : 'Q' + p.quarter;
      const dd = (!marker && before.down)
        ? ord(before.down) + ' & ' +
          (before.fieldPos !== null && before.fieldPos + before.distance >= 100
            ? 'Goal' : before.distance)
        : '';
      const tags = [];
      if (p.unresolved)  tags.push('NEEDS REVIEW');
      if (p.isOverride)  tags.push('OVERRIDE');
      if (e.score && e.score.points) tags.push(e.score.points + ' PTS');
      if (!marker) playNo += 1;
      return {
        // Blank on a marker, and blank rather than a dash or a bullet: the
        // cell is narrow and right-aligned, and anything printed in it
        // lines up under the numbers as though it were one.
        n: marker ? '' : playNo,
        seq: p.seq,
        quarter: q,
        clock: (stamp && stamp.clock) || '',
        team: p.team ? ((TEAMS[p.team] || {}).name || p.team) : '',
        situation: dd,
        ballOn: marker ? '' : spot(before.fieldPos),
        text: p.text || '',
        gain: (!marker && e.isStat) ? (e.statYds || 0) : '',
        tags: tags,
        marker: marker,
        divider: !!p.isDivider
      };
    });
  }

  // NEWEST AT THE TOP, ON SCREEN ONLY.
  // ---------------------------------------------------------------------
  // The page refreshes itself now, so it is read the way a feed is read --
  // you look at it to see what just happened, and the newest row being the
  // one you have to scroll furthest for is the wrong way round for that.
  //
  // The CSV and the printed sheet stay OLDEST FIRST. A data file and a
  // document are both read from the start, and a play log that runs
  // backwards on paper is a log somebody has to read backwards. Andy's
  // call, and it is why this reverses HERE rather than in buildRows():
  // buildRows stays the single chronological source both exports use, so
  // the two can still never disagree about what a play said.
  //
  // .slice() first -- reverse() mutates, and ROWS is that shared source.
  function renderTable(rows, newestFirst){
    const ordered = newestFirst ? rows.slice().reverse() : rows;
    const head = '<tr><th>#</th><th>Qtr</th><th>Clock</th><th>Team</th>' +
                 '<th>Situation</th><th>Ball on</th><th>Play</th><th>Gain</th><th>Flags</th></tr>';
    const body = ordered.map(r =>
      '<tr class="' + (r.marker ? 'marker ' : '') + (r.divider ? 'divider' : '') + '">' +
        '<td class="num">' + r.n + '</td>' +
        '<td class="q">' + esc(r.quarter) + '</td>' +
        '<td class="clock">' + esc(r.clock) + '</td>' +
        // THREE CLASSES ADDED FOR THE PHONE LAYOUT and nothing else. No rule
        // matches them above the breakpoint -- checked against this file and
        // against statchat.css -- so the table they build is byte-identical
        // on a laptop.
        '<td class="team">' + esc(r.team) + '</td>' +
        '<td class="sit">' + esc(r.situation) + '</td>' +
        '<td class="ball">' + esc(r.ballOn) + '</td>' +
        '<td class="play">' + esc(r.text) + '</td>' +
        '<td class="gain' + (r.gain !== '' && r.gain < 0 ? ' neg' : '') + '">' +
          (r.gain === '' ? '' : r.gain) + '</td>' +
        '<td class="flags">' + r.tags.map(t =>
          '<span class="tag ' + (t === 'NEEDS REVIEW' ? 'unres' : t === 'OVERRIDE' ? 'over' : 'score') +
          '">' + esc(t) + '</span>').join('') + '</td>' +
      '</tr>').join('');
    return '<table><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
  }

  // CSV, from the same rows the table used.
  // ---------------------------------------------------------------------
  // EVERY FIELD IS QUOTED, not just the ones that look like they need it.
  // A play's text routinely contains a comma ("rush for 6, tackled by...")
  // and can contain a quotation mark; deciding per field which of those to
  // escape is how a log opens in Excel one column short halfway down.
  const csvCell = (v) => '"' + String(v === null || v === undefined ? '' : v)
    .replace(/"/g, '""') + '"';

  function toCsv(rows){
    const head = ['#','Quarter','Clock','Team','Situation','Ball on','Play',
                  'Gain','Flags','Entry type'];
    const lines = [head.map(csvCell).join(',')];
    rows.forEach(r => lines.push([
      r.n, r.quarter, r.clock, r.team, r.situation, r.ballOn, r.text,
      r.gain, r.tags.join(' '), r.marker ? 'marker' : 'play'
    ].map(csvCell).join(',')));
    // CRLF, which is what Excel expects, and a BOM so it opens UTF-8
    // rather than mangling a name with an accent in it.
    return '﻿' + lines.join('\r\n') + '\r\n';
  }

  function fileStem(){
    const safe = (x) => String(x || '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const teams = [GAME.home_team_name, GAME.away_team_name].filter(Boolean).join('-vs-');
    const stamp = GAME.game_date || new Date().toISOString().slice(0, 10);
    return 'statchat-playlog-' + (safe(teams) || 'game') + '-' + stamp;
  }

  document.getElementById('csvBtn').addEventListener('click', () => {
    const blob = new Blob([toCsv(ROWS)], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileStem() + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  });
  document.getElementById('printBtn').addEventListener('click', () => window.print());

  // PRINTING RE-RENDERS IN THE OTHER ORDER, because print takes the DOM as
  // it stands and CSS cannot reverse table rows without breaking the
  // columns. Bound to beforeprint/afterprint rather than to the button, so
  // Ctrl+P and the browser's own menu get the same sheet as the button.
  //
  // The refresh loop is held during the print, so a tick landing between
  // beforeprint and the snapshot cannot put the screen order back while the
  // sheet is being taken.
  window.addEventListener('beforeprint', () => {
    printing = true;
    document.getElementById('logTable').innerHTML = renderTable(ROWS, false);
  });
  window.addEventListener('afterprint', () => {
    printing = false;
    document.getElementById('logTable').innerHTML = renderTable(ROWS, true);
  });

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'INITIAL_SESSION'){
      if (session){ init(); } else { window.location.href = '/login.html'; }
    }
  });

  async function init(){
    const id = new URLSearchParams(window.location.search).get('id');
    if (!id){ fail('No game specified.'); return; }

    const { data: gameRows, error: gameErr } = await supabaseClient
      .from('games').select('*').eq('id', id).limit(1);
    if (gameErr || !gameRows || !gameRows.length){
      fail(gameErr ? gameErr.message : 'That game could not be found.'); return;
    }
    GAME = gameRows[0];
    startingPossession = GAME.starting_possession || 'teamA';
    quarterLengthSec = GAME.quarter_length_seconds || 720;

    const { data: rosterRows } = await supabaseClient
      .from('game_rosters').select('*').eq('game_id', id);
    // BY THE GAME'S OWN TENANT, not by is_our_team -- the flag is true for
    // every tenant's team, so an unscoped limit(1) returns an arbitrary
    // school's colours. Same reasoning as stat_package.html.
    const { data: teamRows } = await supabaseClient
      .from('teams').select('primary_color, secondary_color, logo_url')
      .eq('tenant_id', GAME.tenant_id).limit(1);
    buildTeams(GAME, rosterRows || [], (teamRows && teamRows[0]) || {});

    const { data: playRows, error: playsErr } = await supabaseClient
      .from('plays').select('*').eq('game_id', id)
      .order('sequence_number', { ascending: true });
    if (playsErr){ fail(playsErr.message); return; }

    plays = (playRows || []).map(p => ({
      seq: p.sequence_number, text: p.text, effect: p.effect || {},
      team: p.team_side, quarter: p.quarter, roles: p.roles,
      unresolved: p.unresolved, isDivider: p.is_divider, isOverride: p.is_override
    }));

    const away = GAME.away_team_name || '', home = GAME.home_team_name || '';
    document.getElementById('title').textContent = away + ' at ' + home;
    document.getElementById('subtitle').textContent =
      [GAME.designator, GAME.game_date, GAME.season_year + ' season',
       GAME.status === 'final' ? 'Final' : 'In progress'].filter(Boolean).join(' · ');
    document.title = 'Play log — ' + away + ' at ' + home;
    const back = document.getElementById('backLink');
    if (GAME.season_year) back.href = 'reports.html?season=' + encodeURIComponent(GAME.season_year);

    paint();
    // SEEDED, so the first poll four seconds from now is not a repaint of
    // what is already on screen. Built from the same plays the first paint
    // used, by the same expression refresh() compares against.
    lastStamp = JSON.stringify(plays);
    showView('mainView');

    // LIVE, on the same 4-second cadence as the scoring summary, and for
    // the same reason: a booth leaves this page up and must not be reading
    // a stale log. Rebuilding everything costs single-digit milliseconds
    // even over a 300-play game -- measured -- so there is nothing to gain
    // from a smarter incremental fetch and a whole class of ordering bugs
    // to lose.
    //
    // document.hidden is checked first, so a tab left open all weekend is
    // not polling all weekend.
    setInterval(refresh, 4000);
  }

  // ONE PAINT, used by the first load and by every refresh, so the counts
  // line and the table can never describe different data.
  function paint(){
    ROWS = buildRows();
    const realPlays = ROWS.filter(r => !r.marker).length;
    document.getElementById('counts').textContent =
      ROWS.length + ' entries logged · ' + realPlays + ' plays · ' +
      (ROWS.length - realPlays) + ' clock and drive markers';
    document.getElementById('logTable').innerHTML = renderTable(ROWS, !printing);
  }

  async function refresh(){
    if (document.hidden || printing || !GAME) return;

    const { data: playRows, error } = await supabaseClient
      .from('plays').select('*').eq('game_id', GAME.id)
      .order('sequence_number', { ascending: true });
    // A FAILED POLL CHANGES NOTHING ON SCREEN. A dropped request in a
    // press box is ordinary, and replacing a good log with an error
    // message because one round trip failed is worse than showing the
    // log four seconds late.
    if (error || !playRows) return;

    const next = playRows.map(p => ({
      seq: p.sequence_number, text: p.text, effect: p.effect || {},
      team: p.team_side, quarter: p.quarter, roles: p.roles,
      unresolved: p.unresolved, isDivider: p.is_divider, isOverride: p.is_override
    }));
    // NOTHING NEW, NOTHING REDRAWN. Rewriting identical innerHTML every
    // four seconds would drop a text selection mid-copy and reset the
    // focus ring, which is exactly what somebody reading the log is doing.
    // Compared on the same JSON the rows are built from rather than on a
    // length, so a CORRECTION -- an edit that changes a play without
    // adding one -- still repaints.
    // THE HEADER GOES STALE INDEPENDENTLY OF THE PLAYS, so it is refreshed
    // BEFORE the early return below and not after it.
    // -------------------------------------------------------------------
    // Finalizing a game elsewhere does not add a play -- that is the whole
    // point of it -- so a status check sitting behind "nothing new to draw"
    // is a status check that never runs on the one transition it exists
    // for. Written the other way round first, and caught by asking the
    // stub to go final without logging anything: the subtitle still read
    // "In progress" two polls later.
    //
    // One column, so it is a fraction of the fetch above it.
    const { data: g } = await supabaseClient
      .from('games').select('status').eq('id', GAME.id).limit(1);
    if (g && g[0] && g[0].status && g[0].status !== GAME.status){
      GAME.status = g[0].status;
      document.getElementById('subtitle').textContent =
        [GAME.designator, GAME.game_date, GAME.season_year + ' season',
         GAME.status === 'final' ? 'Final' : 'In progress'].filter(Boolean).join(' · ');
    }

    // NOTHING NEW, NOTHING REDRAWN. Rewriting identical innerHTML every
    // four seconds would drop a text selection mid-copy and reset the
    // focus ring, which is exactly what somebody reading the log is doing.
    // Compared on the same JSON the rows are built from rather than on a
    // length, so a CORRECTION -- an edit that changes a play without
    // adding one -- still repaints.
    const stamp = JSON.stringify(next);
    if (stamp === lastStamp) return;
    lastStamp = stamp;
    plays = next;

    // HOLD THE READER'S PLACE. New rows arrive at the TOP now, so every
    // one of them pushes whatever is being read further down the page. At
    // the top of the log that is what you want -- the newest play should
    // land in front of you. Anywhere else it is the page yanking itself
    // out from under a person mid-sentence, so the scroll is moved by
    // exactly the height that was inserted above them.
    const wasAtTop = window.scrollY <= 4;
    const before = document.documentElement.scrollHeight;
    paint();
    if (!wasAtTop){
      const grew = document.documentElement.scrollHeight - before;
      if (grew) window.scrollTo(0, window.scrollY + grew);
    }
  }
</script>
</body>
</html>
