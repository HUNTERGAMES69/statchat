<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>StatChat — Statistics Report</title>
<style>
  html, body { margin:0; padding:0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background:#f4f3ef; color:#1a1a1a; }
  .wrap { max-width:960px; margin:0 auto; padding:24px 24px 60px; box-sizing:border-box; }
  .hidden { display:none !important; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .topbar a { color:#555; text-decoration:none; font-size:14px; font-weight:600; }
  .topbar .actions { display:flex; gap:10px; }
  .topbar button { border:none; border-radius:8px; padding:10px 18px; font-size:14px; font-weight:700; cursor:pointer; }
  .topbar button.pdf { background:#1a7a4c; color:#fff; }
  .topbar button.xls { background:#0f6e56; color:#fff; }
  .msg { padding:10px 14px; border-radius:8px; margin-bottom:14px; font-size:14px; }
  .msg.error { background:#fde8e8; color:#a32d2d; }

  table.quarter-table th:first-child, table.quarter-table td:first-child { text-align:left; font-weight:700; }

  .metric-group:first-child { border-top:none; padding-top:0; margin-top:0; }
  .metric-group-label { font-size:11px; color:#999; text-transform:uppercase; letter-spacing:0.03em; margin-bottom:6px; }
  .metric-group-row { display:flex; gap:28px; flex-wrap:wrap; }
  .metric-group-row .metric-item .metric-val { font-size:20px; font-weight:700; }
  .metric-group-row .metric-item .metric-label { font-size:11px; color:#888; margin-left:4px; }

  table.stat-table th { background:#f5f5f5; color:#555; font-weight:600; font-size:11px; text-transform:uppercase; }
  table.stat-table tr.total-row { font-weight:800; background:#fafafa; }
  .no-stats { color:#999; font-size:13px; font-style:italic; }
  .st-subsection { margin-top:14px; }
  .st-subsection-label { font-size:11px; font-weight:700; color:#888; text-transform:uppercase; letter-spacing:0.03em; margin-bottom:4px; }
  @media (max-width: 700px) {
    .wrap { padding:14px 12px 40px; }
    .topbar { flex-wrap:wrap; gap:10px; }
    .topbar .actions { width:100%; }
    .topbar .actions button { flex:1; }

    .statchat-logo { width:44px; top:10px; right:10px; }
    .team-block { padding:12px 14px; }
    .metric-group-row { gap:16px; }
    .metric-group-row .metric-item .metric-val { font-size:18px; }
    .section-title { margin:18px 0 8px; }
    .table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -12px; padding:0 12px; }
    table.stat-table { font-size:12px; }
    table.stat-table th, table.stat-table td { padding:5px 6px; }
    table.quarter-table { font-size:12px; }
  }
  @media print {
    body { background:#fff; }
    .wrap { max-width:none; padding:0 20px; }
    .no-print { display:none !important; }
    .team-block { page-break-inside:avoid; break-inside:avoid; }
    .page-break { page-break-before:always; break-before:always; }
  }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = 'https://pboushzlcyfkssojpuut.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_VGnUYurlkoH1yi67jHO6iQ_C8Q0EM2d';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  function showView(name){
    ['loading','errorView','mainView'].forEach(v => document.getElementById(v).classList.toggle('hidden', v !== name));
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'INITIAL_SESSION'){
      if (session){ init(); } else { window.location.href = '/'; }
    } else if (event === 'SIGNED_OUT'){
      window.location.href = '/';
    }
  });

  let plays = [], startingPossession = 'teamA', quarterLengthSec = 720, gameLabel = '', gameDate = null;
  const TEAMS = {};

  // --- Proven read-only engine core, extracted verbatim from game.html / view.html ---
  function otherTeam(t){ return t === 'teamA' ? 'teamB' : 'teamA'; }
const TIMEOUTS_PER_HALF = 3;
const TIMEOUTS_PER_OT = 1;
  // Administrative entries -- clock markers, quarter/half dividers, manual
  // possession flips -- are announcements, not football plays. They carry
  // no roles and no yardage, so anything reasoning about "what actually
  // happened on this drive" has to skip them.
  //
  // isReset markers are deliberately NOT administrative: they are explicit
  // "new drive" announcements and are valid drive starts.
  function isAdminMarker(p){
    if (!p) return true;
    const e = p.effect || {};
    if (e.isReset) return false;
    return !!(e.clockEvent || e.setQuarter || e.forcePossession || p.isDivider);
  }
  function findDriveStarts(playsList){
    // A drive must never START on an administrative marker. Doing so
    // produces a one-play "drive" whose every counter is zero, and
    // because only the last two drives are ever shown, it silently
    // pushes the real drive out of the "previous drive" slot. That is
    // what made a completed scoring drive display as
    // "Clock - 5:00 at change of possession" with 0/0 tiles: the
    // kickoff flipped possession, so the drive began on the clock
    // line that happened to follow it.
    const firstRealPlayFrom = from => {
      for (let j = from; j < playsList.length; j++){
        if (!isAdminMarker(playsList[j])) return j;
      }
      return -1;
    };
    const starts = [];
    // Start indices are produced in non-decreasing order, so checking
    // only the last entry is enough to stop a detected possession
    // change and an explicit reset marker from both claiming the same
    // play (which they often do, since skipping markers lands the
    // possession change exactly on the reset marker that follows it).
    const pushStart = idx => {
      if (idx !== -1 && starts[starts.length - 1] !== idx) starts.push(idx);
    };
    let priorPoss = startingPossession;
    for (let i = 0; i < playsList.length; i++){
      if (playsList[i].effect && playsList[i].effect.isReset){
        // A reset marker only OPENS the game's first drive. Every later
        // drive begins at a real possession change, which is detected
        // below and already lands on the reset marker that follows it.
        // "Adjust down / distance" writes a reset marker purely to
        // correct the chains, so using it mid-drive -- or twice in a row
        // -- must not register another drive, and therefore another
        // possession, for a team that never gave the ball up.
        if (!starts.length) pushStart(i);
        priorPoss = computeState(playsList.slice(0, i + 1)).possession;
        continue;
      }
      const possAfter = computeState(playsList.slice(0, i + 1)).possession;
      if (possAfter !== priorPoss) pushStart(firstRealPlayFrom(i + 1));
      priorPoss = possAfter;
    }
    return starts;
  }
  // Jersey numbers resolve across ALL THREE roster units, not just the one
  // the play type implies. High-school rosters routinely list a player
  // under a single unit even though they play several, and a dedicated
  // kick/punt returner is normally rostered on special teams only -- which
  // is why returners used to render in the log as a bare "#25".
  //
  // A fallback can only ever turn "#25" into a name; it can never change a
  // name that already resolved, because the expected unit is always
  // searched first. This mirrors playerName() in the report pages.
  function rosterName(teamKey, num, order){
    const t = TEAMS[teamKey];
    const buckets = { offense: t.rosterOffense, defense: t.rosterDefense, special: t.rosterSpecialTeams };
    for (const unit of order){
      const roster = buckets[unit];
      if (roster && roster[num]) return roster[num];
    }
    return null;
  }
  function nameInOffense(teamKey, num){
    const n = rosterName(teamKey, num, ['offense','special','defense']);
    return (n || ('#' + num)) + ' (' + TEAMS[teamKey].name + ')';
  }
  function nameInDefense(teamKey, num){
    const n = rosterName(teamKey, num, ['defense','special','offense']);
    return (n || ('#' + num)) + ' (' + TEAMS[teamKey].name + ')';
  }
  function nameInSpecialTeams(teamKey, num){
    const n = rosterName(teamKey, num, ['special','offense','defense']);
    return (n || ('#' + num)) + ' (' + TEAMS[teamKey].name + ')';
  }

  function computeState(playsList){
    const list = playsList || plays;
    const state = {
      possession: startingPossession,
      quarter: 1,
      scores: { teamA: 0, teamB: 0 },
      possessionTime: { teamA: 0, teamB: 0 },
      down: null, distance: null, fieldPos: null, startSpot: null, statYards: 0,
      penalties: { teamA: { count: 0, yds: 0 }, teamB: { count: 0, yds: 0 } },
    // NFHS: three timeouts per team per half, and they do NOT carry
    // over -- both teams get a fresh three at the start of the second
    // half regardless of what was left.
    timeouts: { teamA: TIMEOUTS_PER_HALF, teamB: TIMEOUTS_PER_HALF },
    // Which physical end of the field a team attacks. Recorded once and
    // alternated by quarter, because teams change ends after Q1, Q2 and
    // Q3. Everything else in this engine is possession-relative, so this
    // is the only place the app knows anything about actual direction.
    dirTeam: null, dirValue: null, dirQuarter: 1
    };
    const pendingClockStart = { teamA: null, teamB: null };
    for (const p of list){
      const e = p.effect;
      if (!e) continue;
      if (e.isReset){
        state.down = e.down; state.distance = e.distance; state.fieldPos = e.fieldPos;
        state.startSpot = e.fieldPos; state.statYards = 0;
      }
      if (e.isStat){
        if (state.fieldPos !== null){
          state.fieldPos += e.fieldDelta;
          state.fieldPos = Math.max(0, Math.min(100, state.fieldPos));
        }
        state.statYards += e.statYds;
        if (e.td){
          state.down = null; state.distance = null; state.fieldPos = null; state.startSpot = null; state.statYards = 0;
        } else {
          if (e.converts){
            state.down = 1;
            state.distance = state.fieldPos !== null ? Math.max(1, Math.min(10, 100 - state.fieldPos)) : 10;
          }
          else if (e.turnoverOnDowns && e.flipApplied){
            state.possession = otherTeam(state.possession);
            // The ball does not move on a turnover on downs -- it is spotted
            // exactly where the play ended, and the team taking over starts
            // 1st & 10 from there. fieldPos is possession-RELATIVE (0 is the
            // possessing team's own goal line), so keeping the same physical
            // spot means mirroring it to 100 - fieldPos for the new offense.
            // Clearing it instead used to force the coach to re-enter a spot
            // the app already knew.
            state.fieldPos = state.fieldPos !== null ? 100 - state.fieldPos : null;
            state.down = 1;
            state.distance = state.fieldPos !== null ? Math.max(1, Math.min(10, 100 - state.fieldPos)) : 10;
            state.startSpot = state.fieldPos; state.statYards = 0;
          } else if (!e.turnoverOnDowns){
            state.down = (state.down || 1) + 1;
            state.distance = Math.max((state.distance || 10) - e.statYds, 1);
          }
        }
      }
      if (e.endsDrive && !e.isStat){
        state.down = null; state.distance = null; state.fieldPos = null; state.startSpot = null; state.statYards = 0;
      }
      if (e.penaltyTeam){
        state.penalties[e.penaltyTeam].count += 1;
        state.penalties[e.penaltyTeam].yds += e.penaltyYds;
        if (state.fieldPos !== null){
          state.fieldPos += e.fieldDelta;
          state.fieldPos = Math.max(0, Math.min(100, state.fieldPos));
        }
        if (state.distance !== null){
          if (e.noDownChange){
            // Dead-ball foul, or one assessed after a kick or change of
            // possession: it is walked off before the series begins, so
            // the ball moves but the down and distance-to-go stay put.
            // Adjusting distance here would measure against a
            // line-to-gain that no longer exists -- which is how a
            // 10-yard foul against a team that had just taken over at
            // 1st & 10 used to become "1st & 20".
            if (state.fieldPos !== null){
              state.distance = Math.max(1, Math.min(state.distance, 100 - state.fieldPos));
            }
          } else {
            state.distance -= e.fieldDelta;
            if (state.distance <= 0){
              // Penalty yardage alone reached or passed the marker --
              // an automatic first down, regardless of what down it was.
              state.down = 1;
              state.distance = state.fieldPos !== null ? Math.max(1, Math.min(10, 100 - state.fieldPos)) : 10;
            }
          }
        }
      }
      if (e.score){ state.scores[e.score.team] += e.score.points; }
      if (e.scoreAdjust){ state.scores[e.scoreAdjust.team] += e.scoreAdjust.pts; }
      if (e.flip && e.flipApplied && !e.isStat){
        state.possession = e.flipTo;
        state.down = null; state.distance = null; state.fieldPos = null; state.startSpot = null; state.statYards = 0;
      }
      if (e.forcePossession){ state.possession = e.forcePossession; }
      if (e.setQuarter){
      // Crossing into the second half (or into overtime) resets the
      // allowance. Guarded on the quarter actually changing so that
      // re-entering a Q3 marker cannot hand out a second fresh set.
      if (e.setQuarter >= 3 && state.quarter < 3) state.timeouts = { teamA: TIMEOUTS_PER_HALF, teamB: TIMEOUTS_PER_HALF };
      if (e.setQuarter >= 5 && state.quarter < 5) state.timeouts = { teamA: TIMEOUTS_PER_OT, teamB: TIMEOUTS_PER_OT };
      state.quarter = e.setQuarter;
    }
    if (e.setDirection){
      state.dirTeam = e.setDirection.team;
      state.dirValue = e.setDirection.dir;
      state.dirQuarter = state.quarter;
    }
    if (e.timeout && state.timeouts[e.timeout.team] !== undefined){
      // Floored at zero: the log is a record of what the coach called,
      // and a fourth timeout should not read as -1 remaining.
      state.timeouts[e.timeout.team] = Math.max(0, state.timeouts[e.timeout.team] - 1);
    }
      if (e.clockEvent){
        const ce = e.clockEvent;
        if (ce.type === 'start'){ pendingClockStart[ce.team] = ce.absSec; }
        if (ce.type === 'end' && pendingClockStart[ce.team] !== null){
          state.possessionTime[ce.team] += Math.max(0, ce.absSec - pendingClockStart[ce.team]);
          pendingClockStart[ce.team] = null;
        }
        if (ce.type === 'transition'){
          if (pendingClockStart[ce.outgoingTeam] !== null){
            state.possessionTime[ce.outgoingTeam] += Math.max(0, ce.absSec - pendingClockStart[ce.outgoingTeam]);
            pendingClockStart[ce.outgoingTeam] = null;
          }
          pendingClockStart[ce.incomingTeam] = ce.absSec;
        }
      }
      if (e.setScores){ state.scores.teamA = e.setScores.teamA; state.scores.teamB = e.setScores.teamB; }
    }
    // Direction the team WITH THE BALL is currently driving. Derived, not
    // stored: ends alternate every quarter, so one recorded answer covers
    // the whole game, and re-recording it mid-game just re-bases the
    // alternation from that quarter.
    state.driveDir = null;
    if (state.dirValue && state.possession){
      const flipped = Math.abs((state.quarter || 1) - state.dirQuarter) % 2 === 1;
      let d = flipped ? (state.dirValue === 'right' ? 'left' : 'right') : state.dirValue;
      if (state.possession !== state.dirTeam) d = (d === 'right' ? 'left' : 'right');
      state.driveDir = d;
    }
    return state;
  }
  // --- End engine core ---

  function luminance(hex){
    const r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
    return (0.299*r + 0.587*g + 0.114*b) / 255;
  }
  function safeTextColor(bgHex, preferredHex){
    if (Math.abs(luminance(bgHex) - luminance(preferredHex)) > 0.35) return preferredHex;
    return luminance(bgHex) > 0.55 ? '#1a1a1a' : '#ffffff';
  }
  function colorDistance(hexA, hexB){
    const a = { r: parseInt(hexA.slice(1,3),16), g: parseInt(hexA.slice(3,5),16), b: parseInt(hexA.slice(5,7),16) };
    const b = { r: parseInt(hexB.slice(1,3),16), g: parseInt(hexB.slice(3,5),16), b: parseInt(hexB.slice(5,7),16) };
    return Math.sqrt((a.r-b.r)**2 + (a.g-b.g)**2 + (a.b-b.b)**2);
  }
  function buildTeams(game, rosterRows, ourBranding){
    const ourName = game.our_team_is_home ? game.home_team_name : game.away_team_name;
    const oppName = game.our_team_is_home ? game.away_team_name : game.home_team_name;
    TEAMS.teamA = { name: ourName, bg: ourBranding.primary_color || '#1a1a2e', text: ourBranding.secondary_color || '#ffffff',
      rosterOffense:{}, rosterDefense:{}, rosterSpecialTeams:{}, posOffense:{}, logo: ourBranding.logo_url || null,
      isHome: !!game.our_team_is_home };
    const oppPrimary = game.opponent_primary_color || '#8B0000', oppSecondary = game.opponent_secondary_color || '#ffffff';
    TEAMS.teamB = { name: oppName, bg: oppPrimary, text: oppSecondary,
      rosterOffense:{}, rosterDefense:{}, rosterSpecialTeams:{}, posOffense:{}, logo: game.opponent_logo_url || null,
      isHome: !game.our_team_is_home };
    if (colorDistance(TEAMS.teamA.bg, TEAMS.teamB.bg) < 60){
      if (colorDistance(TEAMS.teamA.bg, oppSecondary) >= 60){
        TEAMS.teamB.bg = oppSecondary;
        TEAMS.teamB.text = oppPrimary;
      } else {
        TEAMS.teamB.bg = luminance(TEAMS.teamA.bg) > 0.5 ? '#3a3a3a' : '#c8c8c8';
        TEAMS.teamB.text = luminance(TEAMS.teamB.bg) > 0.55 ? '#1a1a1a' : '#ffffff';
      }
    }
    rosterRows.forEach(r => {
      const team = TEAMS[r.team_side];
      if (!team) return;
      if (r.unit === 'offense'){ team.rosterOffense[r.jersey_number] = r.player_name; team.posOffense[r.jersey_number] = r.position; }
      else if (r.unit === 'defense'){ team.rosterDefense[r.jersey_number] = r.player_name; }
      else if (r.unit === 'special'){ team.rosterSpecialTeams[r.jersey_number] = r.player_name; }
    });
  }
  function playerName(team, num, preferredUnit){
  // An NCAA team rush (a QB kneel) is charged to the team, not a player,
  // so it carries the sentinel number TEAM and has no roster entry.
  if (num === 'TEAM') return 'TEAM';
    const t = TEAMS[team];
    const buckets = { offense: t.rosterOffense, defense: t.rosterDefense, special: t.rosterSpecialTeams };
    const order = preferredUnit ? [preferredUnit, ...Object.keys(buckets).filter(u => u !== preferredUnit)] : ['offense', 'defense', 'special'];
    for (const unit of order){
      const roster = buckets[unit];
      if (roster && roster[num]) return roster[num];
    }
    return '#' + num;
  }

  function computeBoxScore(playsList){
    const stats = {
      teamA: { rushing:{}, passing:{}, receiving:{}, defense:{}, specialTeams:{} },
      teamB: { rushing:{}, passing:{}, receiving:{}, defense:{}, specialTeams:{} }
    };
    function bucket(team, cat, num){
      if (!team || !stats[team]) return null;
      const b = stats[team][cat];
      if (!b[num]) b[num] = {};
      return b[num];
    }
    playsList.forEach(p => {
      const r = p.roles || {};
      const e = p.effect || {};
      const type = r.playType;

      if (r.carrier && type === 'rush'){
        const s = bucket(r.carrier.team, 'rushing', r.carrier.num);
        if (s){
          s.att = (s.att||0) + 1;
          s.yds = (s.yds||0) + (r.carrier.yards||0);
          s.long = Math.max(s.long||0, r.carrier.yards||0);
          if (e.td) s.td = (s.td||0) + 1;
        }
      }
      if (r.carrier && type === 'fumble'){
        const teamObj = TEAMS[r.carrier.team];
        const pos = ((teamObj && teamObj.posOffense[r.carrier.num]) || '').toUpperCase();
        const targetCat = RECEIVE_POS.has(pos) ? 'receiving' : 'rushing';
        const s = bucket(r.carrier.team, targetCat, r.carrier.num);
        if (s) s.fum = (s.fum||0) + 1;
      }
      if (r.passer && type === 'incomplete'){
        const s = bucket(r.passer.team, 'passing', r.passer.num);
        if (s) s.att = (s.att||0) + 1;
      }
      if (r.passer && type === 'pass'){
        const s = bucket(r.passer.team, 'passing', r.passer.num);
        if (s){
          s.att = (s.att||0) + 1;
          s.comp = (s.comp||0) + 1;
          s.yds = (s.yds||0) + (r.passer.yards||0);
          s.long = Math.max(s.long||0, r.passer.yards||0);
          if (e.td) s.td = (s.td||0) + 1;
        }
        if (r.receiver){
          const rs = bucket(r.receiver.team, 'receiving', r.receiver.num);
          if (rs){
            rs.rec = (rs.rec||0) + 1;
            rs.yds = (rs.yds||0) + (r.receiver.yards||0);
            rs.long = Math.max(rs.long||0, r.receiver.yards||0);
            if (e.td) rs.td = (rs.td||0) + 1;
          }
        }
      }
      if (r.passer && type === 'sack'){
        const s = bucket(r.passer.team, 'passing', r.passer.num);
        if (s) s.sacked = (s.sacked||0) + 1;
        // NFHS charges sack yardage to the team as a rushing loss. Doing
        // it here rather than as a subtraction in each page's totals
        // means the rushing rows actually add up to the rushing tile,
        // and every surface gets the same numbers from one place.
        const ts = bucket(r.passer.team, 'rushing', 'TEAM');
        if (ts){
          ts.att = (ts.att||0) + 1;
          ts.yds = (ts.yds||0) - (r.passer.yards||0);
        }
      }
      if (r.passer && type === 'int'){
        const s = bucket(r.passer.team, 'passing', r.passer.num);
        if (s){
          s.att = (s.att||0) + 1;
          s.intThrown = (s.intThrown||0) + 1;
        }
      }
      if (r.defense && (type === 'int' || type === 'sack' || type === 'fumble')){
        const s = bucket(r.defense.team, 'defense', r.defense.num);
        if (s){
          if (type === 'int') s.int = (s.int||0) + 1;
          if (type === 'sack') s.sacks = (s.sacks||0) + 1;
          if (type === 'fumble') s.fumRec = (s.fumRec||0) + 1;
        }
      } else if (type === 'int' || type === 'sack' || (type === 'fumble' && r.lost)){
        // Naming the tackler, interceptor or recoverer is optional, and
        // these stats used to be keyed entirely off that name -- so a
        // sack with nobody credited recorded no sack anywhere at all,
        // not even for the team. The event happened regardless, so it is
        // credited to a TEAM bucket. Every caller sums the whole defense
        // object, so this reaches all of them without touching each one.
        const victim = (type === 'fumble') ? (r.carrier && r.carrier.team) : (r.passer && r.passer.team);
        if (victim){
          const s = bucket(otherTeam(victim), 'defense', 'TEAM');
          if (s){
            if (type === 'int') s.int = (s.int||0) + 1;
            if (type === 'sack') s.sacks = (s.sacks||0) + 1;
            if (type === 'fumble') s.fumRec = (s.fumRec||0) + 1;
          }
        }
      }
      if (r.kicker && type === 'kickoff'){
        const s = bucket(r.kicker.team, 'specialTeams', r.kicker.num);
        if (s){
          s.kickoffs = (s.kickoffs||0) + 1;
          if (r.kicker.touchback) s.touchbacks = (s.touchbacks||0) + 1;
        }
      }
      if (r.kicker && type === 'fg'){
        const s = bucket(r.kicker.team, 'specialTeams', r.kicker.num);
        if (s){
          s.fgAtt = (s.fgAtt||0) + 1;
          if (r.kicker.result === 'g'){
            s.fgMade = (s.fgMade||0) + 1;
            s.fgLong = Math.max(s.fgLong||0, r.kicker.yards||0);
          }
          if (r.kicker.result === 'b') s.fgBlocked = (s.fgBlocked||0) + 1;
        }
      }
      if (r.kicker && type === 'pat'){
        const s = bucket(r.kicker.team, 'specialTeams', r.kicker.num);
        if (s){
          s.patAtt = (s.patAtt||0) + 1;
          if (r.kicker.result === 'g') s.patMade = (s.patMade||0) + 1;
          if (r.kicker.result === 'b') s.patBlocked = (s.patBlocked||0) + 1;
        }
      }
      if (r.punter && type === 'punt'){
        const s = bucket(r.punter.team, 'specialTeams', r.punter.num);
        if (s){
          s.punts = (s.punts||0) + 1;
          if (!r.punter.blocked){
            s.puntYds = (s.puntYds||0) + (r.punter.yards||0);
            s.puntsWithYards = (s.puntsWithYards||0) + 1;
            s.puntLong = Math.max(s.puntLong||0, r.punter.yards||0);
          } else {
            s.blocked = (s.blocked||0) + 1;
          }
        }
      }
    });

    ['teamA','teamB'].forEach(defTeam => {
      const offTeam = otherTeam(defTeam);
      let d3att=0, d3conv=0, d4att=0, d4conv=0, explosive=0;
      for (let i = 0; i < playsList.length; i++){
        const p = playsList[i];
        const type = p.roles && p.roles.playType;
        // Must match scrimmageTypes exactly. 'incomplete' was missing
        // here (and only here -- every other definition in the codebase
        // includes it), so an incomplete pass on 3rd down, which is the
        // single most common 3rd-down outcome in football, was not even
        // counted as an ATTEMPT. A drive that went incomplete / run for
        // no gain / incomplete / punt reported "no 3rd downs" rather
        // than 0 of 1.
        if (!['rush','pass','incomplete','sack','int','fumble'].includes(type)) continue;
        const before = computeState(playsList.slice(0, i));
        if (before.possession !== offTeam) continue;
        const down = before.down;
        const success = !!(p.effect && (p.effect.converts || p.effect.td));
        if (down === 3){ d3att++; if (success) d3conv++; }
        else if (down === 4){ d4att++; if (success) d4conv++; }
        if (((p.effect && p.effect.statYds) || 0) >= 20) explosive++;
      }
      stats[defTeam].oppDowns = {
        d3Pct: d3att ? Math.round(100*d3conv/d3att) : null, d3att, d3conv,
        d4Pct: d4att ? Math.round(100*d4conv/d4att) : null, d4att, d4conv,
        explosive
      };
    });

    return stats;
  }

  function countPossessions(playsList){
    // A possession IS a drive, so this must use exactly the same
    // boundary rules as findDriveStarts. It used to reimplement them,
    // and the two disagreed: a detected possession change AND the
    // explicit "New drive" marker that follows it were each counted,
    // so an ordinary kickoff -> clock line -> new drive sequence
    // credited the receiving team twice. A brand-new game in which
    // each side had had the ball exactly once reported 2 possessions
    // apiece. Deriving from findDriveStarts makes the two agree by
    // construction rather than by keeping two copies in step.
    const counts = { teamA: 0, teamB: 0 };
    findDriveStarts(playsList).forEach(idx => {
      // Possession AFTER the starting play, matching how
      // computeDriveSummary attributes a drive to a team.
      const team = computeState(playsList.slice(0, idx + 1)).possession;
      if (team === 'teamA' || team === 'teamB') counts[team]++;
    });
    return counts;
  }
  function countTurnovers(playsList){
    const counts = { teamA: 0, teamB: 0 };
    playsList.forEach(p => {
      const r = p.roles;
      if (!r) return;
      if (r.playType === 'int' && r.passer) counts[r.passer.team] = (counts[r.passer.team] || 0) + 1;
      // r.defense used to be the only signal that a fumble was LOST
      // rather than recovered by the offense. Now that naming the
      // recoverer is optional, r.lost carries that meaning explicitly.
      // r.defense is still honoured so plays saved before this change
      // keep counting.
      if (r.playType === 'fumble' && r.carrier && (r.lost || r.defense)) counts[r.carrier.team] = (counts[r.carrier.team] || 0) + 1;
    });
    return counts;
  }

  const RECEIVE_POS = new Set(['WR','TE','SE','FL','SLOT']);

  async function init(){
    const params = new URLSearchParams(window.location.search);
    const currentGameId = params.get('id');
    if (!currentGameId){
      showView('errorView');
      document.getElementById('errorMsg').textContent = 'No game specified.';
      return;
    }

    const { data: gameRows, error: gameError } = await supabaseClient
      .from('games').select('*').eq('id', currentGameId).limit(1);
    if (gameError || !gameRows || gameRows.length === 0){
      showView('errorView');
      document.getElementById('errorMsg').textContent = gameError ? gameError.message : 'That game could not be found.';
      return;
    }
    const game = gameRows[0];
    gameLabel = game.designator;
    gameDate = game.game_date;
    quarterLengthSec = game.quarter_length_seconds || 720;

    const { data: rosterRows, error: rosterError } = await supabaseClient
      .from('game_rosters').select('*').eq('game_id', currentGameId);
    if (rosterError){
      showView('errorView');
      document.getElementById('errorMsg').textContent = rosterError.message;
      return;
    }

    const { data: teamRows } = await supabaseClient
      .from('teams').select('primary_color, secondary_color, logo_url').eq('is_our_team', true).limit(1);
    const ourBranding = (teamRows && teamRows[0]) || {};

    buildTeams(game, rosterRows || [], ourBranding);

    const { data: existingPlays, error: playsError } = await supabaseClient
      .from('plays').select('*').eq('game_id', currentGameId).order('sequence_number', { ascending: true });
    if (playsError){
      showView('errorView');
      document.getElementById('errorMsg').textContent = playsError.message;
      return;
    }
    plays = (existingPlays || []).map(p => ({
      text: p.text, effect: p.effect || {}, team: p.team_side, quarter: p.quarter,
      roles: p.roles, unresolved: p.unresolved, isDivider: p.is_divider, isOverride: p.is_override
    }));

    document.title = 'Statistics Report — ' + TEAMS.teamA.name + ' vs ' + TEAMS.teamB.name;
    try {
      document.getElementById('reportContent').innerHTML = renderReport();
      showView('mainView');
    } catch (err) {
      showView('errorView');
      document.getElementById('errorMsg').textContent = 'This report could not be built: ' + err.message;
      console.error(err);
    }
  }

  document.getElementById('downloadPdfBtn').addEventListener('click', () => window.print());

  function buildWorkbook(){
    const box = computeBoxScore(plays);
    const finalState = computeState();
    const possessions = countPossessions(plays);
    const turnovers = countTurnovers(plays);
    const gameIdMatch = (gameLabel || '').match(/(\d+)/);
    const gameId = gameIdMatch ? parseInt(gameIdMatch[1]) : (gameLabel || '');
    const oppKey = 'teamB';

    // Quarter-by-quarter scoring, with any 5th-or-later quarter folded
    // into a single OT total rather than clamped into Q4.
    const quarterScores = { teamA: [0,0,0,0], teamB: [0,0,0,0] };
    const otScores = { teamA: 0, teamB: 0 };
    plays.forEach(p => {
      const q = p.quarter || 1;
      const points = (p.effect && p.effect.score) ? p.effect.score : null;
      const adjust = (p.effect && p.effect.scoreAdjust) ? p.effect.scoreAdjust : null;
      if (points){
        if (q >= 5) otScores[points.team] += points.points;
        else quarterScores[points.team][q-1] += points.points;
      }
      if (adjust){
        if (q >= 5) otScores[adjust.team] += adjust.pts;
        else quarterScores[adjust.team][q-1] += adjust.pts;
      }
    });

    // Half-by-half yardage, split into rushing and passing separately
    // (quarters 1-2 = first half, 3+ = second half) -- nothing
    // upstream computes this, so it's built directly from the play log.
    const halfYards = { teamA: { h1Rush:0, h1Pass:0, h2Rush:0, h2Pass:0 }, teamB: { h1Rush:0, h1Pass:0, h2Rush:0, h2Pass:0 } };
    plays.forEach(p => {
      const r = p.roles;
      if (!r) return;
      const half = (p.quarter || 1) <= 2 ? 'h1' : 'h2';
      if (r.playType === 'rush' && r.carrier) halfYards[r.carrier.team][half+'Rush'] += (r.carrier.yards || 0);
      if (r.playType === 'pass' && r.passer) halfYards[r.passer.team][half+'Pass'] += (r.passer.yards || 0);
    });

    const headers = ['GameID','Team','Player','Rush Attempts','Rush Yards','Yds Per Carry','Long Rush','Rush TD',
      'Pass Attempts','Pass Completions','Comp Pctg','Pass Yards','Long Pass','Pass TD','INT','SACK',
      'Receptions','Receiving Yards','Yards Per Catch','Long Recept','Receiving TD','FUMBLE',
      'KO Attempt','KO Touchback','PA Attempt','PA Made','PA Block','FG Attempt','FG Made','FG Block','FG Yards','Long FG',
      'Punt Attempt','Punt Yards','Long Punt','PUNT BLK',
      'D-Sack','D-INT','D-FUM','D-3rdAtt','D-3rdConv','D-4thAtt','D-4thStop','D-20PlusPlay'];
    const blankRow = () => headers.map(() => '');
    const setCols = (row, obj) => { Object.keys(obj).forEach(k => { row[headers.indexOf(k)] = obj[k]; }); return row; };
    const rows = [headers];

    // Rushing -- one row per rusher, aggregated for the game, with a
    // Long field since that's how the reference tracks rush/pass/rec.
    Object.keys(box.teamA.rushing).forEach(n => {
      const d = box.teamA.rushing[n];
      const row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: playerName('teamA', n),
        'Rush Attempts': d.att||0, 'Rush Yards': d.yds||0,
        'Yds Per Carry': d.att ? +(d.yds/d.att).toFixed(1) : '', 'Long Rush': d.long||0, 'Rush TD': d.td||0,
        FUMBLE: d.fum || '' });
      rows.push(row);
    });

    // Passing -- one row per passer, aggregated for the game.
    Object.keys(box.teamA.passing).forEach(n => {
      const d = box.teamA.passing[n];
      const row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: playerName('teamA', n),
        'Pass Attempts': d.att||0, 'Pass Completions': d.comp||0,
        'Comp Pctg': d.att ? +(100*(d.comp||0)/d.att).toFixed(1) : '',
        'Pass Yards': d.yds||0, 'Long Pass': d.long||0, 'Pass TD': d.td||0, INT: d.intThrown||0, SACK: d.sacked||0 });
      rows.push(row);
    });

    // Receiving -- one row per receiver, aggregated for the game.
    Object.keys(box.teamA.receiving).forEach(n => {
      const d = box.teamA.receiving[n];
      const row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: playerName('teamA', n),
        Receptions: d.rec||0, 'Receiving Yards': d.yds||0,
        'Yards Per Catch': d.rec ? +(d.yds/d.rec).toFixed(1) : '', 'Long Recept': d.long||0, 'Receiving TD': d.td||0,
        FUMBLE: d.fum || '' });
      rows.push(row);
    });

    // Kickoffs -- aggregated per kicker for the game.
    Object.keys(box.teamA.specialTeams).filter(n => box.teamA.specialTeams[n].kickoffs).forEach(n => {
      const d = box.teamA.specialTeams[n];
      const row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: playerName('teamA', n, 'special'),
        'KO Attempt': d.kickoffs||0, 'KO Touchback': d.touchbacks||0 });
      rows.push(row);
    });

    // PAT -- aggregated per kicker for the game.
    Object.keys(box.teamA.specialTeams).filter(n => box.teamA.specialTeams[n].patAtt).forEach(n => {
      const d = box.teamA.specialTeams[n];
      const row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: playerName('teamA', n, 'special'),
        'PA Attempt': d.patAtt||0, 'PA Made': d.patMade||0, 'PA Block': d.patBlocked||0 });
      rows.push(row);
    });

    // FG and Punts -- one row per individual attempt, matching the
    // reference exactly, since "Long FG"/"Long Punt" and block status
    // are per-play facts, not something that survives aggregation the
    // way rush/pass/rec's single Long field does. Read straight off
    // the play log rather than the aggregated box score buckets.
    plays.forEach(p => {
      const r = p.roles;
      if (!r || r.playType !== 'fg' || !r.kicker || r.kicker.team !== 'teamA') return;
      const row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: playerName('teamA', r.kicker.num, 'special'),
        'FG Attempt': 1, 'FG Made': r.kicker.result === 'g' ? 1 : 0, 'FG Block': r.kicker.result === 'b' ? 1 : 0,
        'FG Yards': r.kicker.yards || 0 });
      rows.push(row);
    });
    plays.forEach(p => {
      const r = p.roles;
      if (!r || r.playType !== 'punt' || !r.punter || r.punter.team !== 'teamA') return;
      const row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: playerName('teamA', r.punter.num, 'special'),
        'Punt Attempt': 1, 'Punt Yards': r.punter.blocked ? 0 : (r.punter.yards || 0), 'PUNT BLK': r.punter.blocked ? 1 : '' });
      rows.push(row);
    });

    // Sacks and Bad Snaps -- yardage lost to sacks against our own
    // passer, tracked as a negative rushing line per football
    // convention. computeBoxScore only counts sacks, it never sums
    // the yardage lost, so this reads the raw play log directly.
    let sackCount = 0, sackYardsLost = 0;
    plays.forEach(p => {
      const r = p.roles;
      if (r && r.playType === 'sack' && r.passer && r.passer.team === 'teamA'){
        sackCount++; sackYardsLost += (r.passer.yards || 0);
      }
    });
    if (sackCount){
      const row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: 'Sacks and Bad Snaps',
        'Rush Attempts': sackCount, 'Rush Yards': -sackYardsLost });
      rows.push(row);
    }

    // Defense -- our own defense's totals against the opponent's offense.
    // The opponent's own offensive numbers are stored on box.teamA's
    // oppDowns entry (that's "the other team's -- teamB's -- own
    // offense", by the same logic the team-stats section already uses).
    const oppOffenseVsUs = box.teamA.oppDowns;
    const defRow = blankRow();
    setCols(defRow, { GameID: gameId, Team: TEAMS.teamA.name, Player: 'Defense',
      'D-Sack': sumStat(box.teamA.defense,'sacks')||'', 'D-INT': sumStat(box.teamA.defense,'int')||'',
      'D-FUM': sumStat(box.teamA.defense,'fumRec')||'',
      'D-3rdAtt': oppOffenseVsUs.d3att||'', 'D-3rdConv': oppOffenseVsUs.d3conv||'',
      'D-4thAtt': oppOffenseVsUs.d4att||'', 'D-4thStop': oppOffenseVsUs.d4att ? (oppOffenseVsUs.d4att - oppOffenseVsUs.d4conv) : '',
      'D-20PlusPlay': oppOffenseVsUs.explosive||'' });
    rows.push(defRow);

    // Offense -- our own explosive-play count, stored on box.teamB's
    // oppDowns entry (that's "the other team's defense against this
    // team's offense", i.e. our own numbers).
    const ourOffense = box.teamB.oppDowns;
    const offRow = blankRow();
    setCols(offRow, { GameID: gameId, Team: TEAMS.teamA.name, Player: 'Offense', 'D-20PlusPlay': ourOffense.explosive||'' });
    rows.push(offRow);

    // Opponent -- one combined team-total row, since individual
    // opponent players aren't tracked (StatChat has no way to enter
    // an opponent roster).
    const oppRush = box[oppKey].rushing, oppPass = box[oppKey].passing;
    const oppRushAtt = sumStat(oppRush,'att'), oppRushYds = sumStat(oppRush,'yds'), oppRushTd = sumStat(oppRush,'td');
    const oppPassAtt = sumStat(oppPass,'att'), oppPassComp = sumStat(oppPass,'comp'), oppPassYds = sumStat(oppPass,'yds'), oppPassTd = sumStat(oppPass,'td');
    const oppRow = blankRow();
    setCols(oppRow, { GameID: gameId, Team: TEAMS[oppKey].name, Player: TEAMS[oppKey].name,
      'Rush Attempts': oppRushAtt||'', 'Rush Yards': oppRushYds||'', 'Rush TD': oppRushTd||'',
      'Pass Attempts': oppPassAtt||'', 'Pass Completions': oppPassComp||'', 'Pass Yards': oppPassYds||'', 'Pass TD': oppPassTd||'' });
    rows.push(oppRow);

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Stats');

    // Game Totals -- one row per team, matching the reference sheet's
    // exact columns (including its "Penalites" spelling, since a
    // downstream dashboard may already query that exact name).
    const gtHeaders = ['GameID','Team','Q1','Q2','Q3','Q4','OT','Final','Penalites','Penalty Yards',
      'H1 Yards','H2 Yards','Total Yards','Sacks','TO','Possessions','3D Att','3D Conv','4D Att','4D Conv',
      'H1 Rushing','H1 Passing','H2 Rushing','H2 Passing'];
    const gtRows = [gtHeaders];
    [ 'teamA', oppKey ].forEach(teamKey => {
      const pen = finalState.penalties[teamKey];
      const hy = halfYards[teamKey];
      const h1Total = hy.h1Rush + hy.h1Pass, h2Total = hy.h2Rush + hy.h2Pass;
      const own = box[otherTeam(teamKey)].oppDowns; // this team's own offensive down conversions
      const gtRow = new Array(gtHeaders.length).fill('');
      const setGt = (obj) => Object.keys(obj).forEach(k => { gtRow[gtHeaders.indexOf(k)] = obj[k]; });
      setGt({
        GameID: gameId, Team: TEAMS[teamKey].name,
        Q1: quarterScores[teamKey][0], Q2: quarterScores[teamKey][1], Q3: quarterScores[teamKey][2], Q4: quarterScores[teamKey][3],
        OT: otScores[teamKey] || '', Final: finalState.scores[teamKey],
        Penalites: pen.count || '', 'Penalty Yards': pen.yds || '',
        'H1 Yards': h1Total, 'H2 Yards': h2Total, 'Total Yards': h1Total + h2Total,
        Sacks: sumStat(box[teamKey].passing, 'sacked') || '', TO: turnovers[teamKey] || 0,
        Possessions: possessions[teamKey] || 0,
        '3D Att': own.d3att || '', '3D Conv': own.d3conv || '', '4D Att': own.d4att || '', '4D Conv': own.d4conv || '',
        'H1 Rushing': hy.h1Rush, 'H1 Passing': hy.h1Pass, 'H2 Rushing': hy.h2Rush, 'H2 Passing': hy.h2Pass
      });
      gtRows.push(gtRow);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(gtRows), 'Game Totals');

    return wb;
  }

  document.getElementById('downloadXlsBtn').addEventListener('click', () => {
    const wb = buildWorkbook();
    const filename = (gameLabel || 'game') + '_stat_package.xlsx';
    XLSX.writeFile(wb, filename.replace(/[^a-z0-9._-]+/gi, '_'));
  });

  function sumStat(bucketObj, key){
    return Object.keys(bucketObj).reduce((t, n) => t + (bucketObj[n][key] || 0), 0);
  }
  function maxStat(bucketObj, key){
    return Object.keys(bucketObj).reduce((t, n) => Math.max(t, bucketObj[n][key] || 0), 0);
  }
  function statTable(teamKey, bucketObj, headers, rowFn, totalFn, sortKey, nameUnit){
    const nums = Object.keys(bucketObj);
    if (!nums.length) return '';
    const sorted = nums.slice().sort((a, b) => (bucketObj[b][sortKey]||0) - (bucketObj[a][sortKey]||0));
    let h = '<table class="stat-table"><tr><th></th>' + headers.map(x => '<th>' + x + '</th>').join('') + '</tr>';
    sorted.forEach(n => {
      h += '<tr><td>' + playerName(teamKey, n, nameUnit) + '</td>' + rowFn(bucketObj[n], n).map(v => '<td>' + v + '</td>').join('') + '</tr>';
    });
    h += '<tr class="total-row"><td>Total</td>' + totalFn(bucketObj, nums).map(v => '<td>' + v + '</td>').join('') + '</tr>';
    return '<div class="table-scroll">' + h + '</table></div>';
  }

  function renderReport(){
    const box = computeBoxScore(plays);
    const finalState = computeState();
    const possessions = countPossessions(plays);
    const turnovers = countTurnovers(plays);
    const scrimmageTypes = ['rush','pass','incomplete','sack','int','fumble'];
    const playsFor = (teamKey) => plays.filter(p => p.team === teamKey && p.roles && scrimmageTypes.includes(p.roles.playType)).length;

    const quarterScores = { teamA: [0,0,0,0], teamB: [0,0,0,0] };
    plays.forEach(p => {
      const q = Math.min(4, Math.max(1, p.quarter || 1)) - 1;
      if (p.effect && p.effect.score) quarterScores[p.effect.score.team][q] += p.effect.score.points;
      if (p.effect && p.effect.scoreAdjust) quarterScores[p.effect.scoreAdjust.team][q] += p.effect.scoreAdjust.pts;
    });

    const teamMetrics = (teamKey) => {
      const s = box[teamKey];
      let rushYds = sumStat(s.rushing, 'yds');
      const rushAtt = sumStat(s.rushing, 'att'), rushTd = sumStat(s.rushing, 'td');
      // Verified against real NFL box scores: sack yardage lost comes
      // out of the team's Pass Yards total, not Rushing. A passer's
      // own personal statline stays unadjusted -- only this team-level
      // total subtracts it. computeBoxScore only counts sacks, never
      // sums their yardage, so this reads the raw play log directly.
      const sackYardsLost = plays.reduce((t, p) => {
        const r = p.roles;
        return (r && r.playType === 'sack' && r.passer && r.passer.team === teamKey) ? t + (r.passer.yards || 0) : t;
      }, 0);
      // NFHS: charge the sack yardage against rushing.
      const passYds = sumStat(s.passing, 'yds'), passAtt = sumStat(s.passing, 'att'), sacked = sumStat(s.passing, 'sacked');
      const passComp = sumStat(s.passing, 'comp');
      const passTd = sumStat(s.passing, 'td');
      const totalYds = rushYds + passYds, totalPlays = playsFor(teamKey);
      const own = box[otherTeam(teamKey)].oppDowns;
      const pen = finalState.penalties[teamKey];
      return { totalYds, totalPlays, passYds, passAtt, passComp, passTd, rushYds, rushAtt, rushTd, sacked,
        turnovers: turnovers[teamKey]||0, penCount: pen.count, penYds: pen.yds,
        possessions: possessions[teamKey]||0, own };
    };

    const visitorKey = TEAMS.teamA.isHome ? 'teamB' : 'teamA';
    const homeKey = TEAMS.teamA.isHome ? 'teamA' : 'teamB';

    let html = '<div class="report-header"><img class="statchat-logo" src="logo.png" alt="StatChat">' +
      '<h1>' + TEAMS[visitorKey].name + ' @ ' + TEAMS[homeKey].name + '</h1>' +
      '<div class="sub">' + (gameLabel || '') + (gameDate ? ' &middot; ' + new Date(gameDate + 'T00:00:00').toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'}) : '') + '</div>' +
      '</div>';

    html += '<table class="quarter-table"><tr><th></th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th><th>Final</th></tr>' +
      '<tr><td>' + TEAMS[visitorKey].name + '</td>' + quarterScores[visitorKey].map(v=>'<td>'+v+'</td>').join('') + '<td>' + finalState.scores[visitorKey] + '</td></tr>' +
      '<tr><td>' + TEAMS[homeKey].name + '</td>' + quarterScores[homeKey].map(v=>'<td>'+v+'</td>').join('') + '<td>' + finalState.scores[homeKey] + '</td></tr>' +
      '</table>';

    const teamBlock = (teamKey, allowedLabel) => {
      const m = teamMetrics(teamKey);
      const groups = [
        { color: '#534AB7', label: 'Overall', items: [
          [m.totalYds, allowedLabel ? 'Yds allowed' : 'Total yds'], [m.totalPlays, 'Plays'],
          [m.totalPlays ? (m.totalYds/m.totalPlays).toFixed(1) : '0.0', 'Yds/play'], [m.possessions, 'Possessions'] ] },
        { color: '#0F6E56', label: 'Passing', items: [
          [m.passYds, 'Yds'], [m.passAtt ? (m.passYds/m.passAtt).toFixed(1) : '0.0', 'Yds/att'], [m.passTd, 'TD'],
          [m.passAtt ? Math.round(100*m.passComp/m.passAtt)+'%' : '—', 'Comp %'] ] },
        { color: '#993C1D', label: 'Rushing', items: [
          [m.rushYds, 'Yds'], [m.rushAtt ? (m.rushYds/m.rushAtt).toFixed(1) : '0.0', 'Yds/att'], [m.rushTd, 'TD'] ] },
        { color: '#993556', label: 'Discipline', items: [
          [m.turnovers, 'Turnovers'], [m.sacked, 'Sacks allowed'], [m.penCount + '-' + m.penYds, 'Penalties'] ] },
        { color: '#999', label: 'Efficiency', items: [
          [m.own.d3Pct !== null ? m.own.d3conv+'/'+m.own.d3att+' ('+m.own.d3Pct+'%)' : '—', '3rd down'],
          [m.own.d4Pct !== null ? m.own.d4conv+'/'+m.own.d4att+' ('+m.own.d4Pct+'%)' : '—', '4th down'],
          [m.own.explosive, '20yd+ plays'] ] }
      ];
      const groupHtml = groups.map(g => '<div class="metric-group">' +
        '<div class="metric-group-label">' + g.label + '</div>' +
        '<div class="metric-group-row">' + g.items.map(([val,label]) =>
          '<div class="metric-item"><span class="metric-val">' + val + '</span><span class="metric-label">' + label + '</span></div>').join('') +
        '</div></div>').join('');
      return '<div class="team-block">' +
        '<div class="team-block-header">' + (TEAMS[teamKey].logo ? '<img class="team-block-logo" src="'+TEAMS[teamKey].logo+'">' : '') + TEAMS[teamKey].name + '</div>' +
        groupHtml + '</div>';
    };
    html += teamBlock('teamA', false) + teamBlock('teamB', true);

    html += '<div class="section-title">' + TEAMS.teamA.name + ' — Passing</div>' +
      (statTable('teamA', box.teamA.passing, ['Att','Comp','%','Yds','Y/C','Long','TD','Int','Sacked','Rush TD','Fumble'],
        (d, n) => { const rd = box.teamA.rushing[n] || {};
          return [d.att||0, d.comp||0, d.att?Math.round(100*(d.comp||0)/d.att):0, d.yds||0, d.comp?(d.yds/d.comp).toFixed(1):'0.0', d.long||0, d.td||0, d.intThrown||0, d.sacked||0, rd.td||0, (d.fum||0)+(rd.fum||0)]; },
        (obj, nums) => { const att=sumStat(obj,'att'), comp=sumStat(obj,'comp'), yds=sumStat(obj,'yds');
          const rushTdTotal = nums.reduce((t,n) => t + ((box.teamA.rushing[n]&&box.teamA.rushing[n].td)||0), 0);
          const fumTotal = nums.reduce((t,n) => t + ((obj[n].fum||0) + ((box.teamA.rushing[n]&&box.teamA.rushing[n].fum)||0)), 0);
          return [att, comp, att?Math.round(100*comp/att):0, yds, comp?(yds/comp).toFixed(1):'0.0', maxStat(obj,'long'), sumStat(obj,'td'), sumStat(obj,'intThrown'), sumStat(obj,'sacked'), rushTdTotal, fumTotal]; },
        'yds') || '<p class="no-stats">No passing stats recorded.</p>');

    html += '<div class="section-title">' + TEAMS.teamA.name + ' — Receiving</div>' +
      (statTable('teamA', box.teamA.receiving, ['Rec','Yds','Y/C','Long','TD','Fumble'],
        d => [d.rec||0, d.yds||0, d.rec?(d.yds/d.rec).toFixed(1):'0.0', d.long||0, d.td||0, d.fum||0],
        (obj) => { const rec=sumStat(obj,'rec'), yds=sumStat(obj,'yds');
          return [rec, yds, rec?(yds/rec).toFixed(1):'0.0', maxStat(obj,'long'), sumStat(obj,'td'), sumStat(obj,'fum')]; },
        'yds') || '<p class="no-stats">No receiving stats recorded.</p>');

    html += '<div class="section-title">' + TEAMS.teamA.name + ' — Rushing</div>' +
      (statTable('teamA', box.teamA.rushing, ['Att','Yds','Y/C','Long','TD','Fumble'],
        d => [d.att||0, d.yds||0, d.att?(d.yds/d.att).toFixed(1):'0.0', d.long||0, d.td||0, d.fum||0],
        (obj) => { const att=sumStat(obj,'att'), yds=sumStat(obj,'yds');
          return [att, yds, att?(yds/att).toFixed(1):'0.0', maxStat(obj,'long'), sumStat(obj,'td'), sumStat(obj,'fum')]; },
        'yds') || '<p class="no-stats">No rushing stats recorded.</p>');

    const defOwn = box.teamB.oppDowns;
    const defNums = Object.keys(box.teamA.defense);
    html += '<div class="section-title">' + TEAMS.teamA.name + ' — Defense</div>';
    html += defNums.length || defOwn.d3att || defOwn.d4att || defOwn.explosive
      ? '<table class="stat-table"><tr><th></th><th>Int</th><th>Fum Forced</th><th>Sacks</th><th>Opp 3rd %</th><th>Opp 4th %</th><th>Plays Over 20 Allowed</th></tr>' +
        '<tr><td>Defense</td><td>' + sumStat(box.teamA.defense,'int') + '</td><td>' + sumStat(box.teamA.defense,'fumRec') + '</td><td>' + sumStat(box.teamA.defense,'sacks') + '</td>' +
        '<td>' + (defOwn.d3Pct !== null ? defOwn.d3Pct+'%' : '—') + '</td><td>' + (defOwn.d4Pct !== null ? defOwn.d4Pct+'%' : '—') + '</td><td>' + defOwn.explosive + '</td></tr></table>'
      : '<p class="no-stats">No defensive stats recorded.</p>';

    const koNums = Object.keys(box.teamA.specialTeams).filter(n => box.teamA.specialTeams[n].kickoffs);
    const puntNums = Object.keys(box.teamA.specialTeams).filter(n => box.teamA.specialTeams[n].punts);
    const kickNums = Object.keys(box.teamA.specialTeams).filter(n => box.teamA.specialTeams[n].fgAtt || box.teamA.specialTeams[n].patAtt);
    html += '<div class="section-title">' + TEAMS.teamA.name + ' — Special Teams</div>';
    const stSub = (label, tableHtml) => tableHtml ? '<div class="st-subsection"><div class="st-subsection-label">' + label + '</div>' + tableHtml + '</div>' : '';
    let stHtml = '';
    if (koNums.length){
      stHtml += stSub('Kickoffs', statTable('teamA', Object.fromEntries(koNums.map(n=>[n,box.teamA.specialTeams[n]])), ['Kickoffs','Touchbacks','TB %'],
        d => [d.kickoffs||0, d.touchbacks||0, d.kickoffs?Math.round(100*(d.touchbacks||0)/d.kickoffs)+'%':'—'],
        (obj) => { const k=sumStat(obj,'kickoffs'), tb=sumStat(obj,'touchbacks'); return [k, tb, k?Math.round(100*tb/k)+'%':'—']; },
        'kickoffs', 'special'));
    }
    if (puntNums.length){
      stHtml += stSub('Punting', statTable('teamA', Object.fromEntries(puntNums.map(n=>[n,box.teamA.specialTeams[n]])), ['Punts','Yds Per Punt','Long','Blocked'],
        d => [d.punts||0, d.puntsWithYards?(d.puntYds/d.puntsWithYards).toFixed(1):'0.0', d.puntLong||0, d.blocked||0],
        (obj) => { const p=sumStat(obj,'punts'), yds=sumStat(obj,'puntYds'), wy=sumStat(obj,'puntsWithYards');
          return [p, wy?(yds/wy).toFixed(1):'0.0', maxStat(obj,'puntLong'), sumStat(obj,'blocked')]; },
        'puntYds', 'special'));
    }
    if (kickNums.length){
      stHtml += stSub('Kicking', statTable('teamA', Object.fromEntries(kickNums.map(n=>[n,box.teamA.specialTeams[n]])), ['FG Att','FG Made','Long FG','FG %','FG Blk','XP Att','XP Made','XP %','XP Blk'],
        d => [d.fgAtt||0, d.fgMade||0, d.fgLong||0, d.fgAtt?Math.round(100*(d.fgMade||0)/d.fgAtt)+'%':'—', d.fgBlocked||0, d.patAtt||0, d.patMade||0, d.patAtt?Math.round(100*(d.patMade||0)/d.patAtt)+'%':'—', d.patBlocked||0],
        (obj) => { const fa=sumStat(obj,'fgAtt'), fm=sumStat(obj,'fgMade'), pa=sumStat(obj,'patAtt'), pm=sumStat(obj,'patMade');
          return [fa, fm, maxStat(obj,'fgLong'), fa?Math.round(100*fm/fa)+'%':'—', sumStat(obj,'fgBlocked'), pa, pm, pa?Math.round(100*pm/pa)+'%':'—', sumStat(obj,'patBlocked')]; },
        'fgAtt', 'special'));
    }
    html += stHtml || '<p class="no-stats">No special teams stats recorded.</p>';

    return html;
  }
</script>
</body>
</html>
