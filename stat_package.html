     below still wins -- that ordering is what lets a page be converted

<title>StatChat — Statistics Report</title>
<style>
  html, body { margin:0; padding:0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background:var(--sc-page, #f4f3ef); color:var(--sc-ink, #1a1a1a); }
  .wrap { max-width:960px; margin:0 auto; padding:24px 24px 60px; box-sizing:border-box; }
  .hidden { display:none !important; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .topbar a { color:#555; text-decoration:none; font-size:14px; font-weight:600; }
  .topbar .actions { display:flex; gap:10px; }
  .topbar button { border:none; border-radius:8px; padding:10px 18px; font-size:14px; font-weight:700; cursor:pointer; }
  .topbar button.pdf { background:var(--sc-green, #1a7a4c); color:#fff; }
  .topbar button.xls { background:var(--sc-green-dark, #0f6e56); color:#fff; }
  .msg { padding:10px 14px; border-radius:8px; margin-bottom:14px; font-size:14px; }
  .msg.error { background:var(--sc-red-tint, #fdecea); color:var(--sc-red, #a32d2d); }
  .report-header { position:relative; text-align:center; margin-bottom:16px; background:#fff; border:1px solid #ddd; padding:16px; }
  .statchat-logo { position:absolute; top:12px; right:12px; width:60px; height:auto; border-radius:6px; }
  .report-header h1 { font-size:18px; margin:0 0 4px; }
  .report-header .sub { color:#666; font-size:13px; }
  table.quarter-table { width:100%; border-collapse:collapse; margin:0 auto 16px; font-size:13px; background:#fff; border:1px solid #ddd; }
  /* Crest beside the team name in the box score, matching the recap. */
  .quarter-table .qtr-team { text-align:left; }
  .quarter-table .qtr-team img.qtr-team-logo { width:26px; height:26px; object-fit:contain;
                                               vertical-align:middle; margin-right:9px;
                                               display:inline-block; }
  table.quarter-table th, table.quarter-table td { padding:6px 10px; text-align:center; border:1px solid #eee; }
  table.quarter-table th:first-child, table.quarter-table td:first-child { text-align:left; font-weight:700; }
  .team-block { background:#fff; border:1px solid #ddd; padding:14px 16px; margin-bottom:16px; }
  .team-block-header { display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; margin-bottom:10px; padding-bottom:8px; border-bottom:2px solid #eee; }
  .team-block-logo { width:32px; height:32px; object-fit:contain; }
  /* The group heading sits BESIDE its metrics, not above them, in a fixed
     gutter. Six groups per team then line their headings up in a straight
     column, so a reader finds EFFICIENCY by looking rather than by
     reading down -- and each heading stops costing a line of its own,
     which over six groups and two teams is most of a section on a printed
     page.
     Centred against the full two-line height of an item, so it reads as
     belonging to the number AND its descriptor. Baseline alignment looked
     right on a short row and drifted on a long one. */
  .metric-group { border-top:0.5px solid #eee; padding-top:10px; margin-top:10px;
                  display:flex; gap:18px; align-items:center; }
  .metric-group:first-child { border-top:none; padding-top:0; margin-top:0; }
  /* 19px matches the value size exactly. The headings do not take over at
     that size because the WEIGHT differs -- 500 against the values' 700 --
     so the numbers stay the heaviest thing on the page, which is what a
     stat sheet wants.
     The 128px gutter is sized for EFFICIENCY, the longest label. A longer
     group name would wrap or push the metrics; if one is ever added, size
     this from the content instead. */
  .metric-group-label { font-size:19px; font-weight:500; letter-spacing:0.05em;
                        color:var(--sc-navy, #1a1a2e); flex:0 0 128px; min-width:128px; }
  .metric-group-row { display:flex; gap:28px; flex-wrap:wrap; }
  .metric-group-row .metric-item .metric-val { font-size:20px; font-weight:700; }
  .metric-group-row .metric-item .metric-label { font-size:11px; color:#888; margin-left:4px; }
  .section-title { font-size:14px; font-weight:700; margin:22px 0 8px; text-transform:uppercase; letter-spacing:0.03em; color:#333; }
  table.stat-table { width:100%; border-collapse:collapse; font-size:13px; background:#fff; margin-bottom:10px; }
  table.stat-table th, table.stat-table td { padding:6px 8px; text-align:right; border:1px solid #eee; }
  table.stat-table th:first-child, table.stat-table td:first-child { text-align:left; }
  table.stat-table th { background:#f5f5f5; color:#555; font-weight:600; font-size:11px; text-transform:uppercase; }
  table.stat-table tr.total-row { font-weight:800; background:#fafafa; }
  .no-stats { color:#999; font-size:13px; font-style:italic; }
  .st-subsection { margin-top:14px; }
  .st-subsection-label { font-size:11px; font-weight:700; color:#888; text-transform:uppercase; letter-spacing:0.03em; margin-bottom:4px; }
  @media (max-width: 767px) {
    .wrap { padding:14px 12px 40px; }
    .topbar { flex-wrap:wrap; gap:10px; }
    .topbar .actions { width:100%; }
    .topbar .actions button { flex:1; }
    .report-header { padding:14px; }
    .statchat-logo { width:44px; top:10px; right:10px; }
    .team-block { padding:12px 14px; }
    .metric-group-row { gap:16px; }
    .metric-group-row .metric-item .metric-val { font-size:18px; }
    .section-title { margin:18px 0 8px; }
    .table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -12px; padding:0 12px; }
    table.stat-table { font-size:12px; }
    table.stat-table th, table.stat-table td { padding:5px 6px; }
    table.quarter-table { font-size:12px; }
  }
  /* SCORING SUMMARY LAYOUT.
     Everything left justified -- heading, column headers and cells --
     and fixed column widths. Without the widths the Play column's
     varying length shoves the score column around from row to row, and a
     right-hand column that wanders is unreadable at a glance.
     Alternating shade because the score cell is two lines tall: ten rows
     of those run together, and the band gives the eye a line to follow
     from a play across to the score it produced. */
  .scoring-summary h2, .scoring-summary .section-title { text-align:left; }
  .scoring-summary table th, .scoring-summary table td { text-align:left; vertical-align:top; }
  .scoring-summary tbody tr:nth-child(odd) { background:#f7f8f9; }
  .scoring-summary .ss-qtr { width:42px; }
  .scoring-summary .ss-team { width:118px; font-weight:700; }
  /* The one RIGHT justified column. Numbers align on their right edge --
     "Neville 7" and "Neville 27" should end level, not start level -- and
     a score column pinned to the right margin is where a reader's eye
     goes for it. Everything else in this table stays left. */
  .scoring-summary .ss-score { width:132px; font-weight:700; white-space:nowrap;
                               line-height:1.35; text-align:right; }
  .scoring-summary th.ss-score { text-align:right; }
  .scoring-summary .ss-away { color:#666; }
  .scoring-summary .ss-detail { color:#888; }
  /* ===== SECTION HEADERS =====================================
     Two levels, doing different jobs. The big header says which part of
     the document this is; the coloured band says whose numbers follow.
     Before this, both were the same small grey label and a reader had no
     way to tell a document section from a team's table. */
  .sec-head { margin:34px 0 14px; }
  .sec-head:first-child { margin-top:0; }
  /* The eyebrow names the document. It is PRINT ONLY: on screen you know
     which page you are on, but a sheet that has been printed and
     separated from the rest does not say where it came from. */
  .sec-eyebrow { display:none; font-size:10.5px; font-weight:700; letter-spacing:0.16em;
                 text-transform:uppercase; color:var(--sc-ink-muted, #9aa3b2); margin:0 0 3px; }
  .sec-title { font-size:21px; font-weight:700; letter-spacing:-0.02em; color:#12161c;
               margin:0; line-height:1.1; text-align:left; }
  .sec-sub { font-size:12px; color:#7c8794; margin:4px 0 0; font-variant-numeric:tabular-nums; }
  /* A team band carries its own colour inline; the text colour is chosen
     by contrast so a pale school cannot produce an unreadable band. */
  /* The top margin is the important half. A band used to sit 12px below
     the previous table, which itself had a 6px bottom margin -- so a
     whole section ended and the next one began within 18px, and the page
     read as one undifferentiated run of tables.
     A band opens a section, so the space belongs ABOVE it. */
  .team-band { font-size:12px; font-weight:700; text-transform:uppercase;
               letter-spacing:0.12em; padding:9px 14px; border-radius:6px;
               margin:30px 0 12px; display:flex; align-items:center; gap:9px; }
  /* ...but not when it is the first thing in its container, or every
     section would open with a gap it did not need. */
  .team-band:first-child { margin-top:0; }
  .team-band .tb-dot { width:9px; height:9px; border-radius:50%; }
  .team-band .tb-sub { margin-left:auto; font-weight:600; letter-spacing:0.06em;
                       opacity:0.85; text-transform:none; font-size:11px; }
  .sec-title, .team-band { page-break-after:avoid; break-after:avoid; }
  /* RUNNING FOOTER. position:fixed inside a print context repeats the
     element on every sheet -- the only reliable way to get a footer on
     each page without a print engine. Hidden on screen, where the page
     has no bottom to sit at. */
  .print-footer { display:none; }
  /* The end mark is in the NORMAL flow, so it lands wherever the content
     finishes -- which is the last page, and only the last page. There is
     no CSS selector for "the final sheet", so this is the mechanism. */
  .print-endmark { display:none; }
  @media print {
    /* Room for the running footer, so it never sits on top of a table. */
    @page { margin-bottom: 16mm; }
    .print-footer { display:block; position:fixed; bottom:6mm; left:0; right:0;
                    text-align:center; font-size:9px; color:var(--sc-ink-muted, #9aa3b2);
                    letter-spacing:0.04em; }
    /* Pushed down so the logo sits just above the running footer rather
       than immediately under the last table.
       This is a MARGIN, not a pin: CSS cannot anchor an element to the
       bottom of the final printed sheet, so if the content happens to end
       low on the page the logo moves to the next one. 42mm is chosen to
       clear the common case without being so large it usually spills. */
    .print-endmark { display:flex; align-items:center; justify-content:center;
                     margin:42mm 0 0; padding-top:18px;
                     border-top:1px solid var(--sc-rule, #e6e6e6);
                     page-break-inside:avoid; break-inside:avoid; }
    .print-endmark img { width:38px; height:38px; border-radius:7px; }

    /* Page one of the stat package runs about half full: a header, a
       quarter line and seven scores. These spend the space rather than
       save it, the same way the recap does. */
    .header { margin-bottom:34px; }
    table.quarter-table { margin-bottom:34px; }
    .quarter-table th, .quarter-table td { padding:11px 10px; }
    .scoring-summary { margin-top:40px !important; }
    .scoring-summary table th, .scoring-summary table td { padding:15px 9px; }
    .scoring-summary .ss-score { line-height:1.5; }
    /* Between the two team summary blocks, which were butted together. */
    .team-block { margin-bottom:26px; padding:18px 20px; }
    .team-block .metric-group { padding-top:14px; margin-top:14px; }

    /* BACKGROUNDS MUST BE TOLD TO PRINT.
       Browsers drop background colours from printed output by default --
       an ink-saving default from the era of text documents. So the team
       bands printed as grey text on white and the row banding vanished
       entirely, which is most of the visual work on the page.
       print-color-adjust:exact overrides that for the elements where the
       colour IS the information. Not applied page-wide: the default is a
       sensible one for body text. */
    .team-band, .scoring-summary tbody tr, .header, .section {
      -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    /* The eyebrow appears only in print, on every section: a detached
       page should say what document it belongs to. */
    .sec-eyebrow { display:block; }
    .sec-title { font-size:17px; }
    .team-band { padding:7px 11px; }

    body { background:#fff; }
    .wrap { max-width:none; padding:0 20px; }
    .no-print { display:none !important; }
    .team-block { page-break-inside:avoid; break-inside:avoid; }
    .page-break { page-break-before:always; break-before:always; }
    /* A SECTION IS NEVER SPLIT ACROSS PAGES.
       Two rules, because a section is two elements: the heading and the
       table under it.
         - the heading is never left stranded at the foot of a page with
           its table overleaf
         - a table never breaks part-way down, so a player's line cannot
           be separated from the totals row that explains it
       Done in CSS rather than by wrapping each of the eight sections in a
       container: the call sites differ in shape -- Defense and Special
       Teams emit their heading and then build several tables -- and a
       wrapper would have to be threaded through all of them correctly to
       work at all. These two rules cover every section, including any
       added later.
       A table taller than a whole page will still break; nothing can stop
       that, and the browser ignores the rule rather than looping. */
    .section-title { page-break-after:avoid; break-after:avoid; }
    table.stat-table { page-break-inside:avoid; break-inside:avoid; }
    /* Special Teams and Tackles are not ONE table -- they are a heading
       followed by several. The two rules above keep the heading with the
       first table and each table whole, and still let the group split
       between its own subsections: Kickoffs on one page, Punting alone
       on the next under no heading at all.
       So the whole group is wrapped and kept together. If it is too tall
       for the space left it moves entire, which is the behaviour asked
       for -- a section is never split. */
    /* The scoring summary OPTS OUT of the blanket avoid rules above. It
       is the one table with no upper bound on length, and forcing it
       whole either strands most of a page or -- once it is taller than a
       page -- gets ignored and breaks arbitrarily.
       Break between rows, never inside one, and repeat the header:
       display:table-header-group is what makes a thead repeat, and
       without it page two is numbers with no labels. */
    .scoring-summary, .scoring-summary table.stat-table {
      page-break-inside:auto; break-inside:auto; }
    .scoring-summary thead { display:table-header-group; }
    .scoring-summary tr { page-break-inside:avoid; break-inside:avoid; }
    .scoring-summary .section-title { page-break-after:avoid; break-after:avoid; }

    .st-subsection { page-break-inside:avoid; break-inside:avoid; }
    .stat-group { page-break-inside:avoid; break-inside:avoid; }
  }
</style>

<body>
  <div class="print-footer">Generated with StatChat &nbsp;&middot;&nbsp; www.statchat.co</div>

  <div class="wrap">
    <div id="loading">Loading…</div>
    <div id="errorView" class="hidden">
      <p id="errorMsg" class="msg error"></p>
    </div>
    <div id="mainView" class="hidden">
      <div class="topbar no-print">
        <a href="reports.html">&larr; Back to reports</a>
        <div class="actions">
          <button class="xls" id="downloadXlsBtn" type="button">Download XLS</button>
          <button class="pdf" id="downloadPdfBtn" type="button">Download PDF</button>
          <p id="printFallback" class="no-print hidden"
             style="flex:1 1 100%; margin:8px 0 0; padding:10px 12px; background:#fff8e6;
                    border:1px solid #e0b400; border-radius:6px; font-size:13px; color:#5a4300;"></p>
        </div>
      </div>
      <div id="reportContent"></div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="team-icon.js"></script>
<script src="engine.js"></script>
<script>
  const SUPABASE_URL = 'https://pboushzlcyfkssojpuut.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_VGnUYurlkoH1yi67jHO6iQ_C8Q0EM2d';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  function showView(name){
    ['loading','errorView','mainView'].forEach(v => document.getElementById(v).classList.toggle('hidden', v !== name));
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'INITIAL_SESSION'){
      if (session){ init(); } else { window.location.href = '/'; }
    } else if (event === 'SIGNED_OUT'){
      window.location.href = '/';
    }
  });

  let plays = [], startingPossession = 'teamA', quarterLengthSec = 720, gameLabel = '', gameDate = null;
  const TEAMS = {};

  // --- Proven read-only engine core, extracted verbatim from game.html / view.html ---
  function otherTeam(t){ return t === 'teamA' ? 'teamB' : 'teamA'; }
const TIMEOUTS_PER_HALF = 3;
const TIMEOUTS_PER_OT = 1;
  // Administrative entries -- clock markers, quarter/half dividers, manual
  // possession flips -- are announcements, not football plays. They carry
  // no roles and no yardage, so anything reasoning about "what actually
  // happened on this drive" has to skip them.
  //
  // isReset markers are deliberately NOT administrative: they are explicit
  // "new drive" announcements and are valid drive starts.
    // Team tackles for loss, counted from the PLAY rather than a named
  // tackler. Naming the tackler is optional and often skipped at speed,
  // so requiring one would undercount a stat the log already knows for
  // certain: a scrimmage snap by the other team that lost yardage was a
  // tackle for loss, whoever made it. Sacks are included, per NFHS and
  // NCAA, and reported alongside the sack count so both can be read.
  function teamTflFor(playsList, defTeam){
    const TYPES = ['rush', 'pass', 'sack'];
    return (playsList || []).reduce((n, p) => {
      const r = p.roles, e = p.effect || {};
      if (!r) return n;
      const byOpp = (r.carrier && r.carrier.team !== defTeam && r.carrier.team) ||
                    (r.passer && r.passer.team !== defTeam && r.passer.team);
      if (!byOpp) return n;
      if (TYPES.indexOf(r.playType) === -1) return n;
      return (typeof e.statYds === 'number' && e.statYds < 0) ? n + 1 : n;
    }, 0);
  }
function isAdminMarker(p){
    if (!p) return true;
    const e = p.effect || {};
    if (e.isReset) return false;
    // e.timeout added 19 Aug 2026: see game.html for the full reasoning --
    // found and fixed there first, from a real-game report.
    return !!(e.clockEvent || e.setQuarter || e.forcePossession || e.timeout || p.isDivider);
  }

  // Jersey numbers resolve across ALL THREE roster units, not just the one
  // the play type implies. High-school rosters routinely list a player
  // under a single unit even though they play several, and a dedicated
  // kick/punt returner is normally rostered on special teams only -- which
  // is why returners used to render in the log as a bare "#25".
  //
  // A fallback can only ever turn "#25" into a name; it can never change a
  // name that already resolved, because the expected unit is always
  // searched first. This mirrors playerName() in the report pages.






  // --- End engine core ---




  function buildTeams(game, rosterRows, ourBranding){
    const ourName = game.our_team_is_home ? game.home_team_name : game.away_team_name;
    const oppName = game.our_team_is_home ? game.away_team_name : game.home_team_name;
    TEAMS.teamA = { name: ourName, bg: ourBranding.primary_color || '#1a1a2e', text: ourBranding.secondary_color || '#ffffff',
      rosterOffense:{}, rosterDefense:{}, rosterSpecialTeams:{}, rosterUnassigned:{}, posOffense:{}, logo: ourBranding.logo_url || null,
      isHome: !!game.our_team_is_home };
    const oppPrimary = game.opponent_primary_color || '#8B0000', oppSecondary = game.opponent_secondary_color || '#ffffff';
    TEAMS.teamB = { name: oppName, bg: oppPrimary, text: oppSecondary,
      rosterOffense:{}, rosterDefense:{}, rosterSpecialTeams:{}, rosterUnassigned:{}, posOffense:{}, logo: game.opponent_logo_url || null,
      isHome: !game.our_team_is_home };
    if (colorDistance(TEAMS.teamA.bg, TEAMS.teamB.bg) < 60){
      if (colorDistance(TEAMS.teamA.bg, oppSecondary) >= 60){
        TEAMS.teamB.bg = oppSecondary;
        TEAMS.teamB.text = oppPrimary;
      } else {
        TEAMS.teamB.bg = luminance(TEAMS.teamA.bg) > 0.5 ? '#3a3a3a' : '#c8c8c8';
        TEAMS.teamB.text = luminance(TEAMS.teamB.bg) > 0.55 ? '#1a1a1a' : '#ffffff';
      }
    }
    rosterRows.forEach(r => {
      const team = TEAMS[r.team_side];
      if (!team) return;
      if (r.unit === 'offense'){ team.rosterOffense[r.jersey_number] = r.player_name; team.posOffense[r.jersey_number] = r.position; }
      else if (r.unit === 'defense'){ team.rosterDefense[r.jersey_number] = r.player_name; }
      else if (r.unit === 'special'){ team.rosterSpecialTeams[r.jersey_number] = r.player_name; }
      // Requested directly: resolving every unrecognized-position player
      // to a unit is impractical on a large, position-less roster.
      // Still absent from the three unit-specific picker lists above --
      // there is nothing to file him under -- but named here so
      // rosterName/playerName (engine.js) can resolve him once he is
      // actually credited on a play, instead of reading as a call-up.
      else if (r.player_name){ team.rosterUnassigned[r.jersey_number] = r.player_name; }
    });
  }







  const RECEIVE_POS = new Set(['WR','TE','SE','FL','SLOT','SB']);


  // These are load-once pages -- unlike view.html they had no realtime
  // subscription, so a tab left open kept showing the play data as it
  // was at load time. Nothing on screen said so, which is exactly how a
  // stale recap ends up looking like a stats bug in the app.
  // currentGameId is scoped inside init(), so it has to be passed in
  // rather than closed over.
  function subscribeToPlayChanges(gameId, rerender){
    supabaseClient
      .channel('report-' + gameId)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'plays' }, async (payload) => {
        const row = payload.new || payload.old;
        if (!row || row.game_id !== gameId) return;
        const { data } = await supabaseClient.from('plays').select('*')
          .eq('game_id', gameId).order('sequence_number', { ascending: true });
        plays = (data || []).map(p => ({
          text: p.text, effect: p.effect || {}, team: p.team_side, quarter: p.quarter,
          roles: p.roles, unresolved: p.unresolved, isDivider: p.is_divider, isOverride: p.is_override
        }));
        try { rerender(); } catch (e) { console.error(e); }
      })
      .subscribe();
  }

  async function init(){
    const params = new URLSearchParams(window.location.search);
    const currentGameId = params.get('id');
    if (!currentGameId){
      showView('errorView');
      document.getElementById('errorMsg').textContent = 'No game specified.';
      return;
    }

    const { data: gameRows, error: gameError } = await supabaseClient
      .from('games').select('*').eq('id', currentGameId).limit(1);
    if (gameError || !gameRows || gameRows.length === 0){
      showView('errorView');
      document.getElementById('errorMsg').textContent = gameError ? gameError.message : 'That game could not be found.';
      return;
    }
    const game = gameRows[0];
    gameLabel = game.designator;
    gameDate = game.game_date;
    quarterLengthSec = game.quarter_length_seconds || 720;

    const { data: rosterRows, error: rosterError } = await supabaseClient
      .from('game_rosters').select('*').eq('game_id', currentGameId);
    if (rosterError){
      showView('errorView');
      document.getElementById('errorMsg').textContent = rosterError.message;
      return;
    }

    const { data: teamRows } = await supabaseClient
      .from('teams').select('primary_color, secondary_color, logo_url').eq('is_our_team', true).limit(1);
    const ourBranding = (teamRows && teamRows[0]) || {};

    buildTeams(game, rosterRows || [], ourBranding);

    const { data: existingPlays, error: playsError } = await supabaseClient
      .from('plays').select('*').eq('game_id', currentGameId).order('sequence_number', { ascending: true });
    if (playsError){
      showView('errorView');
      document.getElementById('errorMsg').textContent = playsError.message;
      return;
    }
    plays = (existingPlays || []).map(p => ({
      text: p.text, effect: p.effect || {}, team: p.team_side, quarter: p.quarter,
      roles: p.roles, unresolved: p.unresolved, isDivider: p.is_divider, isOverride: p.is_override
    }));

    document.title = 'Statistics Report — ' + TEAMS.teamA.name + ' vs ' + TEAMS.teamB.name;
    try {
      document.getElementById('reportContent').innerHTML = renderReport();
      showView('mainView');
      subscribeToPlayChanges(currentGameId, () => {
        document.getElementById('reportContent').innerHTML = renderReport();
      });
    } catch (err) {
      showView('errorView');
      document.getElementById('errorMsg').textContent = 'This report could not be built: ' + err.message;
      console.error(err);
    }
  }

  // Shared shape with recap.html: window.print() is a silent no-op in
  // some mobile contexts (iOS in-app browsers, installed web apps), so
  // the click watches for the browser telling us a dialog opened and
  // explains what to do by hand if none did.
  document.getElementById('downloadPdfBtn').addEventListener('click', () => {
    const note = document.getElementById('printFallback');
    if (note) note.classList.add('hidden');
    let started = false;
    const mark = () => { started = true; };
    window.addEventListener('beforeprint', mark, { once: true });
    let mq = null;
    if (window.matchMedia){
      mq = window.matchMedia('print');
      if (mq.addListener) mq.addListener(mark);
    }
    try { window.print(); } catch (e) { started = false; }
    setTimeout(() => {
      window.removeEventListener('beforeprint', mark);
      if (mq && mq.removeListener) mq.removeListener(mark);
      if (started || !note) return;
      note.textContent = 'Your browser did not open a print dialog. ' +
        'On iPhone or iPad use the Share button, then Print, then pinch out on the ' +
        'preview to save it as a PDF. On Android open the browser menu, then Print. ' +
        'If you are inside another app — a message or an email — open this page in ' +
        'Safari or Chrome first.';
      note.classList.remove('hidden');
    }, 1500);
  });

  function buildWorkbook(){
    const box = computeBoxScore(plays);
    const finalState = computeState();
    const possessions = countPossessions(plays);
    const turnovers = countTurnovers(plays);
    const gameIdMatch = (gameLabel || '').match(/(\d+)/);
    const gameId = gameIdMatch ? parseInt(gameIdMatch[1]) : (gameLabel || '');
    const oppKey = 'teamB';

    // Quarter-by-quarter scoring, with any 5th-or-later quarter folded
    // into a single OT total rather than clamped into Q4.
    const quarterScores = { teamA: [0,0,0,0], teamB: [0,0,0,0] };
    const otScores = { teamA: 0, teamB: 0 };
    plays.forEach(p => {
      const q = p.quarter || 1;
      const points = (p.effect && p.effect.score) ? p.effect.score : null;
      const adjust = (p.effect && p.effect.scoreAdjust) ? p.effect.scoreAdjust : null;
      if (points){
        if (q >= 5) otScores[points.team] += points.points;
        else quarterScores[points.team][q-1] += points.points;
      }
      if (adjust){
        if (q >= 5) otScores[adjust.team] += adjust.pts;
        else quarterScores[adjust.team][q-1] += adjust.pts;
      }
    });

    // Half-by-half yardage, split into rushing and passing separately
    // (quarters 1-2 = first half, 3+ = second half) -- nothing
    // upstream computes this, so it's built directly from the play log.
    const halfYards = { teamA: { h1Rush:0, h1Pass:0, h2Rush:0, h2Pass:0 }, teamB: { h1Rush:0, h1Pass:0, h2Rush:0, h2Pass:0 } };
    plays.forEach(p => {
      const r = p.roles;
      if (!r) return;
      const half = (p.quarter || 1) <= 2 ? 'h1' : 'h2';
      // A merged fumble play is playType 'fumble' but it WAS a rush or a
      // completion -- see the 'f' branch of parseInput. Keying on
      // playType alone dropped its yardage out of the half splits, so a
      // drive-ending fumble quietly shrank the half it happened in.
      // Sacks stay out, as they always have been here.
      const fumRush = r.playType === 'fumble' && r.attempt === 'rush';
      const fumPass = r.playType === 'fumble' && r.attempt === 'pass';
      if ((r.playType === 'rush' || fumRush) && r.carrier) halfYards[r.carrier.team][half+'Rush'] += (r.carrier.yards || 0);
      if ((r.playType === 'pass' || fumPass) && r.passer) halfYards[r.passer.team][half+'Pass'] += (r.passer.yards || 0);
    });

    const headers = ['GameID','Team','Player','Rush Attempts','Rush Yards','Yds Per Carry','Long Rush','Rush TD',
      'Pass Attempts','Pass Completions','Comp Pctg','Pass Yards','Long Pass','Pass TD','INT','SACK',
      'Receptions','Receiving Yards','Yards Per Catch','Long Recept','Receiving TD','FUMBLE',
      'KO Attempt','KO Touchback','PA Attempt','PA Made','PA Block','FG Attempt','FG Made','FG Block','FG Yards','Long FG',
      'Punt Attempt','Punt Yards','Long Punt','PUNT BLK',
      'D-Sack','D-INT','D-FUM','D-TFL','D-3rdAtt','D-3rdConv','D-4thAtt','D-4thStop','D-20PlusPlay',
      // Per-player tackles, added Aug 2026. Separate from D-TFL above:
      // that one counts from the play log and needs no named tackler
      // (a ceiling), while D-Tackle and D-PlayerTFL come from the
      // optional "tackled by" field (a floor). Two columns, because one
      // number cannot be both.
      'D-Tackle','D-PlayerTFL'];
    const blankRow = () => headers.map(() => '');
    const setCols = (row, obj) => { Object.keys(obj).forEach(k => { row[headers.indexOf(k)] = obj[k]; }); return row; };
    const rows = [headers];

    // Rushing -- one row per rusher, aggregated for the game, with a
    // Long field since that's how the reference tracks rush/pass/rec.
    Object.keys(box.teamA.rushing).forEach(n => {
      const d = box.teamA.rushing[n];
      const row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: n,
        'Rush Attempts': d.att||0, 'Rush Yards': d.yds||0,
        'Yds Per Carry': d.att ? +(d.yds/d.att).toFixed(1) : '', 'Long Rush': d.long||0, 'Rush TD': d.td||0,
        FUMBLE: d.fum || '' });
      rows.push(row);
    });

    // Passing -- one row per passer, aggregated for the game.
    Object.keys(box.teamA.passing).forEach(n => {
      const d = box.teamA.passing[n];
      const row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: n,
        'Pass Attempts': d.att||0, 'Pass Completions': d.comp||0,
        'Comp Pctg': d.att ? +(100*(d.comp||0)/d.att).toFixed(1) : '',
        'Pass Yards': d.yds||0, 'Long Pass': d.long||0, 'Pass TD': d.td||0, INT: d.intThrown||0, SACK: d.sacked||0 });
      rows.push(row);
    });

    // Receiving -- one row per receiver, aggregated for the game.
    Object.keys(box.teamA.receiving).forEach(n => {
      const d = box.teamA.receiving[n];
      const row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: n,
        Receptions: d.rec||0, 'Receiving Yards': d.yds||0,
        'Yards Per Catch': d.rec ? +(d.yds/d.rec).toFixed(1) : '', 'Long Recept': d.long||0, 'Receiving TD': d.td||0,
        FUMBLE: d.fum || '' });
      rows.push(row);
    });

    // Kickoffs -- aggregated per kicker for the game.
    Object.keys(box.teamA.specialTeams).filter(n => box.teamA.specialTeams[n].kickoffs).forEach(n => {
      const d = box.teamA.specialTeams[n];
      const row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: n,
        'KO Attempt': d.kickoffs||0, 'KO Touchback': d.touchbacks||0 });
      rows.push(row);
    });

    // PAT -- aggregated per kicker for the game.
    Object.keys(box.teamA.specialTeams).filter(n => box.teamA.specialTeams[n].patAtt).forEach(n => {
      const d = box.teamA.specialTeams[n];
      const row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: n,
        'PA Attempt': d.patAtt||0, 'PA Made': d.patMade||0, 'PA Block': d.patBlocked||0 });
      rows.push(row);
    });

    // FG and Punts -- one row per individual attempt, matching the
    // reference exactly, since "Long FG"/"Long Punt" and block status
    // are per-play facts, not something that survives aggregation the
    // way rush/pass/rec's single Long field does. Read straight off
    // the play log rather than the aggregated box score buckets.
    plays.forEach(p => {
      const r = p.roles;
      if (!r || r.playType !== 'fg' || !r.kicker || r.kicker.team !== 'teamA') return;
      const row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: playerName('teamA', r.kicker.num, 'special'),
        'FG Attempt': 1, 'FG Made': r.kicker.result === 'g' ? 1 : 0, 'FG Block': r.kicker.result === 'b' ? 1 : 0,
        'FG Yards': r.kicker.yards || 0 });
      rows.push(row);
    });
    plays.forEach(p => {
      const r = p.roles;
      if (!r || r.playType !== 'punt' || !r.punter || r.punter.team !== 'teamA') return;
      const row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: playerName('teamA', r.punter.num, 'special'),
        'Punt Attempt': 1, 'Punt Yards': r.punter.blocked ? 0 : (r.punter.yards || 0), 'PUNT BLK': r.punter.blocked ? 1 : '' });
      rows.push(row);
    });

    // Sacks and Bad Snaps -- yardage lost to sacks against our own
    // passer, tracked as a negative rushing line per football
    // convention. computeBoxScore only counts sacks, it never sums
    // the yardage lost, so this reads the raw play log directly.
    //
    // Reported directly, 20 Aug 2026: a sack-turned-fumble was missing
    // from this count, in a game with three total sacks against the
    // same passer -- the total showed 2. The same shape as
    // season_report.html's identical row, fixed there for the same
    // reason: this reads roles.playType straight off the play log
    // rather than through computeBoxScore, so engine.js's own fix for
    // the fumble-carries-an-attempt shape never reached it.
    let sackCount = 0, sackYardsLost = 0;
    plays.forEach(p => {
      const r = p.roles;
      if (r && (r.playType === 'sack' || (r.playType === 'fumble' && r.attempt === 'sack')) && r.passer && r.passer.team === 'teamA'){
        sackCount++; sackYardsLost += (r.passer.yards || 0);
      }
    });
    if (sackCount){
      const row = blankRow();
      setCols(row, { GameID: gameId, Team: TEAMS.teamA.name, Player: 'Sacks and Bad Snaps',
        'Rush Attempts': sackCount, 'Rush Yards': -sackYardsLost });
      rows.push(row);
    }

    // Defense -- our own defense's totals against the opponent's offense.
    // The opponent's own offensive numbers are stored on box.teamA's
    // oppDowns entry (that's "the other team's -- teamB's -- own
    // offense", by the same logic the team-stats section already uses).
    const oppOffenseVsUs = box.teamA.oppDowns;
    const defRow = blankRow();
    setCols(defRow, { GameID: gameId, Team: TEAMS.teamA.name, Player: 'Defense',
      'D-Sack': sumStat(box.teamA.defense,'sacks')||'', 'D-INT': sumStat(box.teamA.defense,'int')||'',
      'D-FUM': sumStat(box.teamA.defense,'fumRec')||'', 'D-TFL': teamTflFor(plays, 'teamA')||'',
      'D-3rdAtt': oppOffenseVsUs.d3att||'', 'D-3rdConv': oppOffenseVsUs.d3conv||'',
      'D-4thAtt': oppOffenseVsUs.d4att||'', 'D-4thStop': oppOffenseVsUs.d4att ? (oppOffenseVsUs.d4att - oppOffenseVsUs.d4conv) : '',
      'D-20PlusPlay': oppOffenseVsUs.explosive||'' });
    rows.push(defRow);

    // Offense -- our own explosive-play count, stored on box.teamB's
    // oppDowns entry (that's "the other team's defense against this
    // team's offense", i.e. our own numbers).
    const ourOffense = box.teamB.oppDowns;
    const offRow = blankRow();
    setCols(offRow, { GameID: gameId, Team: TEAMS.teamA.name, Player: 'Offense', 'D-20PlusPlay': ourOffense.explosive||'' });
    rows.push(offRow);

    // Opponent -- one combined team-total row, since individual
    // opponent players aren't tracked (StatChat has no way to enter
    // an opponent roster).
    const oppRush = box[oppKey].rushing, oppPass = box[oppKey].passing;
    const oppRushAtt = sumStat(oppRush,'att'), oppRushYds = sumStat(oppRush,'yds'), oppRushTd = sumStat(oppRush,'td');
    const oppPassAtt = sumStat(oppPass,'att'), oppPassComp = sumStat(oppPass,'comp'), oppPassYds = sumStat(oppPass,'yds'), oppPassTd = sumStat(oppPass,'td');
    const oppRow = blankRow();
    setCols(oppRow, { GameID: gameId, Team: TEAMS[oppKey].name, Player: TEAMS[oppKey].name,
      'Rush Attempts': oppRushAtt||'', 'Rush Yards': oppRushYds||'', 'Rush TD': oppRushTd||'',
      'Pass Attempts': oppPassAtt||'', 'Pass Completions': oppPassComp||'', 'Pass Yards': oppPassYds||'', 'Pass TD': oppPassTd||'' });
    rows.push(oppRow);

    const wb = XLSX.utils.book_new();
    // Defence -- one row per tackler, so the sheet carries who made the
    // tackles rather than only a team total. Sorted best first, like the
    // other player sections.
    Object.keys(box.teamA.defense || {})
      .filter(n => n !== 'TEAM' && (box.teamA.defense[n].tackles || 0) > 0)
      .sort((a, b) => (box.teamA.defense[b].tackles || 0) -
                      (box.teamA.defense[a].tackles || 0))
      .forEach(n => {
        const d = box.teamA.defense[n];
        rows.push(setCols(blankRow(), {
          'GameID': gameLabel || '', 'Team': TEAMS.teamA.name, 'Player': n,
          'D-Tackle': d.tackles || '', 'D-PlayerTFL': d.tfl || '',
          'D-Sack': d.sacks || '', 'D-INT': d.int || '', 'D-FUM': d.fumRec || ''
        }));
      });

    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Stats');

    // Game Totals -- one row per team, matching the reference sheet's
    // exact columns (including its "Penalites" spelling, since a
    // downstream dashboard may already query that exact name).
    const gtHeaders = ['GameID','Team','Q1','Q2','Q3','Q4','OT','Final','Penalites','Penalty Yards',
      'H1 Yards','H2 Yards','Total Yards','Sacks','TO','Possessions','3D Att','3D Conv','4D Att','4D Conv',
      'H1 Rushing','H1 Passing','H2 Rushing','H2 Passing'];
    const gtRows = [gtHeaders];
    [ 'teamA', oppKey ].forEach(teamKey => {
      const pen = finalState.penalties[teamKey];
      const hy = halfYards[teamKey];
      const h1Total = hy.h1Rush + hy.h1Pass, h2Total = hy.h2Rush + hy.h2Pass;
      const own = box[otherTeam(teamKey)].oppDowns; // this team's own offensive down conversions
      const gtRow = new Array(gtHeaders.length).fill('');
      const setGt = (obj) => Object.keys(obj).forEach(k => { gtRow[gtHeaders.indexOf(k)] = obj[k]; });
      setGt({
        GameID: gameId, Team: TEAMS[teamKey].name,
        Q1: quarterScores[teamKey][0], Q2: quarterScores[teamKey][1], Q3: quarterScores[teamKey][2], Q4: quarterScores[teamKey][3],
        OT: otScores[teamKey] || '', Final: finalState.scores[teamKey],
        Penalites: pen.count || '', 'Penalty Yards': pen.yds || '',
        'H1 Yards': h1Total, 'H2 Yards': h2Total, 'Total Yards': h1Total + h2Total,
        Sacks: sumStat(box[teamKey].passing, 'sacked') || '', TO: turnovers[teamKey] || 0,
        Possessions: possessions[teamKey] || 0,
        '3D Att': own.d3att || '', '3D Conv': own.d3conv || '', '4D Att': own.d4att || '', '4D Conv': own.d4conv || '',
        'H1 Rushing': hy.h1Rush, 'H1 Passing': hy.h1Pass, 'H2 Rushing': hy.h2Rush, 'H2 Passing': hy.h2Pass
      });
      gtRows.push(gtRow);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(gtRows), 'Game Totals');

    return wb;
  }

  document.getElementById('downloadXlsBtn').addEventListener('click', () => {
    const wb = buildWorkbook();
    const filename = (gameLabel || 'game') + '_stat_package.xlsx';
    XLSX.writeFile(wb, filename.replace(/[^a-z0-9._-]+/gi, '_'));
  });

  function sumStat(bucketObj, key){
    return Object.keys(bucketObj).reduce((t, n) => t + (bucketObj[n][key] || 0), 0);
  }
  function maxStat(bucketObj, key){
    return Object.keys(bucketObj).reduce((t, n) => Math.max(t, bucketObj[n][key] || 0), 0);
  }
  function statTable(teamKey, bucketObj, headers, rowFn, totalFn, sortKey, nameUnit){
    const nums = Object.keys(bucketObj);
    if (!nums.length) return '';
    // TEAM last -- see recap.html for the reasoning.
    const sorted = nums.slice().sort((a, b) =>
      (((a === 'TEAM' || a === 'Unknown') ? 1 : 0) - ((b === 'TEAM' || b === 'Unknown') ? 1 : 0)) ||
      ((bucketObj[b][sortKey]||0) - (bucketObj[a][sortKey]||0)));
    let h = '<table class="stat-table"><tr><th></th>' + headers.map(x => '<th>' + x + '</th>').join('') + '</tr>';
    sorted.forEach(n => {
      h += '<tr><td>' + n + '</td>' + rowFn(bucketObj[n], n).map(v => '<td>' + v + '</td>').join('') + '</tr>';
    });
    h += '<tr class="total-row"><td>Total</td>' + totalFn(bucketObj, nums).map(v => '<td>' + v + '</td>').join('') + '</tr>';
    return '<div class="table-scroll">' + h + '</table></div>';
  }

  const DOC_LABEL = 'Stat Package';

  // SECTION HEADERS. Two levels, both built here so every section in this
  // document is headed the same way and a new one cannot drift.
  //
  //   sectionHead()  document sections -- eyebrow, title, optional subtitle
  //   teamBand()     anything belonging to a team -- coloured band
  //
  // The subtitle is optional and should carry a number the table itself
  // does not total, or nothing at all. An empty line is worse than none.
  function sectionHead(title, subtitle){
    return '<div class="sec-head">' +
      '<p class="sec-eyebrow">' + DOC_LABEL + '</p>' +
      '<h2 class="sec-title">' + title + '</h2>' +
      (subtitle ? '<p class="sec-sub">' + subtitle + '</p>' : '') +
    '</div>';
  }

  // The team cell in the quarter line: crest then name, on one line.
  // The box score is the first thing on the page and had no team mark on
  // it at all -- the crests are what make it read as this game rather
  // than a table of numbers.
  function qtrTeamCell(teamKey){
    const logo = TEAMS[teamKey] && TEAMS[teamKey].logo;
    return '<td class="qtr-team">' +
      (logo ? '<img class="qtr-team-logo" src="' + logo + '">' : '') +
      '<span>' + TEAMS[teamKey].name + '</span>' +
    '</td>';
  }

  function teamBand(teamKey, label, subtitle){
    const t = TEAMS[teamKey] || {};
    const bg = t.bg || '#1a1a2e';
    // safeTextColor picks black or white by WCAG contrast, the same rule
    // the live view uses -- so a gold school gets dark text rather than
    // white on yellow.
    const fg = (typeof safeTextColor === 'function') ? safeTextColor(bg) : '#ffffff';
    const dot = fg === '#000000' ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.85)';
    return '<div class="team-band" style="background:' + bg + '; color:' + fg + ';">' +
      '<span class="tb-dot" style="background:' + dot + ';"></span>' + label +
      (subtitle ? '<span class="tb-sub">' + subtitle + '</span>' : '') +
    '</div>';
  }

  function renderReport(){
    const box = computeBoxScore(plays);
    const finalState = computeState();
    const possessions = countPossessions(plays);
    const turnovers = countTurnovers(plays);
    const scrimmageTypes = ['rush','pass','incomplete','sack','int','fumble'];
    // OFFENSE DETERMINED BY ROLE, NOT BY p.team -- see recap.html for
    // the full reasoning, found and fixed there first the same night.
    const offenseTeamOf = (p) => {
      const r = p.roles;
      if (!r) return null;
      if (r.carrier) return r.carrier.team;
      if (r.passer) return r.passer.team;
      return null;
    };
    const playsFor = (teamKey) => plays.filter(p => p.roles && scrimmageTypes.includes(p.roles.playType) && offenseTeamOf(p) === teamKey).length;

    // The ON-SCREEN quarter line. The XLS export above keeps its own
    // copy and already separated overtime; this one clamped with
    // Math.min(4, ...) and folded overtime into Q4 -- so the exported
    // spreadsheet and the page a coach was reading disagreed about the
    // same game.
    const quarterScores = { teamA: [0,0,0,0], teamB: [0,0,0,0] };
    const otScores = { teamA: 0, teamB: 0 };
    plays.forEach(p => {
      const qn = Math.max(1, p.quarter || 1);
      const add = (team, pts) => {
        if (qn >= 5) otScores[team] += pts;
        else quarterScores[team][qn - 1] += pts;
      };
      if (p.effect && p.effect.score) add(p.effect.score.team, p.effect.score.points);
      if (p.effect && p.effect.scoreAdjust) add(p.effect.scoreAdjust.team, p.effect.scoreAdjust.pts);
    });

    const teamMetrics = (teamKey) => {
      const s = box[teamKey];
      let rushYds = sumStat(s.rushing, 'yds');
      const rushAtt = sumStat(s.rushing, 'att'), rushTd = sumStat(s.rushing, 'td');
      // Verified against real NFL box scores: sack yardage lost comes
      // out of the team's Pass Yards total, not Rushing. A passer's
      // own personal statline stays unadjusted -- only this team-level
      // total subtracts it. computeBoxScore only counts sacks, never
      // sums their yardage, so this reads the raw play log directly.
      //
      // NOT currently referenced downstream in this function -- confirmed
      // by search before this fix, not assumed. Corrected anyway,
      // alongside the identical, LIVE gap a few dozen lines up (the
      // 'Sacks and Bad Snaps' row), rather than left as a latent copy
      // of the same mistake for whenever this does get wired up.
      const sackYardsLost = plays.reduce((t, p) => {
        const r = p.roles;
        return (r && (r.playType === 'sack' || (r.playType === 'fumble' && r.attempt === 'sack')) && r.passer && r.passer.team === teamKey) ? t + (r.passer.yards || 0) : t;
      }, 0);
      // NFHS: charge the sack yardage against rushing.
      const passYds = sumStat(s.passing, 'yds'), passAtt = sumStat(s.passing, 'att'), sacked = sumStat(s.passing, 'sacked');
      const passComp = sumStat(s.passing, 'comp');
      const passTd = sumStat(s.passing, 'td');
      const totalYds = rushYds + passYds, totalPlays = playsFor(teamKey);
      const own = box[otherTeam(teamKey)].oppDowns;
      const pen = finalState.penalties[teamKey];
      return { totalYds, totalPlays, passYds, passAtt, passComp, passTd, rushYds, rushAtt, rushTd, sacked,
        turnovers: turnovers[teamKey]||0, penCount: pen.count, penYds: pen.yds,
        possessions: possessions[teamKey]||0,
        // Cumulative time of possession, from the clock values entered.
        top: (finalState.possessionTime || {})[teamKey] || 0,
        own };
    };

    const visitorKey = TEAMS.teamA.isHome ? 'teamB' : 'teamA';
    const homeKey = TEAMS.teamA.isHome ? 'teamA' : 'teamB';

    let html = '<div class="report-header"><img class="statchat-logo" src="logo.png" alt="StatChat">' +
      '<h1>' + TEAMS[visitorKey].name + ' @ ' + TEAMS[homeKey].name + '</h1>' +
      '<div class="sub">' + (gameLabel || '') + (gameDate ? ' &middot; ' + new Date(gameDate + 'T00:00:00').toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'}) : '') + '</div>' +
      '</div>';

    // otScores was computed above and then never rendered, so overtime
    // points were absent from the quarter line while still counting in
    // Final -- the row did not add up, which on a printed stat sheet is
    // the kind of thing a coach spots and stops trusting the page over.
    const hadOt = plays.some(p => (p.quarter || 1) >= 5);
    html += '<table class="quarter-table"><tr><th></th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th>' +
      (hadOt ? '<th>OT</th>' : '') + '<th>Final</th></tr>' +
      '<tr>' + qtrTeamCell(visitorKey) + quarterScores[visitorKey].map(v=>'<td>'+v+'</td>').join('') +
        (hadOt ? '<td>' + otScores[visitorKey] + '</td>' : '') + '<td>' + finalState.scores[visitorKey] + '</td></tr>' +
      '<tr>' + qtrTeamCell(homeKey) + quarterScores[homeKey].map(v=>'<td>'+v+'</td>').join('') +
        (hadOt ? '<td>' + otScores[homeKey] + '</td>' : '') + '<td>' + finalState.scores[homeKey] + '</td></tr>' +
      '</table>';

    // SCORING SUMMARY, directly under the quarter line it explains.
    // Wrapped in .stat-group so it cannot split across a page break --
    // a scoring summary broken in half is worse than one on the next
    // page whole.
    const scoring = scoringSummary(plays);
    // Which of our two team keys is at home. TEAMS.teamA is always OUR
    // team; isHome says whether that is the home side for this fixture.
    const homeIsA = !!TEAMS.teamA.isHome;
    const homeName = homeIsA ? TEAMS.teamA.name : TEAMS.teamB.name;
    const awayName = homeIsA ? TEAMS.teamB.name : TEAMS.teamA.name;
    if (scoring.length){
      html += '<div class="stat-group scoring-summary" style="margin-top:22px;">' +
        sectionHead('Scoring Summary',
          scoring.length + ' score' + (scoring.length === 1 ? '' : 's') + ' \u00b7 ' +
          homeName + ' ' + (homeIsA ? finalState.scores.teamA : finalState.scores.teamB) + '\u2013' +
          awayName + ' ' + (homeIsA ? finalState.scores.teamB : finalState.scores.teamA) + ' final') +
        '<table class="stat-table"><thead><tr>' +
          '<th style="width:44px;">Qtr</th><th>Team</th><th>Play</th>' +
          '<th class="ss-score">Score</th>' +
        '</tr></thead><tbody>' +
        scoring.map(e => {
          const detail = e.detail ? ' <span class="ss-detail">(' + e.detail + ')</span>' : '';
          return '<tr>' +
            '<td class="ss-qtr">' + (e.quarter >= 5 ? 'OT' : 'Q' + e.quarter) + '</td>' +
            '<td class="ss-team">' + TEAMS[e.team].name + '</td>' +
            '<td>' + e.text + detail + '</td>' +
            // Named, not "7-0". A bare pair leaves a reader working out
            // which number is whose from the home/away line at the top of
            // the page -- and getting it backwards on an away game.
            // HOME ALWAYS ON THE BOTTOM LINE, whoever that is. It is the
            // convention every scoreboard uses, so the column reads the
            // same way at home and away -- which does mean our own team
            // moves between the two lines depending on the fixture.
            //
            // The away line is dimmed slightly so the pair reads as a top
            // and a bottom rather than two equal numbers.
            '<td class="ss-score">' +
              '<span class="ss-away">' + awayName + ' ' + (homeIsA ? e.teamB : e.teamA) + '</span><br>' +
              '<span>' + homeName + ' ' + (homeIsA ? e.teamA : e.teamB) + '</span>' +
            '</td>' +
          '</tr>';
        }).join('') +
        '</tbody></table></div>';
    }

    const teamBlock = (teamKey, allowedLabel) => {
      const m = teamMetrics(teamKey);
      const groups = [
        { color: '#534AB7', label: 'Overall', items: [
          [m.totalYds, allowedLabel ? 'Yds allowed' : 'Total yds'], [m.totalPlays, 'Plays'],
          [m.totalPlays ? (m.totalYds/m.totalPlays).toFixed(1) : '0.0', 'Yds/play'], [m.possessions, 'Possessions'] ] },
        { color: '#0F6E56', label: 'Passing', items: [
          [m.passYds, 'Yds'], [m.passAtt ? (m.passYds/m.passAtt).toFixed(1) : '0.0', 'Yds/att'], [m.passTd, 'TD'],
          [m.passAtt ? Math.round(100*m.passComp/m.passAtt)+'%' : '—', 'Comp %'] ] },
        { color: '#993C1D', label: 'Rushing', items: [
          [m.rushYds, 'Yds'], [m.rushAtt ? (m.rushYds/m.rushAtt).toFixed(1) : '0.0', 'Yds/att'], [m.rushTd, 'TD'] ] },
        { color: '#993556', label: 'Discipline', items: [
          [m.turnovers, 'Turnovers'], [m.sacked, 'Sacks allowed'], [m.penCount + '-' + m.penYds, 'Penalties'] ] },
        { color: '#999', label: 'Efficiency', items: [
          [m.own.d3Pct !== null ? m.own.d3conv+'/'+m.own.d3att+' ('+m.own.d3Pct+'%)' : '—', '3rd down'],
          [m.own.d4Pct !== null ? m.own.d4conv+'/'+m.own.d4att+' ('+m.own.d4Pct+'%)' : '—', '4th down'],
          [m.own.explosive, '20yd+ plays'] ] },
        // Time of possession is its own group, not a Discipline one: it
        // describes how the game was controlled, not what went wrong.
        //
        // LAST because it is the shortest -- one metric against a 128px
        // heading leaves a lot of white to its right, and a block that
        // tapers off at the end reads better than one that dips in the
        // middle and picks back up.
        //
        // Em dash when no clocks were entered; 0:00 would claim they
        // never had the ball.
        { color: '#3C6E47', label: 'Possession', items: [
          [m.top ? formatDuration(m.top) : '—', 'Time of possession'] ] }
      ];
      const groupHtml = groups.map(g => '<div class="metric-group">' +
        '<div class="metric-group-label">' + g.label + '</div>' +
        '<div class="metric-group-row">' + g.items.map(([val,label]) =>
          '<div class="metric-item"><span class="metric-val">' + val + '</span><span class="metric-label">' + label + '</span></div>').join('') +
        '</div></div>').join('');
      return '<div class="team-block">' +
        '<div class="team-block-header">' + (TEAMS[teamKey].logo ? '<img class="team-block-logo" src="'+TEAMS[teamKey].logo+'">' : '') + TEAMS[teamKey].name + '</div>' +
        groupHtml + '</div>';
    };
    // BOTH TEAM BLOCKS SHARE ONE PAGE, on purpose. They are the same six
    // groups of numbers for each side, and the only reason to read them
    // is to compare -- which cannot be done across a fold. So one forced
    // break before the pair, and none between them.
    //
    // Each block still refuses to split internally, so if the two cannot
    // fit together the second moves whole rather than tearing.
    html += '<div class="page-break">' +
              teamBlock('teamA', false) + teamBlock('teamB', true) +
            '</div>';

    // THE INDIVIDUAL TABLES ALWAYS START A NEW PAGE.
    // ------------------------------------------------------------------
    // Passing used to follow the two team summaries on whatever space was
    // left, so page two ended with a half table and the totals row landed
    // overleaf. The summaries are a page's worth of reading on their own
    // and the player tables are a different kind of document -- they get
    // their own sheet.
    html += '<div class="page-break"></div>';

    html += teamBand('teamA', 'Passing') +
      (statTable('teamA', box.teamA.passing, ['Comp','Att','%','Yds','Y/C','Long','TD','Int','Sacked','Rush TD','Fumble'],
        (d, n) => { const rd = box.teamA.rushing[n] || {};
          return [d.comp||0, d.att||0, d.att?Math.round(100*(d.comp||0)/d.att):0, d.yds||0, d.comp?(d.yds/d.comp).toFixed(1):'0.0', d.long||0, d.td||0, d.intThrown||0, d.sacked||0, rd.td||0, (d.fum||0)+(rd.fum||0)]; },
        (obj, nums) => { const att=sumStat(obj,'att'), comp=sumStat(obj,'comp'), yds=sumStat(obj,'yds');
          const rushTdTotal = nums.reduce((t,n) => t + ((box.teamA.rushing[n]&&box.teamA.rushing[n].td)||0), 0);
          const fumTotal = nums.reduce((t,n) => t + ((obj[n].fum||0) + ((box.teamA.rushing[n]&&box.teamA.rushing[n].fum)||0)), 0);
          return [comp, att, att?Math.round(100*comp/att):0, yds, comp?(yds/comp).toFixed(1):'0.0', maxStat(obj,'long'), sumStat(obj,'td'), sumStat(obj,'intThrown'), sumStat(obj,'sacked'), rushTdTotal, fumTotal]; },
        'yds') || '<p class="no-stats">No passing stats recorded.</p>');

    html += teamBand('teamA', 'Receiving') +
      (statTable('teamA', box.teamA.receiving, ['Rec','Tgt','Catch %','Yds','Y/C','Long','TD','Fumble'],
        d => [d.rec||0, d.tgt||0, d.tgt?Math.round(100*(d.rec||0)/d.tgt)+'%':'—', d.yds||0, d.rec?(d.yds/d.rec).toFixed(1):'0.0', d.long||0, d.td||0, d.fum||0],
        (obj) => { const rec=sumStat(obj,'rec'), yds=sumStat(obj,'yds'), tgt=sumStat(obj,'tgt');
          return [rec, tgt, tgt?Math.round(100*rec/tgt)+'%':'—', yds, rec?(yds/rec).toFixed(1):'0.0', maxStat(obj,'long'), sumStat(obj,'td'), sumStat(obj,'fum')]; },
        'yds') || '<p class="no-stats">No receiving stats recorded.</p>');

    html += teamBand('teamA', 'Rushing') +
      (statTable('teamA', box.teamA.rushing, ['Att','Yds','Y/C','Long','TD','Fumble'],
        d => [d.att||0, d.yds||0, d.att?(d.yds/d.att).toFixed(1):'0.0', d.long||0, d.td||0, d.fum||0],
        (obj) => { const att=sumStat(obj,'att'), yds=sumStat(obj,'yds');
          return [att, yds, att?(yds/att).toFixed(1):'0.0', maxStat(obj,'long'), sumStat(obj,'td'), sumStat(obj,'fum')]; },
        'yds') || '<p class="no-stats">No rushing stats recorded.</p>');

    const defOwn = box.teamB.oppDowns;
    const defNums = Object.keys(box.teamA.defense);
    html += teamBand('teamA', 'Defense');
    // TFL belongs in the gate too: a defence that made tackles for loss
    // but no sacks, picks or recoveries would otherwise report "no
    // defensive stats recorded" while holding a real number.
    const defTfl = teamTflFor(plays, 'teamA');
    html += defNums.length || defOwn.d3att || defOwn.d4att || defOwn.explosive || defTfl
      ? '<table class="stat-table"><tr><th></th><th>Int</th><th>Fum Forced</th><th>Sacks</th><th>TFL</th><th>Opp 3rd %</th><th>Opp 4th %</th><th>Plays Over 20 Allowed</th></tr>' +
        '<tr><td>Defense</td><td>' + sumStat(box.teamA.defense,'int') + '</td><td>' + sumStat(box.teamA.defense,'fumRec') + '</td><td>' + sumStat(box.teamA.defense,'sacks') + '</td><td>' + defTfl + '</td>' +
        '<td>' + (defOwn.d3Pct !== null ? defOwn.d3Pct+'%' : '—') + '</td><td>' + (defOwn.d4Pct !== null ? defOwn.d4Pct+'%' : '—') + '</td><td>' + defOwn.explosive + '</td></tr></table>'
      : '<p class="no-stats">No defensive stats recorded.</p>';

    // Per-player tackles, in their OWN table below the team row. Not
    // merged, because the two TFL numbers legitimately differ: the team
    // figure counts every play for a loss (a ceiling), while per-player
    // needs a named tackler and naming is optional (a floor). One table
    // would make the package look like it contradicts itself.
    const tacklers = Object.keys(box.teamA.defense || {})
      .filter(n => n !== 'TEAM' && (box.teamA.defense[n].tackles || 0) > 0)
      .map(n => ({ name: n, d: box.teamA.defense[n] }))
      .sort((a, b) => (b.d.tackles || 0) - (a.d.tackles || 0));
    if (tacklers.length){
      html += '<div class="stat-group">' + teamBand('teamA', 'Tackles') +
        '<table class="stat-table"><tr><th></th><th>Tackles</th><th>TFL</th>' +
        '<th>Sacks</th><th>Int</th><th>Fum Rec</th></tr>' +
        tacklers.map(p => '<tr><td>' + p.name + '</td><td>' + (p.d.tackles || 0) +
          '</td><td>' + (p.d.tfl || 0) + '</td><td>' + (p.d.sacks || 0) +
          '</td><td>' + (p.d.int || 0) + '</td><td>' + (p.d.fumRec || 0) +
          '</td></tr>').join('') +
        '</table><p class="no-stats" style="margin-top:4px; font-size:11px;">' +
        'Counts only plays where a tackler was named. The team TFL above ' +
        'counts every play for a loss, so it may be higher.</p></div>';
    }

    const koNums = Object.keys(box.teamA.specialTeams).filter(n => box.teamA.specialTeams[n].kickoffs);
    const puntNums = Object.keys(box.teamA.specialTeams).filter(n => box.teamA.specialTeams[n].punts);
    // Returns, kickoff and punt combined. Filtered on `returns`, not on
    // yardage -- a return for a loss or no gain still happened.
    const retNums = Object.keys(box.teamA.specialTeams).filter(n => box.teamA.specialTeams[n].returns);
    const kickNums = Object.keys(box.teamA.specialTeams).filter(n => box.teamA.specialTeams[n].fgAtt || box.teamA.specialTeams[n].patAtt);
    html += '<div class="stat-group">' + teamBand('teamA', 'Special Teams');
    const stSub = (label, tableHtml) => tableHtml ? '<div class="st-subsection"><div class="st-subsection-label">' + label + '</div>' + tableHtml + '</div>' : '';
    let stHtml = '';
    if (koNums.length){
      stHtml += stSub('Kickoffs', statTable('teamA', Object.fromEntries(koNums.map(n=>[n,box.teamA.specialTeams[n]])), ['Kickoffs','Touchbacks','TB %'],
        d => [d.kickoffs||0, d.touchbacks||0, d.kickoffs?Math.round(100*(d.touchbacks||0)/d.kickoffs)+'%':'—'],
        (obj) => { const k=sumStat(obj,'kickoffs'), tb=sumStat(obj,'touchbacks'); return [k, tb, k?Math.round(100*tb/k)+'%':'—']; },
        'kickoffs', 'special'));
    }
    if (puntNums.length){
      stHtml += stSub('Punting', statTable('teamA', Object.fromEntries(puntNums.map(n=>[n,box.teamA.specialTeams[n]])), ['Punts','Yds Per Punt','Long','Blocked'],
        d => [d.punts||0, d.puntsWithYards?(d.puntYds/d.puntsWithYards).toFixed(1):'0.0', d.puntLong||0, d.blocked||0],
        (obj) => { const p=sumStat(obj,'punts'), yds=sumStat(obj,'puntYds'), wy=sumStat(obj,'puntsWithYards');
          return [p, wy?(yds/wy).toFixed(1):'0.0', maxStat(obj,'puntLong'), sumStat(obj,'blocked')]; },
        'puntYds', 'special'));
    }
    if (retNums.length){
      stHtml += stSub('Returns', statTable('teamA', Object.fromEntries(retNums.map(n=>[n,box.teamA.specialTeams[n]])), ['Ret','Yds','Avg','Long','TD'],
        d => [d.returns||0, d.retYds||0, d.returns?(d.retYds/d.returns).toFixed(1):'0.0', d.retLong||0, d.retTd||0],
        (obj) => { const r=sumStat(obj,'returns'), yds=sumStat(obj,'retYds');
          return [r, yds, r?(yds/r).toFixed(1):'0.0', maxStat(obj,'retLong'), sumStat(obj,'retTd')]; },
        'retYds', 'special'));
    }
    if (kickNums.length){
      stHtml += stSub('Kicking', statTable('teamA', Object.fromEntries(kickNums.map(n=>[n,box.teamA.specialTeams[n]])), ['FG Att','FG Made','Long FG','FG %','FG Blk','XP Att','XP Made','XP %','XP Blk'],
        d => [d.fgAtt||0, d.fgMade||0, d.fgLong||0, d.fgAtt?Math.round(100*(d.fgMade||0)/d.fgAtt)+'%':'—', d.fgBlocked||0, d.patAtt||0, d.patMade||0, d.patAtt?Math.round(100*(d.patMade||0)/d.patAtt)+'%':'—', d.patBlocked||0],
        (obj) => { const fa=sumStat(obj,'fgAtt'), fm=sumStat(obj,'fgMade'), pa=sumStat(obj,'patAtt'), pm=sumStat(obj,'patMade');
          return [fa, fm, maxStat(obj,'fgLong'), fa?Math.round(100*fm/fa)+'%':'—', sumStat(obj,'fgBlocked'), pa, pm, pa?Math.round(100*pm/pa)+'%':'—', sumStat(obj,'patBlocked')]; },
        'fgAtt', 'special'));
    }
    html += (stHtml || '<p class="no-stats">No special teams stats recorded.</p>') + '</div>';

    // THE END MARK IS THE LOGO ONLY.
    // ------------------------------------------------------------------
    // It used to repeat "Generated with StatChat / www.statchat.co", which
    // the running footer already prints on every sheet -- so the last page
    // carried the same words twice, once here and once six lines below.
    //
    // The running footer cannot be suppressed on the final page (CSS has
    // no "last sheet" selector), so the duplicate had to go from the half
    // that CAN be changed. The logo sits above the footer line and the
    // two read as one mark.
    html += '<div class="print-endmark"><img src="logo.png" alt="StatChat"></div>';
    return html;
  }
</script>
</body>
</html>
