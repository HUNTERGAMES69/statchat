<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Without this every page load logs a 404 for /favicon.ico.
     Harmless, but a red console error should MEAN something. -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="logo.png" type="image/png">
<!-- Shared tokens. Loaded BEFORE this page's own <style> so anything
     below still wins -- that ordering is what lets a page be converted
     a bit at a time without breaking on the way. -->
<link rel="stylesheet" href="statchat.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Apple renamed this; the old tag warns in the console on every
     page load. Both are kept so older iOS still honours it. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StatChat">
<title>StatChat — Customize Team</title>
<style>
  /* THE STATCHAT MARK, identical on every page reachable from the
     dashboard. Same element, same size, same place: beside the page's own
     heading. Uniformity is the point -- a mark that moves or resizes
     between screens reads as decoration rather than as the product. */
  .scMark { display:flex; align-items:center; gap:10px; min-width:0; }
  .scMark > img { width:26px; height:26px; border-radius:5px; flex:none; display:block; }

  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background:var(--sc-page, #f4f3ef); margin:0; padding:24px; padding-top:calc(24px + env(safe-area-inset-top)); }
  .wrap { max-width:600px; margin:0 auto; }
  .card { background:#fff; border-radius:12px; padding:28px; margin-bottom:20px; box-shadow:0 2px 12px rgba(0,0,0,0.08); }
  h1 { font-size:22px; margin:0; }
  p.sub { color:#888; margin:0 0 20px; font-size:14px; }
  label { display:block; font-size:13px; margin-bottom:4px; color:#555; }
  input { padding:8px; border:1px solid #ddd; border-radius:6px; font-size:14px; box-sizing:border-box; }
  input[type="color"] { width:64px; height:40px; padding:2px; cursor:pointer; }
  button { padding:9px 16px; border-radius:6px; border:none; background:var(--sc-navy, #1a1a2e); color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
  button.secondary { background:#fff; color:#444; border:1px solid #ccc; }
  /* THE SAME DASHBOARD BUTTON AS every other page. `.backlink`, not
     `a.backlink`, and display:inline-block added: this one is a flex child
     so it was blockified anyway, but help.html's is not, and five copies of
     a rule should be five identical copies. */
  .backlink { text-decoration:none; padding:8px 14px; border-radius:6px;
              border:1px solid #ccc; color:#444; font-size:13px; font-weight:600;
              display:inline-block; }
  .msg { font-size:14px; padding:10px; border-radius:6px; margin-bottom:14px; }
  .msg.error { background:var(--sc-red-tint, #fdecea); color:var(--sc-red, #a32d2d); }
  .msg.success { background:var(--sc-green-tint, #e8f5e9); color:var(--sc-green, #1a7a4c); }
  .hidden { display:none; }
  .field-row { display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap; margin-top:14px; }
  .hint { font-size:12px; color:#999; margin-top:4px; }
</style>
</head>
<body>
<div class="wrap">

  <div id="loading" class="card"><div style="display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:14px;"><img src="logo.png" alt="StatChat" style="width:48px; height:auto; border-radius:8px;"><img id="splashTeamIcon" style="display:none; width:48px; height:48px; border-radius:8px; object-fit:cover;"></div><h1>Loading…</h1></div>

  <div id="mainView" class="hidden">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:10px; margin-bottom:18px;">
        <div class="scMark">
          <img src="logo.png" alt="StatChat">
        <h1 style="min-width:0;">Customize team</h1>
        </div>
        <a class="backlink" href="dashboard.html" style="white-space:nowrap; flex-shrink:0;">← Dashboard</a>
      </div>
      <p class="sub">Your team's name, logo, and colors — shown across the dashboard.</p>
      <div id="msg"></div>

      <div class="field-row" style="margin-top:0;">
        <div style="flex:1;">
          <label>Team name (used everywhere in stat entry)<input type="text" id="teamNameInput" style="width:100%;"></label>
        </div>
        <div style="flex:1;">
          <label>Full name (shown on the dashboard)<input type="text" id="fullNameInput" style="width:100%;"></label>
        </div>
      </div>
      <div class="field-row">
        <div>
          <label>Current season</label>
          <input type="number" id="seasonYearInput" style="width:100px;">
          <div class="hint">New games default to this year.</div>
        </div>
      </div>

      <div class="field-row">
        <div>
          <label>Logo</label>
          <button type="button" id="chooseLogoBtn" class="secondary">Choose file</button>
          <input type="file" id="logoInput" accept="image/*" style="display:none;">
            <div id="logoError" role="alert" style="display:none; margin-top:6px;
                 font-size:13px; line-height:1.35; color:var(--sc-red, #a32d2d);
                 background:var(--sc-red-tint, #fdecea); border-radius:6px;
                 padding:7px 9px; max-width:280px;"></div>
          <div class="hint">Colors below auto-fill from the logo — still yours to adjust.</div>
        </div>
      </div>
      <div style="margin-top:10px;">
        <img id="logoPreview" style="display:none; height:56px; border-radius:6px;">
      </div>

      <div class="field-row" style="margin-top:14px;">
        <div>


      <div class="field-row">
        <div>
          <label>Primary color</label>
          <input type="color" id="primaryColorInput" value="#1a1a2e">
        </div>
        <div>
          <label>Secondary color</label>
          <input type="color" id="secondaryColorInput" value="#ffffff">
        </div>
      </div>

      <button id="saveBtn" style="margin-top:20px;">Save</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="team-icon.js"></script>
<script>
  // Mirrors the bucket settings in sql/011_storage_scoping, so a bad
  // file is refused when it is chosen rather than when it is saved.
  const LOGO_TYPES = ['image/png','image/jpeg','image/webp','image/svg+xml'];
  const LOGO_MAX_BYTES = 2 * 1024 * 1024;
  // AT the control, not at the top of the page. Same reasoning as
  // create_game.html: a message about this button, rendered above the
  // fold, is a message about something the reader is not looking at.
  function showLogoError(html){
    const el = document.getElementById('logoError');
    if (!el) return;
    if (!html){ el.style.display = 'none'; el.innerHTML = ''; return; }
    el.innerHTML = html;
    el.style.display = 'block';
  }
  const SUPABASE_URL = 'https://pboushzlcyfkssojpuut.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_VGnUYurlkoH1yi67jHO6iQ_C8Q0EM2d';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  let ourTeamId = null;
  let pendingLogoFile = null;

  function showView(name){
    ['loading', 'mainView'].forEach(v => document.getElementById(v).classList.toggle('hidden', v !== name));
  }
  function showMsg(text, type){
    document.getElementById('msg').innerHTML = '<div class="msg ' + type + '">' + text + '</div>';
  }

  async function guardMinRoleOrRedirect(userId, minRole){
    const ROLE_RANK = { view: 0, game_entry: 1, admin: 2 };
    const { data, error } = await supabaseClient
      .from('profiles').select('role').eq('id', userId).limit(1);
    const role = (!error && data && data.length > 0 && data[0].role) || 'view';
    const ok = (ROLE_RANK[role] || 0) >= (ROLE_RANK[minRole] || 0);
    if (!ok) window.location.href = 'dashboard.html';
    return ok;
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'INITIAL_SESSION'){
      if (session){
        guardMinRoleOrRedirect(session.user.id, 'admin').then(ok => {
          if (ok) init();
        });
      } else {
        window.location.href = '/login.html';
      }
    } else if (event === 'SIGNED_OUT'){
      window.location.href = '/login.html';
    }
  });

  async function init(){
    const { data, error } = await supabaseClient
      // EXACTLY ONE ROW, OR AN ERROR. `is_our_team` is true for every
      // tenant's team since there has been more than one tenant, so this
      // returned all of them and took whichever came first. maybeSingle()
      // is correct for a tenant (009 scopes teams to one row) and fails
      // LOUDLY for the platform -- which is the right outcome for a page
      // that cannot tell whose data it is showing, and on this page could
      // let it EDIT another customer's branding.
      .from('teams').select('id, name, full_name, logo_url, primary_color, secondary_color, current_season_year')
      .maybeSingle();
    if (error){
      showView('mainView');
      showMsg('Could not load your team: ' + error.message, 'error');
      return;
    }
    // maybeSingle(): the row itself, or null. `data.length === 0` was
    // silently false on an object, so this page would have redirected
    // to roster.html only when the query errored, never when a team
    // was genuinely absent.
    if (!data){
      window.location.href = 'roster.html';
      return;
    }
    const team = data;
    ourTeamId = team.id;
    document.getElementById('teamNameInput').value = team.name;
    document.getElementById('fullNameInput').value = team.full_name || '';
    document.getElementById('seasonYearInput').value = team.current_season_year || new Date().getFullYear();
    document.getElementById('primaryColorInput').value = team.primary_color || '#2b3440';
    document.getElementById('secondaryColorInput').value = team.secondary_color || '#ffffff';
    if (team.logo_url){
      const img = document.getElementById('logoPreview');
      img.src = team.logo_url;
      img.style.display = 'inline-block';
    }
    showView('mainView');
  }

  function readFileAsDataURL(file){
    return new Promise(resolve => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.readAsDataURL(file);
    });
  }

  function detectLogoColors(dataUrl){
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const size = 60;
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, size, size);
        let data;
        try { data = ctx.getImageData(0, 0, size, size).data; }
        catch (err){ resolve({ primary: null, secondary: null }); return; }
        // Quantizes each pixel into a coarse color bucket so near-
        // identical shades of the same color group together, then finds
        // the bucket with the most pixels -- the actual dominant color,
        // rather than averaging every pixel into one blended value
        // (which is what turns a logo that's genuinely red and blue
        // into a muddy purple).
        const BUCKET = 32;
        const buckets = {};
        for (let i = 0; i < data.length; i += 4){
          const alpha = data[i+3];
          if (alpha < 100) continue;
          const rr = data[i], gg = data[i+1], bb = data[i+2];
          if (rr > 235 && gg > 235 && bb > 235) continue;
          if (rr < 20 && gg < 20 && bb < 20) continue;
          const key = Math.round(rr/BUCKET) + '_' + Math.round(gg/BUCKET) + '_' + Math.round(bb/BUCKET);
          if (!buckets[key]) buckets[key] = { count: 0, rSum: 0, gSum: 0, bSum: 0 };
          buckets[key].count++;
          buckets[key].rSum += rr; buckets[key].gSum += gg; buckets[key].bSum += bb;
        }
        const entries = Object.values(buckets).map(bk => ({
          count: bk.count,
          r: Math.round(bk.rSum / bk.count), g: Math.round(bk.gSum / bk.count), b: Math.round(bk.bSum / bk.count)
        })).sort((a, b) => b.count - a.count);
        if (entries.length === 0){ resolve({ primary: null, secondary: null }); return; }
        const toHex = c => '#' + [c.r, c.g, c.b].map(v => v.toString(16).padStart(2,'0')).join('');
        const colorDistance = (a, b) => Math.sqrt((a.r-b.r)**2 + (a.g-b.g)**2 + (a.b-b.b)**2);
        const primary = entries[0];
        // The second color needs to be genuinely different in hue AND
        // make up a real share of the image, not just a small cluster
        // of edge-blend pixels where the logo's color anti-aliases into
        // the white background during downscaling.
        const secondEntry = entries.find(e => colorDistance(e, primary) > 60 && e.count > primary.count * 0.15);
        resolve({ primary: toHex(primary), secondary: secondEntry ? toHex(secondEntry) : null });
      };
      img.onerror = () => resolve({ primary: null, secondary: null });
      img.src = dataUrl;
    });
  }

  // contrastingColor() was removed on 25 Aug 2026: the secondary is now
  // WHITE on every logo upload. See the assignment below.

  document.getElementById('chooseLogoBtn').addEventListener('click', () => document.getElementById('logoInput').click());
  document.getElementById('logoInput').addEventListener('change', async (e) => {
    pendingLogoFile = e.target.files[0] || null;
    if (!pendingLogoFile) return;

    // CHECKED AT THE MOMENT OF CHOOSING, same reasoning as create_game.html.
    // accept="image/*" is a picker FILTER, not a control -- "All files"
    // walks past it. Storage refuses a non-image since 011, but that
    // refusal arrives at save time, and a message at save time about a
    // choice made minutes ago is a worse message.
    if (!LOGO_TYPES.includes(pendingLogoFile.type)){
      showLogoError('<strong>Invalid file type.</strong><br>' +
        'That file is ' + (pendingLogoFile.type || 'of an unknown type') + '.<br>' +
        'Logos must be <strong>PNG, JPEG, WebP or SVG</strong>.');

      pendingLogoFile = null; e.target.value = '';
      const lp0 = document.getElementById('logoPreview');
      if (lp0) lp0.style.display = 'none';
      return;
    }
    if (pendingLogoFile.size > LOGO_MAX_BYTES){
      showLogoError('<strong>That image is too large.</strong><br>' +
        (pendingLogoFile.size / 1048576).toFixed(1) + 'MB, and the limit is 2MB.<br>' +
        'A crest is usually well under 100KB.');

      pendingLogoFile = null; e.target.value = '';
      const lp1 = document.getElementById('logoPreview');
      if (lp1) lp1.style.display = 'none';
      return;
    }
    showLogoError('');   // a good file clears whatever the last one said
    if (URL.createObjectURL){
      try {
        const img = document.getElementById('logoPreview');
        img.src = URL.createObjectURL(pendingLogoFile);
        img.style.display = 'inline-block';
      } catch (e){}
    }
    const dataUrl = await readFileAsDataURL(pendingLogoFile);
    const detected = await detectLogoColors(dataUrl);
    if (detected.primary){
      document.getElementById('primaryColorInput').value = detected.primary;
      // WHITE, ALWAYS, ON EVERY LOGO UPLOAD. Andy's call, 25 Aug.
      // -----------------------------------------------------------------
      // This used to derive the secondary from the logo -- either its second
      // detected colour or whatever contrasted with the primary -- so two
      // tenants uploading crests got two different answers, neither of which
      // anybody chose.
      //
      // White is the one that is right almost always: the secondary is text
      // and trim over the primary, and a school colour dark enough to be a
      // primary carries white. It is still a plain colour input directly
      // below, so a school with a pale primary can change it in one click --
      // which is a better default than a guess that is confidently wrong.
      document.getElementById('secondaryColorInput').value = '#ffffff';
    }
  });



  // Takes a `kind` although only 'logo' is passed now: the browser tab
  // icon was the other caller and was removed on 22 Aug (see
  // team-icon.js). Left parameterised rather than inlined -- a second
  // team image is plausible again under multi-tenancy, and the caching
  // rules below are the part that must not be rewritten from memory.
  async function uploadImage(file, teamId, kind){
    const ext = file.name.split('.').pop();
    const path = teamId + '/' + kind + '.' + ext;
    const { error: uploadError } = await supabaseClient.storage
      .from('team-logos').upload(path, file, {
        upsert: true,
        // A SHORT CACHE, not the default hour. This object is replaced in
        // place, so a long max-age is a promise the file will not change
        // when replacing it is the entire purpose of this screen.
        cacheControl: '60'
      });
    if (uploadError) throw uploadError;
    const { data } = supabaseClient.storage.from('team-logos').getPublicUrl(path);
    // A VERSION STAMP ON THE URL.
    // -------------------------------------------------------------------
    // The upload overwrites a FIXED path -- teamId/logo.png -- so
    // getPublicUrl returns the identical address every time. A new logo
    // therefore changed nothing a browser could see: every page kept
    // serving the old image out of cache. Reported directly: "I uploaded
    // a new logo and it did not replace logos on any screen."
    //
    // The stamp goes in the STORED url rather than being added when each
    // page renders, because sixteen files read logo_url and three API
    // endpoints pass it on -- fixing it once at the source is one change
    // instead of nineteen that have to agree.
    //
    // Nothing parses this value; every consumer uses it as an <img src>,
    // so a query string is safe.
    const sep = data.publicUrl.indexOf('?') === -1 ? '?' : '&';
    return data.publicUrl + sep + 'v=' + Date.now();
  }


  async function uploadLogo(file, teamId){ return uploadImage(file, teamId, 'logo'); }


  document.getElementById('saveBtn').addEventListener('click', async () => {
    const name = document.getElementById('teamNameInput').value.trim();
    if (!name){
      showMsg('Enter a team name.', 'error');
      return;
    }
    const seasonYear = parseInt(document.getElementById('seasonYearInput').value) || new Date().getFullYear();
    const fullName = document.getElementById('fullNameInput').value.trim();
    const updates = {
      name,
      full_name: fullName || name,
      current_season_year: seasonYear,
      primary_color: document.getElementById('primaryColorInput').value,
      secondary_color: document.getElementById('secondaryColorInput').value
    };
    if (pendingLogoFile){
      try {
        updates.logo_url = await uploadLogo(pendingLogoFile, ourTeamId);
      } catch (logoErr){
        showMsg('Logo upload failed: ' + logoErr.message, 'error');
        return;
      }
    }
    const { error } = await supabaseClient.from('teams').update(updates).eq('id', ourTeamId);
    if (error){
      showMsg(error.message, 'error');
      return;
    }
    showMsg('Saved.', 'success');
  });
</script>
</body>
</html>
