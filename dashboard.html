<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StatChat">
<link rel="apple-touch-icon" id="appleTouchIcon" href="">
<title>StatChat — Dashboard</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background:#f4f3ef; margin:0; padding:24px; }
  .wrap { max-width:760px; margin:0 auto; }
  .card { background:#fff; border-radius:12px; padding:28px; margin-bottom:20px; box-shadow:0 2px 12px rgba(0,0,0,0.08); }
  h1 { font-size:24px; margin:0; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .brandline { display:flex; align-items:center; gap:12px; }
  #teamLogo { height:36px; width:36px; object-fit:contain; border-radius:6px; display:none; }
  .navlinks { display:flex; gap:10px; }
  p.sub { color:#888; margin:0 0 20px; font-size:15px; }
  button { padding:9px 16px; border-radius:6px; border:none; background:#1a1a2e; color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
  button.secondary { background:#fff; color:#444; border:1px solid #ccc; }
  a.button-link { display:inline-block; text-decoration:none; padding:9px 16px; border-radius:6px; background:#1a1a2e; color:#fff; font-size:14px; font-weight:600; }
  a.button-link.secondary { background:#fff; color:#444; border:1px solid #ccc; }
  .msg { font-size:14px; padding:10px; border-radius:6px; margin-bottom:14px; }
  .msg.error { background:#fdecea; color:#a32d2d; }
  .hidden { display:none; }
  .game-list { border-top:0.5px solid #e5e3dc; }
  .game-row { display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:0.5px solid #e5e3dc; cursor:pointer; }
  .game-row:hover { background:#faf9f6; }
  .game-left { display:flex; align-items:center; gap:14px; }
  .game-num { font-size:13px; color:#aaa; width:28px; }
  .game-matchup { font-weight:600; }
  .game-meta { font-size:13px; color:#888; }
  .game-right { text-align:right; }
  .game-score { font-weight:600; }
  .status-win { color:#1a7a4c; font-size:13px; }
  .status-live { color:#a37a00; font-size:13px; }
  .status-loss { color:#a32d2d; font-size:13px; }
  .status-notstarted { color:#999; font-weight:600; }
  .empty-state { color:#999; padding:16px 0; }
  #appSplash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:1000; background:#fff; transition:opacity 0.3s; }
  #appSplash img { width:96px; height:96px; object-fit:contain; margin-bottom:16px; border-radius:16px; }
  #appSplash .splashTitle { font-size:20px; font-weight:600; letter-spacing:0.5px; }
  #appSplash.hidden { opacity:0; pointer-events:none; }
</style>
</head>
<body>

<div id="appSplash">
  <img id="splashLogo" style="display:none;" alt="">
  <div class="splashTitle" id="splashTitle">StatChat</div>
</div>

<div class="wrap">

  <div id="loading" class="card"><h1>Loading…</h1></div>

  <div id="dashboardView" class="hidden">
    <div class="card">
      <div class="topbar">
        <div class="brandline">
          <img id="teamLogo" alt="">
          <h1 id="teamHeading">StatChat</h1>
        </div>
        <div class="navlinks">
          <a class="button-link secondary" href="roster.html">Team Roster</a>
          <a class="button-link secondary" href="customize.html">Customize team</a>
          <button id="signOutBtn" class="secondary">Sign out</button>
        </div>
      </div>
      <p class="sub" id="signedInAs"></p>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;">
        <div>
          <h1 style="font-size:20px; margin:0;">Games</h1>
          <span id="seasonLabel" style="font-size:13px; color:#999;"></span>
        </div>
        <a class="button-link" id="newGameLink" href="create_game.html">+ New game</a>
      </div>
      <p class="sub" id="seasonSummary"></p>
      <div id="dashboardMsg"></div>
      <div class="game-list" id="gamesBody"></div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://pboushzlcyfkssojpuut.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_VGnUYurlkoH1yi67jHO6iQ_C8Q0EM2d';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  function luminanceOf(hex){
    if (!hex || hex.length < 7) return 0.5;
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return (0.299*r + 0.587*g + 0.114*b) / 255;
  }

  function applySplash(branding){
    const isLight = luminanceOf(branding.primary_color) > 0.6;
    const bg = isLight ? '#000000' : '#ffffff';
    const fg = isLight ? '#ffffff' : '#1a1a1a';
    const splash = document.getElementById('appSplash');
    splash.style.background = bg;
    document.getElementById('splashTitle').style.color = fg;
    if (branding.logo_url){
      const img = document.getElementById('splashLogo');
      img.src = branding.logo_url;
      img.style.display = 'block';
      document.getElementById('appleTouchIcon').setAttribute('href', branding.logo_url);
    }
  }

  function hideSplash(){
    document.getElementById('appSplash').classList.add('hidden');
  }

  // Show branding INSTANTLY from whatever was cached last time, before any
  // network call -- this is what makes repeat opens feel like a real
  // installed app instead of a blank page while data loads.
  try {
    const cached = JSON.parse(localStorage.getItem('statchat_branding') || 'null');
    if (cached) applySplash(cached);
  } catch (e){}

  function showView(name){
    ['loading', 'dashboardView'].forEach(v => document.getElementById(v).classList.toggle('hidden', v !== name));
  }
  function showMsg(elId, text, type){
    document.getElementById(elId).innerHTML = '<div class="msg ' + type + '">' + text + '</div>';
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'INITIAL_SESSION'){
      if (session){
        document.getElementById('signedInAs').textContent = 'Signed in as ' + session.user.email;
        showView('dashboardView');
        loadDashboard();
      } else {
        window.location.href = '/';
      }
    } else if (event === 'SIGNED_OUT'){
      window.location.href = '/';
    }
  });

  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
  });

  async function loadDashboard(){
    const { data, error } = await supabaseClient
      .from('teams')
      .select('name, full_name, logo_url, primary_color, secondary_color, current_season_year')
      .eq('is_our_team', true)
      .limit(1);
    let seasonYear = new Date().getFullYear();
    if (!error && data && data.length > 0){
      const team = data[0];
      document.getElementById('teamHeading').textContent = team.full_name || team.name;
      if (team.primary_color){
        document.getElementById('teamHeading').style.color = team.primary_color;
        document.getElementById('newGameLink').style.background = team.primary_color;
        if (team.secondary_color) document.getElementById('newGameLink').style.color = team.secondary_color;
      }
      if (team.logo_url){
        const logo = document.getElementById('teamLogo');
        logo.src = team.logo_url;
        logo.style.display = 'inline-block';
      }
      if (team.current_season_year) seasonYear = team.current_season_year;
      applySplash(team);
      try { localStorage.setItem('statchat_branding', JSON.stringify({ logo_url: team.logo_url, primary_color: team.primary_color })); } catch (e){}
    }
    loadGames(seasonYear);
  }

  async function loadGames(seasonYear){
    const { data, error } = await supabaseClient
      .from('games')
      .select('id, designator, season_year, game_date, home_team_name, away_team_name, our_team_is_home, status')
      .eq('season_year', seasonYear)
      .order('game_date', { ascending: false });
    if (error){
      showMsg('dashboardMsg', 'Could not load games: ' + error.message, 'error');
      hideSplash();
      return;
    }
    document.getElementById('seasonLabel').textContent = seasonYear + ' season';
    renderSummary(data || []);
    renderGames(data || []);
    hideSplash();
  }

  function renderSummary(games){
    const final = games.filter(g => g.status === 'final').length;
    const inProgress = games.filter(g => g.status === 'in_progress').length;
    if (games.length === 0){
      document.getElementById('seasonSummary').textContent = '';
      return;
    }
    document.getElementById('seasonSummary').textContent =
      games.length + ' game(s) this season · ' + final + ' completed' +
      (inProgress > 0 ? ' · ' + inProgress + ' in progress' : '');
  }

  function renderGames(games){
    const body = document.getElementById('gamesBody');
    if (games.length === 0){
      body.innerHTML = '<div class="empty-state">No games yet — click "New game" to set up your first one.</div>';
      return;
    }
    body.innerHTML = games.map(g => {
      const matchup = g.our_team_is_home ? 'vs ' + g.away_team_name : '@ ' + g.home_team_name;
      const homeAway = g.our_team_is_home ? 'Home' : 'Away';
      const dateStr = g.game_date ? new Date(g.game_date + 'T00:00:00').toLocaleDateString() : 'Date TBD';
      let rightHtml;
      if (g.status === 'final'){
        rightHtml = '<div class="game-score">—</div><div class="status-win">Final</div>';
      } else if (g.status === 'in_progress'){
        rightHtml = '<div class="game-score">—</div><div class="status-live">In progress</div>';
      } else {
        rightHtml = '<div class="status-notstarted">Not started</div>';
      }
      return '<div class="game-row" data-id="' + g.id + '">' +
        '<div class="game-left">' +
        '<span class="game-num">' + g.designator + '</span>' +
        '<div><div class="game-matchup">' + matchup + '</div><div class="game-meta">' + homeAway + ' · ' + dateStr + '</div></div>' +
        '</div>' +
        '<div class="game-right">' + rightHtml + '</div>' +
        '</div>';
    }).join('');
    body.querySelectorAll('.game-row').forEach(row => {
      row.addEventListener('click', () => {
        window.location.href = 'game.html?id=' + row.dataset.id;
      });
    });
  }
</script>
</body>
</html>
