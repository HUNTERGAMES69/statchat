<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StatChat — Dashboard</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background:#f4f3ef; margin:0; padding:24px; }
  .wrap { max-width:800px; margin:0 auto; }
  .card { background:#fff; border-radius:12px; padding:28px; margin-bottom:20px; box-shadow:0 2px 12px rgba(0,0,0,0.08); }
  h1 { font-size:24px; margin:0; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .navlinks { display:flex; gap:10px; }
  p.sub { color:#888; margin:0 0 20px; font-size:14px; }
  button { padding:9px 16px; border-radius:6px; border:none; background:#1a1a2e; color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
  button.secondary { background:#fff; color:#444; border:1px solid #ccc; }
  a.button-link { display:inline-block; text-decoration:none; padding:9px 16px; border-radius:6px; background:#1a1a2e; color:#fff; font-size:14px; font-weight:600; }
  a.button-link.secondary { background:#fff; color:#444; border:1px solid #ccc; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-size:12px; color:#888; text-transform:uppercase; padding:8px; border-bottom:1px solid #eee; }
  td { padding:10px 8px; border-bottom:1px solid #f2f2f2; }
  tr.gameRow { cursor:pointer; }
  tr.gameRow:hover { background:#faf9f6; }
  .status-badge { font-size:11px; padding:3px 9px; border-radius:10px; font-weight:600; }
  .status-setup { background:#eee; color:#666; }
  .status-in_progress { background:#fff8e1; color:#a37a00; }
  .status-final { background:#e8f5e9; color:#1a7a4c; }
  .msg { font-size:14px; padding:10px; border-radius:6px; margin-bottom:14px; }
  .msg.error { background:#fdecea; color:#a32d2d; }
  .hidden { display:none; }
  .season-summary { display:flex; gap:24px; margin-bottom:20px; }
  .season-summary div { text-align:center; }
  .season-summary .num { font-size:22px; font-weight:700; }
  .season-summary .label { font-size:12px; color:#888; }
</style>
</head>
<body>
<div class="wrap">

  <div id="loading" class="card"><h1>Loading…</h1></div>

  <div id="dashboardView" class="hidden">
    <div class="card">
      <div class="topbar">
        <h1>StatChat</h1>
        <div class="navlinks">
          <a class="button-link secondary" href="roster.html">Team Roster</a>
          <button id="signOutBtn" class="secondary">Sign out</button>
        </div>
      </div>
      <p class="sub" id="signedInAs"></p>
    </div>

    <div class="card">
      <div class="season-summary" id="seasonSummary"></div>
      <div id="dashboardMsg"></div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h2 style="margin:0; font-size:16px; color:#444;">Games this season</h2>
        <a class="button-link" href="create_game.html">+ New Game</a>
      </div>
      <table>
        <thead>
          <tr><th>Game</th><th>Date</th><th>Matchup</th><th>Status</th><th>Score</th></tr>
        </thead>
        <tbody id="gamesBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://pboushzlcyfkssojpuut.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_VGnUYurlkoH1yi67jHO6iQ_C8Q0EM2d';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  function showView(name){
    ['loading', 'dashboardView'].forEach(v => document.getElementById(v).classList.toggle('hidden', v !== name));
  }
  function showMsg(elId, text, type){
    document.getElementById(elId).innerHTML = '<div class="msg ' + type + '">' + text + '</div>';
  }

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'INITIAL_SESSION'){
      if (session){
        document.getElementById('signedInAs').textContent = 'Signed in as ' + session.user.email;
        showView('dashboardView');
        loadGames();
      } else {
        window.location.href = '/';
      }
    } else if (event === 'SIGNED_OUT'){
      window.location.href = '/';
    }
  });

  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
  });

  async function loadGames(){
    const { data, error } = await supabaseClient
      .from('games')
      .select('id, designator, season_year, game_date, home_team_name, away_team_name, our_team_is_home, status')
      .order('game_date', { ascending: false });
    if (error){
      showMsg('dashboardMsg', 'Could not load games: ' + error.message, 'error');
      return;
    }
    renderSummary(data || []);
    renderGames(data || []);
  }

  function renderSummary(games){
    const final = games.filter(g => g.status === 'final');
    const inProgress = games.filter(g => g.status === 'in_progress').length;
    const summary = document.getElementById('seasonSummary');
    summary.innerHTML =
      '<div><div class="num">' + games.length + '</div><div class="label">Total games</div></div>' +
      '<div><div class="num">' + final.length + '</div><div class="label">Completed</div></div>' +
      '<div><div class="num">' + inProgress + '</div><div class="label">In progress</div></div>';
  }

  function renderGames(games){
    const body = document.getElementById('gamesBody');
    if (games.length === 0){
      body.innerHTML = '<tr><td colspan="5" style="color:#999;">No games yet — click "New Game" to set up your first one.</td></tr>';
      return;
    }
    body.innerHTML = games.map(g => {
      const matchup = g.our_team_is_home
        ? g.home_team_name + ' (Home) vs ' + g.away_team_name
        : g.away_team_name + ' @ ' + g.home_team_name;
      const dateStr = g.game_date ? new Date(g.game_date + 'T00:00:00').toLocaleDateString() : '—';
      return '<tr class="gameRow" data-id="' + g.id + '">' +
        '<td>' + g.designator + '</td>' +
        '<td>' + dateStr + '</td>' +
        '<td>' + matchup + '</td>' +
        '<td><span class="status-badge status-' + g.status + '">' + g.status.replace('_',' ') + '</span></td>' +
        '<td>—</td>' +
        '</tr>';
    }).join('');
    body.querySelectorAll('.gameRow').forEach(row => {
      row.addEventListener('click', () => {
        window.location.href = 'game.html?id=' + row.dataset.id;
      });
    });
  }
</script>
</body>
</html>
