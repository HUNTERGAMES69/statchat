<body>
<!-- TRANSPARENT BACKGROUND, like every other overlay here: vMix keys this
     page over the programme feed, so anything opaque outside the panel
     would black out the game. -->
<style>
  html, body { margin:0; padding:0; background:transparent; }
  #panel { display:none; position:absolute; left:60px; right:60px; top:70px;
           font-family:'Inter','Helvetica Neue',Arial,sans-serif;
           color:#12151a; }
  /* TRANSLUCENT, WITH A BLUR BEHIND IT. Alpha alone would put yard lines
     and moving crowd straight behind the numbers and the graphic would
     shimmer; blurred, the field reads as colour and depth and the panel
     still holds as a surface.
     Shown at halftime and after the final only, so there is no live play
     to obscure -- that is what makes this safe here and would not make it
     safe over a snap.
     -webkit- first for the Chromium build vMix embeds. If a browser
     ignores both, the 0.88 still renders -- it just loses the blur, which
     is why the labels below were darkened rather than left to rely on it. */
  .card { background:rgba(255,255,255,0.88); border-radius:14px;
          -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
          box-shadow:0 10px 40px rgba(0,0,0,0.45); overflow:hidden; }

  /* ---- head: visitor, title, home ---- */
  #head { display:flex; align-items:stretch; }
  /* CENTRED AS A GROUP, both sides the same way round.
     The first version stretched the name to fill the bar and pushed the
     score to the far edge, then mirrored the home side -- so the two
     halves read in opposite directions, the scores ended up against the
     title in the middle, and each name sat a different distance from its
     own number depending on how long the name was. Reported as not
     reading well, and that was why.
     Now: logo, name, then the score a FIXED step to its right, and the
     whole group centred in its half. Both sides identical, so the eye
     finds the score in the same place on each. */
  .hteam { flex:1 1 0; display:flex; align-items:center; justify-content:center;
           gap:14px; padding:14px 22px; min-width:0; }
  .hteam img { width:44px; height:44px; object-fit:contain; flex:0 0 auto; }
  .hname { flex:0 1 auto; font-size:26px; font-weight:800; letter-spacing:0.01em;
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* The fixed step. margin-left rather than the flex gap so it is wider
     than the logo-to-name spacing, which keeps the number reading as a
     score and not as part of the name. */
  .hpts { flex:0 0 auto; margin-left:14px; font-size:34px; font-weight:800;
          font-variant-numeric:tabular-nums; }
  .hmid { flex:0 0 auto; display:flex; align-items:center; padding:0 30px;
          background:#12151a; color:#fff; font-size:17px; font-weight:800;
          letter-spacing:0.16em; }

  /* ---- comparison rows ---- */
  #rows { padding:6px 22px 14px; }
  .srow { display:flex; align-items:baseline; padding:7px 0;
          border-bottom:1px solid #ececec; }
  .srow:last-child { border-bottom:none; }
  .sv { flex:0 0 26%; font-size:25px; font-weight:800;
        font-variant-numeric:tabular-nums; }
  /* Visitor's figure hugs the centre label from the left, home's from the
     right, so both columns are read against the label between them. */
  .srow .sv:first-child { text-align:left; }
  .srow .sv:last-child { text-align:right; }
  .slab { flex:1 1 auto; text-align:center; font-size:14px; font-weight:700;
          letter-spacing:0.1em; text-transform:uppercase; color:#3d4249; }

  /* ---- leaders ---- */
  #leaders { display:flex; gap:16px; margin-top:16px; }
  .lside { flex:1 1 0; min-width:0; display:flex; align-items:center; gap:18px;
           background:rgba(255,255,255,0.88);
           -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
           border-radius:14px;
           box-shadow:0 10px 40px rgba(0,0,0,0.45); padding:16px 20px; }
  /* Width is set in script, from the LONGER of the two team names, and
     the same value is given to both panels. A fixed basis alone did not
     hold: flex items default to min-width:auto, so a nowrap name wider
     than the basis simply pushed past it -- which is why the Neville
     cards started further left than the West Monroe ones. */
  .lteam { flex:0 0 108px; text-align:center; }
  .lteam img { width:62px; height:62px; object-fit:contain; display:block; margin:0 auto 6px; }
  .ltname { font-size:19px; font-weight:800; white-space:normal;
            overflow-wrap:break-word; }
  .lcards { flex:1 1 auto; display:flex; gap:10px; min-width:0; }
  .lcard { flex:1 1 0; min-width:0; background:#f4f6f9; border-radius:10px; padding:10px 12px; }
  .lcat { font-size:12.5px; font-weight:700; color:#4a5058; margin-bottom:2px; }
  /* A PLAYER NAME IS NEVER CUT. It used to be nowrap + ellipsis, so a
     long one was truncated to fit the card -- the one thing this graphic
     must not do, since the name is the reason the card exists. It wraps
     to a second line instead; the card grows, and the row grows with it. */
  .lname { font-size:17px; font-weight:800; white-space:normal;
           overflow-wrap:break-word; }
  .lval { font-size:30px; font-weight:800; line-height:1.1;
          font-variant-numeric:tabular-nums; }
  .lunit { font-size:14px; font-weight:700; color:#4a5058; margin-left:5px; }
  .lsub { font-size:13.5px; font-weight:600; color:#4a5058; }
  .lcard.empty .lnone { font-size:30px; font-weight:800; color:#b9bec6; }

  /* ---- presented by ----
     BLACK, with the white version of the mark. The first pass used a
     light bar because the colour logo's byline is black on transparent
     and would have disappeared over the programme feed; a black bar with
     the white artwork solves the same problem the other way round, and
     sits apart from the white cards below it instead of merging with
     them. */
  /* THE KNOCKOUT MARK, taken from nettech.net's own header: green
     chevron and green wordmark (#93D500) with the byline in white on a
     transparent ground. It is the file the site itself uses on both a
     light header and a dark footer, so it is the artwork as supplied
     rather than anything recoloured here.
     This replaced sponsor_nettech_white.png, which greyed the wordmark
     as well as the byline -- the green is the brand, and there was no
     reason to lose it once a knockout existed. */
  .sponsor { display:flex; align-items:center; background:#000;
             border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,0.45);
             padding:20px 26px; color:#fff; }
  #sponsorTop { margin-bottom:12px; }
  /* Equal fixed flex on the two outer zones, so the centre is the PANEL's
     centre and not the midpoint between two strings of different length. */
  /* Longhand, not the `flex` shorthand: identical in a browser, but the
     shorthand is invisible to getComputedStyle under jsdom, so a test
     asserting the two zones balance could not actually see it. */
  .spleft, .spright { flex-grow:1; flex-shrink:1; flex-basis:0;
                      font-size:15px; font-weight:700;
                      letter-spacing:0.03em; white-space:nowrap; }
  .spleft { text-align:left; }
  .spright { text-align:right; }
  .spmid { flex:0 0 auto; display:flex; align-items:center; }
  /* Height-driven, width auto: the mark is 2.52:1 and fixing the width
     would squash it the moment a different sponsor is dropped in. At 62px
     tall it runs about 156px wide, which the 640px portrait column still
     clears with the contact details either side. */
  .sponsor img { height:62px; width:auto; display:block; }
  /* Up with the bar. At the old 15px these read as captions beside a mark
     twice their height; the bar is the sponsor's, so its type should not
     look borrowed from the panel below. */
  .spleft, .spright { font-size:19px; }
  body.sponsor-none .sponsor { display:none; }

  /* ================= PORTRAIT =================
     /broadcast_stats.html?layout=portrait

     A tall narrow column instead of a full-width band, for a lower-third
     slot or a side panel rather than a full-frame graphic. Same data and
     the same DOM -- only the shape changes, so there is one renderer to
     keep correct rather than two pages that drift apart.

     The two leaders panels stack, OUR TEAM ON TOP. Side by side they were
     peers; stacked, whichever is first reads as the subject of the
     graphic, and on a Neville broadcast that is Neville -- so the order
     here is our team then the opponent, NOT visitor then home the way the
     comparison above it runs. */
  /* 820px, not 640. The header gives each side half of whatever the
     TEAM STATS block leaves, and a two-word school name did not fit what
     remained after the crest and the score took their share -- "West
     Monroe" came out as "West Mo...".
     Budgeted rather than nudged: the middle block runs about 120px and
     each side spends about 119px on padding, crest, gap and score, so the
     name gets (width - 120) / 2 - 119. At 820 that is roughly 231px,
     which carries an eighteen-character name; 640 carried eleven, and
     "West Monroe" is exactly eleven. */
  body.layout-portrait #panel { right:auto; width:820px; }
  body.layout-portrait .hteam { gap:10px; padding:11px 16px; }
  body.layout-portrait .hteam img { width:34px; height:34px; }
  body.layout-portrait .hname { font-size:20px; }
  body.layout-portrait .hpts { font-size:27px; margin-left:11px; }
  /* The middle block gives back a little of its padding: every pixel it
     drops is split between the two names either side of it. */
  body.layout-portrait .hmid { padding:0 13px; font-size:13px; letter-spacing:0.1em; }
  /* The ellipsis stays as a last resort -- a name longer than the budget
     should truncate rather than push the score off the panel -- but it
     should be reached by a genuinely long name, not an ordinary one. */
  body.layout-portrait .hname { min-width:0; }
  body.layout-portrait #rows { padding:4px 16px 10px; }
  body.layout-portrait .srow { padding:5px 0; }
  body.layout-portrait .sv { font-size:20px; flex-basis:24%; }
  body.layout-portrait .slab { font-size:11.5px; letter-spacing:0.07em; }

  body.layout-portrait #leaders { flex-direction:column; gap:10px; margin-top:10px; }
  body.layout-portrait .lside { padding:11px 14px; gap:12px; }
  body.layout-portrait .lteam { flex:0 0 84px; }
  body.layout-portrait .lteam img { width:42px; height:42px; margin-bottom:4px; }
  body.layout-portrait .ltname { font-size:15px; }
  body.layout-portrait .lcards { gap:7px; }
  body.layout-portrait .lcard { padding:7px 9px; }
  body.layout-portrait .lcat { font-size:10.5px; margin-bottom:1px; }
  body.layout-portrait .lname { font-size:13.5px; }
  body.layout-portrait .lval { font-size:22px; }
  body.layout-portrait .lunit { font-size:11px; margin-left:3px; }
  body.layout-portrait .lsub { font-size:11.5px; }
  body.layout-portrait .lcard.empty .lnone { font-size:22px; }
  body.layout-portrait .sponsor { padding:14px 16px; }
  body.layout-portrait .spleft, body.layout-portrait .spright { font-size:14px; }
  body.layout-portrait .sponsor img { height:44px; }
  body.layout-portrait #sponsorTop { margin-bottom:10px; }
</style>

<div id="panel">
  <!-- SPONSOR BAR, at the top only. The bottom banner was a comparison
       aid and is gone now the position is settled, and the words
       "presented by" went with the enlargement: at this size the mark is
       plainly a sponsor's and the caption only shrank it.
       Three zones: the web address left, the mark centred, the phone
       number right. Left and right are given equal fixed widths so the
       logo sits on the panel's true centre line -- letting the two text
       blocks size themselves would push it off centre by the difference
       between them. -->
  <div class="sponsor" id="sponsorTop">
    <span class="spleft">nettech.net</span>
    <span class="spmid">
      <img src="sponsor_nettech_knockout.png" alt="">
    </span>
    <span class="spright">318.387.0001</span>
  </div>
  <div class="card">
    <div id="head"></div>
    <div id="rows"></div>
  </div>
  <div id="leaders"></div>
</div>

<script>
  // See the note at the fetch below: an overlay is opened by vMix with
  // no session, so its key arrives in its own URL.
  const OVERLAY_KEY = new URLSearchParams(location.search).get('key') || '';
// ===================================================================
// BROADCAST OVERLAY -- GENERATED FILE, do not hand-edit.
//   regenerate: python3 tools/make_broadcast.py
//
// TEMPORARY BY DESIGN. The engine below is copied from view.html,
// making this the SIXTH copy in the repo -- the duplication TODO 8a
// exists to remove. Taken this way so an overlay could be in vMix
// today rather than after the extraction. Fold it into engine.js when
// 8a is done; do not let it drift.
//
// VMIX SETUP
//   Add Input -> Web Browser
//   URL   https://nevillestatchat.vercel.app/broadcast.html?id=<gameId>
//   Size  1920 x 1080
//   The background is transparent, so it keys straight over video.
//
//   ?layout=bug   score only, no down and distance
//   ?debug=1      solid background, to see the edges while positioning
// ===================================================================

  const SUPABASE_URL = 'https://pboushzlcyfkssojpuut.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_VGnUYurlkoH1yi67jHO6iQ_C8Q0EM2d';
  // A passive viewer (as opposed to whoever's actively typing plays) is
  // far more likely to lock their screen or background the tab between
  // checks -- and browsers, especially iOS, aggressively throttle JS
  // timers in that state. That silently breaks the realtime connection's
  // heartbeat with no visible error and no automatic recovery, which is
  // exactly what was reported: it looked like an admin-vs-viewer
  // permissions issue, but was actually just who happens to keep their
  // device active. Both mitigations below are Supabase's own documented
  // fix for this exact failure mode -- see
  // https://supabase.com/docs/guides/troubleshooting/realtime-handling-silent-disconnections-in-backgrounded-applications-592794
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    realtime: {
      worker: true,
      heartbeatCallback: (status) => {
        if (status === 'disconnected'){
          supabaseClient.realtime.connect();
        }
      }
    }
  });

  // The display is designed against a fixed 1920x1080 canvas so every font
  // size and tile dimension throughout stays correct relative to every
  // other -- rather than rewriting all of that in relative units, the
  // whole canvas is scaled up or down as a single unit to fit whatever
  // viewport is actually available, so nothing is ever clipped or forced
  // to scroll regardless of the real screen/browser size. Skipped
  // entirely below the mobile breakpoint, where the layout is already
  // its own natural, responsive, scrolling design.
  function applyDisplayScale(){
    if (window.innerWidth <= 700){
      document.querySelector('.wrap').style.transform = '';
      return;
    }
    // Scale X and Y independently -- rather than one uniform scale
    // (which forces the fixed 1920x1080 (16:9) aspect ratio and always
    // leaves wasted space on whichever axis doesn't match the actual
    // screen), this stretches the whole canvas to exactly fill
    // whatever viewport is actually available, since every real screen
    // has a different ratio. The very slight non-uniform distortion
    // this can introduce is far less noticeable than the wasted-space
    // gaps it replaces, since almost everything on this page is text,
    // tables, and tiles rather than shapes where aspect ratio matters.
    const scaleX = window.innerWidth / 1920;
    const scaleY = window.innerHeight / 1080;
    document.querySelector('.wrap').style.transform = 'scale(' + scaleX + ', ' + scaleY + ')';
  }
  // resize handler removed: fixed canvas.
  // Logos and webfonts land after first paint and change measured
  // heights, so the first fit is made on stale numbers. Re-fit once
  // everything has actually loaded.
  window.addEventListener('load', () => { if (plays.length) renderBoxScore(); });
  // applyDisplayScale() removed: no .wrap on the overlay, and vMix
  // renders at a fixed size.

  function showView(name){
    ['loading','errorView','mainView'].forEach(v => document.getElementById(v).classList.toggle('hidden', v !== name));
  }
  function showMsg(elId, text, type){
    document.getElementById(elId).innerHTML = '<div class="msg ' + type + '">' + text + '</div>';
  }

  let currentGameId = null;
  let isResultsMode = false;
  let currentGameStatus = null;
  let TEAMS = { teamA: {}, teamB: {} };
  let plays = [], startingPossession = 'teamA', quarterLengthSec = 720, gameLabel = '';

  // auth gate removed: an overlay cannot sign in. See TODO 8d.


  // A logo's two detected colors can both be dark and saturated (navy
  // and red, for instance) -- using one directly as banner text on the
  // other as background then reads as low-contrast, hard to read text,
  // even though each color individually looks fine. Checks the actual
  // luminance gap between this specific background/text pairing, and
  // only overrides to black/white when that gap is too small to read
  // comfortably -- a light background with intentionally dark text
  // stays untouched, since that's already good contrast.


  function buildTeams(game, rosterRows, ourBranding){
    const ourName = game.our_team_is_home ? game.home_team_name : game.away_team_name;
    const oppName = game.our_team_is_home ? game.away_team_name : game.home_team_name;
    // isHome, which buildTeams did NOT carry. It comes from the scoreboard
    // overlay, where nothing ever asked which side was at home -- that
    // page puts our team on the left always. This one orders the
    // comparison visitor-then-home like the recap, so without it the test
    // was inert: teamA.isHome was undefined, so Neville sat on the left of
    // every graphic including their own home games.
    TEAMS.teamA = { name: ourName, bg: ourBranding.primary_color || '#2b3440', text: ourBranding.secondary_color || '#ffffff',
      isHome: !!game.our_team_is_home,
      rosterOffense:{}, rosterDefense:{}, rosterSpecialTeams:{}, rosterUnassigned:{}, posOffense:{}, logo: ourBranding.logo_url || null };
    const oppPrimary = game.opponent_primary_color || '#6e7885', oppSecondary = game.opponent_secondary_color || '#ffffff';
    TEAMS.teamB = { name: oppName, bg: oppPrimary, text: oppSecondary,
      isHome: !game.our_team_is_home,
      rosterOffense:{}, rosterDefense:{}, rosterSpecialTeams:{}, rosterUnassigned:{}, posOffense:{}, logo: game.opponent_logo_url || null };
    // Each team's color is set independently -- nothing checks that
    // they're actually distinguishable from each other, and two
    // different schools can genuinely share a similar accent color.
    // Only the opponent's displayed color adjusts here, never our own,
    // since our identity should stay put -- first try swapping to their
    // own secondary color, since that's still genuinely their color, and
    // only fall back to a neutral tone if even that's too close.
    if (colorDistance(TEAMS.teamA.bg, TEAMS.teamB.bg) < 60){
      if (colorDistance(TEAMS.teamA.bg, oppSecondary) >= 60){
        TEAMS.teamB.bg = oppSecondary;
        TEAMS.teamB.text = oppPrimary;
      } else {
        TEAMS.teamB.bg = luminance(TEAMS.teamA.bg) > 0.5 ? '#3a3a3a' : '#c8c8c8';
        TEAMS.teamB.text = luminance(TEAMS.teamB.bg) > 0.55 ? '#1a1a1a' : '#ffffff';
      }
    }
    rosterRows.forEach(r => {
      const team = TEAMS[r.team_side];
      if (!team) return;
      if (r.unit === 'offense'){ team.rosterOffense[r.jersey_number] = r.player_name; team.posOffense[r.jersey_number] = r.position; }
      else if (r.unit === 'defense'){ team.rosterDefense[r.jersey_number] = r.player_name; }
      else if (r.unit === 'special'){ team.rosterSpecialTeams[r.jersey_number] = r.player_name; }
      // Requested directly: resolving every unrecognized-position player
      // to a unit is impractical on a large, position-less roster.
      // Still absent from the three unit-specific picker lists above --
      // there is nothing to file him under -- but named here so
      // rosterName/playerName (engine.js) can resolve him once he is
      // actually credited on a play, instead of reading as a call-up.
      else if (r.player_name){ team.rosterUnassigned[r.jersey_number] = r.player_name; }
    });
  }

  // --- Proven read-only engine core, extracted verbatim from game.html ---
function otherTeam(t){ return t === 'teamA' ? 'teamB' : 'teamA'; }
const TIMEOUTS_PER_HALF = 3;
const TIMEOUTS_PER_OT = 1;
// Administrative entries -- clock markers, quarter/half dividers, manual
// possession flips -- are announcements, not football plays. They carry
// no roles and no yardage, so anything reasoning about "what actually
// happened on this drive" has to skip them.
//
// isReset markers are deliberately NOT administrative: they are explicit
// "new drive" announcements and are valid drive starts.
//
// Lives in the engine core (top level) rather than inside
// findDriveStarts because computeDriveSummary needs it too, from a
// different scope.
// Bookkeeping the drive tiles do not need. These are entries the app
// writes to keep its own state straight -- clock events, chain
// corrections, the direction arrow -- rather than things that happened on
// the field. The tiles are for reading at a glance, so they are dropped
// there; the ALL PLAYS list is the audit trail and keeps everything.
//
// Deliberately KEPT: penalties and timeouts (real events), quarter
// markers, overtime markers, dividers, and "New series" -- which looks
// like "New drive" but means something different: a muffed kick
// recovered by the kicking team, a fresh set of downs with no change of
// possession. Manual entry NOTEs are kept too; a coach typed those on
// purpose. Only the two "Manual ..." state overrides are dropped.
function isDriveTileNoise(p){
  if (!p || p.isDivider) return false;
  const e = p.effect || {};
  if (e.clockEvent) return true;
  if (e.setDirection) return true;
  const t = (p.text || '').trim();
  if (t.indexOf('Down & distance adjusted') === 0) return true;
  if (t.indexOf('New drive') === 0) return true;
  if (t.indexOf('Manual flip') === 0) return true;
  if (t.indexOf('Manual score adjust') === 0) return true;
  return false;
}
function isAdminMarker(p){
  if (!p) return true;
  const e = p.effect || {};
  if (e.isReset) return false;
  // e.timeout added 19 Aug 2026: a timeout call has no bearing on
  // possession or drive state at all, but was never in this list --
  // so findDriveStarts treated it as a real play, and a timeout called
  // between a defensive score and its own PAT became the target a
  // phantom drive boundary landed on, registering an unearned
  // possession for the scoring team. Reported from a real game.
  return !!(e.clockEvent || e.setQuarter || e.forcePossession || e.timeout || p.isDivider);
}

// Jersey numbers resolve across ALL THREE roster units, not just the one
// the play type implies. High-school rosters routinely list a player
// under a single unit even though they play several, and a dedicated
// kick/punt returner is normally rostered on special teams only -- which
// is why returners used to render in the log as a bare "#25".
//
// A fallback can only ever turn "#25" into a name; it can never change a
// name that already resolved, because the expected unit is always
// searched first. This mirrors playerName() in the report pages.




function ordinal(n){ return n===1?'1st':n===2?'2nd':n===3?'3rd':n===4?'4th':(n+'th'); }
function clockToAbsSeconds(quarter, clockStr){
  let m = clockStr.match(/^(\d{1,2}):(\d{2})$/);
  let mins, secs;
  if (m){
    mins = parseInt(m[1]); secs = parseInt(m[2]);
  } else {
    // Colon-less entry: last two digits are seconds, everything
    // before that is minutes -- e.g. "1156" reads the same as
    // "11:56" would, "56" alone reads as "0:56". Requires at least
    // two digits so this split is never ambiguous.
    m = clockStr.match(/^(\d*)(\d{2})$/);
    if (!m) return null;
    mins = m[1] ? parseInt(m[1]) : 0; secs = parseInt(m[2]);
  }
  if (secs > 59) return null;
  const remaining = mins * 60 + secs;
  // A clock value can never show more time than the quarter itself
  // holds -- e.g. "15:00" is meaningless in a 12-minute quarter.
  if (remaining > quarterLengthSec) return null;
  return (quarter - 1) * quarterLengthSec + (quarterLengthSec - remaining);
}
function formatDuration(sec){
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function readFileAsDataURL(file){

function posToUnit(pos){
  if (!pos) return null;
  const first = String(pos).toUpperCase().split(/[\/,\s]+/)[0];
  if (SPECIAL_POS.has(first)) return 'st';
  if (OFFENSE_POS.has(first)) return 'o';
  if (DEFENSE_POS.has(first)) return 'd';

function extractNameTag(rawName){
  const m = String(rawName).match(/\(\s*(O|D|ST)\s*\)\s*$/i);
  if (!m) return { cleanName: String(rawName).trim(), explicitUnit: null };
  const tag = m[1].toUpperCase();
  const cleanName = String(rawName).slice(0, m.index).trim();
  return { cleanName, explicitUnit: tag.toLowerCase() };
}

  function renderBoxScore(){
    const box = computeBoxScore(plays);
    const a = renderTeamBoxScore('teamA', box);
    const b = renderTeamBoxScore('teamB', box);
    const quadBL = document.getElementById('quadBL'), quadBR = document.getElementById('quadBR');
    quadBL.style.setProperty('--stat-scale', 1);
    quadBR.style.setProperty('--stat-scale', 1);
    document.getElementById('boxScoreTeamA').innerHTML = a.html;
    document.getElementById('boxScoreTeamB').innerHTML = b.html;

    // Measure real rendered height at scale 1, then compute the scale
    // that actually fills the available space -- growing when there's
    // room to spare (a team with modest stats shouldn't render small
    // and leave the rest of the quadrant empty), shrinking when there's
    // more content than fits. Both sides use the same scale so neither
    // panel looks visually denser or sparser than its sibling.
    // offsetHeight, NOT getBoundingClientRect(). The whole page sits
    // inside a `transform: scale()` wrapper, and getBoundingClientRect
    // returns the VISUAL box -- already multiplied by that transform --
    // while clientHeight and scrollHeight return the unscaled layout
    // box. Mixing the two made availableHeight too generous by exactly
    // the display scale factor, so --stat-scale came out too large and
    // the content overflowed its quadrant. At 1920x1080 the transform
    // is 1:1 and the bug is invisible, which is why it looked like it
    // "sometimes worked".
    const availableHeight = (quad) => {
      const header = quad.querySelector('h2');
      const headerH = header ? header.offsetHeight + 10 : 0;
      return quad.clientHeight - headerH - 16;
    };
    const contentHeight = (id) => document.getElementById(id).scrollHeight;
    // A 4% safety margin. The fit is computed from measurements taken
    // before the browser has finished reflowing at the new scale, so
    // landing exactly on the available height reliably overshoots by a
    // pixel or two -- which is all it takes to get a scrollbar.
    const FIT_MARGIN = 0.96;
    // Growth is allowed but capped well below the old 2.2. Enlarging a
    // table does not increase its height proportionally -- columns
    // re-wrap and rows gain padding -- so a scale derived from
    // measurements taken at 1.0 overshoots, and the error compounds the
    // further it grows. At 2.2 that overshoot produced scrollbars and
    // clipped rows; a modest ceiling keeps the prediction close enough
    // for the refinement loop below to correct the remainder.
    const MAX_GROW = 1.5;
    const scaleFor = (avail, content) => {
      if (content <= 0) return 1;
      return Math.min(MAX_GROW, Math.max(0.5, (avail / content) * FIT_MARGIN));
    };
    const availA = availableHeight(quadBL), availB = availableHeight(quadBR);
    let scale = Math.min(scaleFor(availA, contentHeight('boxScoreTeamA')),
                         scaleFor(availB, contentHeight('boxScoreTeamB')));
    quadBL.style.setProperty('--stat-scale', scale);
    quadBR.style.setProperty('--stat-scale', scale);

    // Scaling text does not change height linearly -- lines re-wrap and
    // line heights round to whole pixels -- so one pass can still
    // overshoot. Re-measure and back off until it genuinely fits.
    for (let i = 0; i < 8; i++){
      // Measure against the margin, not the raw height, so the loop
      // stops slightly short of the edge rather than flush against it.
      const targetA = availA * FIT_MARGIN, targetB = availB * FIT_MARGIN;
      const overA = contentHeight('boxScoreTeamA') - targetA;
      const overB = contentHeight('boxScoreTeamB') - targetB;
      if (overA <= 0 && overB <= 0) break;
      const worst = Math.max(overA / targetA, overB / targetB);
      scale = Math.max(0.5, scale * (1 - Math.min(0.2, worst)));
      quadBL.style.setProperty('--stat-scale', scale);
      quadBR.style.setProperty('--stat-scale', scale);
    }
  }

      ['Pass Yards', passYds],
      ['Rush Yards', rushYds],
      // An em dash, not 0:00, when no clock was entered: a zero reads as
      // "they never had the ball" rather than "nobody recorded it".
      ['Time of Possession', top ? formatDuration(top) : '\u2014'],
      ['Turnovers', turnovers[teamKey] || 0],
      ['3rd Down', own.d3Pct !== null ? own.d3conv + '/' + own.d3att + ' (' + own.d3Pct + '%)' : '\u2014']
    ];
  }

  // Same three categories and the same sub-lines as the recap card, so a
  // viewer who sees both does not meet two different answers.
  const LEADER_CATS = [
    { key: 'passing',   label: 'Passing leader',
      sub: d => (d.comp || 0) + '/' + (d.att || 0) + ', ' + (d.td || 0) + ' TD' },
    { key: 'rushing',   label: 'Rushing leader',
      sub: d => (d.att || 0) + ' att, ' + (d.td || 0) + ' TD' },
    { key: 'receiving', label: 'Receiving leader',
      sub: d => (d.rec || 0) + ' rec, ' + (d.td || 0) + ' TD' }
  ];

  function leaderCards(teamKey, box){
    return LEADER_CATS.map(cat => {
      const bucket = box[teamKey][cat.key] || {};
      // A LEADER MUST BE A PLAYER. TEAM is a bookkeeping bucket (sack
      // yardage, kneels) and Unknown is a completion whose receiver was
      // never recorded -- neither is somebody a commentator can name, and
      // Unknown would take the card on exactly the play nobody
      // identified. Excluded rather than sorted last: picking a single
      // winner from a list of one still leaves it on top.
      const nums = Object.keys(bucket).filter(n => n !== 'TEAM' && n !== 'Unknown');
      if (!nums.length){
        return '<div class="lcard empty"><div class="lcat">' + cat.label + '</div>' +
               '<div class="lnone">\u2014</div></div>';
      }
      const key = nums.slice().sort((a, b) => (bucket[b].yds || 0) - (bucket[a].yds || 0))[0];
      const d = bucket[key];
      // Keyed by DISPLAY NAME already -- computeBoxScore resolves each
      // bucket key to the player's name, or '#44' where nobody was
      // recorded. Passing it through a number lookup is what once put a
      // hash in front of every man's name on the recap.
      return '<div class="lcard">' +
        '<div class="lcat">' + cat.label + '</div>' +
        '<div class="lname">' + key + '</div>' +
        '<div class="lval">' + (d.yds || 0) + '<span class="lunit">yds</span></div>' +
        '<div class="lsub">' + cat.sub(d) + '</div>' +
      '</div>';
    }).join('');
  }

  function renderAll(){
    const state = computeState(plays);
    const box = computeBoxScore(plays);
    const turnovers = countTurnovers(plays);

    // VISITOR ON THE LEFT, home on the right -- the order every scoreboard
    // and every report in this app already uses.
    const visitorKey = TEAMS.teamA.isHome ? 'teamB' : 'teamA';
    const homeKey    = TEAMS.teamA.isHome ? 'teamA' : 'teamB';

    const headSide = (k) => {
      const t = TEAMS[k];
      return '<div class="hteam" style="background:' + (t.bg || '#1a1a2e') + '; color:' +
        safeText(t.bg, t.text) + ';">' +
        (t.logo ? '<img src="' + String(t.logo).replace(/"/g, '&quot;') + '" alt="">' : '') +
        '<span class="hname">' + t.name + '</span>' +
        '<span class="hpts">' + (state.scores[k] || 0) + '</span></div>';
    };
    document.getElementById('head').innerHTML =
      headSide(visitorKey) + '<div class="hmid">TEAM STATS</div>' + headSide(homeKey);

    const vRows = statRowsFor(visitorKey, box, state, turnovers);
    const hRows = statRowsFor(homeKey, box, state, turnovers);
    document.getElementById('rows').innerHTML = vRows.map((r, i) =>
      '<div class="srow"><span class="sv">' + r[1] + '</span>' +
      '<span class="slab">' + r[0] + '</span>' +
      '<span class="sv">' + hRows[i][1] + '</span></div>').join('');

    // PORTRAIT STACKS OUR TEAM FIRST. Side by side the two panels are
    // peers and visitor-then-home is the right order, matching the
    // comparison above. Stacked, the top one reads as the subject of the
    // graphic -- so on a Neville broadcast Neville goes there, whether
    // they are at home or away that week.
    const portrait = new URLSearchParams(window.location.search).get('layout') === 'portrait';
    const ldSide = (k) => {
      const t = TEAMS[k];
      return '<div class="lside">' +
        '<div class="lteam">' +
          (t.logo ? '<img src="' + String(t.logo).replace(/"/g, '&quot;') + '" alt="">' : '') +
          '<div class="ltname">' + t.name + '</div>' +
        '</div>' +
        '<div class="lcards">' + leaderCards(k, box) + '</div>' +
      '</div>';
    };
    document.getElementById('leaders').innerHTML = portrait
      ? ldSide('teamA') + ldSide('teamB')
      : ldSide(visitorKey) + ldSide(homeKey);

    // ONE COLUMN WIDTH FOR BOTH PANELS, sized to the longer name so
    // neither is cut. Measured from the name lengths rather than from
    // the rendered boxes: reading offsetWidth here would mean laying out,
    // writing, and laying out again on every poll, and the two panels
    // would disagree for a frame each time.
    const longest = Math.max((TEAMS.teamA.name || '').length,
                             (TEAMS.teamB.name || '').length);
    const perChar = portrait ? 8.4 : 10.6;   // 15px and 19px at weight 800
    const col = Math.max(portrait ? 84 : 108, Math.round(longest * perChar) + 10);
    document.querySelectorAll('#leaders .lteam').forEach(el => {
      el.style.flexBasis = col + 'px';
      el.style.width = col + 'px';
    });

    document.getElementById('panel').style.display = 'block';
    const p = new URLSearchParams(window.location.search);
    document.body.classList.toggle('layout-portrait', portrait);
    // THE SPONSOR BAR IS OFF UNTIL THE SERVER SAYS OTHERWISE.
    // ------------------------------------------------------------------
    // The banner is hardcoded to one school's sponsor -- a domain, a logo
    // and a phone number -- and was shipping to every tenant. Another
    // school's broadcast should not be carrying it.
    //
    // It used to be ON by default with ?sponsor=none to remove it. That is
    // the wrong way round for a multi-tenant product, and the obvious
    // inversion -- off by default, ?sponsor=nettech to show it -- would
    // only HIDE it: anyone who saw the parameter could put that sponsor on
    // their own overlay.
    //
    // So the decision is made server-side. api/gamedata.js resolves the
    // tenant FROM THE OVERLAY KEY, which is the only identity a vMix
    // browser source has, and returns sponsorBar. Applied in
    // fetchAndRender when that answer arrives; until then the class stays
    // on, so the bar cannot flash up on a tenant that should never see it.
    document.body.classList.add('sponsor-none');
    document.body.classList.toggle('debug', p.get('debug') === '1');
  }

  // ---- boot ---------------------------------------------------------
  // Everything comes from /api/gamedata, which reads server-side with the
  // service key. The overlay cannot query Supabase directly: it has no
  // session, and every RLS policy requires one.
  //
  // POLLING, not realtime. Supabase realtime also needs a session, so the
  // overlay re-fetches on an interval instead. Two seconds is well inside
  // what a scoreboard needs and is trivial load for one game.
  const POLL_MS = 2000;

  // SILENT ON AIR by design: an overlay that prints an error puts that
  // error on the broadcast. ?debug=1 says what happened -- vMix never has
  // that parameter, a person testing the address in a browser does.
  function showFatal(msg){
    const p = document.getElementById('panel');
    if (p) p.style.display = 'none';
    if (new URLSearchParams(window.location.search).get('debug') !== '1') return;
    document.body.innerHTML =
      '<p style="position:absolute;left:40px;bottom:40px;margin:0;color:#fff;' +
      'background:#8a1414;padding:14px 20px;border-radius:6px;' +
      'font:500 20px sans-serif;">' + msg + '</p>';
  }

  async function fetchAndRender(){
    // THE KEY TRAVELS IN THIS PAGE'S OWN URL. An overlay is a browser
    // source in vMix: it has no session, so it cannot ask who it is.
    // Since 010 the API requires a per-tenant key, and the only place
    // this page can get one is the address it was opened with — the same
    // way the raw feed URLs carry theirs.
    //
    // MISSED WHEN 010 LANDED: the endpoints were scoped and the three
    // pages that CALL them were not, so every overlay returned 401 while
    // the feed URLs worked. Scoping an endpoint is half the job; finding
    // its callers is the other half.
    const qs = [];
    if (currentGameId) qs.push('id=' + encodeURIComponent(currentGameId));
    if (OVERLAY_KEY)   qs.push('key=' + encodeURIComponent(OVERLAY_KEY));
    const r = await fetch('/api/gamedata' + (qs.length ? '?' + qs.join('&') : ''),
      { cache: 'no-store' });
    if (!r.ok){
      const body = await r.json().catch(() => ({}));
      throw new Error(body.error || ('HTTP ' + r.status));
    }
    const d = await r.json();
    startingPossession = d.game.starting_possession || 'teamA';
    quarterLengthSec   = d.game.quarter_length_seconds || 720;
    buildTeams(d.game, d.roster || [], d.ourBranding || {});
    // Only a literal true shows it. An older API that does not send the
    // field, or a failed request, leaves the bar hidden -- which is the
    // safe direction: a missing answer must not reveal another school's
    // sponsor.
    document.body.classList.toggle('sponsor-none', d.sponsorBar !== true);
    plays = (d.plays || []).map(p => ({
      id: p.id, seq: p.sequence_number, text: p.text,
      effect: p.effect || {}, roles: p.roles || null,
      team: p.team_side, quarter: p.quarter,
      isDivider: !!p.is_divider, unresolved: !!p.unresolved
    }));
    renderAll();
  }

  async function initOverlay(){
    const params = new URLSearchParams(window.location.search);
    // An id is OPTIONAL now. Without one, /api/gamedata resolves the game
    // set ON AIR -- which is the whole point of the flag, and means the
    // overlay address never needs editing. The old behaviour was a
    // leftover from before the flag existed, and produced
    // "No game id" for anyone who used the address as given.
    currentGameId = params.get('id') || '';
    try {
      await fetchAndRender();
    } catch (e){
      showFatal('Could not load the game: ' + e.message);
      return;
    }
    // A later failure must not blank a working scoreboard -- keep showing
    // the last good state and try again on the next tick.
    setInterval(() => { fetchAndRender().catch(() => {}); }, POLL_MS);
  }
  initOverlay();

</script>
</body>
</html>
