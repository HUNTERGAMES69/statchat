          if (!cand || cand.isDivider || isDriveTileNoise(cand)) continue;
          picked.unshift(cand);
          const e = cand.effect || {};
          const pt = (cand.roles || {}).playType;
          // The anchor: the kick that began the sequence, or the play
          // that scored it. Anything after it (a try, a timeout) is
          // carried along with it.
          if (pt === 'kickoff' || pt === 'kickoff_return' ||
              (e.score && e.score.points === 6)) break;
          // A guard, not a feature: without a kick or a score behind it
          // this is an unusual log, and walking the whole game backwards
          // to fill a tile is not worth it.
          if (picked.length >= 3) break;
        }
        if (picked.length) currentDriveDisplayList = picked.concat(currentDriveDisplayList);
      }
      // THE SECOND HALF HAS BEEN STARTED BUT NOTHING HAS HAPPENED IN IT.
      // ----------------------------------------------------------------
      // Between "Start 2nd half" and the kickoff there is no drive and no
      // play, but every figure on this card still described the FIRST
      // half: the tiles carried the last first-half drive's rushes and
      // yards, the down line read the spot the half ended on, and
      // Previous Drive showed a punt from minutes earlier. All of it true
      // once and none of it true now.
      //
      // The half boundary is the honest reset point, so the card says
      // where the game is and nothing else until the kickoff lands.
      // secondHalfPending is defined up with the banner -- one definition,
      // so the banner and these cards can never disagree about whether
      // the half has actually begun.
      // Declared outside the branch: paintDrive() colors both cards from
      // these further down, and scoping them to the else left it reading
      // an undefined name the moment the start-of-half state was hit.
      let currentSummary = null;
      if (secondHalfPending){
        const q = (state.quarter && state.quarter >= 3) ? state.quarter : 3;
        document.getElementById('driveLogScroll').innerHTML =
          '<div style="font-size:36px; font-weight:700; color:#eef1f4; line-height:1.2; ' +
          'margin-top:16px;">Start of Q' + q + '</div>';
        document.getElementById('currentDriveTiles').innerHTML = '';
        // The series tiles render EMPTY here rather than being blanked,
        // for the same reason the penalties tile lists both teams at
        // zero: the grid holding its shape across a state change is the
        // whole point of a fixed height. Blanking it would collapse the
        // quad between "Start 2nd half" and the kickoff and pop it back.
        document.getElementById('seriesTiles').innerHTML = renderSeriesTiles([], null);
      } else {

      document.getElementById('driveLogScroll').innerHTML =
        renderCurrentDriveLastPlay(currentDriveDisplayList, state, distDisplay, driveThisHalf);

      // Same floor as the log above, for the same reason: the numbers and
      // the play they sit over have to describe the same stretch of game.
      currentSummary = driveFloor >= 0
        ? computeDriveSummary(driveFloor, plays.length)
        : null;
      document.getElementById('currentDriveTiles').innerHTML = currentSummary
        ? '<div class="inline-stat-line">' + [
            ['RUSH', currentSummary.rushes + '/' + currentSummary.rushYds],
            ['PASS', currentSummary.passes + '/' + currentSummary.passYds],
            ['TOTAL', currentSummary.totalPlays + '/' + currentSummary.totalYds],
            // Requested directly: while the drive is still open (no
            // closing clock event yet for driveTeam), this tile reads
            // SOP -- the clock exactly as the scorer logged it at the
            // START of the possession, not a computed duration, since
            // there isn't one yet. The moment a closing clock value is
            // entered, pendingClockStart[driveTeam] resets to null on
            // its own (see engine.js's computeState) and this reverts
            // to TOP with the real elapsed time, unchanged from before.
            //
            // The TILE matches its three neighbours; only the LABEL is
            // marked. It used to be amber all over, which made the whole
            // quad look uneven for something that is simply a fourth
            // reading — and the amber sat behind the CLOCK VALUE too,
            // tinting the one part of the tile that is a plain fact.
            //
            // What actually needs saying is that SOP is not the same kind
            // of number as TOP: it is where the possession started, not
            // how long it has run. So the badge goes on the label, which
            // is the word that changes between the two states, and the
            // value is left to read as the clock reading it is.
            (function(){
              const pending = (state.pendingClockStart || {})[driveTeam];
              if (pending !== null && pending !== undefined){
                const clk = absSecToClockStr(pending);
                return ['Started', clk ? clk.text : '—', true];
              }
              return ['TOP', formatDuration(currentSummary.top), false];
            })()
          ].map(([label, val]) => '<span class="inline-stat-item">' +
              '<span class="stat-value">' + val + '</span>' +
              // NO BADGE. The label used to be boxed in amber to say that
              // this reading is a different KIND of number from TOP -- where
              // the possession started rather than how long it has run. The
              // word "Started" says that on its own, so the box was carrying
              // meaning the text now carries, and it was the only label on
              // the row wearing a color. Andy's call, 25 Aug.
              '<span class="stat-label">' + label + '</span></span>').join('') + '</div>'
        : '';

      // THIS SERIES, from the SAME slice the card above renders from.
      // ----------------------------------------------------------------
      // currentDrivePlays, not a second walk of `plays` with its own idea
      // of where the drive began. The half-clamp reasoning, the reset
      // markers, the onside-kick case and the period boundaries are all
      // already settled in findDriveStarts and read once at driveFloor;
      // re-deriving the boundary here is exactly the "second copy that
      // does not announce itself until the two disagree" shape that put
      // three different team-defense totals on three surfaces.
      //
      // Deliberately NOT currentDriveOwnTeamPlays: that list is filtered
      // for DISPLAY (it keeps the other team's scoring play, drops their
      // kickoff) and its membership rules are about what belongs in a
      // play log. These tiles count events, and the team test each tile
      // needs differs per tile -- penalties are stamped with the
      // penalized team, a sack is charged to the passer's team. Each one
      // asks the play directly.
      document.getElementById('seriesTiles').innerHTML =
        renderSeriesTiles(currentDrivePlays, driveTeam);
      }

      // AT HALFTIME AND FINAL, THE SCORING SUMMARY TAKES THE QUAD.
      // ----------------------------------------------------------------
      // Requested directly. Neither drive card says anything useful at
      // those two moments -- there is no current drive, and the previous
      // one is a single play from minutes ago -- while the question a
      // spectator actually arrives with is how the score got there.
      //
      // Reads the same `phase` the banner does, so the three can never
      // disagree about what moment this is. NOT shown for 'NOT STARTED':
      // that state already hands the bottom-left tile to season stats,
      // and an empty Scoring card would say nothing at all.
      // AT FINAL THE QUAD JUST SAYS SO. The scoring summary earns its
      // place at the interval, when the question is how the score got
      // there and there is a second half still to come. Once the game is
      // over that question is answered by the recap, and a spectator
      // arriving at a finished stream wants one thing from this quarter
      // of the screen: whether it is over. Reported directly.
      const isFinal = phase === 'FINAL';
      const showScoring = phase === 'HALFTIME';
      const scoringCard = document.getElementById('scoringCard');
      document.querySelectorAll('#quadTR .drive-current, #quadTR .series-card')
        .forEach(el => { el.style.display = (showScoring || isFinal) ? 'none' : ''; });
      scoringCard.style.display = (showScoring || isFinal) ? '' : 'none';
      if (isFinal){
        document.getElementById('scoringHeading').textContent = '';
        document.getElementById('scoringBody').innerHTML =
          '<div style="display:flex; align-items:center; justify-content:center; height:100%; ' +
          'min-height:120px; font-size:44px; font-weight:800; letter-spacing:0.08em; ' +
          'color:#eef1f4;">GAME FINAL</div>';
      } else if (showScoring){
        document.getElementById('scoringHeading').textContent =
          phase === 'HALFTIME' ? 'Scoring — first half' : 'Scoring — final';
        const rows = scoringSummary(plays);
        // WHO KICKS OFF NEXT, under the scoring rows. Halftime only: at
        // FINAL there is no next kickoff, and at NOT STARTED the opening
        // kickoff has not been chosen yet.
        const kickLine = (phase === 'HALFTIME' && secondHalfKicker && TEAMS[secondHalfKicker])
          ? '<div style="margin-top:18px; padding-top:14px; border-top:1px solid var(--sc-rule); ' +
            'font-size:20px; font-weight:800;">' + TEAMS[secondHalfKicker].name +
            ' kicks off</div>'
          : '';
        document.getElementById('scoringBody').innerHTML = (rows.length
          ? rows.map(r => {
              const t = TEAMS[r.team] || {};
              const bg = t.bg || '#1a1a2e';
              return '<div class="score-row">' +
                '<span class="score-q">' + (r.quarter >= 5 ? 'OT' : 'Q' + r.quarter) + '</span>' +
                  // A SPINE, NOT A FILL -- the same rule as the team summary
                  // header and the box-score headings. The color comes from
                  // the database, so a pale primary fills a bright block into
                  // a dark card, and safeTextColor then flips the label to
                  // near-black -- leaving the two teams' rows with different
                  // contrast. As an edge it works for every color a school
                  // might pick. These rows only render at HALFTIME and FINAL,
                  // which is why the pattern survived here.
                  '<span class="score-team" style="background:#171d25; color:var(--v-paper); ' +
                    'border-left:4px solid ' + bg + '; border-radius:0 5px 5px 0;">' +
                    (t.name || '') + '</span>' +
                '<span class="score-text">' + r.text +
                  (r.detail ? '<span class="score-detail">(' + r.detail + ')</span>' : '') + '</span>' +
                // The running score after this play, which is the column a
                // spectator scans -- the play text alone does not say
                // whether it tied the game or extended a lead.
                '<span class="score-tally">' + r.teamA + '&ndash;' + r.teamB + '</span>' +
                '</div>';
            }).join('')
          : '<div style="color:#8d99a6; padding:14px 0;">no scoring yet</div>') + kickLine;
      }

      // COLOR EACH DRIVE CARD FOR THE TEAM THAT HAD THE BALL.
      // ----------------------------------------------------------------
      // The accent bar and the heading take the team's own color; the
      // stat chips take a pale mix of it toward white. Set as custom
      // properties so the CSS above keeps its fallbacks -- before the
      // first drive exists there is no team to color for, and the card
      // should not flash an undefined value.
      //
      // The heading goes through safeTextColor against WHITE, not against
      // the tint: it sits on the card, and a pale gold team color is
      // perfectly readable on its own chips while being invisible as text
      // on a white card.
      const paintDrive = (sel, summary) => {
        const card = document.querySelector(sel);
        if (!card) return;
        const teamKey = summary && summary.team;
        const bg = teamKey && TEAMS[teamKey] && TEAMS[teamKey].bg;
        if (!bg){
          ['--drive-accent', '--drive-heading', '--drive-tint']
            .forEach(v => card.style.removeProperty(v));
          return;
        }
        card.style.setProperty('--drive-accent', bg);
          // AGAINST THE CARD, NOT AGAINST WHITE. safeTextColor('#ffffff', bg)
          // asks "what reads on a white background" -- so for a dark team
          // color it returned that color unchanged, and the drive heading
          // came out near-black on a #191f27 card. Only visible at HALFTIME
          // and FINAL alongside the rest of this block, which is why it
          // survived the conversion.
          card.style.setProperty('--drive-heading', safeTextColor('#191f27', bg));
          // Same reason as the leader tint above: toward the card, not away
          // from it. This one feeds --drive-tint, the chip background in the
          // drive cards.
        card.style.setProperty('--drive-tint', mixHex(bg, '#191f27', 0.82));
      };
      // ONLY THE CURRENT DRIVE CARD IS PAINTED NOW. The series card takes
      // no team color on purpose: penalties list BOTH teams inside one
      // tile, so a single team accent on the card would be a claim the
      // contents contradict.
      paintDrive('.drive-current', currentSummary);
    } else {
      document.getElementById('allPlaysScroll').innerHTML = renderLogLines(plays.slice().reverse()) || '<div style="color:#8d99a6;">No plays recorded.</div>';
    }

    renderTeamSummary();
    renderBoxScore();
    if (!isResultsMode) adjustDriveCardVisibility();
  }

  // THE SERIES CARD IS NO LONGER AN EVICTION CANDIDATE. 30 Aug 2026.
  // -------------------------------------------------------------------
  // Andy's rule, reported from a live screen: the tiles are part of the
  // current drive readout and must live and die with it -- everything in
  // this quad changes and resets together. Hiding them mid-drive makes
  // the quad look broken, because the data they describe is still on
  // screen right above them.
  //
  // WHAT IT COST TO KEEP THEM: 5px. A touchdown headline wraps to two
  // lines at 36px, and the PAT sub-line under it adds 36px more, which
  // took quadTR from 524px of content to 529px in a 524px box. The old
  // rule then dropped the whole 236px tile card to recover five
  // pixels. Measured, not guessed -- the reported case reproduces at
  // exactly 529 vs 524.
  //
  // So the element that yields is now the one whose height actually
  // VARIES. The tile card is a fixed 236px by construction; the play
  // text is anything from one line to three. It yields by clamping,
  // which costs the bottom few pixels of the last line in the rare
  // case, instead of by removing four facts from the screen in the
  // common one.
  //
  // The .series-card top margin also came down 14px -> 8px, which is
  // enough on its own that the reported touchdown-plus-PAT case now
  // fits with a pixel to spare and never clamps at all. That trim is
  // NOT the fix -- a longer pair of names still wraps to three lines
  // and overflows again. The clamp is the fix; the trim just keeps the
  // common case pixel-clean.
  function adjustDriveCardVisibility(){
    const quad = document.getElementById('quadTR');
    const seriesCard = document.getElementById('seriesCard');
    const driveLog = document.getElementById('driveLogScroll');
    if (!quad || !seriesCard || !driveLog) return;

    // Always start from unclamped and fully visible, so the card
    // recovers its full height once there is room again -- after an Undo
    // shortens the current drive, or when a two-line play text becomes
    // one. Without this reset the clamp would ratchet down and never
    // come back up.
    // Always start from every line shown and the card visible, so the
    // display recovers in full once there is room again -- after an Undo
    // shortens the current drive, or when a two-line play text becomes
    // one. Without this reset the degrade would ratchet and never come
    // back up.
    seriesCard.classList.remove('hidden');
    const kids = Array.prototype.slice.call(driveLog.children);
    kids.forEach(k => { k.style.display = ''; });
    if (quad.scrollHeight <= quad.clientHeight) return;

    // WHOLE LINES, DROPPED FROM THE BOTTOM.
    // -----------------------------------------------------------------
    // driveLogScroll's children are discrete lines, emitted in this
    // order: the play text, the try result, the down and distance, then
    // any timeouts. Reverse order is already ascending order of
    // importance, so dropping from the end sheds the least useful line
    // first. Re-measured after each one, so it removes the minimum
    // number rather than a guessed block.
    //
    // NOT a max-height clamp, which was the first attempt and is worth
    // recording: overflow:hidden establishes a new block formatting
    // context, which STOPS the play text's 16px top margin collapsing
    // out through driveLogScroll. The element grows 16px the instant
    // the clamp lands, so a cut measured beforehand falls 16px high and
    // slices a line through the middle -- and the 16px it adds is
    // overflow that then has to be paid for out of the same budget.
    // Dropping children needs no overflow property, so none of that
    // applies.
    //
    // `i >= 2` deliberately, and this is the second correction to this
    // rule. The first version protected only the play text, and Andy
    // reported the consequence immediately: the tiles stayed but the
    // "Trey Johnson PAT — GOOD" line went instead. The try result is
    // the CONFIRMATION that the entry landed -- it is the reason a
    // scorer looks at this card after a score at all, and it is not
    // available anywhere else on the crew view at a glance.
    //
    // So the first two children -- the play text and the try line --
    // are both off limits. Only the down-and-distance line and any
    // timeouts can be shed, and the 28px freed by the 96px tiles above
    // means it is rare that even those have to go.
    //
    // If it still does not fit after everything droppable is gone, the
    // quad clips at its own edge. That is the honest floor: nothing in
    // this function is qualified to choose between the play, the score
    // it produced, and the four tiles.
    for (let i = kids.length - 1; i >= 2; i--){
      if (quad.scrollHeight <= quad.clientHeight) break;
      kids[i].style.display = 'none';
    }
  }

  // HOISTED TO TOP LEVEL, 19 Aug 2026 -- this used to be a private
  // helper nested inside renderAll(), which is fine as long as only
  // renderAll ever calls it. renderDriveSummary (Previous Drive's own
  // full play log, added the same night; removed 30 Aug 2026 with the
  // card itself) needed it too, and a function declared inside another
  // function is invisible outside it -- calling
  // it from renderDriveSummary threw "renderLogLines is not defined" in
  // the real page even though an isolated test of both functions
  // together passed cleanly, because extracting them side by side into
  // one flat script accidentally recreated the very scope they don't
  // share on the real page. Caught by the full test suite booting the
  // actual page, not by the isolated one.
  function renderLogLines(list, highlightFirst){
    let marked = false;
    // A touchdown or a made field goal is bold on sight, not just
    // whichever play happens to be most recent -- Andy asked for
    // this specifically, 19 Aug 2026. Same detection computeDriveSummary
    // uses for scoringPlayText -- and the SAME bug this function had,
    // found by a systematic audit rather than another live-game report:
    // effect.td is never set by a blocked kick, an interception, or a
    // fumble returned for a touchdown -- only effect.score.points: 6
    // is. Every one of those thirteen-plus branches has been bold-
    // eligible in NAME since the feature shipped and never once
    // actually bold, because this check could not see them. points
    // === 6 is unambiguous in football regardless of the mechanism
    // that scored it. Deliberately NOT every scoring play -- a PAT, a
    // 2-point try and a safety were not asked for, and neither is 6
    // points, so none of them match this check either.
    const isTdOrFg = (p) => {
      if (p.effect && p.effect.score && p.effect.score.points === 6) return true;
      const r = p.roles;
      return !!(r && r.playType === 'fg' && r.kicker && r.kicker.result === 'g');
    };
    return list.map(p => {
      if (p.isDivider) return '<div style="text-align:center; font-size:14px; font-weight:600; color:#888; margin:8px 0; border-top:1px dashed var(--sc-rule); padding-top:6px;">' + p.text + '</div>';
      // A play in overtime is tagged OT, not Q5. The banner already
      // said OT while every row beneath it said Q5, which is the same
      // period under two names on one screen.
      //
      // Rounds are deliberately NOT numbered here: the tag is per PLAY
      // and quarterLabel counts series up to the CURRENT state, so
      // numbering a play from it would relabel the whole log every time
      // a new series began. Which OT round is on the banner; the row
      // only has to say it was overtime.
      const qtag = p.quarter
        ? '<span style="color:#8d99a6; font-size:12px; margin-right:6px;">' +
          (p.quarter >= 5 ? 'OT' : 'Q' + p.quarter) + '</span>'
        : '';
      // THE CLOCK ON A SCORING PLAY, 30 August 2026. Same rule and same
      // source as the entry page's own log -- isStampableScore and
      // scoreStamp both live in engine.js so the two logs cannot drift.
      // .clock only: the quarter tag is already immediately left of it.
      const stamp = isStampableScore(p)
        ? (function(){
            const st = scoreStamp(plays, p);
            return st ? '<span style="color:#ffc72c; font-size:12px; font-weight:700; margin-right:6px;">' +
                        st.clock + '</span>' : '';
          })()
        : '';
      const text = stripTeamNames(p.text || '').replace(/TOUCHDOWN/g, '<strong>TOUCHDOWN</strong>');
      // The first NON-DIVIDER line, not simply the first entry: an "End
      // of 1st half" rule sitting on top would otherwise take the
      // emphasis meant for the last real play.
      let style = '';
      if (highlightFirst && !marked){
        marked = true;
        style = ' style="font-size:calc(17px * var(--stat-scale, 1)); font-weight:700; color:#eef1f4;"';
      } else if (isTdOrFg(p)){
        style = ' style="font-weight:700;"';
      }
      return '<div class="logline"' + style + '>' + qtag + stamp + text + (p.unresolved ? '<span class="badge unresolved">unresolved</span>' : '') + '</div>';
    }).join('');
  }

  // Requested directly, 21 Aug 2026: the Current Drive tile no longer
  // lists every play -- just the most recent one, at a size meant to
  // be read from across a room, with the down/distance/spot it left
  // the offense facing directly underneath. `list` is in CHRONOLOGICAL
  // order (oldest first), matching what currentDriveOwnTeamPlays
  // already produces -- so the last element is the most recent play,
  // with no reversing needed.
  //
  // Deliberately its own function rather than a mode of renderLogLines:
  // that function's highlightFirst path exists for exactly one caller
  // (this one, until today), and the two now want genuinely different
  // things -- a single play at 30px plus a line of state renderLogLines
  // has no concept of at all, versus a scrollable list of many. Forcing
  // both through one function would have meant threading an unrelated
  // "and also render this extra line" parameter through code that every
  // other caller (allPlaysScroll) has no use for.
  function renderCurrentDriveLastPlay(list, state, distDisplay, driveThisHalf){
    if (!list.length) return '<div style="color:#8d99a6;">no active drive yet</div>';
    // Requested directly: a timeout must be ADDITIVE to the last play,
    // never replace it as the headline -- the same principle as the
    // touchdown/try lock below. Every trailing timeout is peeled off
    // the end of the list into its own amber sub-line (amber matching
    // the SOP tile: a clock event, not a play), and everything below
    // -- including the try-lock -- operates on what remains, so a
    // timeout called after a PAT leaves the touchdown+try pairing
    // fully intact with the timeout beneath both. Rendered LAST, after
    // the down/distance line, reading chronologically: the play, the
    // situation it produced, then the stoppage called on top of it.
    //
    // If the segment holds NOTHING BUT timeouts (end === 0), nothing
    // is peeled and the newest timeout stays the headline -- the only
    // event that exists is still better shown than hidden.
    let timeoutLines = '';
    let end = list.length;
    while (end > 0 && list[end - 1].effect && list[end - 1].effect.timeout) end--;
    if (end > 0 && end < list.length){
      timeoutLines = list.slice(end).map(t =>
        '<div style="font-size:24px; font-weight:600; margin-top:8px; color:#ffc72c;">' +
        stripTeamNames(t.text || '') + '</div>').join('');
      list = list.slice(0, end);
    }
    let p = list[list.length - 1];
    // Requested directly: when the drive just ended in a touchdown, the
    // try (PAT/2PT) that follows must not REPLACE the touchdown as the
    // headline -- the score is the story, the try is its follow-up.
    // Lock the touchdown in place and show the try's own result as a
    // colored sub-line beneath it, the same pairing Previous Drive's
    // summary already presents. Nothing here needs clearing later: the
    // moment the next drive actually registers (the ensuing kickoff --
    // see findDriveStarts), this list becomes the NEW drive's plays and
    // the display moves on on its own.
    //
    // Detection mirrors computeDriveSummary exactly, on purpose:
    // playType 'pat'/'twopt' for the try (never .result alone, which a
    // field goal's kicker also carries), points === 6 for the touchdown
    // behind it (never effect.td, which a blocked-kick return score
    // never sets). Both lessons were paid for once already in that
    // function; re-deriving them differently here would just buy the
    // same bugs a second time.
    let tryLine = '';
    const lastRoles = p.roles || {};
    if (lastRoles.playType === 'pat' || lastRoles.playType === 'twopt'){
      const tryRole = lastRoles.playType === 'pat' ? lastRoles.kicker : (lastRoles.carrier || lastRoles.passer);
      for (let i = list.length - 2; i >= 0; i--){
        const e = list[i].effect || {};
        if (e.score && e.score.points === 6){
          tryLine = '<div style="font-size:24px; font-weight:600; margin-top:8px; color:' +
            (tryRole && tryRole.result === 'g' ? '#1a7a4c' : '#a32d2d') + ';">' +
            stripTeamNames(p.text || '') + '</div>';
          p = list[i];
          break;
        }
      }
      // No touchdown found behind the try -- nothing to lock onto, so
      // fall through unchanged and show the try itself as the last
      // play, exactly as before this existed.
    }
    // The trailing " — 2nd & 9" (or, when the play converts the down,
    // the fixed phrase " — 1st down") every scrimmage play's own stored
    // text already carries -- added at entry time in game.html, and
    // left completely alone there and everywhere else it is shown:
    // this page's own allPlaysScroll, recap.html, the stat package --
    // is now redundant HERE ONLY, since the down/distance/spot line
    // below repeats the exact same information as its own, standalone
    // line. Stripped from the copy shown in this one widget, not from
    // the text itself.
    //
    // Deliberately does NOT touch " — TOUCHDOWN" or
    // " — turnover on downs": neither is duplicated by the standalone
    // line below (a scoring or turnover-ending play has no next down to
    // repeat), so stripping those would delete information this widget
    // states nowhere else.
    const rawText = (p.text || '').replace(/ — (?:\d+(?:st|nd|rd|th) & (?:\d+|Goal)|1st down)$/, '');
    // Same text processing renderLogLines applies -- team names
    // stripped (redundant here, since only one team's own drive is
    // ever shown), TOUCHDOWN bolded for consistency with every other
    // log line in the app, even though a 30px, already-bold line does
    // not visually need the extra emphasis.
    const text = stripTeamNames(rawText).replace(/TOUCHDOWN/g, '<strong>TOUCHDOWN</strong>');
    // margin-top, not a gap on the tiles above: currentDriveTiles and
    // driveLogScroll are separate sibling elements, and the tiles are
    // shared with Previous Drive's own summary -- spacing added there
    // would have widened Previous Drive's gap too, which nobody asked
    // to change.
    // #111 on a near-black panel is the washed-out text Andy reported.
    // These are inline, so no stylesheet override could have reached them.
    // THE CLOCK, WHEN THIS PLAY IS A SCORE. 30 August 2026.
    // ------------------------------------------------------------------
    // .full here, not .clock: unlike the log lines there is no quarter
    // tag beside this one, and a bare "5:12" on a card watched from
    // across a room does not say which quarter it belongs to.
    //
    // Inline and much smaller than the 36px headline on purpose. It is a
    // fact ABOUT the play rather than part of what happened, and the
    // touchdown is what a spectator is reading. Gold, matching every
    // other clock reading on this page.
    //
    // Sits on the LOCKED play, which is the touchdown rather than the try
    // that follows it -- `p` has already been swapped back by the
    // touchdown lock above, which is exactly the play the stamp belongs
    // to under Andy's exclude-the-try rule.
    const scoreStampHtml = isStampableScore(p)
      ? (function(){
          const st = scoreStamp(plays, p);
          return st ? '<span style="font-size:20px; font-weight:700; color:#ffc72c; ' +
                      'margin-left:12px; white-space:nowrap;">' + st.full + '</span>' : '';
        })()
      : '';
    const playHtml = '<div style="font-size:36px; font-weight:700; color:#eef1f4; line-height:1.2; margin-top:16px;">' +
      breakPlayText(text) + scoreStampHtml +
      (p.unresolved ? '<span class="badge unresolved">unresolved</span>' : '') + '</div>';
    // Identical construction to the banner's own down/distance/spot
    // text a few hundred lines up -- same hasDrive guard, same
    // ordinal/markerLabel calls, same state and distDisplay passed in
    // from the one place renderAll() already computed them. Anything
    // else risks the two silently disagreeing about the same drive.
    // driveThisHalf gates it, exactly as the banner does. computeState()
    // keeps the down, distance and spot the first half ended on, so this
    // line sat under the second-half KICKOFF reading "3rd & 16 at own 12"
    // -- a situation that ended at the interval. Fixing the banner alone
    // left it here, because this tile builds its own copy of the line
    // rather than reading the banner's.
    //
    // Defaults to true when the caller passes nothing, so the argument is
    // additive and no other call site changes behavior.
    const inThisHalf = driveThisHalf === undefined ? true : !!driveThisHalf;
    const hasDrive = inThisHalf && !!state.down &&
      state.fieldPos !== null && state.fieldPos !== undefined;
    const downLine = hasDrive
      ? '<div style="font-size:24px; font-weight:600; color:#b9c4d0; margin-top:8px;">' +
        ordinal(state.down) + ' & ' + distDisplay + ' at ' + markerLabelNamed(state.fieldPos, state.possession) + '</div>'
      : '';
    return playHtml + tryLine + downLine + timeoutLines;
  }

  function computeDriveSummary(startIdx, endIdx){
    const driveTeam = computeState(plays.slice(0, startIdx + 1)).possession;
    if (driveTeam !== 'teamA' && driveTeam !== 'teamB') return null;
    // stateBefore / stateAtEnd removed 30 Aug 2026. Their ONLY consumer
    // was the possession-time delta, which now lives in engine.js as
    // driveTop() -- leaving two full computeState() passes here would be
    // dead work that still looked load-bearing.
    const segment = plays.slice(startIdx, endIdx);
    const scrimmageTypes = ['rush','pass','incomplete','sack','int','fumble'];
    let rushes = 0, rushYds = 0, passes = 0, passYds = 0, totalPlays = 0, totalYds = 0, scoringPlayText = null;
    // Set only for a TOUCHDOWN, never a field goal -- a made FG has no
    // PAT/2PT to follow, so tryOutcome must not even be searched for
    // after one, let alone shown as though it belonged there.
    let endedInTouchdown = false, tryOutcome = null;
    segment.forEach(p => {
      const e0 = p.effect || {};
      // A penalty is not a play, but its yardage genuinely moves the
      // drive -- a 15-yard defensive foul advances the offense just as a
      // 15-yard completion does. Counted in YARDS only, never in plays.
      // fieldDelta is already signed from the offense's point of view,
      // so a foul on the offense subtracts.
      if (e0.penaltyTeam && typeof e0.fieldDelta === 'number'){
        totalYds += e0.fieldDelta;
        return;
      }
      const r = p.roles;
      // SCORING TEXT CAPTURED REGARDLESS OF TEAM, unlike everything
      // below this. Reported from a real game, 19 Aug 2026: a
      // defensive score -- a blocked kick, an interception, a fumble,
      // anything returned by the team that was NOT driving -- is still
      // this drive's OUTCOME, even though the team that committed it
      // is not the offense whose rushing/passing stats the rest of this
      // loop counts. The early return two lines below, gating
      // everything on p.team === driveTeam, used to gate THIS too --
      // so once a defensive score's own team correctly said who
      // actually scored (the attribution fix from earlier the same
      // night), that team no longer matched driveTeam, and the
      // touchdown that ended this exact drive silently never got
      // captured. The outcome line fell back to lastPlayText instead --
      // in the reported case, the scoring team's own ensuing kickoff,
      // which is not remotely what ended this drive.
      if (r){
        const isFgGoodAny = r.playType === 'fg' && r.kicker && r.kicker.result === 'g';
        // points === 6, not effect.td -- a THIRD bug in the same
        // function, found while fixing the second one, the same night:
        // a blocked kick returned for a touchdown sets effect.score
        // with points: 6, but never sets effect.td at all -- that flag
        // only gets set by the rush/pass/fumble/interception/kick-
        // return branches, not the field-goal-block one. And it can
        // never match isFgGoodAny either, since a BLOCKED kick's own
        // result is 'b', never the 'g' a made field goal has. Neither
        // condition ever matched this exact play shape, in EITHER
        // team's own drive, since before tonight's attribution fix
        // existed at all -- this was never about which team the play
        // was filed under. 6 points is unambiguous in football
        // regardless of the mechanism that produced it, so it is the
        // one check that cannot miss a touchdown no matter how it was
        // scored.
        if (p.effect && p.effect.score && p.effect.score.points === 6){ scoringPlayText = p.text; endedInTouchdown = true; }
        else if (p.effect && isFgGoodAny){ scoringPlayText = p.text; }
        // THE TRY THAT FOLLOWS THE TOUCHDOWN, captured REGARDLESS OF
        // TEAM -- moved above the team filter below for the same
        // reason scoringPlayText was, a few lines up, the same night.
        // A try always belongs to whoever scored the touchdown it
        // follows, not to driveTeam (the team that was driving BEFORE
        // the turnover this drive's segment starts from). For an
        // ordinary offensive touchdown those are the same team, so
        // this worked by coincidence and the gap went unnoticed; for a
        // defensive score they never are, and the try's own outcome
        // silently never got captured -- the "Previous Drive" panel's
        // colored PAT/2PT line, built for exactly this, simply never
        // rendered. Reported directly from a real game.
        //
        // Detected by playType === 'pat'/'twopt' specifically -- NOT by
        // the presence of a .result field, which a field goal's kicker
        // role also carries. An earlier version of this keyed on
        // .result alone and silently swallowed made field goals:
        // r.kicker.result === 'g' matched a FG too, this branch
        // returned early, and the FG's own scoringPlayText capture
        // above never ran. Caught by testing a made field goal
        // specifically, not by re-reading the code -- the assumption
        // that playType was absent from these roles was wrong, and the
        // generic `roles.playType = roles.playType || type` line in
        // the submit code (which runs for every panel, this one
        // included) is why.
        const tryRole = r.playType === 'pat' ? r.kicker
          : r.playType === 'twopt' ? (r.carrier || r.passer) : null;
        if (tryRole){
          // p.text is reused verbatim rather than re-derived -- it is
          // already the exact, correct wording for every outcome this
          // can have, including the edge cases (a blocked kick
          // returned for two, a muffed hold, an intercepted 2-point
          // pass) that a short summary written here would be liable to
          // get wrong or leave out.
          tryOutcome = { text: p.text, good: tryRole.result === 'g' };
          return;
        }
      }
      if (!r || p.team !== driveTeam) return;

      if (scrimmageTypes.includes(r.playType)) totalPlays++;
      // A LOST fumble carries no statYds ON PURPOSE -- computeState skips
      // the flip for stat plays, so the yardage rides on roles instead
      // (see the 'f' branch of parseInput). Reading statYds alone therefore
      // scored a 3-yard catch-and-fumble as a 3-yard drive gain of zero.
      const attYds = (typeof r.attemptYards === 'number') ? r.attemptYards : null;
      const yds = (p.effect && typeof p.effect.statYds === 'number') ? p.effect.statYds
        : (attYds !== null ? attYds : 0);
      if (p.effect && typeof p.effect.statYds === 'number') totalYds += p.effect.statYds;
      else if (attYds !== null) totalYds += attYds;
      if (r.playType === 'rush'){ rushes++; rushYds += yds; }
      else if (r.playType === 'pass' || r.playType === 'incomplete' || r.playType === 'int' || r.playType === 'sack'){ passes++; passYds += yds; }
      else if (r.playType === 'fumble' && r.carrier){
        // ASK THE PLAY, DO NOT GUESS FROM THE ROSTER.
        // A fumble used to carry no record of what play it ended, so this
        // inferred rush-or-pass from the carrier's listed position. That
        // put a completion to a receiver with no position on file -- or
        // any position outside RECEIVE_POS -- in the RUSHING column, and a
        // running back's catch-and-fumble with it. `attempt` now states
        // what the play was, so the guess is only a fallback for plays
        // saved before it existed.
        if (r.attempt === 'rush'){ rushes++; rushYds += yds; }
        else if (r.attempt === 'pass' || r.attempt === 'sack'){ passes++; passYds += yds; }
        else {
          const pos = ((TEAMS[driveTeam] && TEAMS[driveTeam].posOffense[r.carrier.num]) || '').toUpperCase();
          if (RECEIVE_POS.has(pos)){ passes++; passYds += yds; }
          else { rushes++; rushYds += yds; }
        }
      }
    });
    // ONE IMPLEMENTATION, in engine.js, since 30 Aug 2026 -- scoresummary.html
    // needs the same number for its scoring rows. driveTeam is passed
    // explicitly rather than letting the helper re-derive it: this
    // function already computed it from the same slice, and handing it
    // over means the two cannot disagree about whose drive this is even
    // if the derivation ever changes on one side.
    const top = driveTop(plays, startIdx, endIdx, driveTeam);
    let lastPlayText = null;
    if (!scoringPlayText){
      for (let i = segment.length - 1; i >= 0; i--){
        // Skip trailing administrative markers: a drive that ended in a
        // punt must summarize as the punt, not as the clock line that
        // happens to follow it.
        if (segment[i].text && !isAdminMarker(segment[i])){ lastPlayText = segment[i].text; break; }
      }
    }
    return { team: driveTeam, rushes, rushYds, passes, passYds, totalPlays, totalYds, top, scoringPlayText, lastPlayText,
      // null unless the drive ended in a touchdown AND a try play was
      // actually found in the segment -- a TD entered without its try
      // yet (the scorer has not gotten to it) must not show a blank or
      // a guess, it must show nothing, same as any other pending state
      // in this app.
      tryOutcome: endedInTouchdown ? tryOutcome : null };
  }

  // BREAK A LONG PLAY LINE AT ITS OWN CLAUSES.
  // ---------------------------------------------------------------------
  // A kickoff with a return and a tackler runs past 90 characters, and on
  // a tile this size that wraps wherever the box happens to end -- mid
  // name as often as not. The play text already has natural seams: the
  // clauses that follow the main action are each introduced by a comma
  // and a fixed phrase, so breaking THERE puts each part of the play on
  // its own line and never splits a person's name.
  //
  // Display only -- the stored text is untouched. The comma goes with the
  // break: it was punctuation for a running sentence and reads as a stray
  // mark at the end of a line.
  const PLAY_CLAUSES = [
    ', returned by ', ', intended for ', ', tackled by ', ', recovered by '
  ];
  function breakPlayText(html){
    if (!html) return html;
    // FIND EVERY SEAM FIRST, then cut once. Wrapping one clause at a time
    // nested each span inside the last, so a kickoff with a return AND a
    // tackler indented the tackler twice -- it rendered on its own line,
    // but stepped further right than the clause above it for no reason a
    // reader could see. Collecting the positions and emitting siblings
    // keeps every clause at the same indent.
    const cuts = [];
    PLAY_CLAUSES.forEach(c => {
      let from = 0, idx;
      while ((idx = html.indexOf(c, from)) !== -1){
        cuts.push({ at: idx, len: c.length, phrase: c.slice(2) });
        from = idx + c.length;
      }
    });
    if (!cuts.length) return html;
    cuts.sort((a, b) => a.at - b.at);
    let out = html.slice(0, cuts[0].at);
    cuts.forEach((cut, i) => {
      const end = (i + 1 < cuts.length) ? cuts[i + 1].at : html.length;
      out += '<span class="play-clause">' + cut.phrase +
             html.slice(cut.at + cut.len, end) + '</span>';
    });
    return out;
  }

  // THIS SERIES, IN FOUR TILES. Replaced renderDriveSummary, 30 Aug 2026.
  // ====================================================================
  // `list` is the current drive's slice, already cut at the boundary
  // findDriveStarts produced; `driveTeam` is whoever has the ball.
  //
  // EVERY TILE ASKS THE PLAY, NEVER THE ROSTER AND NEVER THE PLAY TEXT.
  // Yardage comes off the role that owns it -- receiver.yards for a
  // completion, carrier.yards for a rush, passer.yards for a sack --
  // matching computeBoxScore exactly. Parsing p.text would be a second
  // implementation of rules the engine already owns, and the whole
  // reason team defense was wrong on three surfaces.
  //
  // THE TEAM TEST DIFFERS PER TILE, on purpose:
  //   long pass / long rush / sacks  the OFFENSE, so driveTeam
  //   penalties                      BOTH, keyed on effect.penaltyTeam,
  //                                  which is stamped with the PENALIZED
  //                                  team and not the team whose drive
  //                                  the flag fell in
  // A single shared filter would have to be wrong for one of them.
  function renderSeriesTiles(list, driveTeam){
    const seq = Array.isArray(list) ? list : [];
    const esc = v => String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    // A play's own type, with the fumble indirection resolved. A fumble
    // records what the play WAS in `attempt` (see computeDriveSummary's
    // note: ask the play, do not guess from the roster), so a
    // catch-and-fumble is a completion for these tiles exactly as it is
    // for the box score. Without this a 40-yard catch that ended in a
    // fumble would not be the long pass of the series.
    const actOf = p => {
      const r = p.roles || {};
      return r.playType === 'fumble' ? (r.attempt || null) : (r.playType || null);
    };
    // Whose offense the play belongs to, taken from the ROLE rather than
    // p.team. p.team is the row's filed team and a penalty row carries
    // the penalized side, so reading it here would mis-file plays in
    // exactly the way the display filter above documents.
    const ours = teamKey => !driveTeam || teamKey === driveTeam;

    // THE NAME IS RESOLVED FROM THE JERSEY NUMBER, NOT READ OFF THE ROLE.
    // --------------------------------------------------------------------
    // Reported live, 30 Aug 2026: both long tiles showed a number and no
    // name. The first version read `role.name`, and roles DO NOT RELIABLY
    // CARRY ONE -- it depends which entry path wrote the play. The click
    // handlers in game.html write `name: sel.carrierName || undefined`;
    // parseInput, the keyboard path a scorer actually uses at speed,
    // writes `{ team, num, yards }` and no name at all. So the field was
    // present in every fixture I built and absent in most real plays.
    // Exactly the bad-snap shape: the roles come from the PARSER, and
    // code written against the click handler describes a path that
    // rarely runs.
    //
    // playerName() is engine.js's own resolver, the one the box score
    // and every report already use, and it falls back to '#22' when the
    // number is on no roster. The stored name is used only when the
    // roster cannot answer -- so a player who has left the roster still
    // shows the name the play was entered with.
    //
    // 'offense' is the preferred unit because every play reaching these
    // two tiles is a scrimmage play by the team with the ball. This is a
    // DISPLAY-ONLY resolution on a live tile about the current game; it
    // does not touch how the box score keys its buckets and does not
    // prejudge item 1.
    const nameOf = role => {
      if (!role) return '';
      const resolved = (role.team && role.num !== undefined)
        ? playerName(role.team, role.num, 'offense') : '';
      if (resolved && resolved.charAt(0) !== '#') return resolved;
      return role.name || resolved || '';
    };

    let longPass = null, longRush = null;
    let sackCount = 0, sackYds = 0;
    const pen = { teamA: { n: 0, yds: 0 }, teamB: { n: 0, yds: 0 } };

    seq.forEach(p => {
      const r = p.roles || {};
      const e = p.effect || {};

      // PENALTIES FIRST AND UNCONDITIONALLY. A flag is not a play and
      // carries no playType, so it must not fall through the act
      // switch below -- and it counts for whichever team it was called
      // on, including the defense during our own series, which is half
      // the reason this tile lists both.
      if (e.penaltyTeam && pen[e.penaltyTeam]){
        pen[e.penaltyTeam].n += 1;
        // Math.abs, not the raw value: fieldDelta is signed from the
        // offense's point of view elsewhere in this file, and a tile
        // reading "2 for -15" would read as yards gained by the flag.
        // A penalty's yardage is a magnitude here.
        pen[e.penaltyTeam].yds += Math.abs(e.penaltyYds || 0);
        return;
      }

      const act = actOf(p);
      if (act === 'pass' && r.receiver && ours(r.receiver.team)){
        const y = r.receiver.yards || 0;
        // Strictly greater, so the FIRST of two equal-length catches
        // keeps the tile. Ties going to the earlier play is arbitrary
        // either way; it is fixed here so the tile does not flicker
        // between two names as later plays land.
        if (!longPass || y > longPass.yds) longPass = { yds: y, who: nameOf(r.receiver) };
      } else if (act === 'rush' && r.carrier && ours(r.carrier.team)){
        const y = r.carrier.yards || 0;
        if (!longRush || y > longRush.yds) longRush = { yds: y, who: nameOf(r.carrier) };
      } else if (act === 'sack' && r.passer && ours(r.passer.team)){
        sackCount += 1;
        // passer.yards on a sack is stored as a POSITIVE magnitude and
        // SUBTRACTED by the engine (rushing TEAM yds -= passer.yards).
        // Summing it raw and labelling it "lost" says the same thing
        // the box score does, without a sign flip that would have to
        // agree with the engine's forever.
        sackYds += Math.abs(r.passer.yards || 0);
      }
    });

    // One tile: a label, then one or more number+name lines sharing a
    // baseline. `lines` is a list of [number, trailing text] pairs.
    const tile = (label, lines, extraClass) =>
      '<div class="series-tile' + (extraClass ? ' ' + extraClass : '') + '">' +
        '<div class="series-tile-label">' + esc(label) + '</div>' +
        lines.map(([num, text]) => num === null
          ? '<div class="series-line"><span class="series-empty">' + esc(text) + '</span></div>'
          : '<div class="series-line">' +
              '<span class="series-num">' + esc(num) + '</span>' +
              '<span class="series-name">' + esc(text) + '</span>' +
            '</div>').join('') +
      '</div>';

    // An em dash, not "0" and not an empty tile. Zero is a claim -- it
    // says a pass was completed for no gain -- where the truth on the
    // first play of a series is that nothing has happened yet.
    const longTile = (label, hit) => hit
      ? tile(label, [[hit.yds, hit.who]])
      : tile(label, [[null, '—']]);

    const teamName = k => (TEAMS[k] && TEAMS[k].name) || (k === 'teamA' ? 'Us' : 'Them');
    const penTile = tile('Penalties', ['teamA', 'teamB'].map(k =>
      [pen[k].n, teamName(k) + ' · ' + pen[k].yds + ' yds']), 'two-row');

    const sackTile = sackCount
      ? tile('Sacks', [[sackCount, sackYds + ' yds lost']])
      : tile('Sacks', [[null, '—']]);

    return longTile('Long pass', longPass) + longTile('Long rush', longRush) +
           penTile + sackTile;
  }

  function renderTeamSummary(){
    const box = computeBoxScore(plays);
    // BETWEEN HALVES, AND AFTER THE FINAL WHISTLE, the football and the
    // timeout counter both describe a situation that does not exist. Nobody
    // has the ball. Timeouts reset for the second half, so TOL=1 at the
    // interval is not stale -- it is wrong -- and at full time it describes
    // a game that cannot use them.
    //
    // THE SAME TWO STATES THE DRIVE CARDS USE, and read from the same
    // `phase` rather than derived again: a first version added its own
    // atHalftime() helper, a third copy of
    // `halftimeIdx !== -1 && !secondHalfStarted`, which is exactly the kind
    // of thing that drifts until two halves of one screen disagree about
    // when halftime is. renderAll sets phase at the top of the same pass
    // that calls this, so it is always current.
    const notLive = phase === 'HALFTIME' || phase === 'FINAL';

    // WHAT HAS HAPPENED SINCE HALFTIME.
    // ---------------------------------------------------------------------
    // Total, pass and rush each carry a bracketed second figure from the
    // second half onward: that team's yardage SINCE THE BREAK.
    //
    // CHANGED 30 August 2026. The bracket used to hold the figure as it
    // stood AT halftime. Same information either way -- one is the other
    // subtracted from the total -- but mid-third-quarter the question a
    // crew asks out loud is "what have they done since the break", and
    // that was the number nobody had without doing arithmetic on air.
    //
    // Computed by running the SAME computeBoxScore over the second-half
    // plays, not by subtracting one total from another and not by
    // snapshotting. Subtraction would be right for yardage and quietly
    // wrong for anything else that ever joins these tiles (a long, a
    // percentage, a completion rate), and a snapshot would be wrong the
    // moment a first-half play is corrected after halftime -- which is
    // ordinary, since corrections are entered when somebody notices, not
    // when the mistake happened.
    //
    // QUARTERS 3 AND 4 ONLY. OVERTIME IS NOT THE SECOND HALF.
    // ---------------------------------------------------------------------
    // Andy's call, 30 Aug 2026, and it is the football reading: overtime
    // is its own period, not part of the second half, so yardage gained
    // there does not belong in a tile labelled as the second half.
    //
    // THE CONSEQUENCE, stated because it is not obvious. In regulation,
    // game total minus bracket is the first half. Once overtime starts
    // that stops being true -- the remainder is then the first half PLUS
    // the overtime, because OT still accrues to the game total and no
    // longer appears in the bracket. Nothing on screen is wrong; the
    // subtraction simply stops meaning what it meant, and anybody adding
    // a check on these two numbers needs to know that before writing it.
    const secondHalfPlays = plays.filter(p => {
      const q = p.quarter || 0;
      return q >= 3 && q <= 4;
    });
    const secondHalfBox = computeBoxScore(secondHalfPlays);
    // FROM THE FIRST SECOND-HALF PLAY, not from the quarter changing.
    // Unchanged, and it still earns its place: before the break there is
    // no second half to report, and "284 []" or "284 [0]" on a first-half
    // screen states a fact about a period that has not started.
    const showHalf = plays.some(p => (p.quarter || 0) >= 3);
    // Needed for the possession marker on each team's header. This
    // function did not previously care who had the ball.
    const liveState = computeState(plays);
    const scrimmageTypes = ['rush','pass','incomplete','sack','int','fumble'];
    // OFFENSE DETERMINED BY ROLE, NOT BY p.team -- same bug, same fix as
    // recap.html/stat_package.html/season_report.html, found the same
    // night by a systematic audit specifically because this file's own
    // copy had been missed on the first pass through those three.
    const offenseTeamOf = (p) => {
      const r = p.roles;
      if (!r) return null;
      if (r.carrier) return r.carrier.team;
      if (r.passer) return r.passer.team;
      return null;
    };
    const playsFor = (teamKey) => plays.filter(p => p.roles && scrimmageTypes.includes(p.roles.playType) && offenseTeamOf(p) === teamKey).length;
    const possessions = countPossessions(plays);
    const turnovers = countTurnovers(plays);
    const penState = computeState();

    let html = '<div class="team-summary-row">';
    ['teamA', 'teamB'].forEach(teamKey => {
      const team = TEAMS[teamKey];
      const s = box[teamKey];
      const rushYdsRaw = Object.keys(s.rushing).reduce((t, n) => t + (s.rushing[n].yds || 0), 0);
      // NFHS (which follows the NCAA convention, not the NFL one):
      // sack yardage is charged as RUSHING yardage lost, not deducted
      // from passing. The quarterback's individual passing line is
      // untouched either way -- only where the team total absorbs it
      // changes. Under the NFL rule this came out of Pass Yards.
      //
      // NOT currently referenced downstream in this function -- confirmed
      // by search before this fix, not assumed. Corrected anyway,
      // alongside the identical, LIVE gap this same session found a few
      // hundred lines up (defTotals.sacks), rather than left as a latent
      // copy of the same mistake for whenever this does get wired up.
      const sackYardsLost = plays.reduce((t, p) => {
        const r = p.roles;
        return (r && (r.playType === 'sack' || (r.playType === 'fumble' && r.attempt === 'sack')) && r.passer && r.passer.team === teamKey) ? t + (r.passer.yards || 0) : t;
      }, 0);
      const passYds = Object.keys(s.passing).reduce((t, n) => t + (s.passing[n].yds || 0), 0);
      // No subtraction here: the sack yardage is already inside the
      // TEAM rushing line, so taking it off again would double count.
      const rushYds = rushYdsRaw;
      const totalYds = rushYds + passYds;
      // A team's own offensive 3rd/4th down conversion rate is stored on
      // the OTHER team's oppDowns entry (that's "the other team's defense
      // against this team's offense", which is the same numbers).
      const own = box[otherTeam(teamKey)].oppDowns;
      const d3 = own.d3Pct !== null ? own.d3conv + ' of ' + own.d3att + ' (' + own.d3Pct + '%)' : '—';
      const pen = penState.penalties[teamKey];

      // COMPLETIONS AND ATTEMPTS REMOVED FROM THESE TWO TILES, 25 Aug 2026.
      // ---------------------------------------------------------------
      // They were here deliberately -- "180 passing yards reads very
      // differently at 12 of 18 than at 12 of 34" -- and that argument
      // still holds, which is why comp and att remain in the per-category
      // tables further down this page. What changed is what these three
      // tiles are FOR: a game total beside its second-half figure. Two
      // pairs of numbers in one tile is one pair too many at 34px.
      const yardsOf = (bucket) =>
        Object.keys(bucket).reduce((t, n) => t + (bucket[n].yds || 0), 0);
      // Named for what they now hold. `halfBox`/`halfTotal` meant the
      // FIRST half until today, and a name that quietly changes meaning is
      // how the next reader gets it backwards.
      const hs = secondHalfBox[teamKey];
      const secondHalfPass  = yardsOf(hs.passing);
      const secondHalfRush  = yardsOf(hs.rushing);
      const secondHalfTotal = secondHalfPass + secondHalfRush;
      // Interpolated as HTML, so it is built from numbers this function
      // computed rather than from anything a scorer typed.
      const withSecondHalf = (val, sh) => showHalf
        ? val + '<span class="stat-tile-half">[' + sh + ']</span>'
        : String(val);

      const topSec = (liveState.possessionTime || {})[teamKey] || 0;
      const tiles = [
        [possessions[teamKey] || 0, 'Possessions'],
        [withSecondHalf(totalYds, secondHalfTotal), 'Total Yards'],
        [withSecondHalf(passYds, secondHalfPass), 'Pass Yards'],
        [withSecondHalf(rushYds, secondHalfRush), 'Rush Yards'],
        [playsFor(teamKey), 'Total Plays'],
        [turnovers[teamKey] || 0, 'Turnovers'],
        [pen.count + '-' + pen.yds, 'Penalties'],
        [d3, '3rd Down']
      ];

      html += '<div class="team-summary-col">' +
        // DARK THEME: a spine, not a fill. The tenant picks this color
        // and it may be pale -- filled, it is a bright block in a dark
        // screen and safeTextColor has to flip the label to near-black,
        // so the two teams' headers end up with different contrast. As a
        // 5px edge the color still identifies the team and the label is
        // always the same white.
        '<div class="team-summary-header" style="background:#171d25; color:#eef1f4; ' +
          'border-left:5px solid ' + team.bg + '; border-radius:0 8px 8px 0;">' +
        (team.logo ? '<img class="team-summary-logo" src="' + team.logo + '">' : '') +
        '<span>' + team.name + '</span>' +
        // The possession marker. Rendered for BOTH teams and hidden on
        // the one without the ball, so the header width does not jump
        // every time possession changes.
        '<span class="poss-ball" style="visibility:' +
          (!notLive && liveState.possession === teamKey && liveState.down
            ? 'visible' : 'hidden') +
          ';" title="has the ball">\uD83C\uDFC8</span>' +
        // Right-justified via margin-left:auto so it sits hard against
        // the end of the colored bar regardless of how long the team
        // name or logo is.
        // Timeouts and time of possession, stacked and right-justified at
        // the end of the colored bar. The bar is a flex row with no set
        // height, so a second line grows it by one small line and nothing
        // in the tile grid below moves -- the grid takes its height from
        // flex:1 on whatever is left.
        //
        // TOP is shown only once some has accrued. It is built entirely
        // from the clock values the scorer types, and those are optional,
        // so a game with no clock entries would otherwise read a confident
        // 0:00 -- which says "they never had the ball" rather than "nobody
        // recorded it". Absent is honest; zero is a claim.
        '<span style="margin-left:auto; display:flex; flex-direction:column; align-items:flex-end; line-height:1.15;">' +
          // REMOVED at halftime, not hidden. The football keeps its space
          // because the header width would otherwise jump as possession
          // changes; this has no such problem, and leaving an empty line
          // above the time of possession just looks like a missing number.
          (notLive ? '' :
            '<span style="font-size:16px; font-weight:700; letter-spacing:0.02em;">TOL=' +
              computeState(plays).timeouts[teamKey] + '</span>') +
          (topSec > 0
            // Same font size and weight as TOL above it, so the two lines
            // are the same height. It was 13px against 16px, which on a
            // screen read from across a room made the second line look
            // like a footnote rather than a figure. Both are stats a coach
            // glances at between plays; neither outranks the other.
            ? '<span style="font-size:16px; font-weight:700; letter-spacing:0.02em;" ' +
              'title="Time of possession, from the clock values entered">' +
              formatDuration(topSec) + ' TOP</span>'
            : '') +
        '</span>' +
        '</div>' +
        '<div class="stat-tile-grid">' +
        tiles.map(([val, label]) => '<div class="stat-tile"><div class="stat-tile-value">' + val + '</div><div class="stat-tile-label">' + label + '</div></div>').join('') +
        '</div>' +
        '</div>';
    });
    html += '</div>';
    document.getElementById('teamSummaryContainer').innerHTML = html;
  }

  // Requested directly, mocked up and approved before this was built:
  // while a game has not started, the bottom-left tile shows this
  // season's cumulative stats for our own team instead of this game's
  // own (which would otherwise just be empty, since nothing has been
  // entered yet). Set once in init(), before the CURRENT game's own
  // buildTeams() call, and read from again on every render rather than
  // refetched -- see loadSeasonStatsForNotStarted() below for why the
  // ordering there matters.
  //
  // { aggregatedBox, allSeasonPlays, gameCount } | null. null means
  // either the game has actually started (the normal, live tile
  // applies) or this was never checked for this game at all.
  let seasonStatsForNotStarted = null;

  // There is no stored, precomputed season-stats table anywhere in
  // this app -- confirmed directly before building this, not assumed.
  // season_report.html derives its own season totals fresh, in the
  // browser, every single time it loads: for each finished game,
  // rebuild that game's own roster/team context, compute that game's
  // own box score, merge the result into a running total. This does
  // the identical thing, for the same reason -- there is no cheaper
  // source to read from, since nothing anywhere writes this total back
  // to the database once computed. A third page doing the same
  // derivation, not a shortcut around it.
  async function loadSeasonStatsForNotStarted(game, ourBranding){
    const { data: priorGames, error } = await supabaseClient
      .from('games').select('*')
      .eq('season_year', game.season_year).eq('status', 'final')
      // Same reasoning as season_report.html and player_report.html:
      // NULL is not false in SQL, so a plain .eq('is_preseason', false)
      // would have silently excluded every game saved before that
      // column existed.
      .or('is_preseason.is.null,is_preseason.eq.false');
    if (error || !priorGames || !priorGames.length){
      seasonStatsForNotStarted = { aggregatedBox: null, allSeasonPlays: [], gameCount: 0 };
      return;
    }

    // Everything below is wrapped -- reported directly: a real season
    // with real, finished games rendered the tile completely blank, not
    // "no season stats yet". That distinction matters: an exception
    // thrown partway through this loop (an older or unusual stored
    // shape this had not been tested against) would otherwise propagate
    // straight up through init() and leave the REST of the page's own
    // setup unfinished too, not just this one tile. Caught here, logged
    // loudly so the actual cause is visible in the console instead of a
    // silent blank box, and surfaced as its own distinct state --
    // deliberately NOT the same "no season stats yet" a genuinely empty
    // season falls to, since that would misreport real games as if
    // they did not exist.
    try {
      const aggRushing = {}, aggPassing = {}, aggReceiving = {}, aggSpecialTeams = {};
      const allSeasonPlays = [];
      // Identical to season_report.html's own mergeInto -- summed except
      // for a "long" figure, which is a max, not a running total.
      const mergeInto = (target, key, delta) => {
        if (!target[key]) target[key] = {};
        Object.keys(delta).forEach(k => {
          // A LIST OF MAXIMA. The suffix test was added on 23 Aug: the list
      // was three hardcoded names, so any new "long" stat would have been
      // SUMMED across games -- three 20-yard returns reporting a long of
      // 60. Returns are no longer shown on this page, but the trap is
      // general and the fix is kept: the explicit names remain only so
      // the intent stays readable.
      if (/Long$/.test(k) || k === 'long' || k === 'fgLong' || k === 'puntLong'){
            target[key][k] = Math.max(target[key][k] || 0, delta[k] || 0);
          } else {
            target[key][k] = (target[key][k] || 0) + (delta[k] || 0);
          }
        });
      };

      // FETCHED ONCE FOR EVERY PRIOR GAME, NOT ONCE PER GAME.
      // Same fault as the two report pages: two awaits inside the loop, so
      // each round trip waited for the last. This one runs while a crew is
      // opening the view page before kickoff, which is the worst possible
      // moment for a page that looks frozen.
      // .in('game_id', ids) hits plays_game_idx and game_rosters_game_idx
      // exactly as the per-game lookups did, under the same RLS.
      const priorIds = priorGames.map(g => g.id);
      const [allPriorRosters, allPriorPlays] = await Promise.all([
        fetchAllByGame(supabaseClient, 'game_rosters', priorIds, null),
        fetchAllByGame(supabaseClient, 'plays', priorIds, 'sequence_number')
      ]);
      const pRostersBy = new Map(), pPlaysBy = new Map();
      for (const r of (allPriorRosters)){
        if (!pRostersBy.has(r.game_id)) pRostersBy.set(r.game_id, []);
        pRostersBy.get(r.game_id).push(r);
      }
      for (const q of (allPriorPlays)){
        if (!pPlaysBy.has(q.game_id)) pPlaysBy.set(q.game_id, []);
        pPlaysBy.get(q.game_id).push(q);
      }

      for (const priorGame of priorGames){
        const rosterRows = pRostersBy.get(priorGame.id) || [];
        const rawPlays = pPlaysBy.get(priorGame.id) || [];
        const gamePlays = (rawPlays || []).map(p => ({
          text: p.text, effect: p.effect || {}, team: p.team_side, quarter: p.quarter,
          roles: p.roles, unresolved: p.unresolved, isDivider: p.is_divider, isOverride: p.is_override
        }));
        // Rebuilds the SAME global TEAMS object the current, not-started
        // game is about to use for real -- deliberately safe, because
        // this entire function runs and finishes BEFORE buildTeams() is
        // called for the actual current game a few lines later in
        // init(). Whatever TEAMS looks like when this returns is
        // correctly overwritten immediately afterward; nothing else
        // reads TEAMS in between.
        buildTeams(priorGame, rosterRows || [], ourBranding);
        const box = computeBoxScore(gamePlays);
        ['rushing', 'passing', 'receiving'].forEach(cat => {
          const target = cat === 'rushing' ? aggRushing : cat === 'passing' ? aggPassing : aggReceiving;
          Object.keys(box.teamA[cat]).forEach(n => mergeInto(target, n, box.teamA[cat][n]));
        });
        Object.keys(box.teamA.specialTeams).forEach(n => mergeInto(aggSpecialTeams, n, box.teamA.specialTeams[n]));
        // Kept, not just merged and discarded: renderTeamBoxScore's own
        // Defense tile has never read its numbers from `box` at all (see
        // the comment on defTotals above) -- it reduces straight over
        // whichever plays array it is handed. Concatenating every prior
        // game's plays here, then handing the combined array in as
        // overrideDefensePlays, reuses that exact same reduction
        // unchanged rather than re-deriving int/fumRec/sacks/tfl a second
        // way that could quietly disagree with it.
        allSeasonPlays.push(...gamePlays);
      }

      seasonStatsForNotStarted = {
        aggregatedBox: { teamA: { rushing: aggRushing, passing: aggPassing, receiving: aggReceiving, specialTeams: aggSpecialTeams } },
        allSeasonPlays,
        gameCount: priorGames.length
      };
    } catch (e) {
      console.error('Season Stats tile: could not compute the season aggregate', e);
      seasonStatsForNotStarted = { aggregatedBox: null, allSeasonPlays: [], gameCount: 0, loadError: true };
    }
  }

  async function init(){
    const params = new URLSearchParams(window.location.search);
    currentGameId = params.get('id');
    isResultsMode = params.get('mode') === 'results';
    if (isResultsMode){
      document.getElementById('quadTR').innerHTML =
        '<div class="card compact drive-card" style="height:100%; display:flex; flex-direction:column;">' +
          '<h2>All Plays</h2>' +
          '<div id="allPlaysScroll" style="flex:1; min-height:0; overflow-y:auto;"></div>' +
        '</div>';
    }
    if (!currentGameId){
      showView('errorView');
      showMsg('errorMsg', 'No game specified.', 'error');
      return;
    }

    const { data: gameRows, error: gameError } = await supabaseClient
      .from('games').select('*').eq('id', currentGameId).limit(1);
    if (gameError || !gameRows || gameRows.length === 0){
      showView('errorView');
      document.getElementById('errorMsg').textContent = gameError ? gameError.message : 'That game could not be found.';
      return;
    }
    const game = gameRows[0];
    currentGameTenantId = game.tenant_id;
    gameLabel = game.designator;
    currentGameStatus = game.status;
    quarterLengthSec = game.quarter_length_seconds || 720;

    // BY THE GAME'S OWN TENANT, not by is_our_team.
    // -----------------------------------------------------------------
    // `is_our_team` meant "the only team" when there was one tenant. It
    // is TRUE for every tenant's team now, so this query returned every
    // team on the platform and .limit(1) took whichever Postgres felt
    // like -- an arbitrary school's colors on somebody else's page.
    //
    // The game already knows whose it is. Asking it is exact for a
    // tenant, for the platform, and for an anonymous recap reader, none
    // of which the flag could distinguish.
    const { data: teamRows } = await supabaseClient
      .from('teams').select('primary_color, secondary_color, logo_url').eq('tenant_id', game.tenant_id).limit(1);
    const ourBranding = (teamRows && teamRows[0]) || {};

    // Requested directly: this has to run and finish BEFORE the current
    // game's own buildTeams() call a few lines below, since it does its
    // own buildTeams() calls internally, once per prior game, and the
    // LAST one to run wins for the rest of this page. Doing this first
    // means the current game's own buildTeams() call is always that
    // last one, regardless of what happened during aggregation.
    //
    // 'setup', not 'not_started' -- a real error, caught directly: this
    // read 'not_started' from the first draft on, a string that does
    // not occur anywhere in this app. create_game.html writes 'setup'
    // for a freshly created game (gamePayload.status = 'setup'), and
    // every other page's own currentGameStatus default agrees. The
    // wrong string meant this condition was never once true against a
    // real game, in testing or otherwise -- confirmed only once a real
    // season's own games showed nothing, and traced back to this exact
    // line rather than guessed at.
    if (game.status === 'setup'){
      await loadSeasonStatsForNotStarted(game, ourBranding);
    }

    const { data: rosterRows, error: rosterError } = await supabaseClient
      .from('game_rosters').select('*').eq('game_id', currentGameId);
    if (rosterError){
      showView('errorView');
      document.getElementById('errorMsg').textContent = rosterError.message;
      return;
    }

    // A SPINE HAS TO BE VISIBLE, WHATEVER THE BRAND COLOR IS.
    // ------------------------------------------------------------------
    // The spine is the tenant's own color, and some are very dark. Against
    // the old #171d25 heading a navy brand sat at 1.46:1 and a near-black
    // one at 1.09:1 -- already invisible, before this change. The lighter
    // heading improves the near-black case and worsens navy, so rather than
    // trade one for the other the color is lifted until it actually shows.
    //
    // Mixed toward white in steps rather than replaced: a school's navy
    // stays recognisably navy, just light enough to see. Only touched when
    // it fails -- gold, green and pale brands pass on the first check and
    // come through exactly as the customer set them.
    function spineColor(hex){
      if (!hex) return '#6b7d8f';
      var c = hex;
      for (var i = 0; i < 8 && contrastRatio(c, '#363a3e') < 2.2; i++){
        c = mixHex(c, '#ffffff', 0.15);
      }
      return c;
    }

    buildTeams(game, rosterRows || [], ourBranding);
    ['teamA', 'teamB'].forEach(teamKey => {
      const h = document.getElementById(teamKey === 'teamA' ? 'teamAHeading' : 'teamBHeading');
      // Season Stats only ever applies to OUR OWN team's tile (teamA),
      // matching the request exactly -- the opponent changes every
      // week, so a season total for them would not mean anything.
      const showingSeasonStats = teamKey === 'teamA' && seasonStatsForNotStarted;
      const n = showingSeasonStats ? seasonStatsForNotStarted.gameCount : 0;
      h.textContent = TEAMS[teamKey].name + (showingSeasonStats
        ? (n > 0 ? ' Season Stats — ' + n + ' game' + (n === 1 ? '' : 's') : ' Season Stats')
        : ' Stats');
      // DARK THEME: the tenant's color becomes a spine, not a fill.
      // It is chosen by the customer, so it may be pale -- filled, it
      // punches a hole in a dark screen and safeTextColor then has to
      // flip the label to near-black. As an edge it always works, and
      // the heading keeps one predictable contrast.
      //
      // LIFTED, NOT SUNK. This fill was #171d25, DARKER than the #191f27
      // quad it sits in, so the heading receded into its own panel instead
      // of leading it -- the same fault the score banner had. #363a3e is
      // the value used there, so the two headers on the page match.
      h.style.background = '#363a3e';
      h.style.color = '#eef1f4';
      h.style.borderLeft = '5px solid ' + spineColor(TEAMS[teamKey].bg);
      h.style.padding = '6px 12px';
      h.style.borderRadius = '0 6px 6px 0';
      h.style.display = 'table';
      h.style.margin = '0 auto 8px';
    });

    const { data: existingPlays } = await supabaseClient
      .from('plays').select('*').eq('game_id', currentGameId).order('sequence_number', { ascending: true });
    plays = (existingPlays || []).map(p => ({
      text: p.text, effect: p.effect || {}, team: p.team_side, quarter: p.quarter,
      roles: p.roles, unresolved: p.unresolved, isDivider: p.is_divider, isOverride: p.is_override
    }));

    showView('mainView');
    renderAll();
    subscribeToLiveUpdates();
  }

  async function reloadPlaysAndRender(){
    const { data: existingPlays } = await supabaseClient
      .from('plays').select('*').eq('game_id', currentGameId).order('sequence_number', { ascending: true });
    plays = (existingPlays || []).map(p => ({
      text: p.text, effect: p.effect || {}, team: p.team_side, quarter: p.quarter,
      roles: p.roles, unresolved: p.unresolved, isDivider: p.is_divider, isOverride: p.is_override
    }));
    renderAll();
  }

  function subscribeToLiveUpdates(){
    // Inserts and updates can be filtered server-side by game_id.
    // Deletes (Undo) can't be filtered server-side at all in Postgres
    // Changes, so we listen to every delete on this table and check
    // game_id ourselves once it arrives -- this only works because the
    // migration set REPLICA IDENTITY FULL, which makes sure a delete
    // event actually carries the deleted row's other columns instead
    // of just its id.
    supabaseClient
      .channel('plays-' + currentGameId)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'plays', filter: 'game_id=eq.' + currentGameId }, () => {
        reloadPlaysAndRender();
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'plays', filter: 'game_id=eq.' + currentGameId }, () => {
        reloadPlaysAndRender();
      })
      // Reload on ANY delete, without checking game_id.
      //
      // This used to check `payload.old.game_id === currentGameId`, which
      // depends on the delete event carrying non-key columns. That needs
      // REPLICA IDENTITY FULL -- which IS set here, and the table IS in
      // the supabase_realtime publication, and undos still did not
      // propagate. Rather than keep chasing it, the check is gone: the
      // cost of reloading when another game is edited is one query, and
      // in practice two games are never live at once.
      //
      // A missed undo is the WORST failure mode this page has. The
      // spectator keeps seeing a play that no longer exists, and nothing
