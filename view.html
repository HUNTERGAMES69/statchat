<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StatChat">
<title>StatChat — Live View</title>
<style>
  html, body { height:100%; margin:0; box-sizing:border-box; overflow:hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background:#f4f3ef; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; padding:0; padding-top:env(safe-area-inset-top); }
  .wrap { width:1920px; height:1080px; max-width:none; margin:0; padding:8px; box-sizing:border-box; flex-shrink:0; transform-origin:center center; }
  #mainView.hidden, #loading, #errorView { height:auto; overflow:visible; }
  #mainView { height:100%; }
  .quad-grid { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:8px; height:100%; position:relative; }
  #centerLogoLink { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:20; }
  #centerLogo { display:block; width:56px; height:auto; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.25); }
  #mobileBackLink { display:none; }
  .quad { min-height:0; overflow-y:auto; display:flex; flex-direction:column; background:#fff; border:2px solid #1a1a1a; border-radius:4px; padding:8px; box-sizing:border-box; }
  .card { background:#fff; border-radius:12px; padding:18px; margin-bottom:16px; box-shadow:0 2px 12px rgba(0,0,0,0.08); }
  .card.compact { padding:0 0 8px; margin-bottom:16px; background:none; box-shadow:none; border-radius:0; border-bottom:2px solid #d5d2c8; }
  .card.compact:last-child { border-bottom:none; margin-bottom:0; }
  .drive-card { border-left:5px solid transparent; padding-left:10px !important; }
  .drive-current { border-left-color:#1a7a4c; }
  .drive-current h2 { color:#1a7a4c; }
  .drive-current h2::before { content:"● LIVE  "; font-size:10px; letter-spacing:0.05em; }
  .drive-current .inline-stat-item { background:#e6f4ea; }
  .drive-previous { border-left-color:#8a8f98; }
  .drive-previous h2 { color:#5b6068; }
  .drive-previous .inline-stat-item { background:#edeef0; }
  .team-summary-row { display:flex; gap:28px; flex:1; min-height:0; }
  .team-summary-col { flex:1; display:flex; flex-direction:column; min-width:0; }
  .team-summary-header { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:8px; font-weight:800; font-size:20px; margin-bottom:10px; }
  .team-summary-logo { height:36px; width:36px; object-fit:contain; border-radius:6px; background:rgba(255,255,255,0.85); flex-shrink:0; }
  .stat-tile-grid { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr 1fr 1fr; gap:8px; flex:1; min-height:0; }
  .stat-tile { background:#f5f7fa; border-radius:8px; padding:6px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .stat-tile-value { font-size:34px; font-weight:500; color:#1a1a2e; line-height:1.1; }
  .stat-tile-label { font-size:13px; color:#777; text-transform:uppercase; letter-spacing:0.03em; margin-top:3px; }
  .inline-stat-line { display:flex; gap:5px; margin-bottom:5px; }
  .inline-stat-item { flex:1; white-space:nowrap; text-align:center; font-size:19px; font-weight:700; color:#1a1a2e; background:#f5f7fa; border-radius:6px; padding:5px 6px; }
  .inline-stat-item b { font-size:14px; font-weight:800; color:#5b6068; text-transform:uppercase; letter-spacing:0.03em; margin-right:5px; }
  .card.compact h2 { font-size:13px; margin:0 0 6px; }
  h1 { font-size:20px; margin:0; }
  h2 { font-size:16px; margin:0 0 10px; color:#444; }
  h3 { font-size:14px; font-weight:700; margin:12px 0 6px; color:#1a1a1a; letter-spacing:0.02em; }
  p.sub { color:#888; margin:0 0 14px; font-size:13px; }
  .banner { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; border-radius:10px; padding:12px 16px; margin-bottom:6px; box-shadow:0 2px 8px rgba(0,0,0,0.15); }
  .banner .score { font-size:20px; font-weight:700; }
  .banner .downdist { font-size:15px; font-weight:500; }
  .banner.compact { padding:8px 12px; margin-bottom:6px; }
  .banner.compact .score { font-size:16px; }
  .banner.compact .downdist { font-size:12px; }
  .hint { font-size:12px; color:#888; margin:6px 0; }
  .msg { font-size:14px; padding:10px; border-radius:6px; margin-bottom:14px; }
  .msg.error { background:#fdecea; color:#a32d2d; }
  .hidden { display:none; }
  .logline { font-size:14px; padding:6px 0; border-bottom:1px solid #f2f2f2; }
  table.stattable { width:100%; border-collapse:collapse; font-size:11px; margin:0; }
  table.stattable th { text-align:right; font-size:9px; color:#5b7ca8; font-weight:600; padding:2px 6px; border-bottom:1px solid #d8dde3; white-space:nowrap; }
  table.stattable th:first-child, table.stattable td:first-child { text-align:left; }
  table.stattable td { text-align:right; padding:2px 6px; border-bottom:none; }
  table.stattable tbody tr:nth-child(even) { background:rgba(0,0,0,0.03); }
  table.stattable tr.totalRow { font-weight:700; border-top:1px solid #333; }
  .stat-category-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; align-content:start; }
  .stat-category-tile { background:#eef1f5; border:1px solid #c9d0d9; border-radius:6px; padding:6px 6px 4px; margin-bottom:0; min-width:0; }
  .stat-category-label { font-size:10px; font-weight:700; color:#fff; text-transform:uppercase; letter-spacing:0.02em; margin:0 0 3px; background:#4a5568; display:inline-block; padding:2px 6px; border-radius:3px; }
  .player-stat-row { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 12px; padding:3px 2px; border-bottom:1px solid rgba(0,0,0,0.06); font-size:12px; }
  .player-stat-row.leader { background:rgba(255,193,7,0.18); border-radius:4px; }
  .player-stat-row:last-child { border-bottom:none; }
  .player-stat-name { font-weight:700; color:#1a1a2e; min-width:64px; flex-shrink:0; }
  .player-stat-item { color:#555; white-space:nowrap; }
  .player-stat-item b { color:#1a1a2e; font-size:14px; font-weight:700; }
  .live-badge { display:inline-block; font-size:11px; font-weight:700; color:#a37a00; background:#fff3cd; padding:2px 8px; border-radius:10px; margin-left:8px; vertical-align:middle; }
  @media (min-width: 640px) { body { padding:24px; padding-top:calc(24px + env(safe-area-inset-top)); } .card { padding:24px; } }

  /* Mobile: drop the fixed 1920x1080 desktop layout entirely. Show only
     the team-summary tiles and per-category stat tiles, stacked in one
     column -- drop the drive quadrant, which needs the wider desktop
     layout to be useful. */
  @media (max-width: 700px) {
    html, body { height:auto; overflow:visible; }
    body { width:auto; height:auto; display:block; padding:10px; padding-top:calc(10px + env(safe-area-inset-top)); }
    .wrap { width:auto; height:auto; max-width:none; padding:0; transform:none !important; }
    .quad-grid { display:flex; flex-direction:column; height:auto; gap:12px; }
    .quad { border:1px solid #1a1a1a; overflow-y:visible; padding:10px; }
    #quadTR { order:99; }
    .team-summary-row { flex-direction:column; gap:16px; }
    .stat-category-grid { grid-template-columns:1fr; }
    #centerLogoLink { display:none; }
    #mobileBackLink { display:block; }
  }
</style>
</head>

<div class="wrap">

  <a href="dashboard.html" id="mobileBackLink" style="font-size:13px; color:#555; text-decoration:none; margin-bottom:8px;">← Back to dashboard</a>

  <div id="loading" class="card"><div style="display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:14px;"><img src="logo.png" alt="StatChat" style="width:48px; height:auto; border-radius:8px;"><img id="splashTeamIcon" style="display:none; width:48px; height:48px; border-radius:8px; object-fit:cover;"></div><h1>Loading…</h1></div>

    <div class="quad-grid">

          <h2 id="teamAHeading">Team Stats</h2>

      <div class="quad" id="quadBR">
        <div class="card compact">

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="team-icon.js"></script>
<script>
  const SUPABASE_URL = 'https://pboushzlcyfkssojpuut.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_VGnUYurlkoH1yi67jHO6iQ_C8Q0EM2d';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  // The display is designed against a fixed 1920x1080 canvas so every font
  // size and tile dimension throughout stays correct relative to every
  // other -- rather than rewriting all of that in relative units, the
  // whole canvas is scaled up or down as a single unit to fit whatever
  // viewport is actually available, so nothing is ever clipped or forced
  // to scroll regardless of the real screen/browser size. Skipped
  // entirely below the mobile breakpoint, where the layout is already
  // its own natural, responsive, scrolling design.
  function applyDisplayScale(){
    if (window.innerWidth <= 700){
      document.querySelector('.wrap').style.transform = '';
      return;
    }
    const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    document.querySelector('.wrap').style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', applyDisplayScale);
  applyDisplayScale();

  function showView(name){
    ['loading','errorView','mainView'].forEach(v => document.getElementById(v).classList.toggle('hidden', v !== name));
  }
  function showMsg(elId, text, type){
    document.getElementById(elId).innerHTML = '<div class="msg ' + type + '">' + text + '</div>';
  }

  let currentGameId = null;
  let isResultsMode = false;
  let currentGameStatus = null;
  let TEAMS = { teamA: {}, teamB: {} };
  let plays = [], startingPossession = 'teamA', quarterLengthSec = 720, gameLabel = '';

  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'INITIAL_SESSION'){
      if (session){ init(); } else { window.location.href = '/'; }
    } else if (event === 'SIGNED_OUT'){
      window.location.href = '/';
    }
  });

  function buildTeams(game, rosterRows, ourBranding){
    const ourName = game.our_team_is_home ? game.home_team_name : game.away_team_name;
    const oppName = game.our_team_is_home ? game.away_team_name : game.home_team_name;
    TEAMS.teamA = { name: ourName, bg: ourBranding.primary_color || '#1a1a2e', text: ourBranding.secondary_color || '#ffffff',
      rosterOffense:{}, rosterDefense:{}, rosterSpecialTeams:{}, posOffense:{}, logo: ourBranding.logo_url || null };
    TEAMS.teamB = { name: oppName, bg: game.opponent_primary_color || '#8B0000', text: game.opponent_secondary_color || '#ffffff',
      rosterOffense:{}, rosterDefense:{}, rosterSpecialTeams:{}, posOffense:{}, logo: game.opponent_logo_url || null };
    rosterRows.forEach(r => {
      const team = TEAMS[r.team_side];
      if (!team) return;
      if (r.unit === 'offense'){ team.rosterOffense[r.jersey_number] = r.player_name; team.posOffense[r.jersey_number] = r.position; }
      else if (r.unit === 'defense'){ team.rosterDefense[r.jersey_number] = r.player_name; }
      else if (r.unit === 'special'){ team.rosterSpecialTeams[r.jersey_number] = r.player_name; }
    });
  }

  // --- Proven read-only engine core, extracted verbatim from game.html ---
function otherTeam(t){ return t === 'teamA' ? 'teamB' : 'teamA'; }
function nameInOffense(teamKey, num){
  const n = TEAMS[teamKey].rosterOffense[num] || (TEAMS[teamKey].rosterSpecialTeams && TEAMS[teamKey].rosterSpecialTeams[num]);
  return (n || ('#' + num)) + ' (' + TEAMS[teamKey].name + ')';
}
function nameInDefense(teamKey, num){
  const n = TEAMS[teamKey].rosterDefense[num];
  return (n || ('#' + num)) + ' (' + TEAMS[teamKey].name + ')';
}
function nameInSpecialTeams(teamKey, num){
  const n = (TEAMS[teamKey].rosterSpecialTeams && TEAMS[teamKey].rosterSpecialTeams[num]) || TEAMS[teamKey].rosterOffense[num];
  return (n || ('#' + num)) + ' (' + TEAMS[teamKey].name + ')';
}
function ordinal(n){ return n===1?'1st':n===2?'2nd':n===3?'3rd':n===4?'4th':(n+'th'); }
function clockToAbsSeconds(quarter, clockStr){
  const m = clockStr.match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return null;
  const remaining = parseInt(m[1]) * 60 + parseInt(m[2]);
  return (quarter - 1) * quarterLengthSec + (quarterLengthSec - remaining);
}
function formatDuration(sec){
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}
function markerLabel(fp){
  if (fp === null || fp === undefined) return '';
  return fp <= 50 ? ('own ' + fp) : ('opp ' + (100 - fp));
}

function readFileAsDataURL(file){
  return new Promise(resolve => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.readAsDataURL(file);
  });
}

const OFFENSE_POS = new Set(['QB','RB','FB','HB','WR','TE','OL','OT','OG','C']);
const DEFENSE_POS = new Set(['DB','CB','S','FS','SS','LB','OLB','ILB','MLB','WLB','DE','DT','NG','NT','EDGE']);
const SPECIAL_POS = new Set(['K','P','LS','H','KR','PR']);
function posToUnit(pos){
  if (!pos) return null;
  const first = String(pos).toUpperCase().split(/[\/,\s]+/)[0];
  if (SPECIAL_POS.has(first)) return 'st';
  if (OFFENSE_POS.has(first)) return 'o';
  if (DEFENSE_POS.has(first)) return 'd';
  return null;
}
function extractNameTag(rawName){
  const m = String(rawName).match(/\(\s*(O|D|ST)\s*\)\s*$/i);
  if (!m) return { cleanName: String(rawName).trim(), explicitUnit: null };
  const tag = m[1].toUpperCase();
  const cleanName = String(rawName).slice(0, m.index).trim();
  return { cleanName, explicitUnit: tag.toLowerCase() };
}
function computeState(playsList){
  const list = playsList || plays;
  const state = {
    possession: startingPossession,
    quarter: 1,
    scores: { teamA: 0, teamB: 0 },
    possessionTime: { teamA: 0, teamB: 0 },
    down: null, distance: null, fieldPos: null, startSpot: null, statYards: 0,
    penalties: { teamA: { count: 0, yds: 0 }, teamB: { count: 0, yds: 0 } }
  };
  const pendingClockStart = { teamA: null, teamB: null };
  for (const p of list){
    const e = p.effect;
    if (!e) continue;
    if (e.isReset){
      state.down = e.down; state.distance = e.distance; state.fieldPos = e.fieldPos;
      state.startSpot = e.fieldPos; state.statYards = 0;
    }
    if (e.isStat){
      if (state.fieldPos !== null){
        state.fieldPos += e.fieldDelta;
        state.fieldPos = Math.max(0, Math.min(100, state.fieldPos));
      }
      state.statYards += e.statYds;
      if (e.td){
        state.down = null; state.distance = null; state.fieldPos = null; state.startSpot = null; state.statYards = 0;
      } else {
        if (e.converts){
          state.down = 1;
          state.distance = state.fieldPos !== null ? Math.max(1, Math.min(10, 100 - state.fieldPos)) : 10;
        }
        else if (e.turnoverOnDowns && e.flipApplied){
          state.possession = otherTeam(state.possession);
          state.down = null; state.distance = null; state.fieldPos = null; state.startSpot = null; state.statYards = 0;
        } else if (!e.turnoverOnDowns){
          state.down = (state.down || 1) + 1;
          state.distance = Math.max((state.distance || 10) - e.statYds, 1);
        }
      }
    }
    if (e.endsDrive && !e.isStat){
      state.down = null; state.distance = null; state.fieldPos = null; state.startSpot = null; state.statYards = 0;
    }
    if (e.penaltyTeam){
      state.penalties[e.penaltyTeam].count += 1;
      state.penalties[e.penaltyTeam].yds += e.penaltyYds;
      if (state.fieldPos !== null){
        state.fieldPos += e.fieldDelta;
        state.fieldPos = Math.max(0, Math.min(100, state.fieldPos));
      }
    }
    if (e.score){ state.scores[e.score.team] += e.score.points; }
    if (e.scoreAdjust){ state.scores[e.scoreAdjust.team] += e.scoreAdjust.pts; }
    if (e.flip && e.flipApplied && !e.isStat){
      state.possession = e.flipTo;
      state.down = null; state.distance = null; state.fieldPos = null; state.startSpot = null; state.statYards = 0;
    }
    if (e.forcePossession){ state.possession = e.forcePossession; }
    if (e.setQuarter){ state.quarter = e.setQuarter; }
    if (e.clockEvent){
      const ce = e.clockEvent;
      if (ce.type === 'start'){ pendingClockStart[ce.team] = ce.absSec; }
      if (ce.type === 'end' && pendingClockStart[ce.team] !== null){
        state.possessionTime[ce.team] += Math.max(0, ce.absSec - pendingClockStart[ce.team]);
        pendingClockStart[ce.team] = null;
      }
      if (ce.type === 'transition'){
        if (pendingClockStart[ce.outgoingTeam] !== null){
          state.possessionTime[ce.outgoingTeam] += Math.max(0, ce.absSec - pendingClockStart[ce.outgoingTeam]);
          pendingClockStart[ce.outgoingTeam] = null;
        }
        pendingClockStart[ce.incomingTeam] = ce.absSec;
      }
    }
    if (e.setScores){ state.scores.teamA = e.setScores.teamA; state.scores.teamB = e.setScores.teamB; }
  }
  return state;
}

  // --- End engine core ---

  const RUSH_POS = new Set(['QB','RB','FB','HB','TB']);
  const RECEIVE_POS = new Set(['WR','TE','SE','FL','SLOT']);

  function playerName(team, num){
    const t = TEAMS[team];
    return (t.rosterOffense[num] || t.rosterDefense[num] || (t.rosterSpecialTeams && t.rosterSpecialTeams[num]) || ('#' + num));
  }

  function computeBoxScore(playsList){
    const stats = {
      teamA: { rushing:{}, passing:{}, receiving:{}, defense:{}, specialTeams:{} },
      teamB: { rushing:{}, passing:{}, receiving:{}, defense:{}, specialTeams:{} }
    };
    function bucket(team, cat, num){
      if (!team || !stats[team]) return null;
      const b = stats[team][cat];
      if (!b[num]) b[num] = {};
      return b[num];
    }
    playsList.forEach(p => {
      const r = p.roles || {};
      const e = p.effect || {};
      const type = r.playType;

      if (r.carrier && type === 'rush'){
        const s = bucket(r.carrier.team, 'rushing', r.carrier.num);
        if (s){
          s.att = (s.att||0) + 1;
          s.yds = (s.yds||0) + (r.carrier.yards||0);
          if (e.td) s.td = (s.td||0) + 1;
        }
      }
      if (r.carrier && type === 'fumble'){
        const teamObj = TEAMS[r.carrier.team];
        const pos = ((teamObj && teamObj.posOffense[r.carrier.num]) || '').toUpperCase();
        const targetCat = RECEIVE_POS.has(pos) ? 'receiving' : 'rushing';
        const s = bucket(r.carrier.team, targetCat, r.carrier.num);
        if (s) s.fum = (s.fum||0) + 1;
      }
      if (r.passer && type === 'incomplete'){
        const s = bucket(r.passer.team, 'passing', r.passer.num);
        if (s) s.att = (s.att||0) + 1;
      }
      if (r.passer && type === 'pass'){
        const s = bucket(r.passer.team, 'passing', r.passer.num);
        if (s){
          s.att = (s.att||0) + 1;
          s.comp = (s.comp||0) + 1;
          s.yds = (s.yds||0) + (r.passer.yards||0);
          if (e.td) s.td = (s.td||0) + 1;
        }
        if (r.receiver){
          const rs = bucket(r.receiver.team, 'receiving', r.receiver.num);
          if (rs){
            rs.rec = (rs.rec||0) + 1;
            rs.yds = (rs.yds||0) + (r.receiver.yards||0);
            if (e.td) rs.td = (rs.td||0) + 1;
          }
        }
      }
      if (r.passer && type === 'sack'){
        const s = bucket(r.passer.team, 'passing', r.passer.num);
        if (s) s.sacked = (s.sacked||0) + 1;
      }
      if (r.passer && type === 'int'){
        const s = bucket(r.passer.team, 'passing', r.passer.num);
        if (s){
          s.att = (s.att||0) + 1;
          s.intThrown = (s.intThrown||0) + 1;
        }
      }
      if (r.defense){
        const s = bucket(r.defense.team, 'defense', r.defense.num);
        if (s){
          if (type === 'int') s.int = (s.int||0) + 1;
          if (type === 'sack') s.sacks = (s.sacks||0) + 1;
          if (type === 'fumble') s.fumRec = (s.fumRec||0) + 1;
        }
      }
      if (r.kicker && type === 'fg'){
        const s = bucket(r.kicker.team, 'specialTeams', r.kicker.num);
        if (s){
          s.fgAtt = (s.fgAtt||0) + 1;
          if (r.kicker.result === 'g'){
            s.fgMade = (s.fgMade||0) + 1;
            s.fgLong = Math.max(s.fgLong||0, r.kicker.yards||0);
          }
          if (r.kicker.result === 'b') s.fgBlocked = (s.fgBlocked||0) + 1;
        }
      }
      if (r.kicker && type === 'pat'){
        const s = bucket(r.kicker.team, 'specialTeams', r.kicker.num);
        if (s){
          s.patAtt = (s.patAtt||0) + 1;
          if (r.kicker.result === 'g') s.patMade = (s.patMade||0) + 1;
          if (r.kicker.result === 'b') s.patBlocked = (s.patBlocked||0) + 1;
        }
      }
      if (r.punter && type === 'punt'){
        const s = bucket(r.punter.team, 'specialTeams', r.punter.num);
        if (s){
          s.punts = (s.punts||0) + 1;
          if (!r.punter.blocked){
            s.puntYds = (s.puntYds||0) + (r.punter.yards||0);
            s.puntsWithYards = (s.puntsWithYards||0) + 1;
          } else {
            s.blocked = (s.blocked||0) + 1;
          }
        }
      }
    });

    ['teamA','teamB'].forEach(defTeam => {
      const offTeam = otherTeam(defTeam);
      let d3att=0, d3conv=0, d4att=0, d4conv=0, explosive=0;
      for (let i = 0; i < playsList.length; i++){
        const p = playsList[i];
        const type = p.roles && p.roles.playType;
        if (!['rush','pass','sack','int','fumble'].includes(type)) continue;
        const before = computeState(playsList.slice(0, i));
        if (before.possession !== offTeam) continue;
        const down = before.down;
        const success = !!(p.effect && (p.effect.converts || p.effect.td));
        if (down === 3){ d3att++; if (success) d3conv++; }
        else if (down === 4){ d4att++; if (success) d4conv++; }
        if (((p.effect && p.effect.statYds) || 0) >= 20) explosive++;
      }
      stats[defTeam].oppDowns = {
        d3Pct: d3att ? Math.round(100*d3conv/d3att) : null, d3att, d3conv,
        d4Pct: d4att ? Math.round(100*d4conv/d4att) : null, d4att, d4conv,
        explosive
      };
    });

    return stats;
  }

  function statRow(cells){
    return '<tr>' + cells.map(c => '<td>' + c + '</td>').join('') + '</tr>';
  }

  function renderTeamBoxScore(teamKey, box){
      const team = TEAMS[teamKey];
      const s = box[teamKey];
      let html = '';

      const sum = (nums, obj, key) => nums.reduce((t, n) => t + ((obj[n] && obj[n][key]) || 0), 0);
      const tile = (label, inner) => '<div class="stat-category-tile"><div class="stat-category-label">' + label + '</div>' + inner + '</div>';
      const item = (val, label) => '<span class="player-stat-item"><b>' + val + '</b> ' + label + '</span>';
      const row = (name, items, isLeader) => '<div class="player-stat-row' + (isLeader ? ' leader' : '') + '">' + '<span class="player-stat-name">' + name + '</span>' + items.join('') + '</div>';
      // Sorts jersey numbers by a yardage-like field, descending, so the
      // category leader always renders first.
      const sortByYds = (nums, obj, key) => nums.slice().sort((a, b) => ((obj[b] && obj[b][key]) || 0) - ((obj[a] && obj[a][key]) || 0));

      const passNums = sortByYds(Object.keys(s.passing), s.passing, 'yds');
      if (passNums.length){
        html += tile('Passing', passNums.map((n, i) => {
          const d = s.passing[n];
          const compPct = d.att ? Math.round(100 * (d.comp||0) / d.att) : '—';
          return row(playerName(teamKey, n), [item(d.att||0,'Att'), item(d.comp||0,'Comp'), item(compPct,'%'), item(d.yds||0,'Yds'), item(d.td||0,'TD'), item(d.intThrown||0,'Int')], i === 0 && passNums.length > 1);
        }).join(''));
      }
      const rushNums = sortByYds(Object.keys(s.rushing), s.rushing, 'yds');
      if (rushNums.length){
        html += tile('Rushing', rushNums.map((n, i) => {
          const d = s.rushing[n];
          return row(playerName(teamKey, n), [item(d.att||0,'Att'), item(d.yds||0,'Yds'), item(d.td||0,'TD')], i === 0 && rushNums.length > 1);
        }).join(''));
      }
      const recNums = sortByYds(Object.keys(s.receiving), s.receiving, 'yds');
      if (recNums.length){
        html += tile('Receiving', recNums.map((n, i) => {
          const d = s.receiving[n];
          return row(playerName(teamKey, n), [item(d.rec||0,'Rec'), item(d.yds||0,'Yds'), item(d.td||0,'TD')], i === 0 && recNums.length > 1);
        }).join(''));
      }
      const stNums = Object.keys(s.specialTeams).filter(n => s.specialTeams[n].fgAtt || s.specialTeams[n].patAtt || s.specialTeams[n].punts);
      const stEntries = [];
      stNums.forEach(n => {
        const d = s.specialTeams[n];
        const name = playerName(teamKey, n);
        if (d.fgAtt){
          stEntries.push({ yds: d.fgLong||0, name, items: [item(d.fgAtt||0,'FG Att'), item(d.fgMade||0,'FG Made'), item(d.fgLong||0,'Long'), item(d.fgBlocked||0,'Blocked')] });
        }
        if (d.patAtt){
          stEntries.push({ yds: 0, name, items: [item(d.patAtt||0,'PAT Att'), item(d.patMade||0,'PAT Made'), item(d.patBlocked||0,'Blocked')] });
        }
        if (d.punts){
          const avg = d.puntsWithYards ? (d.puntYds / d.puntsWithYards).toFixed(1) : '0.0';
          stEntries.push({ yds: d.puntYds||0, name, items: [item(d.punts||0,'Punts'), item(d.puntYds||0,'Yds'), item(avg,'Avg')] });
        }
      });
      stEntries.sort((a, b) => b.yds - a.yds);
      if (stEntries.length){
        html += tile('Special Teams', stEntries.map(e => row(e.name, e.items)).join(''));
      }
      const defNums = Object.keys(s.defense);
      if (defNums.length){
        html += tile('Defense', row('Team', [
          item(sum(defNums,s.defense,'int'),'Int'),
          item(sum(defNums,s.defense,'fumRec'),'Fum Rec'),
          item(sum(defNums,s.defense,'sacks'),'Sacks')
        ]));
      }
      if (!rushNums.length && !passNums.length && !recNums.length && !stEntries.length && !defNums.length){
        html += '<p class="hint">No stats yet for ' + team.name + '.</p>';
      }
      return '<div class="stat-category-grid">' + html + '</div>';
  }

  function renderBoxScore(){
    const box = computeBoxScore(plays);
    document.getElementById('boxScoreTeamA').innerHTML = renderTeamBoxScore('teamA', box);
    document.getElementById('boxScoreTeamB').innerHTML = renderTeamBoxScore('teamB', box);
  }

  function renderAll(){
    const state = computeState();
    const isGoalToGo = state.down && state.fieldPos !== null && (state.fieldPos + state.distance >= 100);
    const distDisplay = isGoalToGo ? 'Goal' : state.distance;
    document.getElementById('scoreText').textContent = TEAMS.teamA.name + ' ' + state.scores.teamA + ' — ' + TEAMS.teamB.name + ' ' + state.scores.teamB;
    if (currentGameStatus === 'final'){
      document.getElementById('downText').textContent = '';
      document.getElementById('quarterText').textContent = 'FINAL';
    } else {
      document.getElementById('downText').textContent = state.down
        ? (ordinal(state.down) + ' & ' + distDisplay + ' at the ' + markerLabel(state.fieldPos) + ' — ' + TEAMS[state.possession].name + ' ball')
        : ('no active drive — ' + TEAMS[state.possession].name + ' ball');
      document.getElementById('quarterText').textContent = 'Q' + state.quarter + ' (' + (state.quarter <= 2 ? '1st half' : state.quarter <= 4 ? '2nd half' : 'OT') + ')';
    }
    const banner = document.getElementById('banner');
    banner.style.background = '#1a1a1a';
    banner.style.color = '#ffffff';

    function renderLogLines(list){
      return list.map(p => {
        if (p.isDivider) return '<div style="text-align:center; font-size:14px; font-weight:600; color:#888; margin:8px 0; border-top:1px dashed #ccc; padding-top:6px;">' + p.text + '</div>';
        const qtag = p.quarter ? '<span style="color:#999; font-size:12px; margin-right:6px;">Q' + p.quarter + '</span>' : '';
        const text = (p.text || '').replace(/TOUCHDOWN/g, '<strong>TOUCHDOWN</strong>');
        return '<div class="logline">' + qtag + text + (p.unresolved ? '<span class="badge unresolved">unresolved</span>' : '') + '</div>';
      }).join('');
    }
    if (!isResultsMode){
      const resetIdxs = [];
      for (let i = 0; i < plays.length; i++){
        if (plays[i].effect && plays[i].effect.isReset) resetIdxs.push(i);
      }
      const currentDrivePlays = resetIdxs.length ? plays.slice(resetIdxs[resetIdxs.length - 1]) : [];
      document.getElementById('driveLogScroll').innerHTML = renderLogLines(currentDrivePlays.slice().reverse()) || '<div style="color:#999;">no active drive yet</div>';

      const currentSummary = resetIdxs.length
        ? computeDriveSummary(resetIdxs[resetIdxs.length - 1], plays.length)
        : null;
      document.getElementById('currentDriveTiles').innerHTML = currentSummary
        ? '<div class="inline-stat-line">' + [
            ['RUSH', currentSummary.rushes + '/' + currentSummary.rushYds],
            ['PASS', currentSummary.passes + '/' + currentSummary.passYds],
            ['TOTAL', currentSummary.totalPlays + '/' + currentSummary.totalYds]
          ].map(([label, val]) => '<span class="inline-stat-item"><b>' + label + '</b>' + val + '</span>').join('') + '</div>'
        : '';

      const prevSummary = resetIdxs.length >= 2
        ? computeDriveSummary(resetIdxs[resetIdxs.length - 2], resetIdxs[resetIdxs.length - 1])
        : null;
      document.getElementById('prevDriveLogScroll').innerHTML = renderDriveSummary(prevSummary);
    }

    renderTeamSummary();
    renderBoxScore();
    if (!isResultsMode) adjustDriveCardVisibility();
  }

  // Measures the actual rendered content against the quadrant's real
  // height and progressively frees up space for Current Drive if
  // Previous Drive would otherwise force scrolling -- first dropping
  // just its tile row, then the whole card if that's still not enough.
  // Always starts from fully visible so it correctly un-hides again
  // once there's more room (e.g. after Undo shortens the current drive).
  function adjustDriveCardVisibility(){
    const quad = document.getElementById('quadTR');
    const prevCard = document.querySelector('.drive-previous');
    const prevTiles = prevCard ? prevCard.querySelector('.inline-stat-line') : null;
    if (!quad || !prevCard) return;

    prevCard.classList.remove('hidden');
    if (prevTiles) prevTiles.classList.remove('hidden');

    if (quad.scrollHeight <= quad.clientHeight) return;

    if (prevTiles) prevTiles.classList.add('hidden');
    if (quad.scrollHeight <= quad.clientHeight) return;

    prevCard.classList.add('hidden');
  }

  function computeDriveSummary(startIdx, endIdx){
    const driveTeam = computeState(plays.slice(0, startIdx + 1)).possession;
    if (driveTeam !== 'teamA' && driveTeam !== 'teamB') return null;
    const stateBefore = computeState(plays.slice(0, startIdx));
    const stateAtEnd = computeState(plays.slice(0, endIdx));
    const segment = plays.slice(startIdx, endIdx);
    const scrimmageTypes = ['rush','pass','incomplete','sack','int','fumble'];
    let rushes = 0, rushYds = 0, passes = 0, passYds = 0, totalPlays = 0, totalYds = 0, scoringPlayText = null;
    segment.forEach(p => {
      const r = p.roles;
      if (!r || p.team !== driveTeam) return;
      if (scrimmageTypes.includes(r.playType)) totalPlays++;
      if (p.effect && typeof p.effect.statYds === 'number') totalYds += p.effect.statYds;
      const yds = (p.effect && p.effect.statYds) || 0;
      if (r.playType === 'rush' || r.playType === 'sack'){ rushes++; rushYds += yds; }
      else if (r.playType === 'pass' || r.playType === 'incomplete' || r.playType === 'int'){ passes++; passYds += yds; }
      else if (r.playType === 'fumble' && r.carrier){
        const pos = ((TEAMS[driveTeam] && TEAMS[driveTeam].posOffense[r.carrier.num]) || '').toUpperCase();
        if (RECEIVE_POS.has(pos)){ passes++; passYds += yds; }
        else { rushes++; rushYds += yds; }
      }
      const isFgGood = r.playType === 'fg' && r.kicker && r.kicker.result === 'g';
      if (p.effect && (p.effect.td || isFgGood)) scoringPlayText = p.text;
    });
    const top = stateAtEnd.possessionTime[driveTeam] - stateBefore.possessionTime[driveTeam];
    let lastPlayText = null;
    if (!scoringPlayText){
      for (let i = segment.length - 1; i >= 0; i--){
        if (segment[i].text && !segment[i].isDivider){ lastPlayText = segment[i].text; break; }
      }
    }
    return { team: driveTeam, rushes, rushYds, passes, passYds, totalPlays, totalYds, top, scoringPlayText, lastPlayText };
  }

  function renderDriveSummary(summary){
    if (!summary) return '<div style="color:#999;">no previous drive yet</div>';
    const teamName = TEAMS[summary.team].name;
    const tiles = [
      ['RUSH', summary.rushes + '/' + summary.rushYds],
      ['PASS', summary.passes + '/' + summary.passYds],
      ['YARDS', summary.totalYds],
      ['TOP', formatDuration(summary.top)]
    ];
    const outcome = summary.scoringPlayText || summary.lastPlayText || 'No plays recorded';
    const outcomeColor = summary.scoringPlayText ? '#1a7a4c' : '#555';
    return '<div class="inline-stat-line">' +
      tiles.map(([label, val]) => '<span class="inline-stat-item"><b>' + label + '</b>' + val + '</span>').join('') +
      '</div>' +
      '<div style="font-size:13px; line-height:1.3;"><strong>' + teamName + ':</strong> <span style="color:' + outcomeColor + '; font-weight:600;">' + outcome + '</span></div>';
  }

  function countPossessions(playsList){
    const counts = { teamA: 0, teamB: 0 };
    for (let i = 0; i < playsList.length; i++){
      if (playsList[i].effect && playsList[i].effect.isReset){
        const after = computeState(playsList.slice(0, i + 1));
        if (after.possession === 'teamA' || after.possession === 'teamB') counts[after.possession]++;
      }
    }
    return counts;
  }

  function countTurnovers(playsList){
    const counts = { teamA: 0, teamB: 0 };
    playsList.forEach(p => {
      const r = p.roles;
      if (!r) return;
      if (r.playType === 'int' && r.passer) counts[r.passer.team] = (counts[r.passer.team] || 0) + 1;
      if (r.playType === 'fumble' && r.carrier && r.defense) counts[r.carrier.team] = (counts[r.carrier.team] || 0) + 1;
    });
    return counts;
  }

  function renderTeamSummary(){
    const box = computeBoxScore(plays);
    const scrimmageTypes = ['rush','pass','incomplete','sack','int','fumble'];
    const playsFor = (teamKey) => plays.filter(p => p.team === teamKey && p.roles && scrimmageTypes.includes(p.roles.playType)).length;
    const possessions = countPossessions(plays);
    const turnovers = countTurnovers(plays);
    const penState = computeState();

    let html = '<div class="team-summary-row">';
    ['teamA', 'teamB'].forEach(teamKey => {
      const team = TEAMS[teamKey];
      const s = box[teamKey];
      const rushYds = Object.keys(s.rushing).reduce((t, n) => t + (s.rushing[n].yds || 0), 0);
      const passYds = Object.keys(s.passing).reduce((t, n) => t + (s.passing[n].yds || 0), 0);
      const totalYds = rushYds + passYds;
      // A team's own offensive 3rd/4th down conversion rate is stored on
      // the OTHER team's oppDowns entry (that's "the other team's defense
      // against this team's offense", which is the same numbers).
      const own = box[otherTeam(teamKey)].oppDowns;
      const d3 = own.d3Pct !== null ? own.d3conv + ' of ' + own.d3att + ' (' + own.d3Pct + '%)' : '—';
      const pen = penState.penalties[teamKey];

      const tiles = [
        [possessions[teamKey] || 0, 'Possessions'],
        [totalYds, 'Total Yards'],
        [passYds, 'Passing Yards'],
        [rushYds, 'Rushing Yards'],
        [playsFor(teamKey), 'Total Plays'],
        [turnovers[teamKey] || 0, 'Turnovers'],
        [pen.count + '-' + pen.yds, 'Penalties'],
        [d3, '3rd Down']
      ];

      html += '<div class="team-summary-col">' +
        '<div class="team-summary-header" style="background:' + team.bg + '; color:' + team.text + ';">' +
        (team.logo ? '<img class="team-summary-logo" src="' + team.logo + '">' : '') +
        '<span>' + team.name + '</span>' +
        '</div>' +
        '<div class="stat-tile-grid">' +
        tiles.map(([val, label]) => '<div class="stat-tile"><div class="stat-tile-value">' + val + '</div><div class="stat-tile-label">' + label + '</div></div>').join('') +
        '</div>' +
        '</div>';
    });
    html += '</div>';
    document.getElementById('teamSummaryContainer').innerHTML = html;
  }

  async function init(){
    const params = new URLSearchParams(window.location.search);
    currentGameId = params.get('id');
    isResultsMode = params.get('mode') === 'results';
    if (isResultsMode){
      document.getElementById('quadTR').innerHTML = '<div style="height:100%; display:flex; align-items:center; justify-content:center; color:#999; font-size:14px; text-align:center; padding:20px;">Drive summary isn\'t available for a completed game.<br>See the box scores for full stats.</div>';
    }
    if (!currentGameId){
      showView('errorView');
      showMsg('errorMsg', 'No game specified.', 'error');
      return;
    }

    const { data: gameRows, error: gameError } = await supabaseClient
      .from('games').select('*').eq('id', currentGameId).limit(1);
    if (gameError || !gameRows || gameRows.length === 0){
      showView('errorView');
      document.getElementById('errorMsg').textContent = gameError ? gameError.message : 'That game could not be found.';
      return;
    }
    const game = gameRows[0];
    gameLabel = game.designator;
    currentGameStatus = game.status;
    quarterLengthSec = game.quarter_length_seconds || 720;

    const { data: rosterRows, error: rosterError } = await supabaseClient
      .from('game_rosters').select('*').eq('game_id', currentGameId);
    if (rosterError){
      showView('errorView');
      document.getElementById('errorMsg').textContent = rosterError.message;
      return;
    }

    const { data: teamRows } = await supabaseClient
      .from('teams').select('primary_color, secondary_color, logo_url').eq('is_our_team', true).limit(1);
    const ourBranding = (teamRows && teamRows[0]) || {};

    buildTeams(game, rosterRows || [], ourBranding);
    ['teamA', 'teamB'].forEach(teamKey => {
      const h = document.getElementById(teamKey === 'teamA' ? 'teamAHeading' : 'teamBHeading');
      h.textContent = TEAMS[teamKey].name + ' Stats';
      h.style.background = TEAMS[teamKey].bg;
      h.style.color = TEAMS[teamKey].text;
      h.style.padding = '6px 10px';
      h.style.borderRadius = '6px';
      h.style.display = 'table';
      h.style.margin = '0 auto 8px';
    });

    const { data: existingPlays } = await supabaseClient
      .from('plays').select('*').eq('game_id', currentGameId).order('sequence_number', { ascending: true });
    plays = (existingPlays || []).map(p => ({
      text: p.text, effect: p.effect || {}, team: p.team_side, quarter: p.quarter,
      roles: p.roles, unresolved: p.unresolved, isDivider: p.is_divider, isOverride: p.is_override
    }));

    showView('mainView');
    renderAll();
    subscribeToLiveUpdates();
  }

  async function reloadPlaysAndRender(){
    const { data: existingPlays } = await supabaseClient
      .from('plays').select('*').eq('game_id', currentGameId).order('sequence_number', { ascending: true });
    plays = (existingPlays || []).map(p => ({
      text: p.text, effect: p.effect || {}, team: p.team_side, quarter: p.quarter,
      roles: p.roles, unresolved: p.unresolved, isDivider: p.is_divider, isOverride: p.is_override
    }));
    renderAll();
  }

  function subscribeToLiveUpdates(){
    // Inserts and updates can be filtered server-side by game_id.
    // Deletes (Undo) can't be filtered server-side at all in Postgres
    // Changes, so we listen to every delete on this table and check
    // game_id ourselves once it arrives -- this only works because the
    // migration set REPLICA IDENTITY FULL, which makes sure a delete
    // event actually carries the deleted row's other columns instead
    // of just its id.
    supabaseClient
      .channel('plays-' + currentGameId)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'plays', filter: 'game_id=eq.' + currentGameId }, () => {
        reloadPlaysAndRender();
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'plays', filter: 'game_id=eq.' + currentGameId }, () => {
        reloadPlaysAndRender();
      })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'plays' }, (payload) => {
        if (payload.old && payload.old.game_id === currentGameId){
          reloadPlaysAndRender();
        }
      })
      .subscribe();
  }
</script>
