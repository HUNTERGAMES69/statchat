<style>

  .drive-previous { border-left-color:#8a8f98; }
  .drive-previous h2 { color:#5b6068; }

function otherTeam(t){ return t === 'teamA' ? 'teamB' : 'teamA'; }

const TIMEOUTS_PER_OT = 1;
// Administrative entries -- clock markers, quarter/half dividers, manual

// happened on this drive" has to skip them.

// isReset markers are deliberately NOT administrative: they are explicit
// "new drive" announcements and are valid drive starts.
//
// Lives in the engine core (top level) rather than inside
// findDriveStarts because computeDriveSummary needs it too, from a
// different scope.
function isAdminMarker(p){
  if (!p) return true;
  const e = p.effect || {};
  if (e.isReset) return false;
  return !!(e.clockEvent || e.setQuarter || e.forcePossession || p.isDivider);

function findDriveStarts(playsList){
  // A drive must never START on an administrative marker. Doing so
  // produces a one-play "drive" whose every counter is zero, and
  // because only the last two drives are ever shown, it silently
  // pushes the real drive out of the "previous drive" slot. That is
  // what made a completed scoring drive display as
  // "Clock - 5:00 at change of possession" with 0/0 tiles: the
  // kickoff flipped possession, so the drive began on the clock
  // line that happened to follow it.
  const firstRealPlayFrom = from => {
    for (let j = from; j < playsList.length; j++){
      if (!isAdminMarker(playsList[j])) return j;
    }
    return -1;
  };

  // Start indices are produced in non-decreasing order, so checking
  // only the last entry is enough to stop a detected possession
  // change and an explicit reset marker from both claiming the same
  // play (which they often do, since skipping markers lands the
  // possession change exactly on the reset marker that follows it).
  const pushStart = idx => {
    if (idx !== -1 && starts[starts.length - 1] !== idx) starts.push(idx);

      // drive begins at a real possession change, which is detected
      // below and already lands on the reset marker that follows it.
      // "Adjust down / distance" writes a reset marker purely to
      // correct the chains, so using it mid-drive -- or twice in a row
      // -- must not register another drive, and therefore another
      // possession, for a team that never gave the ball up.
      if (!starts.length) pushStart(i);
      priorPoss = computeState(playsList.slice(0, i + 1)).possession;
      continue;
    }

    // the ball back to start the next one. Only a change of possession
    // was treated as a boundary, so a team that finished the first half
    // with the ball and received to open the second had both halves
    // counted as ONE continuous drive -- the Current Drive panel still
    // listed its Q2 kneels, and the drive tiles totalled plays from
    // before the interval.
    // The interval and the start of overtime both end whatever drive
    // was in progress, even when the same team keeps the ball. Only a
    // change of possession counted as a boundary, so a team that
    // finished a period with the ball and got it back to open the
    // next had both counted as ONE drive.

function rosterName(teamKey, num, order){

  const t = TEAMS[teamKey];
  const buckets = { offense: t.rosterOffense, defense: t.rosterDefense, special: t.rosterSpecialTeams };

    const roster = buckets[unit];
    if (roster && roster[num]) return roster[num];

  const n = rosterName(teamKey, num, ['offense','special','defense']);

function nameInDefense(teamKey, num){

function nameInSpecialTeams(teamKey, num){

}

        if (d.fgAtt || d.patAtt){
          // A dash, not a zero, for a category the kicker never attempted.
          // "0 for 0" reads as a failure; on a PAT-only kicker it looked
          // like he had missed field goals he was never asked to take.
          // Long is also dashed on an 0-for-N day -- a missed 45 is not
          // a "long" of 45, and nor is it a long of 0.
          const fg = d.fgAtt
            ? [d.fgAtt, d.fgMade || 0, d.fgMade ? (d.fgLong || 0) : '—']
            : ['—', '—', '—'];
          const xp = d.patAtt ? [d.patAtt, d.patMade || 0] : ['—', '—'];
          stKicking.push({ yds: d.fgLong || 0, name, values: fg.concat(xp) });
        }
        if (d.kickoffs){
          const tbPct = Math.round(100 * (d.touchbacks || 0) / d.kickoffs);
          stKickoffs.push({ name, values: [d.kickoffs, tbPct + '%'] });
        }
        if (d.punts){
          const avg = d.puntsWithYards ? (d.puntYds / d.puntsWithYards).toFixed(1) : '0.0';
          // Total punt yardage is not a stat anyone reads -- it is just
          // punts x average. Longest is the one that gets talked about,
          // and computeBoxScore already tracks it.
          stPunting.push({ yds: d.puntYds||0, name, values: [d.punts||0, avg, d.puntLong||0] });
        }
      });
      stKicking.sort((a, b) => b.yds - a.yds);
      stPunting.sort((a, b) => b.yds - a.yds);
      const stTotalEntries = stKicking.length + stPunting.length + stKickoffs.length;
      if (stTotalEntries){
        // Three separate tables share this tile, and concatenated flush
        // they read as one run-on block: a header row lands directly
        // under the previous table's data row, so "Punts Avg Long" looks
        // like more numbers for the kicker above it. A rule and a gap
        // between sections makes each one legible on its own.
        const stSections = [];
        if (stKicking.length) stSections.push(table(['FG Att','FG Made','Long','XP Att','XP Made'], stKicking.slice(0, 5)));
        if (stPunting.length) stSections.push(table(['Punts','Avg','Long'], stPunting.slice(0, 5)));
        // Kickoffs: just the count and how many stayed in the end zone.
        // Individual kickoff distance is not reported anywhere and the
        // panel does not even ask for it, so a per-kicker yardage table
        // would be all zeroes.
        if (stKickoffs.length) stSections.push(table(['Kickoffs','TB %'], stKickoffs));
        const stInner = stSections.map((sec, i) => i === 0 ? sec :
          '<div style="border-top:1px solid #dde3ea; margin-top:calc(9px * var(--stat-scale, 1)); ' +
          'padding-top:calc(7px * var(--stat-scale, 1));">' + sec + '</div>').join('');
        stHtml += tile('Special Teams', stInner);
      }
      // Counted from the play log, not from named defenders. Naming the
      // tackler, interceptor or recoverer is optional, and summing
      // s.defense meant a sack with nobody credited recorded no sack at
      // all -- the Defense tile simply did not render. The event
      // happened whether or not anyone was identified.
      const opp = otherTeam(teamKey);
      const defTotals = plays.reduce((acc, p) => {
        const r = p.roles; if (!r) return acc;
        if (r.playType === 'sack' && r.passer && r.passer.team === opp) acc.sacks++;
        if (r.playType === 'int' && r.passer && r.passer.team === opp) acc.int++;
        if (r.playType === 'fumble' && r.carrier && r.carrier.team === opp && (r.lost || r.defense)) acc.fumRec++;
        return acc;
      }, { int: 0, fumRec: 0, sacks: 0 });
      const hasDef = defTotals.int || defTotals.fumRec || defTotals.sacks;
      if (hasDef){
        defHtml += tile('Defense', table(['Int','Fum Rec','Sacks'],
          [{ name: 'Team', values: [defTotals.int, defTotals.fumRec, defTotals.sacks] }]));
      }
      const defNums = hasDef ? ['team'] : [];
      if (!rushNums.length && !passNums.length && !recNums.length && !stTotalEntries && !defNums.length){
        passHtml += '<p class="hint">No stats yet for ' + team.name + '.</p>';
      }
      const totalRows = passNums.length + rushNums.length + recNums.length + Math.min(stKicking.length, 5) + Math.min(stPunting.length, 5) + (defNums.length ? 1 : 0);
      // Left: the passing game top to bottom, then rushing.
      // Right: defense, then special teams.
      leftHtml = passHtml + recHtml + rushHtml;
      rightHtml = defHtml + stHtml;
      // Early in a game a team can easily have defensive or special-teams
      // stats and no offensive ones -- the opening play being a punt or a
      // sack does it. That left the first column empty and the content
      // stranded in the right half with a gap beside it. Reading order is
      // left to right, so a lone column belongs on the left.
      if (!leftHtml && rightHtml){
        leftHtml = rightHtml;
        rightHtml = '';
      }
      return { html: '<div class="stat-category-grid"><div class="stat-category-col">' + leftHtml + '</div><div class="stat-category-col">' + rightHtml + '</div></div>', totalRows };
  }

  function renderBoxScore(){
    const box = computeBoxScore(plays);
    const a = renderTeamBoxScore('teamA', box);
    const b = renderTeamBoxScore('teamB', box);
    const quadBL = document.getElementById('quadBL'), quadBR = document.getElementById('quadBR');
    quadBL.style.setProperty('--stat-scale', 1);
    quadBR.style.setProperty('--stat-scale', 1);
    document.getElementById('boxScoreTeamA').innerHTML = a.html;
    document.getElementById('boxScoreTeamB').innerHTML = b.html;

    // Measure real rendered height at scale 1, then compute the scale
    // that actually fills the available space -- growing when there's
    // room to spare (a team with modest stats shouldn't render small
    // and leave the rest of the quadrant empty), shrinking when there's
    // more content than fits. Both sides use the same scale so neither
    // panel looks visually denser or sparser than its sibling.
    // offsetHeight, NOT getBoundingClientRect(). The whole page sits
    // inside a `transform: scale()` wrapper, and getBoundingClientRect
    // returns the VISUAL box -- already multiplied by that transform --
    // while clientHeight and scrollHeight return the unscaled layout
    // box. Mixing the two made availableHeight too generous by exactly
    // the display scale factor, so --stat-scale came out too large and
    // the content overflowed its quadrant. At 1920x1080 the transform
    // is 1:1 and the bug is invisible, which is why it looked like it
    // "sometimes worked".
    const availableHeight = (quad) => {
      const header = quad.querySelector('h2');
      const headerH = header ? header.offsetHeight + 10 : 0;
      return quad.clientHeight - headerH - 16;
    };
    const contentHeight = (id) => document.getElementById(id).scrollHeight;
    // A 4% safety margin. The fit is computed from measurements taken
    // before the browser has finished reflowing at the new scale, so
    // landing exactly on the available height reliably overshoots by a
    // pixel or two -- which is all it takes to get a scrollbar.
    const FIT_MARGIN = 0.96;
    // Growth is allowed but capped well below the old 2.2. Enlarging a
    // table does not increase its height proportionally -- columns
    // re-wrap and rows gain padding -- so a scale derived from
    // measurements taken at 1.0 overshoots, and the error compounds the
    // further it grows. At 2.2 that overshoot produced scrollbars and
    // clipped rows; a modest ceiling keeps the prediction close enough
    // for the refinement loop below to correct the remainder.
    const MAX_GROW = 1.5;
    const scaleFor = (avail, content) => {
      if (content <= 0) return 1;
      return Math.min(MAX_GROW, Math.max(0.5, (avail / content) * FIT_MARGIN));
    };
    const availA = availableHeight(quadBL), availB = availableHeight(quadBR);
    let scale = Math.min(scaleFor(availA, contentHeight('boxScoreTeamA')),
                         scaleFor(availB, contentHeight('boxScoreTeamB')));
    quadBL.style.setProperty('--stat-scale', scale);
    quadBR.style.setProperty('--stat-scale', scale);

    // Scaling text does not change height linearly -- lines re-wrap and
    // line heights round to whole pixels -- so one pass can still
    // overshoot. Re-measure and back off until it genuinely fits.
    for (let i = 0; i < 8; i++){
      // Measure against the margin, not the raw height, so the loop
      // stops slightly short of the edge rather than flush against it.
      const targetA = availA * FIT_MARGIN, targetB = availB * FIT_MARGIN;
      const overA = contentHeight('boxScoreTeamA') - targetA;
      const overB = contentHeight('boxScoreTeamB') - targetB;
      if (overA <= 0 && overB <= 0) break;
      const worst = Math.max(overA / targetA, overB / targetB);
      scale = Math.max(0.5, scale * (1 - Math.min(0.2, worst)));
      quadBL.style.setProperty('--stat-scale', scale);
      quadBR.style.setProperty('--stat-scale', scale);
    }
  }

  function renderAll(){
    const state = computeState();
    const isGoalToGo = state.down && state.fieldPos !== null && (state.fieldPos + state.distance >= 100);
    const distDisplay = isGoalToGo ? 'Goal' : state.distance;
    document.getElementById('scoreText').textContent = TEAMS.teamA.name + ' ' + state.scores.teamA + ' — ' + TEAMS.teamB.name + ' ' + state.scores.teamB;
    // Phase is derived from the play log rather than passed in, because
    // view.html is a spectator page and only reliably has the plays. The
    // markers it looks for are the same ones End 1st half / End game
    // write, so the banner can never disagree with the drive summary --
    // which it did: "3rd & 10 at own 21" while the drive panel already
    // said End of 1st half.
    const isDiv = (p, t) => p.isDivider && (p.text || '').trim() === t;
    const halftimeIdx = plays.findIndex(p => isDiv(p, 'End of 1st half'));
    // "The second half has started" means a REAL play has been run since
    // the interval, not merely that a quarter marker exists. Undoing the
    // opening plays of a half leaves that marker behind, and keying off
    // it made this page insist on Q3 while game.html had already gone
    // back to halftime -- the two pages disagreeing about the same log.
    const secondHalfStarted = halftimeIdx !== -1 &&
      plays.some((p, i) => i > halftimeIdx && !isAdminMarker(p));
    const phase =
      currentGameStatus === 'final' || plays.some(p => isDiv(p, 'Final')) ? 'FINAL'
      : (halftimeIdx !== -1 && !secondHalfStarted) ? 'HALFTIME'
      : !plays.some(p => p.roles || (p.effect && p.effect.isStat)) ? 'NOT STARTED'
      : null;
    const qEl = document.getElementById('quarterText');
    if (phase){
      document.getElementById('downText').textContent = '';
      qEl.textContent = phase;
      // Large and bold: this is the whole state of the game, and at 15px
      // regular it read as just another label beside the quarter.
      qEl.style.fontSize = '26px';
      qEl.style.fontWeight = '800';
      qEl.style.letterSpacing = '0.06em';
    } else {
      qEl.style.fontSize = '';
      qEl.style.fontWeight = '';
      qEl.style.letterSpacing = '';
      document.getElementById('downText').textContent = state.down
        ? (ordinal(state.down) + ' & ' + distDisplay + ' at ' + markerLabel(state.fieldPos) + ' — ' + TEAMS[state.possession].name + ' ball')
        : ('no active drive — ' + TEAMS[state.possession].name + ' ball');
      // Just the quarter, matching game.html. Which half it belongs to is
      // obvious from the number and only crowded the banner.
      document.getElementById('quarterText').textContent =
        state.quarter <= 4 ? 'Q' + state.quarter : 'OT';
    }
    const banner = document.getElementById('banner');
    banner.style.background = '#1a1a1a';
    banner.style.color = '#ffffff';

    // highlightFirst marks the most recent play. The list arrives already
    // reversed, so index 0 is the play that just happened -- the one a
    // spectator glancing up is looking for, and the one that was hardest
    // to pick out of an evenly-weighted list.
    function renderLogLines(list, highlightFirst){
      let marked = false;
      return list.map(p => {
        if (p.isDivider) return '<div style="text-align:center; font-size:14px; font-weight:600; color:#888; margin:8px 0; border-top:1px dashed #ccc; padding-top:6px;">' + p.text + '</div>';
        const qtag = p.quarter ? '<span style="color:#999; font-size:12px; margin-right:6px;">Q' + p.quarter + '</span>' : '';
        const text = (p.text || '').replace(/TOUCHDOWN/g, '<strong>TOUCHDOWN</strong>');
        // The first NON-DIVIDER line, not simply the first entry: an "End
        // of 1st half" rule sitting on top would otherwise take the
        // emphasis meant for the last real play.
        let style = '';
        if (highlightFirst && !marked){
          marked = true;
          style = ' style="font-size:calc(17px * var(--stat-scale, 1)); font-weight:700; color:#111;"';
        }
        return '<div class="logline"' + style + '>' + qtag + text + (p.unresolved ? '<span class="badge unresolved">unresolved</span>' : '') + '</div>';
      }).join('');
    }
    // Drive boundaries aren't only marked by explicit isReset plays --
    // a turnover on downs changes possession but never sets isReset at
    // all, relying entirely on the next scrimmage play's own down/
    // distance fallback logic. Detect any possession change directly
    // so "current drive" can't silently span two different teams.
    // For an explicit isReset marker, that play itself IS the first
    // play of the new drive (a dedicated announcement) -- include it.
    // For a detected-but-unmarked possession change, the play that
    // caused it still belongs to the PREVIOUS possessor's drive, so
    // the new drive starts at the next play instead.
    if (!isResultsMode){
      const resetIdxs = findDriveStarts(plays);
      const currentDrivePlays = resetIdxs.length ? plays.slice(resetIdxs[resetIdxs.length - 1]) : [];
      document.getElementById('driveLogScroll').innerHTML = renderLogLines(currentDrivePlays.slice().reverse(), true) || '<div style="color:#999;">no active drive yet</div>';

      const currentSummary = resetIdxs.length
        ? computeDriveSummary(resetIdxs[resetIdxs.length - 1], plays.length)
        : null;
      document.getElementById('currentDriveTiles').innerHTML = currentSummary
        ? '<div class="inline-stat-line">' + [
            ['RUSH', currentSummary.rushes + '/' + currentSummary.rushYds],
            ['PASS', currentSummary.passes + '/' + currentSummary.passYds],
            ['TOTAL', currentSummary.totalPlays + '/' + currentSummary.totalYds],
            // Time of possession, matching the Previous Drive tiles.
            // This stays 0:00 until the drive's closing clock event is
            // entered, because possessionTime only accumulates on an
            // 'end' or 'transition' clock event -- there is no live game
            // clock to measure against mid-drive.
            ['TOP', formatDuration(currentSummary.top)]
          ].map(([label, val]) => '<span class="inline-stat-item"><b>' + label + '</b>' + val + '</span>').join('') + '</div>'
        : '';

      const prevSummary = resetIdxs.length >= 2
        ? computeDriveSummary(resetIdxs[resetIdxs.length - 2], resetIdxs[resetIdxs.length - 1])
        : null;
      document.getElementById('prevDriveLogScroll').innerHTML = renderDriveSummary(prevSummary);
    } else {
      document.getElementById('allPlaysScroll').innerHTML = renderLogLines(plays.slice().reverse()) || '<div style="color:#999;">No plays recorded.</div>';
    }

    renderTeamSummary();
    renderBoxScore();
    if (!isResultsMode) adjustDriveCardVisibility();
  }

  // Measures the actual rendered content against the quadrant's real
  // height and progressively frees up space for Current Drive if
  // Previous Drive would otherwise force scrolling -- first dropping
  // just its tile row, then the whole card if that's still not enough.
  // Always starts from fully visible so it correctly un-hides again
  // once there's more room (e.g. after Undo shortens the current drive).
  function adjustDriveCardVisibility(){
    const quad = document.getElementById('quadTR');
    const prevCard = document.querySelector('.drive-previous');
    const prevTiles = prevCard ? prevCard.querySelector('.inline-stat-line') : null;
    if (!quad || !prevCard) return;

    prevCard.classList.remove('hidden');
    if (prevTiles) prevTiles.classList.remove('hidden');

    if (quad.scrollHeight <= quad.clientHeight) return;

    if (prevTiles) prevTiles.classList.add('hidden');
    if (quad.scrollHeight <= quad.clientHeight) return;

    prevCard.classList.add('hidden');
  }

  function computeDriveSummary(startIdx, endIdx){
    const driveTeam = computeState(plays.slice(0, startIdx + 1)).possession;
    if (driveTeam !== 'teamA' && driveTeam !== 'teamB') return null;
    const stateBefore = computeState(plays.slice(0, startIdx));
    const stateAtEnd = computeState(plays.slice(0, endIdx));
    const segment = plays.slice(startIdx, endIdx);
    const scrimmageTypes = ['rush','pass','incomplete','sack','int','fumble'];
    let rushes = 0, rushYds = 0, passes = 0, passYds = 0, totalPlays = 0, totalYds = 0, scoringPlayText = null;
    segment.forEach(p => {
      const e0 = p.effect || {};
      // A penalty is not a play, but its yardage genuinely moves the
      // drive -- a 15-yard defensive foul advances the offense just as a
      // 15-yard completion does. Counted in YARDS only, never in plays.
      // fieldDelta is already signed from the offense's point of view,
      // so a foul on the offense subtracts.
      if (e0.penaltyTeam && typeof e0.fieldDelta === 'number'){
        totalYds += e0.fieldDelta;
        return;
      }
      const r = p.roles;
      if (!r || p.team !== driveTeam) return;
      if (scrimmageTypes.includes(r.playType)) totalPlays++;
      if (p.effect && typeof p.effect.statYds === 'number') totalYds += p.effect.statYds;
      const yds = (p.effect && p.effect.statYds) || 0;
      if (r.playType === 'rush'){ rushes++; rushYds += yds; }
      else if (r.playType === 'pass' || r.playType === 'incomplete' || r.playType === 'int' || r.playType === 'sack'){ passes++; passYds += yds; }
      else if (r.playType === 'fumble' && r.carrier){
        const pos = ((TEAMS[driveTeam] && TEAMS[driveTeam].posOffense[r.carrier.num]) || '').toUpperCase();
        if (RECEIVE_POS.has(pos)){ passes++; passYds += yds; }
        else { rushes++; rushYds += yds; }
      }
      const isFgGood = r.playType === 'fg' && r.kicker && r.kicker.result === 'g';
      if (p.effect && (p.effect.td || isFgGood)) scoringPlayText = p.text;
    });
    const top = stateAtEnd.possessionTime[driveTeam] - stateBefore.possessionTime[driveTeam];
    let lastPlayText = null;
    if (!scoringPlayText){
      for (let i = segment.length - 1; i >= 0; i--){
        // Skip trailing administrative markers: a drive that ended in a
        // punt must summarize as the punt, not as the clock line that
        // happens to follow it.
        if (segment[i].text && !isAdminMarker(segment[i])){ lastPlayText = segment[i].text; break; }
      }
    }
    return { team: driveTeam, rushes, rushYds, passes, passYds, totalPlays, totalYds, top, scoringPlayText, lastPlayText };
  }

  function renderDriveSummary(summary){
    if (!summary) return '<div style="color:#999;">no previous drive yet</div>';
    const teamName = TEAMS[summary.team].name;
    const tiles = [
      ['RUSH', summary.rushes + '/' + summary.rushYds],
      ['PASS', summary.passes + '/' + summary.passYds],
      ['YARDS', summary.totalYds],
      ['TOP', formatDuration(summary.top)]
    ];
    const outcome = summary.scoringPlayText || summary.lastPlayText || 'No plays recorded';
    const outcomeColor = summary.scoringPlayText ? '#1a7a4c' : '#555';
    return '<div class="inline-stat-line">' +
      tiles.map(([label, val]) => '<span class="inline-stat-item"><b>' + label + '</b>' + val + '</span>').join('') +
      '</div>' +
      '<div style="font-size:13px; line-height:1.3;"><strong>' + teamName + ':</strong> <span style="color:' + outcomeColor + '; font-weight:600;">' + outcome + '</span></div>';
  }

  function countPossessions(playsList){
    // A possession IS a drive, so this must use exactly the same
    // boundary rules as findDriveStarts. It used to reimplement them,
    // and the two disagreed: a detected possession change AND the
    // explicit "New drive" marker that follows it were each counted,
    // so an ordinary kickoff -> clock line -> new drive sequence
    // credited the receiving team twice. A brand-new game in which
    // each side had had the ball exactly once reported 2 possessions
    // apiece. Deriving from findDriveStarts makes the two agree by
    // construction rather than by keeping two copies in step.
    const counts = { teamA: 0, teamB: 0 };
    findDriveStarts(playsList).forEach(idx => {
      // Possession AFTER the starting play, matching how
      // computeDriveSummary attributes a drive to a team.
      // Overtime possessions are excluded. OT is a separate, artificial
      // series -- each side is simply handed the ball -- so counting
      // them alongside regulation drives distorts every per-possession
      // figure and makes two games incomparable on the same axis.
      if ((playsList[idx].quarter || 1) >= 5) return;
      const team = computeState(playsList.slice(0, idx + 1)).possession;
      if (team === 'teamA' || team === 'teamB') counts[team]++;
    });
    return counts;
  }

  function countTurnovers(playsList){
    const counts = { teamA: 0, teamB: 0 };
    playsList.forEach(p => {
      const r = p.roles;
      if (!r) return;
      if (r.playType === 'int' && r.passer) counts[r.passer.team] = (counts[r.passer.team] || 0) + 1;
      // r.defense used to be the only signal that a fumble was LOST
      // rather than recovered by the offense. Now that naming the
      // recoverer is optional, r.lost carries that meaning explicitly.
      // r.defense is still honoured so plays saved before this change
      // keep counting.
      if (r.playType === 'fumble' && r.carrier && (r.lost || r.defense)) counts[r.carrier.team] = (counts[r.carrier.team] || 0) + 1;
    });
    return counts;
  }

  function renderTeamSummary(){
    const box = computeBoxScore(plays);
    const scrimmageTypes = ['rush','pass','incomplete','sack','int','fumble'];
    const playsFor = (teamKey) => plays.filter(p => p.team === teamKey && p.roles && scrimmageTypes.includes(p.roles.playType)).length;
    const possessions = countPossessions(plays);
    const turnovers = countTurnovers(plays);
    const penState = computeState();

    let html = '<div class="team-summary-row">';
    ['teamA', 'teamB'].forEach(teamKey => {
      const team = TEAMS[teamKey];
      const s = box[teamKey];
      const rushYdsRaw = Object.keys(s.rushing).reduce((t, n) => t + (s.rushing[n].yds || 0), 0);
      // NFHS (which follows the NCAA convention, not the NFL one):
      // sack yardage is charged as RUSHING yardage lost, not deducted
      // from passing. The quarterback's individual passing line is
      // untouched either way -- only where the team total absorbs it
      // changes. Under the NFL rule this came out of Pass Yards.
      const sackYardsLost = plays.reduce((t, p) => {
        const r = p.roles;
        return (r && r.playType === 'sack' && r.passer && r.passer.team === teamKey) ? t + (r.passer.yards || 0) : t;
      }, 0);
      const passYds = Object.keys(s.passing).reduce((t, n) => t + (s.passing[n].yds || 0), 0);
      // No subtraction here: the sack yardage is already inside the
      // TEAM rushing line, so taking it off again would double count.
      const rushYds = rushYdsRaw;
      const totalYds = rushYds + passYds;
      // A team's own offensive 3rd/4th down conversion rate is stored on
      // the OTHER team's oppDowns entry (that's "the other team's defense
      // against this team's offense", which is the same numbers).
      const own = box[otherTeam(teamKey)].oppDowns;
      const d3 = own.d3Pct !== null ? own.d3conv + ' of ' + own.d3att + ' (' + own.d3Pct + '%)' : '—';
      const pen = penState.penalties[teamKey];

      const tiles = [
        [possessions[teamKey] || 0, 'Possessions'],
        [totalYds, 'Total Yards'],
        [passYds, 'Passing Yards'],
        [rushYds, 'Rushing Yards'],
        [playsFor(teamKey), 'Total Plays'],
        [turnovers[teamKey] || 0, 'Turnovers'],
        [pen.count + '-' + pen.yds, 'Penalties'],
        [d3, '3rd Down']
      ];

      html += '<div class="team-summary-col">' +
        '<div class="team-summary-header" style="background:' + team.bg + '; color:' + safeTextColor(team.bg, team.text) + ';">' +
        (team.logo ? '<img class="team-summary-logo" src="' + team.logo + '">' : '') +
        '<span>' + team.name + '</span>' +
        // Right-justified via margin-left:auto so it sits hard against
        // the end of the coloured bar regardless of how long the team
        // name or logo is.
        '<span style="margin-left:auto; font-size:16px; font-weight:700; letter-spacing:0.02em;">TOL=' +
          computeState(plays).timeouts[teamKey] + '</span>' +
        '</div>' +
        '<div class="stat-tile-grid">' +
        tiles.map(([val, label]) => '<div class="stat-tile"><div class="stat-tile-value">' + val + '</div><div class="stat-tile-label">' + label + '</div></div>').join('') +
        '</div>' +
        '</div>';
    });
    html += '</div>';
    document.getElementById('teamSummaryContainer').innerHTML = html;
  }

  async function init(){
    const params = new URLSearchParams(window.location.search);
    currentGameId = params.get('id');
    isResultsMode = params.get('mode') === 'results';
    if (isResultsMode){
      document.getElementById('quadTR').innerHTML =
        '<div class="card compact drive-card" style="height:100%; display:flex; flex-direction:column;">' +
          '<h2>All Plays</h2>' +
          '<div id="allPlaysScroll" style="flex:1; min-height:0; overflow-y:auto;"></div>' +
        '</div>';
    }
    if (!currentGameId){
      showView('errorView');
      showMsg('errorMsg', 'No game specified.', 'error');
      return;
    }

    const { data: gameRows, error: gameError } = await supabaseClient
      .from('games').select('*').eq('id', currentGameId).limit(1);
    if (gameError || !gameRows || gameRows.length === 0){
      showView('errorView');
      document.getElementById('errorMsg').textContent = gameError ? gameError.message : 'That game could not be found.';
      return;
    }
    const game = gameRows[0];
    gameLabel = game.designator;
    currentGameStatus = game.status;
    quarterLengthSec = game.quarter_length_seconds || 720;

    const { data: rosterRows, error: rosterError } = await supabaseClient
      .from('game_rosters').select('*').eq('game_id', currentGameId);
    if (rosterError){
      showView('errorView');
      document.getElementById('errorMsg').textContent = rosterError.message;
      return;
    }

    const { data: teamRows } = await supabaseClient
      .from('teams').select('primary_color, secondary_color, logo_url').eq('is_our_team', true).limit(1);
    const ourBranding = (teamRows && teamRows[0]) || {};

    buildTeams(game, rosterRows || [], ourBranding);
    ['teamA', 'teamB'].forEach(teamKey => {
      const h = document.getElementById(teamKey === 'teamA' ? 'teamAHeading' : 'teamBHeading');
      h.textContent = TEAMS[teamKey].name + ' Stats';
      h.style.background = TEAMS[teamKey].bg;
      h.style.color = safeTextColor(TEAMS[teamKey].bg, TEAMS[teamKey].text);
      h.style.padding = '6px 10px';
      h.style.borderRadius = '6px';
      h.style.display = 'table';
      h.style.margin = '0 auto 8px';
    });

    const { data: existingPlays } = await supabaseClient
      .from('plays').select('*').eq('game_id', currentGameId).order('sequence_number', { ascending: true });
    plays = (existingPlays || []).map(p => ({
      text: p.text, effect: p.effect || {}, team: p.team_side, quarter: p.quarter,
      roles: p.roles, unresolved: p.unresolved, isDivider: p.is_divider, isOverride: p.is_override
    }));

    showView('mainView');
    renderAll();
    subscribeToLiveUpdates();
  }

  async function reloadPlaysAndRender(){
    const { data: existingPlays } = await supabaseClient
      .from('plays').select('*').eq('game_id', currentGameId).order('sequence_number', { ascending: true });
    plays = (existingPlays || []).map(p => ({
      text: p.text, effect: p.effect || {}, team: p.team_side, quarter: p.quarter,
      roles: p.roles, unresolved: p.unresolved, isDivider: p.is_divider, isOverride: p.is_override
    }));
    renderAll();
  }

  function subscribeToLiveUpdates(){
    // Inserts and updates can be filtered server-side by game_id.
    // Deletes (Undo) can't be filtered server-side at all in Postgres
    // Changes, so we listen to every delete on this table and check
    // game_id ourselves once it arrives -- this only works because the
    // migration set REPLICA IDENTITY FULL, which makes sure a delete
    // event actually carries the deleted row's other columns instead
    // of just its id.
    supabaseClient
      .channel('plays-' + currentGameId)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'plays', filter: 'game_id=eq.' + currentGameId }, () => {
        reloadPlaysAndRender();
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'plays', filter: 'game_id=eq.' + currentGameId }, () => {
        reloadPlaysAndRender();
      })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'plays' }, (payload) => {
        if (payload.old && payload.old.game_id === currentGameId){
          reloadPlaysAndRender();
        }
      })
      .subscribe();
  }
</script>
