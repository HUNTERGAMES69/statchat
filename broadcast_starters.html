<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="logo.png" type="image/png">
<title>StatChat — Starting lineup overlay</title>
<style>
  /* A vMix browser input composites this over the programme feed, so
     anything not explicitly painted shows the feed through. Do not give
     html or body a background colour. */
  html, body { background:transparent !important; margin:0; padding:0; overflow:hidden;
               font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
               -webkit-font-smoothing:antialiased; }

  /* Bottom-left, the same corner as the score bug, the leaders panel and
     the drive panel, so a director can cut between all of them without the
     eye moving. */
  #panel { position:absolute; left:60px; bottom:60px; display:none;
           border-radius:10px; overflow:hidden; box-shadow:0 6px 24px rgba(0,0,0,0.55);
           opacity:0; transform:translateY(10px);
           transition:opacity 380ms ease, transform 380ms ease; }
  #panel.shown { opacity:1; transform:translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    #panel { transition:opacity 180ms ease; transform:none; }
    #panel.shown { transform:none; }
  }
  /* TWO WIDTHS, NOT ONE SCALED. Eleven men one-per-row is 600px tall and
     eats the frame; two-up is 380 and sits in the lower third. Both are
     offered because which one fits depends on the show, not on the data. */
  body.cols2 #panel { width:760px; }
  body.cols1 #panel { width:420px; }

  #head { display:flex; align-items:center; gap:14px; padding:14px 22px; font-weight:800; }
  #head img { height:40px; width:auto; display:block; }
  #headText .title { font-size:30px; line-height:1.1; letter-spacing:0.01em; }
  #headText .sub   { font-size:17px; font-weight:600; opacity:0.78; margin-top:3px; }

  #rows { background:rgba(12,12,14,0.92); color:#fff; display:grid; }
  body.cols2 #rows { grid-template-columns:1fr 1fr; }
  body.cols1 #rows { grid-template-columns:1fr; }
  .cell { display:flex; align-items:center; gap:12px; padding:9px 22px;
          border-top:1px solid rgba(255,255,255,0.09); min-width:0; }
  .pos { font-size:15px; font-weight:700; opacity:0.55; letter-spacing:0.03em;
         min-width:56px; flex:none; }
  .num { font-size:22px; font-weight:800; font-variant-numeric:tabular-nums;
         min-width:36px; text-align:right; flex:none; }
  .nm  { font-size:19px; font-weight:700; white-space:nowrap; overflow:hidden;
         text-overflow:ellipsis; min-width:0; }

  /* ?debug=1 paints a near-black ground so the panel can be seen in a
     browser. Never on air: vMix does not send this parameter. */
  body.debug { background:#123 !important; }
</style>
</head>
<body>
<div id="panel">
  <div id="head"><img id="logo" alt="" hidden><div id="headText">
    <div class="title" id="title">Starters</div>
    <div class="sub" id="sub"></div></div></div>
  <div id="rows"></div>
</div>

<script>
(function(){
  const params = new URLSearchParams(location.search);
  const OVERLAY_KEY = params.get('key') || '';
  const DEBUG = params.get('debug') === '1';
  if (DEBUG) document.body.classList.add('debug');

  // WHICH CARD. Anything unrecognised falls back to offense rather than
  // drawing nothing, so a typo in a switcher address shows a lineup that is
  // merely the wrong one -- visible and fixable -- instead of a blank input
  // the operator cannot diagnose mid-show.
  const UNITS = {
    offense: { key:'offense', title:'Offensive Starters' },
    defense: { key:'defense', title:'Defensive Starters' },
    special: { key:'special', title:'Special Teams' }
  };
  const UNIT = UNITS[(params.get('unit') || 'offense').toLowerCase()] || UNITS.offense;

  // Two columns by default: an eleven-man card one-per-row is 600px tall.
  // Special teams is four rows either way, so it defaults to one.
  const askedCols = params.get('cols');
  const cols = askedCols === '1' ? 1 : askedCols === '2' ? 2
             : (UNIT.key === 'special' ? 1 : 2);
  document.body.classList.add(cols === 1 ? 'cols1' : 'cols2');

  const POLL_MS = 5000;   // a lineup does not change during a game; this is
                          // only so a card entered at kickoff appears without
                          // the operator reloading the input.
  let currentGameId = '';

  const esc = (v) => String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

  // ACCEPTS BOTH SHAPES, exactly as game.html's seedNum/seedName do for
  // seed_starters: { "QB": "7" } from before shared numbers were expressible,
  // and { "QB": { num, name } } since. One reader, both forms.
  const slotNum  = (v) => (v && typeof v === 'object') ? String(v.num || '') : String(v || '');
  const slotName = (v) => (v && typeof v === 'object') ? String(v.name || '') : '';

  function render(game, branding){
    const panel = document.getElementById('panel');
    const all = game && game.broadcast_starters;
    const lineup = all && all[UNIT.key];
    const positions = lineup ? Object.keys(lineup) : [];

    // NOTHING ENTERED IS NOT AN ERROR. Most games will never have a lineup
    // filled in, and this input may sit in a switcher bank all season. It
    // draws nothing rather than an empty frame or a row of dashes.
    if (!positions.length){
      panel.classList.remove('shown');
      panel.style.display = 'none';
      return;
    }

    const ourName = game.our_team_is_home ? game.home_team_name : game.away_team_name;
    const oppName = game.our_team_is_home ? game.away_team_name : game.home_team_name;
    document.getElementById('title').textContent = UNIT.title;
    document.getElementById('sub').textContent =
      [ourName, oppName ? 'vs ' + oppName : ''].filter(Boolean).join(' · ');

    const head = document.getElementById('head');
    head.style.background = (branding && branding.primary_color) || '#ffc72c';
    head.style.color      = (branding && branding.secondary_color) || '#20180a';
    const logo = document.getElementById('logo');
    if (branding && branding.logo_url){ logo.src = branding.logo_url; logo.hidden = false; }
    else { logo.hidden = true; }

    document.getElementById('rows').innerHTML = positions.map(pos => {
      const v = lineup[pos];
      const num = slotNum(v), nm = slotName(v);
      // A NUMBER WITH NO NAME IS STILL WORTH SHOWING. It happens when the
      // jersey is shared and nobody picked which player, or when the number
      // is not on the roster loaded for this game. The number is the thing
      // a viewer matches to the field, so it goes up either way.
      return '<div class="cell"><span class="pos">' + esc(pos) + '</span>' +
             '<span class="num">' + esc(num) + '</span>' +
             '<span class="nm">' + (nm ? esc(nm) : '') + '</span></div>';
    }).join('');

    panel.style.display = 'block';
    requestAnimationFrame(() => panel.classList.add('shown'));
  }

  async function fetchAndRender(){
    const qs = [];
    if (currentGameId) qs.push('id=' + encodeURIComponent(currentGameId));
    if (OVERLAY_KEY)   qs.push('key=' + encodeURIComponent(OVERLAY_KEY));
    const r = await fetch('/api/gamedata' + (qs.length ? '?' + qs.join('&') : ''),
      { cache: 'no-store' });
    if (!r.ok){
      const body = await r.json().catch(() => ({}));
      throw new Error(body.error || ('HTTP ' + r.status));
    }
    const d = await r.json();
    render(d.game || {}, d.ourBranding || {});
  }

  async function init(){
    currentGameId = params.get('id') || '';
    try { await fetchAndRender(); }
    catch (e){
      // Silent ON AIR by design: an overlay that prints an error puts that
      // error on the broadcast. ?debug=1 says what happened; vMix never has
      // that parameter, a person testing the address does.
      document.getElementById('panel').style.display = 'none';
      if (DEBUG){
        document.body.innerHTML = '<pre style="color:#fff; font:16px monospace; padding:24px;">' +
          'No lineup shown.\n\nunit: ' + UNIT.key + '\n\n' +
          String(e && e.message ? e.message : e) +
          '\n\nCheck /api/gamedata in a browser: it reports which game it ' +
          'resolved, or says no game is on air. If it resolves a game, that ' +
          'game has no ' + UNIT.key + ' lineup entered on the setup screen.</pre>';
      }
      return;
    }
    setInterval(() => { fetchAndRender().catch(() => {}); }, POLL_MS);
  }
  init();
})();
</script>
</body>
</html>
