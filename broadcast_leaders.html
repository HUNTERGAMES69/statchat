<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>StatChat — Season Leaders overlay</title>
<style>
  /* A vMix browser input composites this over the programme feed, so
     anything not explicitly painted shows the feed through. Do not give
     html or body a background colour. */
  html, body { background:transparent !important; margin:0; padding:0; overflow:hidden;
               font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
               -webkit-font-smoothing:antialiased; }

  /* Sized for a 1920x1080 input, anchored bottom-left like the score bug
     so the two can be cut between without the eye moving. */
  #panel { position:absolute; left:60px; bottom:60px; width:760px; display:none;
           border-radius:10px; overflow:hidden; box-shadow:0 6px 24px rgba(0,0,0,0.55); }

  #head { display:flex; align-items:center; gap:16px; padding:16px 24px; font-weight:800; }
  #head img { height:46px; width:auto; display:block; }
  #headText .title { font-size:32px; line-height:1.1; letter-spacing:0.01em; }
  #headText .sub { font-size:19px; font-weight:600; opacity:0.78; margin-top:3px; }

  #rows { background:rgba(12,12,14,0.92); color:#fff; }
  .row { display:flex; align-items:center; gap:18px; padding:13px 24px;
         border-top:1px solid rgba(255,255,255,0.09); }
  .row:first-child { border-top:none; }
  .rank { width:34px; font-size:24px; font-weight:800; opacity:0.55;
          font-variant-numeric:tabular-nums; }
  .who { flex:1; min-width:0; }
  .who .nm { font-size:30px; font-weight:800; line-height:1.15;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .who .det { font-size:19px; font-weight:600; opacity:0.62; margin-top:2px; }
  .val { font-size:38px; font-weight:800; font-variant-numeric:tabular-nums;
         text-align:right; min-width:120px; }
  .val .unit { font-size:19px; font-weight:600; opacity:0.62; margin-left:7px; }

  /* The leader is the reason the panel is on screen. */
  .row.lead .rank { opacity:0.9; }
  .row.lead { background:rgba(255,255,255,0.06); }

  /* =====================================================================
     ROTATION. Added 31 Aug 2026 -- one input that cycles the season cards
     instead of a switcher input per category.

     EVERY RULE HERE IS SCOPED TO body.rotating, deliberately. The six
     single-view addresses are already pointed at by real switchers, and a
     change that shifts a graphic already on air is not worth the tidiness
     of unscoped CSS. Without ?views= this file renders exactly as before,
     to the pixel.
     ===================================================================== */

  /* A CROSS-FADE, NOT A CUT. A hard swap under a director reads as a
     glitch -- the eye catches the change before it can read what changed.
     The 10px rise says "new card" rather than "the numbers just moved",
     and is small enough not to compete with live pictures. */
  body.rotating #panel { opacity:0; transform:translateY(10px);
                         transition:opacity 420ms ease, transform 420ms ease; }
  body.rotating #panel.shown { opacity:1; transform:translateY(0); }

  /* THE BOX MUST NOT CHANGE SIZE BETWEEN CARDS.
     --------------------------------------------------------------------
     The panel is anchored BOTTOM-left, so a shorter card does not leave a
     gap underneath -- it moves its own header up and down the picture.
     Under a director that reads as the graphic twitching.

     TWO things vary, and fixing only the obvious one leaves the fault in
     place. The row COUNT (a school has one kicker) is handled by padding
     to topN in the renderer. The row HEIGHT is handled here: a player with
     no detail line -- a defensive back with tackles but no TFL and no
     sacks -- has an empty detail string, and an omitted div makes that row
     a whole line shorter than the one above it. */
  body.rotating .who .det { min-height:23px; }
  /* The held slot. Dimmed with a dash where the name would be, so it reads
     as "there is no second one" rather than as a half-drawn graphic. */
  body.rotating .row.blank .nm   { opacity:0.30; font-weight:600; }
  body.rotating .row.blank .rank { opacity:0.22; }

  @media (prefers-reduced-motion: reduce) {
    body.rotating #panel { transition:opacity 200ms ease; transform:none; }
    body.rotating #panel.shown { transform:none; }
  }

  body.debug { background:#123 !important; }
</style>
</head>
<body>
  <div id="panel">
    <div id="head"><img id="headLogo" alt=""><div id="headText">
      <div class="title" id="headTitle"></div>
      <div class="sub" id="headSub"></div>
    </div></div>
    <div id="rows"></div>
  </div>

<script src="team-icon.js"></script>
<script src="engine.js"></script>
<script>
  // See the note at the fetch below: an overlay is opened by vMix with
  // no session, so its key arrives in its own URL.
  const OVERLAY_KEY = new URLSearchParams(location.search).get('key') || '';
  // SEASON LEADERS, for a vMix browser input.
  // ---------------------------------------------------------------------
  //     /broadcast_leaders.html?view=rushing
  //     /broadcast_leaders.html?view=passing&season=2025&top=3
  //
  // Data comes from /api/seasondata, which reads server-side with the
  // service key. A browser input is unauthenticated and every RLS policy
  // on plays requires an authenticated role, so querying Supabase from
  // here returns nothing and renders a black rectangle -- the same lesson
  // the score bug learned.
  //
  // The leaders are computed HERE from raw plays using the shared engine,
  // rather than server-side, so that this page and the player report
  // cannot disagree about who leads. Both call computeBoxScore.

  const params = new URLSearchParams(window.location.search);
  if (params.get('debug') === '1') document.body.classList.add('debug');

  // engine.js needs these from the host page. See the note at its top.
  let plays = [], startingPossession = 'teamA', quarterLengthSec = 720;
  const TEAMS = {};
  function otherTeam(t){ return t === 'teamA' ? 'teamB' : 'teamA'; }
  const TIMEOUTS_PER_HALF = 3;
  const TIMEOUTS_PER_OT = 1;
  // isAdminMarker moved to engine.js on 30 August 2026. It was declared in
  // nine pages; seven were identical and two had drifted. Left as a note
  // rather than a silent deletion, because a reader looking for it here
  // should be told where it went.

  // Each view says which bucket to read, how to rank, and how to read out
  // a line. Adding one is adding an entry here.
  const VIEWS = {
    rushing: { bucket: 'rushing', title: 'Rushing Leaders',
      rank: (d) => d.yds || 0, unit: 'YDS',
      value: (d) => d.yds || 0,
      detail: (d) => (d.att || 0) + ' att' +
        (d.att ? ' \u00b7 ' + (d.yds / d.att).toFixed(1) + ' avg' : '') +
        ((d.td || 0) ? ' \u00b7 ' + d.td + ' TD' : '') },
    passing: { bucket: 'passing', title: 'Passing Leaders',
      rank: (d) => d.yds || 0, unit: 'YDS',
      value: (d) => d.yds || 0,
      detail: (d) => (d.comp || 0) + '/' + (d.att || 0) +
        ((d.td || 0) ? ' \u00b7 ' + d.td + ' TD' : '') +
        ((d.intThrown || 0) ? ' \u00b7 ' + d.intThrown + ' INT' : '') },
    receiving: { bucket: 'receiving', title: 'Receiving Leaders',
      rank: (d) => d.yds || 0, unit: 'YDS',
      value: (d) => d.yds || 0,
      detail: (d) => (d.rec || 0) + ' rec' +
        (d.rec ? ' \u00b7 ' + (d.yds / d.rec).toFixed(1) + ' avg' : '') +
        ((d.td || 0) ? ' \u00b7 ' + d.td + ' TD' : '') },
    tackles: { bucket: 'defense', title: 'Tackle Leaders',
      rank: (d) => d.tackles || 0, unit: 'TKL',
      value: (d) => d.tackles || 0,
      detail: (d) => ((d.tfl || 0) ? d.tfl + ' TFL' : '') +
        ((d.sacks || 0) ? ((d.tfl || 0) ? ' \u00b7 ' : '') + d.sacks + ' SACK' : '') },
    kicking: { bucket: 'specialTeams', title: 'Kicking Leaders',
      has: (d) => (d.fgAtt || 0) + (d.patAtt || 0) > 0,
      rank: (d) => (d.fgMade || 0) * 3 + (d.patMade || 0), unit: 'PTS',
      value: (d) => (d.fgMade || 0) * 3 + (d.patMade || 0),
      detail: (d) => 'FG ' + (d.fgMade || 0) + '/' + (d.fgAtt || 0) +
        ' \u00b7 XP ' + (d.patMade || 0) + '/' + (d.patAtt || 0) },
    punting: { bucket: 'specialTeams', title: 'Punting Leaders',
      has: (d) => (d.punts || 0) > 0,
      // Ranked on AVERAGE, which is what a punter is judged on -- total
      // yards would just crown whoever punted most, which is a comment
      // on the offence rather than on him.
      rank: (d) => d.puntsWithYards ? d.puntYds / d.puntsWithYards : 0, unit: 'AVG',
      // A MINIMUM, or a backup who punted twice for 48 outranks the man
      // who punted twelve times for 36. Every average-based leaderboard
      // in the sport carries one.
      //
      // Relative rather than fixed: a third of the busiest punter's
      // volume works in week two and in week nine, where "at least ten"
      // would exclude everybody early and nobody late.
      qualify: (d, all) => {
        const busiest = Math.max.apply(null, all.map(x => x.d.punts || 0).concat([0]));
        return (d.punts || 0) >= Math.max(2, Math.ceil(busiest / 3));
      },
      value: (d) => d.puntsWithYards ? (d.puntYds / d.puntsWithYards).toFixed(1) : '0.0',
      detail: (d) => (d.punts || 0) + ' punts' +
        ((d.puntLong || 0) ? ' \u00b7 long ' + d.puntLong : '') }
  };

  const viewKey = (params.get('view') || 'rushing').toLowerCase();
  const view = VIEWS[viewKey] || VIEWS.rushing;

  // ROTATION, opted into by ?views= and by nothing else.
  // ---------------------------------------------------------------------
  //     /broadcast_leaders.html?views=rushing,passing,receiving&secs=8
  //
  // ONE PAGE, NOT A SECOND ONE. A rotating overlay is the same fetch: the
  // whole season comes back from /api/seasondata in one payload and
  // leaders() just reads a different bucket out of it, so cycling costs no
  // extra network on air. A separate page would have meant a second copy
  // of VIEWS, and two copies of a table like that eventually disagree.
  //
  // Unknown names are dropped rather than refused: ?views=rushing,punt
  // rotates rushing alone rather than showing nothing, because an overlay
  // that renders SOMETHING is better on air than one that renders nothing
  // over a typo.
  //
  // SPECIAL TEAMS ARE NOT ROTATED. Andy's call, 31 Aug 2026.
  // --------------------------------------------------------------------
  // A school has one kicker, and more often than not he punts as well. So
  // a special-teams leaderboard is one name and a held slot, every week,
  // for almost every school -- which is fine on an input a director has
  // deliberately cut to, and wrong in a loop that comes round unattended
  // every few seconds whether it has anything to say or not.
  //
  // The two SINGLE-VIEW overlays are untouched: ?view=kicking and
  // ?view=punting work exactly as they always have, and the setup page
  // still hands them out. This excludes them from ?views= only.
  const ROTATION_EXCLUDED = ['kicking', 'punting'];
  const askedViews = (params.get('views') || '').toLowerCase()
    .split(',').map(v => v.trim()).filter(Boolean);
  const rotation = askedViews.filter(v =>
    VIEWS[v] && ROTATION_EXCLUDED.indexOf(v) === -1);
  // WAS A ROTATION ASKED FOR, as distinct from one being possible. The two
  // differ exactly when every name given was unknown or excluded, and that
  // difference matters: `rotating` alone would fall through to the ?view=
  // path, which defaults to rushing -- so ?views=kicking would quietly put
  // the Rushing card on an input somebody set up for kicking. Showing the
  // wrong graphic is worse than showing none.
  const rotationRequested = askedViews.length > 0;
  const rotating = rotation.length > 0;
  if (rotating) document.body.classList.add('rotating');

  // Seconds per card. Long enough to read two names, short enough that a
  // director is not waiting on it.
  const DWELL_MS = Math.max(3, Math.min(60,
    parseInt(params.get('secs'), 10) || 8)) * 1000;
  const FADE_MS = 420;   // matches the transition in the stylesheet

  // TWO on a rotating card, five on a static one. A rotating panel is read
  // in a glance and sits under a score bug; a static one is on screen as
  // long as the director wants it. ?top= still overrides either.
  const topN = Math.max(1, Math.min(8,
    parseInt(params.get('top'), 10) || (rotating ? 2 : 5)));

  function buildTeams(game, rosterRows, branding){
    const ourName = game.our_team_is_home ? game.home_team_name : game.away_team_name;
    const oppName = game.our_team_is_home ? game.away_team_name : game.home_team_name;
    TEAMS.teamA = { name: ourName, bg: branding.primary_color || '#2b3440',
      text: branding.secondary_color || '#ffffff',
      rosterOffense:{}, rosterDefense:{}, rosterSpecialTeams:{}, posOffense:{},
      logo: branding.logo_url || null, isHome: !!game.our_team_is_home };
    TEAMS.teamB = { name: oppName, bg: game.opponent_primary_color || '#6e7885',
      text: game.opponent_secondary_color || '#ffffff',
      rosterOffense:{}, rosterDefense:{}, rosterSpecialTeams:{}, posOffense:{},
      logo: game.opponent_logo_url || null, isHome: !game.our_team_is_home };
    (rosterRows || []).forEach(r => {
      const t = TEAMS[r.team_side];
      if (!t) return;
      const bucket = r.unit === 'defense' ? 'rosterDefense'
                   : r.unit === 'special' ? 'rosterSpecialTeams' : 'rosterOffense';
      t[bucket][String(r.jersey_number)] = r.player_name;
      if (r.unit === 'offense' && r.position) t.posOffense[String(r.jersey_number)] = r.position;
    });
  }

  function merge(into, name, line){
    const acc = into[name] = into[name] || {};
    Object.keys(line).forEach(k => {
      const v = line[k];
      if (typeof v !== 'number') return;
      // Anything ending in "long" is a best, not a running total.
      if (/long$/i.test(k)) acc[k] = Math.max(acc[k] || 0, v);
      else acc[k] = (acc[k] || 0) + v;
    });
  }

  // TAKES ITS VIEW rather than closing over the module-level one, because
  // a rotation asks the same payload six different questions.
  function leaders(payload, view){
    const totals = {};
    (payload.games || []).forEach(entry => {
      const gamePlays = (entry.plays || []).map(p => ({
        text: p.text, effect: p.effect || {}, team: p.team_side, quarter: p.quarter,
        roles: p.roles, unresolved: p.unresolved, isDivider: p.is_divider,
        isOverride: p.is_override
      }));
      buildTeams(entry.game, entry.roster || [], payload.ourBranding || {});
      plays = gamePlays;
      const box = computeBoxScore(gamePlays);
      const bucket = box.teamA[view.bucket] || {};
      Object.keys(bucket).forEach(n => {
        // TEAM is the sentinel for a kneel or a bad snap. It is not a
        // person and must never appear on a leaderboard.
        if (n === 'TEAM') return;
        if (view.has && !view.has(bucket[n])) return;
        merge(totals, n, bucket[n]);
      });
    });
    const all = Object.keys(totals)
      .map(n => ({ name: n, d: totals[n] }))
      .filter(x => view.rank(x.d) > 0);
    // qualify() sees the whole field, because a minimum that means
    // anything is relative to what everyone else did.
    const eligible = view.qualify ? all.filter(x => view.qualify(x.d, all)) : all;
    return eligible
      .sort((a, b) => view.rank(b.d) - view.rank(a.d))
      .slice(0, topN);
  }

  function render(payload, view){
    const list = leaders(payload, view);
    const panel = document.getElementById('panel');
    // Nothing to show is shown as NOTHING, not as an empty frame. A blank
    // panel sitting over the programme feed is worse than no panel.
    if (!list.length){
      panel.style.display = 'none';
      if (params.get('debug') === '1'){
        document.body.innerHTML = '<pre style="color:#fff; font:16px monospace; padding:24px;">' +
          'No leaders to show.\n\nseason: ' + payload.season +
          '\nresolved by: ' + (payload.resolvedBy || '?') +
          '\ngames: ' + ((payload.games || []).length) +
          '\nview: ' + view.title +
          (payload.reason ? '\nreason: ' + payload.reason : '') +
          '\n\nA season with no finalized games has no leaders. Add ' +
          '?season=YYYY to pick a different one.</pre>';
      }
      return;
    }

    const b = payload.ourBranding || {};
    const bg = b.primary_color || '#2b3440';
    const fg = (typeof safeTextColor === 'function') ? safeTextColor(bg) : '#ffffff';
    const head = document.getElementById('head');
    head.style.background = bg;
    head.style.color = fg;
    const logo = document.getElementById('headLogo');
    if (b.logo_url){ logo.src = b.logo_url; logo.style.display = 'block'; }
    else { logo.style.display = 'none'; }

    document.getElementById('headTitle').textContent = view.title;
    document.getElementById('headSub').textContent =
      (b.name ? b.name + ' \u00b7 ' : '') + payload.season + ' season \u00b7 ' +
      (payload.games || []).length + ' game' + ((payload.games || []).length === 1 ? '' : 's');

    // PADDED TO topN WHEN ROTATING, so every card is the same size -- see
    // the note on body.rotating in the stylesheet. A static panel is not
    // padded: it renders once and never moves, so a held slot there would
    // be an empty row for no reason.
    const slots = list.slice();
    if (rotating) while (slots.length < topN) slots.push(null);

    document.getElementById('rows').innerHTML = slots.map((x, i) => {
      if (!x) return '<div class="row blank">' +
        '<div class="rank">' + (i + 1) + '</div>' +
        '<div class="who"><div class="nm">\u2014</div><div class="det"></div></div>' +
        '<div class="val"></div></div>';
      const det = view.detail(x.d);
      // The detail div is EMITTED EVEN WHEN EMPTY while rotating, because
      // an omitted one makes that row a line shorter than its neighbour --
      // see body.rotating .who .det. Left omitted on a static panel so
      // those six addresses render exactly as they always have.
      const detHtml = (rotating || det) ? '<div class="det">' + det + '</div>' : '';
      return '<div class="row' + (i === 0 ? ' lead' : '') + '">' +
        '<div class="rank">' + (i + 1) + '</div>' +
        '<div class="who"><div class="nm">' + x.name + '</div>' +
          detHtml + '</div>' +
        '<div class="val">' + view.value(x.d) +
          '<span class="unit">' + view.unit + '</span></div>' +
      '</div>';
    }).join('');
    panel.style.display = 'block';
  }

  async function load(){
    // NOTHING ELIGIBLE TO ROTATE. Refused here rather than after the fetch,
    // so a misconfigured input does not also pull a season down. Blank on
    // air by design, with ?debug=1 saying why -- the same bargain the rest
    // of this file makes.
    if (rotationRequested && !rotating){
      document.getElementById('panel').style.display = 'none';
      if (params.get('debug') === '1'){
        document.body.innerHTML = '<pre style="color:#fff; font:16px monospace; padding:24px;">' +
          'Nothing to rotate.\n\nviews: ' + askedViews.join(', ') +
          '\n\nEvery name given is either unknown or not available in a ' +
          'rotation. Kicking and punting are single-view only -- a school ' +
          'has one kicker, so that card is one name and a held slot.\n\n' +
          'Use ?view=kicking for those, or choose from: ' +
          Object.keys(VIEWS).filter(v => ROTATION_EXCLUDED.indexOf(v) === -1)
            .join(', ') + '</pre>';
      }
      return;
    }
    try {
      const season = params.get('season');
      // THE KEY TRAVELS IN THIS PAGE'S OWN URL. An overlay is a browser
      // source in vMix: it has no session, so it cannot ask who it is.
      // Since 010 the API requires a per-tenant key, and the only place
      // this page can get one is the address it was opened with — the same
      // way the raw feed URLs carry theirs.
      //
      // MISSED WHEN 010 LANDED: the endpoints were scoped and the three
      // pages that CALL them were not, so every overlay returned 401 while
      // the feed URLs worked. Scoping an endpoint is half the job; finding
      // its callers is the other half.
      const sq = [];
      if (season)      sq.push('season=' + encodeURIComponent(season));
      if (OVERLAY_KEY) sq.push('key=' + encodeURIComponent(OVERLAY_KEY));
      const r = await fetch('/api/seasondata' + (sq.length ? '?' + sq.join('&') : ''));
      if (!r.ok) throw new Error('seasondata ' + r.status);
      const payload = await r.json();
      if (rotating) startRotation(payload); else render(payload, view);
    } catch (e){
      // Silent ON AIR by design: an overlay that prints an error puts that
      // error on the broadcast. But a blank page with no way to find out
      // why cost an evening once, so ?debug=1 says what happened. vMix
      // never has that parameter; a person testing the URL in a browser
      // does.
      document.getElementById('panel').style.display = 'none';
      if (params.get('debug') === '1'){
        document.body.innerHTML = '<pre style="color:#fff; font:16px monospace; padding:24px;">' +
          'No leaders shown.\n\n' + String(e && e.message ? e.message : e) +
          '\n\nCheck /api/seasondata in a browser: it reports the season it ' +
          'resolved and why.</pre>';
      }
    }
  }

  // =====================================================================
  // THE ROTATION DRIVER. Only reached when ?views= is present.
  // =====================================================================
  function startRotation(payload){
    const panel = document.getElementById('panel');

    // SKIP THE EMPTY CARDS, decided ONCE here rather than at each step.
    // A view with nobody in it is not a card that renders badly -- it is a
    // card that must not appear, exactly as the static panel hides itself
    // rather than showing an empty frame. Punting is the one that bites:
    // its minimum is relative to the busiest punter, so early in a season
    // nobody qualifies and that card is genuinely empty.
    //
    // Fixed at load because this reads FINISHED games only, which do not
    // change while the overlay is up. Re-deriving it each step would cost
    // a full box score per card, on a machine encoding video.
    const cycle = rotation.filter(v => leaders(payload, VIEWS[v]).length > 0);

    if (!cycle.length){ render(payload, VIEWS[rotation[0]]); return; }

    let i = 0, timer = null, fadeTimer = null;

    function show(n){
      i = n;
      render(payload, VIEWS[cycle[i]]);
      panel.classList.add('shown');
      clearTimeout(timer);
      // ONE CARD IS NOT A ROTATION. If only one view survived, stop here --
      // fading a card out and bringing the same card back is a flicker on
      // air with nothing gained.
      if (cycle.length < 2) return;
      timer = setTimeout(() => {
        panel.classList.remove('shown');
        clearTimeout(fadeTimer);
        // Swap only once it is invisible, so nobody sees numbers change.
        fadeTimer = setTimeout(() => show((i + 1) % cycle.length), FADE_MS);
      }, DWELL_MS);
    }

    // Start on the first card at once rather than after a dwell. An overlay
    // that is blank for eight seconds after it loads reads as broken, and a
    // director may well cut to it immediately.
    show(0);
  }

  // LOADED ONCE. No polling.
  // ---------------------------------------------------------------------
  // This reads FINISHED games only, and those do not change during a
  // broadcast -- load the overlay before kickoff and the leaders are
  // already final for the night.
  //
  // The only case a timer would serve is a game finalized while the
  // overlay is already loaded, which is not worth an interval running
  // behind a source that is live on air. vMix can reload the input if it
  // is ever needed.
  load();
</script>
</body>
</html>
