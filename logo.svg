<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="StatChat">
  <!-- StatChat mark: an abstracted lower third. Accent block, then two
       rows of unequal length — what the product puts on screen.
       Dark-background colorway. For light backgrounds swap #eef1f4 for
       #2b333d and #ffc72c for #e8a900. -->
  <rect x="2"  y="7"  width="6"  height="18" rx="1.5" fill="#ffc72c"/>
  <rect x="10" y="7"  width="20" height="7"  rx="1.5" fill="#eef1f4"/>
  <rect x="10" y="18" width="13" height="7"  rx="1.5" fill="#7cb518"/>
</svg>
